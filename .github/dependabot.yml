version: 2
updates:
  # npm (root monorepo)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    ignore:
      - dependency-name: "@noble/curves"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "bcryptjs"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "sm-crypto"
        # FIBEMATE has its own @fibemate/sm2-ref replacement.
        # Legacy dependency only for backward compat in www/crypto/sm2-browser.js.
      - dependency-name: "ws"
        # Production dependency for reg-server WebSocket.
        # DoS vulnerability has low impact for a post-quantum crypto validation platform.
        # Will upgrade post 8/31 launch.
      - dependency-name: "eslint"
        # ESLint 10 is a major version with breaking rule changes.
        # Pre-8/31 launch stability: defer to post-launch review.

  # GitHub Actions

      - dependency-name: "underscore"
        # DoS in development dependency — no RCE, tolerable risk
      - dependency-name: "path-to-regexp"
        # Transitive (express/restify chain) — DoS only, no RCE
      - dependency-name: "ip-address"
        # Transitive — SSRF bypass in development toolchain only
      - dependency-name: "qs"
        # Transitive — DoS in parsing library, no RCE
      - dependency-name: "body-parser"
        # Transitive — DoS, low severity
      - dependency-name: "mongoose"
        # Transitive — prototype pollution in restify server, not web-facing
      - dependency-name: "js-yaml"
        # Transitive — DoS in development YAML parser
      - dependency-name: "brace-expansion"
        # Transitive — DoS in minimist/path-to-regexp chain
      - dependency-name: "express"
        # Many transitive vulnerabilities in express <5 — using restify instead
      - dependency-name: "electron"
        # tools/pqc-desktop is an unfinished skeleton (assets/content/lib dirs
        # absent, cannot build). Frozen at ^28.0.0 until desktop client is
        # actually developed. Not part of the PQC core library.

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore(ci)"
