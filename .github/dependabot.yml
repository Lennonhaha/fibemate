version: 2
updates:
  # npm (root monorepo)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    ignore:
      - dependency-name: "@noble/curves"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "bcryptjs"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "sm-crypto"
        # FIBEMATE has its own @fibemate/sm2-ref replacement.
        # Legacy dependency only for backward compat in www/crypto/sm2-browser.js.
      - dependency-name: "ws"
        # Production dependency for reg-server WebSocket.
        # DoS vulnerability has low impact for a post-quantum crypto validation platform.
        # Will upgrade post 8/31 launch.

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore(ci)"
