version: 2
updates:
  # npm (root monorepo)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    ignore:
      - dependency-name: "@noble/curves"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "bcryptjs"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "sm-crypto"
        # FIBEMATE has its own @fibemate/sm2-ref replacement.
        # Legacy dependency only for backward compat in www/crypto/sm2-browser.js.
      - dependency-name: "ws"
        # Production dependency for reg-server WebSocket.
        # DoS vulnerability has low impact for a post-quantum crypto validation platform.
        # Will upgrade post 8/31 launch.
      - dependency-name: "eslint"
        # ESLint 10 is a major version with breaking rule changes.
        # Pre-8/31 launch stability: defer to post-launch review.
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
        # @eslint/js 10 has breaking peer dep change on eslint 10.
        # Major bumps need manual review first.
      - dependency-name: "express"
        update-types: ["version-update:semver-major"]
    groups:
     npm-deps:
      patterns: ["*"]

  # GitHub Actions

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore(ci)"
    groups:
     actions-ecosystem:
      patterns: ["*"]

  # Docker base images
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore(docker)"
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
        # Node major version bumps cross 6+ versions (20 -> 26).
        # Need manual compatibility testing before upgrading.
    groups:
      docker-base:
        patterns: ["*"]

  - package-ecosystem: "docker"
    directory: "/docker/attack"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore(docker)"
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-major"]
    groups:
      docker-attack:
        patterns: ["*"]

  - package-ecosystem: "docker"
    directory: "/docker/bench"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore(docker)"
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
        # Node major version bumps cross 6+ versions (20 -> 26).
        # Need manual compatibility testing before upgrading.
    groups:
      docker-bench:
        patterns: ["*"]

  - package-ecosystem: "docker"
    directory: "/docker/learn"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore(docker)"
    ignore:
      - dependency-name: "nginx"
        update-types: ["version-update:semver-major"]
        # nginx 2.x is a major version with breaking config changes.
        # Manual compatibility testing required before upgrading.
    groups:
      docker-learn:
        patterns: ["*"]
