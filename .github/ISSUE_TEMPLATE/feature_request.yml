name: Feature Request
description: 建议新功能或改进
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        ## 功能建议
  - type: textarea
    id: problem
    attributes:
      label: 解决了什么问题
      description: 你遇到的场景或痛点
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 建议方案
      description: 你期望的实现方式
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案（可选）
  - type: input
    id: context
    attributes:
      label: 相关模块
      description: ML-KEM / SM2 / SLH-DSA / FPGA / Mobile / Docs / CI
  - type: checkboxes
    id: contribution
    attributes:
      label: 意愿
      options:
        - label: 我愿意参与实现