name: DCO

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  check:
    name: dco
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Verify Signed-off-by on all commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # All commits in the PR range must carry a Signed-off-by trailer,
          # with one exception: merge commits created by GitHub itself when a
          # maintainer clicks "Update branch".  Those carry
          # committer = GitHub <noreply@github.com> and no trailer, and they
          # cannot be signed in place -- amending one would rewrite the branch
          # and destroy the DCO trailers of everything behind it.
          #
          # The exception is deliberately narrow: it requires BOTH
          #   (a) the commit has more than one parent (it is a merge commit), and
          #   (b) its committer is GitHub's noreply address.
          # Dependabot's own commits are single-parent and are still checked --
          # they do carry a trailer, so they pass on their merits rather than by
          # being skipped.  Hand-made merge commits by contributors keep a real
          # committer address and are still checked, which is the behaviour we
          # want: signing your own merges is the correct practice.
          missing=0
          skipped=0
          while IFS= read -r commit; do
            # rev-list --parents prints the commit itself plus its parents,
            # so a root commit gives 1 word and a merge commit gives 3+.
            #
            # ⚠️ RED LINE: keep the test below as `-gt 2`. Never rewrite it as
            # `-eq 3`, and never compare against a real parent count here.
            # `wc -w` counts the commit ITSELF plus its parents, so the numbers
            # are offset by one:
            #   root commit    -> 1 word  = 0 parents
            #   normal commit  -> 2 words = 1 parent
            #   2-parent merge -> 3 words = 2 parents   (the common GitHub case)
            #   octopus merge  -> 4+ words = 3+ parents
            # `-gt 2` therefore means "2 or more parents", i.e. ANY merge.
            # Writing `-eq 3` would silently stop exempting octopus merges and
            # writing `-gt 1` would exempt ordinary single-parent commits.
            parents=$(git rev-list --parents -n 1 "$commit" | wc -w)
            committer=$(git log -1 --format='%ce' "$commit")
            if [ "$parents" -gt 2 ] && [ "$committer" = "noreply@github.com" ]; then
              echo "Skipping GitHub-generated merge commit ${commit:0:12} (no trailer possible)"
              skipped=$((skipped + 1))
              continue
            fi
            if ! git log -1 --format='%(trailers:key=Signed-off-by)' "$commit" | grep -q 'Signed-off-by:'; then
              echo "❌ Commit ${commit:0:12} is missing Signed-off-by"
              git log -1 --format='   %s' "$commit"
              missing=1
            fi
          done < <(git rev-list "$BASE_SHA..$HEAD_SHA")
          if [ "$missing" -ne 0 ]; then
            echo ""
            echo "Each commit must be signed with the Developer Certificate of Origin:"
            echo "  git commit -s   (or:  git commit --signoff)"
            echo "See .github/DCO and CONTRIBUTING.md → Developer Certificate of Origin."
            exit 1
          fi
          echo "✅ All commits carry Signed-off-by (${skipped} GitHub-generated merge commit(s) skipped)"
