name: Sentinel

permissions:
  contents: read

on:
  pull_request:
    paths:
      - 'www/docs/**'
      - 'packages/**'

jobs:
  verifact:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: fibemate
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: LennonHaha/fibemate-tools
          path: .sentinel-tools
          ref: main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - name: Run verifact
        working-directory: .sentinel-tools/verifact
        run: node bin/verifact.js verify --docs ../../fibemate/www/docs --fail-on drift --no-cache

  xdiff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: fibemate
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: LennonHaha/fibemate-tools
          path: .sentinel-tools
          ref: main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - name: Install @noble/post-quantum (no-save)
        working-directory: fibemate
        run: npm install @noble/post-quantum --no-save
      - name: Run xdiff (main + noble; cp/liboqs unavailable in CI)
        working-directory: .sentinel-tools/xdiff
        run: node bin/xdiff.js run --require-impl 2