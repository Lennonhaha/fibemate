# FIBEMATE Nightly - Phase 2: Full Validation (pre 8-31)
#
# Trigger: Daily at 06:00 UTC (14:00 CST) — runs before Phase 1 (06:30 UTC)
# Phase 2 Goal: Complete coverage before open source
#   - Full KAT 10,000 rounds
#   - TVLA summary validation
#   - STM32 cross-compilation
#   - liboqs cross-validation (from source)
#   - Performance regression check
#
# Phase 3 (post 8-31): OSS-Fuzz, SLSA, Sigstore

name: Nightly-Full
permissions: read-all

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

concurrency:
  group: nightly-phase2
  cancel-in-progress: false

env:
  NODE_VERSION: '22'

jobs:

  # === Full KAT 10k ===
  kat-full:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci
      - name: Full KAT 10,000 rounds
        run: node scripts/kat-quick.js --samples 10000

  # === TVLA summary validation ===
  tvla-summary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci
      - name: TVLA summary check
        shell: bash
        run: |
          set -o pipefail
          node scripts/tvla-summary.js 2>&1 | tee "$RUNNER_TEMP/tvla.log"

      - name: Attribute - TVLA digest
        if: always()
        shell: bash
        run: |
          {
            echo "### TVLA - threshold |t| < 4.5"
            echo '```'
            if [ -f "$RUNNER_TEMP/tvla.log" ]; then
              grep -E 'max\|t\||Summary:|THRESHOLD BREACHED|TVLA SUMMARY' "$RUNNER_TEMP/tvla.log" || echo '(no TVLA digest lines)'
            else
              echo '(log missing - step did not run)'
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # === Performance regression ===
  perf-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci
      - name: Performance gate
        run: node scripts/perf-gate.js
        # FAIL if p95 latency degrades >20%

  # === STM32 cross-compilation ===
  stm32-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-arm-none-eabi
      - name: Build STM32 framework
        working-directory: ./c-stm32
        run: make
        # FAIL on error — strict mode

  # === liboqs cross-validation (pinned 0.12.0 source build) ===
  liboqs-cross:
    runs-on: ubuntu-latest
    continue-on-error: true  # advisory: flip to a hard gate only once the pin proves stable
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - run: npm ci

      - name: Build liboqs 0.12.0 from source (commit-pinned)
        env:
          LIBOQS_TAG: '0.12.0'
          LIBOQS_COMMIT: f4b96220e4bd208895172acc4fedb5a191d9f5b1
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential cmake ninja-build libssl-dev
          git clone --depth 1 --branch "$LIBOQS_TAG" https://github.com/open-quantum-safe/liboqs.git /tmp/liboqs
          cd /tmp/liboqs
          echo "liboqs HEAD: $(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "$LIBOQS_COMMIT" || \
            { echo "::error::liboqs commit drift - expected $LIBOQS_COMMIT"; exit 1; }
          git rev-parse HEAD | sudo tee /liboqs.commit > /dev/null
          mkdir build && cd build
          cmake -GNinja -DBUILD_SHARED_LIBS=ON -DOQS_BUILD_ONLY_LIB=ON \
                -DOQS_MINIMAL_BUILD=KEM_ml_kem_768 -DCMAKE_INSTALL_PREFIX=/usr/local ..
          ninja && sudo ninja install && sudo ldconfig

      - name: Assert the build knob was honoured (ML-KEM-768 only)
        run: |
          if strings /usr/local/lib/liboqs.so | grep -q 'Classic-McEliece'; then
            echo "::error::OQS_MINIMAL_BUILD was ignored - non-ML-KEM algorithms are present"
            exit 1
          fi
          echo "liboqs built with ML-KEM-768 only"

      - name: Build oqs_gen helper
        run: |
          gcc -O2 -o scripts/oqs_gen scripts/oqs_gen.c -l oqs -lcrypto
          ./scripts/oqs_gen keygen > /dev/null

      - name: 10,000-round interop (noble + liboqs)
        env:
          LIBOQS_VERSION: '0.12.0'
          FIBEMATE_REPO_COMMIT: ${{ github.sha }}
        run: |
          set -o pipefail
          node scripts/interop/run.mjs run \
            --rounds 10000 --liboqs-rounds 10000 --partners noble,liboqs \
            --kat all --out interop-out

      - name: Report digest
        if: always()
        run: |
          if [ -f interop-out/report.json ]; then
            sha256sum interop-out/report.json
          else
            echo "::warning::no report produced"
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.1
        if: always()
        with:
          name: interop-report-nightly
          path: interop-out/
          retention-days: 30
