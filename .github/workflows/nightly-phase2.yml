# FIBEMATE Nightly - Phase 2: Full Validation (pre 8-31)
#
# Trigger: Daily at 06:00 UTC (14:00 CST) — runs before Phase 1 (06:30 UTC)
# Phase 2 Goal: Complete coverage before open source
#   - Full KAT 10,000 rounds
#   - TVLA summary validation
#   - STM32 cross-compilation
#   - liboqs cross-validation (from source)
#   - Performance regression check
#
# Phase 3 (post 8-31): OSS-Fuzz, SLSA, Sigstore

name: Nightly-Full
permissions: read-all

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

concurrency:
  group: nightly-phase2
  cancel-in-progress: false

env:
  NODE_VERSION: '22'

jobs:

  # === Full KAT 10k ===
  kat-full:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm install
      - name: Full KAT 10,000 rounds
        run: node scripts/kat-quick.js --samples 10000

  # === TVLA summary validation ===
  tvla-summary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm install
      - name: TVLA summary check
        run: node scripts/tvla-summary.js
        # Verifies TVLA reports exist and pass thresholds

  # === Performance regression ===
  perf-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm install
      - name: Performance gate
        run: node scripts/perf-gate.js
        # FAIL if p95 latency degrades >20%

  # === STM32 cross-compilation ===
  stm32-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-arm-none-eabi
      - name: Build STM32 framework
        working-directory: ./c-stm32
        run: make
        # FAIL on error — strict mode

  # === liboqs cross-validation (build from source — liboqs-dev not in apt) ===
  liboqs-cross:
    runs-on: ubuntu-latest
    continue-on-error: true  # best-effort: liboqs build may vary across releases
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - run: npm install
      - name: Build liboqs from source
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential cmake ninja-build libssl-dev
          git clone --depth 1 -b main https://github.com/open-quantum-safe/liboqs.git /tmp/liboqs
          cd /tmp/liboqs && mkdir build && cd build
          cmake -GNinja -DBUILD_SHARED_LIBS=ON -DOQS_BUILD_ONLY_LIB=ON ..
          ninja && sudo ninja install && sudo ldconfig
      - name: Build oqs_gen helper
        run: |
          gcc -O2 -o scripts/oqs_gen scripts/oqs_gen.c -l oqs -lcrypto
      - name: 10,000-round cross-validation
        run: node scripts/liboqs-10000.cjs
