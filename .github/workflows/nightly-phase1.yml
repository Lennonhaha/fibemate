# FIBEMATE Nightly - Phase 1: Lightweight but Real Checks
#
# Trigger: Daily at 06:30 UTC (14:30 CST) — offset from Phase 2 (06:00 UTC)
# Phase 1 Goal: Move from "placeholder success" to "lightweight validation"
#   - KAT quick sampling (100 rounds, not 10k)
#   - ESLint strict check
#   - Smoke test (module loads, basic roundtrip)
#   - FAIL on error (no more || echo SKIP)
#
# Phase 2 (pre 8-31): Full KAT 10k, TVLA summary, RTL lint (runs at 06:00 UTC)
# Phase 3 (post 8-31): OSS-Fuzz harness, perf regression baseline

name: Nightly
permissions: read-all

on:
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:

concurrency:
  group: nightly-phase1
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  CARGO_TERM_COLOR: always

jobs:

  # === Phase 1: Core validation (was placeholder) ===
  core-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install npm deps
        run: npm install

      - name: ESLint strict check
        run: npm run lint
        # FAIL on error — no || echo SKIP

      # KAT quick sampling (100 rounds)
      # Full KAT 10k is NOT run in Nightly Phase 1 (see scripts/kat-quick.js header)
      - name: Quick KAT sampling (100 rounds)
        run: node scripts/kat-quick.js --quick --samples 100
        # FAIL on mismatch — this is the real gate

      - name: Smoke test — module loads + basic roundtrip
        run: node scripts/smoke-test.js
        # FAIL on exception

  # === Cross-lang equivalence (existing, keep) ===
  cross-lang:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install npm deps
        run: npm install

      - name: Cross-lang seed test
        run: node test/test-cross-lang-seeded.js

  # === STM32 / liboqs: NOT included in Phase 1 (deferred to Phase 2) ===
  # Reason: Nightly Phase 1 goal is "lightweight validation", not "full coverage"
  # STM32 needs cross-compiler toolchain; liboqs built from source in Phase 2
  # Both run in Phase 2 nightly at 06:00 UTC
  # === C-2 TLA+ continuous verification (G1: K3 strong-invariant gate) ===
  # Scope: C2.cfg 7 invariants only (TypeOK + K1..K5, incl. K3/K3p strong form); liveness (G2) not in this job
  # Pinned: setup-java pinned by commit SHA (per checkout/setup-node convention); tla2tools.jar pinned v1.7.4
  # G3 (re-run) satisfied automatically: nightly checks out current HEAD each run
  # === C-2 TLA+ 持续验证（G1 修复：K3 强不变式门禁化）===
  # 范围：仅 C2.cfg 7 条不变式；liveness (G2) 不在本 job
  c2-tlc:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'

      - name: C-2 TLA+ invariants (TLC)
        env:
          # 钉版本，不使用 latest（可复现性；见 C-2 门禁接缝纪律）
          TLA2TOOLS_URL: https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
        run: bash scripts/tla/c2-tlc-nightly.sh
        # FAIL on TLC non-zero（发现不变式违反 → nightly 红）

  # === Seam checker (fibemate-tools, cross-repo) ===
  # G 层：C2/OPK 模型 TLC 实跑 + S 层接缝闭合报告
  # 前提：PR #26 MERGED (mergeCommit f39a1f46b7d1ed222533089c4434575ada4db7dd)
  # 注意：本 job 接入后 nightly 预期转红 — OPK O4_ConsumedNotReusable 为已证模型缺陷
  #        (非工具误报，是 seam-checker 拦截能力的证明，见 seam-checklist-v1)
  seam-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read          # 显式最小权限（跨仓读 public 仓 + 读主仓）
    steps:
      - name: Checkout main repo (fibemate)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: main   # ← 显式 path，与下方 MAIN_REPO_DIR 字节级对齐（防读错目录→伪 PASS）

      - name: Checkout fibemate-tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Lennonhaha/fibemate-tools
          ref: f39a1f46b7d1ed222533089c4434575ada4db7dd   # PR #26 merge 后 main SHA（钉死，密封）
          path: fibemate-tools
          # public 仓 + read-all 权限：默认 GITHUB_TOKEN 可读，无需 PAT

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'

      - name: Fetch pinned tla2tools.jar (v1.7.4)
        run: |
          curl -fsSL -o /tmp/tla2tools.jar \
            https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
          ls -l /tmp/tla2tools.jar

      - name: Run seam-checker (G + S layers)
        env:
          MAIN_REPO_DIR: ${{ github.workspace }}/main   # ← 与上面 checkout path: main 严格一致
          TLA2TOOLS_JAR: /tmp/tla2tools.jar
        run: node fibemate-tools/tla-verifier/seam-checker.js
        # exit 1（G 层失败，OPK O4 违反）→ nightly 红（预期，非回归）

