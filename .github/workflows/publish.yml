name: publish

# Tag-driven npm release with Sigstore provenance.
#
# Why this exists: publishing by hand is how a package ends up half-released, and
# `--provenance` cannot be produced outside CI (it needs an OIDC id-token). A tag is
# the only human decision; everything after it is mechanical.
#
# One tag publishes exactly one package, and only a tag that names it. The tag pattern
# is `v*-fml-dsa`, not `v*`: this repository also tags project releases (`v3.3.4`), and
# a bare `v*` trigger would run the release pipeline on those too.
#
# The first version of this workflow fanned a single tag out to eight packages. A
# pre-tag audit on 2026-11-15 (`npm pack --dry-run --json` in every package directory)
# found six of the eight not publishable: six had no LICENSE, four had no README, and
# three shipped `python/__pycache__/*.pyc` plus their KAT files inside the tarball.
# A tag that publishes seven surprises is worse than no automation, so the fan-out is
# gone: there is one publishable package, and its path is written out literally.
#
# Required repository secret: NPM_TOKEN (automation token with publish rights).
# Status 2026-11-15: configured (secret present since 2026-11-14T16:15Z). That the
# secret exists is not the same as the token being able to publish: the guard below
# asks `npm view`, which is a public read and succeeds without any credential at all.
# The step after it is therefore `npm whoami`, the cheapest question an expired,
# revoked or wrong-account token answers with 401 before a tarball is ever built.
#
# Usage:
#   git tag v0.1.0-fml-dsa && git push origin v0.1.0-fml-dsa
#   gh workflow run publish --ref main -f package=fml-dsa -f tag=v0.1.0-fml-dsa
#
# Only a tag push publishes. A dispatch is a rehearsal: it checks out the tag named in
# `tag`, runs every preflight, and stops. There is no boolean that can turn a rehearsal
# into a release, because the previous design had one (`dry_run`) and that is exactly how
# a tarball ends up built from `main` while the release is named after a tag.

on:
  push:
    tags:
      - 'v*-fml-dsa'
  workflow_dispatch:
    inputs:
      package:
        description: 'Package directory under packages/ (currently: fml-dsa)'
        required: true
        type: string
      tag:
        description: 'Tag to rehearse, example v0.1.0-fml-dsa (a dispatch never publishes)'
        required: true
        type: string

permissions:
  contents: read
  id-token: write # required for provenance (OIDC)

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse anything outside the publish allowlist
        run: |
          set -euo pipefail
          pkg="${{ inputs.package || 'fml-dsa' }}"
          case "$pkg" in
            fml-dsa) echo "allowed: $pkg" ;;
            *) echo "::error::$pkg is not in the publish allowlist"; exit 1 ;;
          esac

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The tree must be the tag, not the branch the run was started from. Without
          # this, a dispatch built `main` and published it under a tag's name.
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Resolve package identity
        id: pkg
        working-directory: packages/fml-dsa
        run: |
          node -e "
            const p = require('./package.json');
            if (p.private === true) { console.error('package is private'); process.exit(1); }
            if (!p.version) { console.error('no version'); process.exit(1); }
            console.log('name=' + p.name);
            console.log('version=' + p.version);
          " >> "$GITHUB_OUTPUT"

      - name: The tag must name the version it publishes
        # Reads package.json itself rather than depending on the previous step's
        # outputs, so the check can be run standalone (and is, before every tag).
        working-directory: packages/fml-dsa
        run: |
          set -euo pipefail
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          # The tag name is the only thing that may name a version. On a tag push it is
          # GITHUB_REF_NAME; on a rehearsal it is the tag the run checked out. There is no
          # branch-name path, so a rehearsal cannot skip this check.
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          expected="v${version}-${name}"
          echo "tag=${tag} expected=${expected}"
          if [ "$tag" != "$expected" ]; then
            echo "::error::tag ${tag} does not name ${name}@${version} (expected ${expected})"
            exit 1
          fi

      - name: Skip when this exact version is already on the registry
        id: guard
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set +e
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          npm view "$name@$version" version >/dev/null 2>&1
          rc=$?
          set -e
          if [ $rc -eq 0 ]; then
            echo "already published: $name@$version"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify the registry credential identifies a publisher
        # An expired, revoked or wrong-account token answers 401 here, before anything
        # is packed. Without this step the first place a bad token surfaces is
        # `npm publish`, i.e. after a tag has already been pushed, which is the most
        # expensive moment to discover it. A dry run executes this step, so the token
        # can be proven before a tag exists.
        #
        # The comparison is case-insensitive on purpose. npm normalises usernames to
        # lower case, so an exact comparison against "Lennonhaha" rejected a perfectly
        # valid token on run 43628410303: the registry answered "lennonhaha" and the
        # check called it the wrong account. A guard that fails on a correct input is
        # worse than no guard, because the next person disables it.
        if: steps.guard.outputs.skip != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          EXPECTED_NPM_USER: lennonhaha
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::NPM_TOKEN is empty — set it in repository secrets"
            exit 1
          fi
          who=$(npm whoami)
          echo "registry identity: $who (expected: $EXPECTED_NPM_USER, compared case-insensitively)"
          who_lc=$(printf '%s' "$who" | tr '[:upper:]' '[:lower:]')
          exp_lc=$(printf '%s' "$EXPECTED_NPM_USER" | tr '[:upper:]' '[:lower:]')
          if [ "$who_lc" != "$exp_lc" ]; then
            echo "::error::token authenticates as '$who', not '$EXPECTED_NPM_USER'; refusing to publish under the wrong account"
            exit 1
          fi

      - name: Preflight — licence and docs ship, tests do not
        if: steps.guard.outputs.skip != 'true'
        working-directory: packages/fml-dsa
        run: |
          set -euo pipefail
          for f in LICENSE README.md; do
            [ -f "$f" ] || { echo "::error::$f missing from the package directory"; exit 1; }
          done
          tarball=$(npm pack --silent | tail -n 1)
          tarball_path="$PWD/$tarball"
          trap 'rm -f "$tarball_path"' EXIT
          echo "tarball: $tarball_path"
          tar -tzf "$tarball_path" | sed 's/\r$//' > /tmp/entries.txt
          grep -qx 'package/LICENSE' /tmp/entries.txt || { echo "::error::LICENSE not in tarball"; exit 1; }
          grep -qx 'package/README.md' /tmp/entries.txt || { echo "::error::README.md not in tarball"; exit 1; }
          for bad in '/test/' 'bench-' '__pycache__' '\.pyc$' '/kat-vectors/'; do
            if grep -Eq "$bad" /tmp/entries.txt; then
              echo "::error::tarball contains a test-only path matching $bad"
              grep -E "$bad" /tmp/entries.txt
              exit 1
            fi
          done
          echo "contents ok: $(wc -l < /tmp/entries.txt) entries"

      - name: Preflight — install and import in a clean directory
        if: steps.guard.outputs.skip != 'true'
        working-directory: packages/fml-dsa
        run: |
          set -euo pipefail
          name=$(node -p "require('./package.json').name")
          tarball=$(npm pack --silent | tail -n 1)
          tarball_path="$PWD/$tarball"
          trap 'rm -f "$tarball_path"' EXIT
          echo "tarball: $tarball_path"
          work=$(mktemp -d)
          cd "$work"
          npm init -y >/dev/null
          npm install "$tarball_path" --no-audit --no-fund
          node --input-type=module -e "
            const m = await import('$name');
            const keys = Object.keys(m);
            if (keys.length === 0) throw new Error('package exports nothing');
            console.log('import ok:', keys.length, 'exports');
          "

      - name: Preflight — sign and verify through the installed package
        if: steps.guard.outputs.skip != 'true'
        working-directory: packages/fml-dsa
        run: |
          set -euo pipefail
          tarball=$(npm pack --silent | tail -n 1)
          tarball_path="$PWD/$tarball"
          trap 'rm -f "$tarball_path"' EXIT
          work=$(mktemp -d)
          cd "$work"
          npm init -y >/dev/null
          npm install "$tarball_path" --no-audit --no-fund
          node --input-type=module -e "
            const show = console.log;
            console.log = () => {};
            const { ml_dsa44, ml_dsa65, ml_dsa87 } = await import('fml-dsa');
            const rows = [];
            for (const [tag, p] of [['44', ml_dsa44], ['65', ml_dsa65], ['87', ml_dsa87]]) {
              const kp = p.keygen();
              const msg = new TextEncoder().encode('publish preflight ' + tag);
              const sig = p.sign(msg, kp.secretKey);
              const ok = p.verify(sig, msg, kp.publicKey);
              const tampered = p.verify(sig, new TextEncoder().encode('publish preflight X'), kp.publicKey);
              const again = p.sign(msg, kp.secretKey);
              rows.push([tag, ok, tampered, Buffer.compare(Buffer.from(sig), Buffer.from(again)) === 0]);
            }
            console.log = show;
            for (const [tag, ok, tampered, deterministic] of rows) {
              console.log('ML-DSA-' + tag, 'verify=' + ok, 'tampered=' + tampered, 'deterministic=' + deterministic);
              if (!ok || tampered || !deterministic) throw new Error('ML-DSA-' + tag + ' preflight failed');
            }
          "

      - name: Publish with provenance
        # One condition, no input: a tag push. A dispatch has no way to satisfy it, so
        # there is nothing to flip and nothing to remember to turn back off.
        if: steps.guard.outputs.skip != 'true' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        working-directory: packages/fml-dsa
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public

      - name: Rehearsal - every preflight ran, nothing was published
        if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
        run: |
          echo "not a tag push: npm publish was skipped by construction"

      - name: Record result
        if: always()
        run: |
          {
            echo "### ${{ steps.pkg.outputs.name }}@${{ steps.pkg.outputs.version }}"
            echo ""
            echo "- tag: \`${{ github.event.inputs.tag || github.ref_name }}\`"
            echo "- event: ${GITHUB_EVENT_NAME}"
            echo "- tag push: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}"
            echo "- skipped (already on registry): ${{ steps.guard.outputs.skip }}"
            echo "- job status: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
