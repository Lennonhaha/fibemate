name: OpenSSF Scorecard
permissions:
  contents: read
  actions: read
  security-events: write
  id-token: write

on:
  workflow_dispatch:
  schedule:
    - cron: "30 1 * * 6"
  push:
    branches: [main]

jobs:
  analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Run scorecard
        env:
          GITHUB_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker run --rm \
            -e GITHUB_AUTH_TOKEN \
            -e GITHUB_REPOSITORY=Lennonhaha/fibemate \
            gcr.io/openssf/scorecard:v5.5.0 \
            --repo=github.com/Lennonhaha/fibemate \
            --format=json \
            --show-details 2>&1 | tee results.json
          echo "EXIT=$?"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: scorecard-results
          path: results.json
          retention-days: 5