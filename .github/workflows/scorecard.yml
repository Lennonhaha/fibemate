name: OpenSSF Scorecard
on:
  workflow_dispatch:
  schedule:
    - cron: '30 1 * * 6'
  push:
    branches: [main]

jobs:
  analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run scorecard via Docker
        run: |
          docker run --rm \
            -e GITHUB_AUTH_TOKEN=`${{ secrets.GITHUB_TOKEN }} \
            -v `${{ github.workspace }}:/repo \
            gcr.io/openssf/scorecard:latest \
            --repo=github.com/Lennonhaha/fibemate \
            --format=sarif --output=/repo/results.sarif \
            --show-details 2>&1
          echo "EXIT=`$?"
          ls -la results.sarif 2>&1 || touch results.sarif
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5