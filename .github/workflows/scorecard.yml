name: OpenSSF Scorecard
on:
  workflow_dispatch:
  schedule:
    - cron: "30 1 * * 6"
  push:
    branches: [main]

jobs:
  analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run scorecard
        env:
          GITHUB_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker run --rm \
            -e GITHUB_AUTH_TOKEN \
            -e GITHUB_REPOSITORY=Lennonhaha/fibemate \
            gcr.io/openssf/scorecard:latest \
            --repo=github.com/Lennonhaha/fibemate \
            --format=json \
            --show-details 2>&1 | tee results.json
          echo "EXIT=$?"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scorecard-results
          path: results.json
          retention-days: 5