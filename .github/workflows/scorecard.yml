name: OpenSSF Scorecard

permissions:
  contents: read
  actions: read
  security-events: write
  id-token: write

on:
  workflow_dispatch:
  schedule:
    - cron: "30 1 * * 6"
  push:
    branches: [main]

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
      id-token: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@v7

      - name: Run Scorecard analysis
        env:
          GITHUB_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker run --rm \
            -e GITHUB_AUTH_TOKEN \
            -e GITHUB_REPOSITORY=Lennonhaha/fibemate \
            gcr.io/openssf/scorecard:v5.5.0 \
            --repo=github.com/Lennonhaha/fibemate \
            --format=json \
            --show-details 2>&1 | tee results.json
          echo "EXIT=$?"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scorecard-results
          path: results.json
          retention-days: 5
