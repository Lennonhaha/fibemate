name: OpenSSF Scorecard
on:
  workflow_dispatch:
  schedule:
    - cron: '30 1 * * 6'
  push:
    branches: [ main ]

permissions: {}

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
        with:
          persist-credentials: false
      - name: Run analysis
        uses: ossf/scorecard-action@dc50aa9510ff46b811dd3065a4a2bed06d04968b
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: false
      - name: Upload artifact
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb5887
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5
      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@b248780849a2076e7c4c905a13ac2aa389447238
        with:
          sarif_file: results.sarif