# TLA+ model verification on change — PR-stage early signal.
#
# 目的：补上 G3 的"早信号"半边。nightly 已保证"合入即下次重跑"（最迟 12h），
# 本 workflow 让「改 docs/tla/** 的 PR」当场看到 TLC 结果，无需等 nightly。
#
# 门禁范围 = nightly 对齐：仅 C2（C2.cfg 的 7 条不变式）。
# OPK 是 docs/tla/ 下第二个模型（OPK.cfg 有 O1-O6 + TypeOK），但当前 nightly 未跑它，
# 且 OPK.tla 的 \/ TRUE / Next== 缺陷仍在修；为避免误红 PR，OPK 默认关闭，
# 需显式设仓库变量 TLA_OPK_GATE=true 才启用（且 continue-on-error）。

name: TLA+ (model change)
permissions:
  contents: read

on:
  pull_request:
    paths:
      - 'docs/tla/**'
      - 'scripts/tla/**'
      - '.github/workflows/docs-tla-verify.yml'
  push:
    branches: [ main ]
    paths:
      - 'docs/tla/**'
      - 'scripts/tla/**'

concurrency:
  group: tla-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tlc-c2:
    name: TLC - C2 (nightly parity)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # 与 nightly-phase1.yml 同 pin（checkout v4.2.2 / setup-java temurin17）
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '17'
      - name: Run TLC (C2 - same 7 invariants as nightly)
        env:
          TLA2TOOLS_URL: https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
        run: bash scripts/tla/c2-tlc-nightly.sh   # MODEL defaults to C2

  tlc-opk:
    name: TLC - OPK (informational - not gated yet)
    if: ${{ vars.TLA_OPK_GATE == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '17'
      - name: Run TLC (OPK - informational)
        env:
          TLA2TOOLS_URL: https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
          MODEL: OPK
        run: bash scripts/tla/c2-tlc-nightly.sh
