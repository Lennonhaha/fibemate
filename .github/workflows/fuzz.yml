# SPDX-License-Identifier: GPL-3.0-only
name: Fuzz

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'   # daily 06:00 UTC

permissions:
  contents: read

jobs:
  jazzer:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        harness:
          - harness-pqc-kem-generateKeypair
          - harness-pqc-kem-encapsulate
          - harness-pqc-kem-decapsulate
          - harness-pqc-kem-compress
          - harness-pqc-kem-shake128
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - run: npm ci --ignore-scripts

      - name: Fuzz ${{ matrix.harness }}
        run: npx jazzer fuzz/${{ matrix.harness }}.js -- -runs=10000 -max_len=4096
        timeout-minutes: 5

  # Smoke test: verify all harnesses load without error
  load-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - name: Verify CJS harnesses load
        run: |
          for f in fuzz/harness-pqc-kem-*.js; do
            echo "Loading $f"
            node -e "require('./$f')"
          done
      - name: Verify ESM harnesses load
        run: |
          for f in fuzz/harness-fml-dsa-*.mjs; do
            echo "Loading $f"
            node --input-type=module -e "await import('./$f')"
          done

  # Stable context for branch protection. Matrix jobs produce names such as
  # "jazzer (harness-pqc-kem-compress)"; requiring every matrix entry would
  # break whenever the matrix changes. This single gate is the required check.
  fuzz-gate:
    name: Fuzz
    if: always()
    needs: [jazzer, load-check]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if a fuzz job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - name: Fuzz jobs passed
        run: echo "All fuzz jobs passed."
