# CodeQL Analysis for FIBEMATE
name: "CodeQL"

permissions:
  contents: read
  actions: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 3"  # Wednesdays 06:00 UTC

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python, actions]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
          config-file: ./.github/codeql-config.yml

      - name: Autobuild
        uses: github/codeql-action/autobuild@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          category: "/language:${{ matrix.language }}"

  # Issue #582: a required check that stops running turns green. The ruleset accepts
  # `skipped` and `neutral` for a required context, so requiring `Analyze (...)` directly
  # means a paths filter, a job-level `if`, or a deleted matrix entry silently satisfies the
  # gate. This job is the only CodeQL context that belongs in the required set: it has no
  # paths filter, it runs even when the matrix fails, and it fails unless the analysis
  # actually completed.
  #
  # Scope, stated so it is not overread: this gate enforces that the scan ran. It does not
  # make findings block a merge. CodeQL uploads SARIF and exits 0 regardless of alerts, so
  # blocking on severity is a separate ruleset rule (`code_scanning`), not something a job
  # conclusion can express.
  codeql-gate:
    name: codeql-gate
    runs-on: ubuntu-latest
    needs: analyze
    if: always()
    permissions:
      contents: read
    steps:
      # Without this the job runs in an empty directory and looks for the verdict script in
      # a tree that was never checked out -- which fails, but for the wrong reason, and would
      # read as "the gate works" to anyone not opening the log. The structural guard checks
      # for this line for the same reason.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Fail unless the analysis ran and completed
        env:
          ANALYZE_RESULT: ${{ needs.analyze.result }}
        run: node scripts/codeql-gate.cjs "$ANALYZE_RESULT"
