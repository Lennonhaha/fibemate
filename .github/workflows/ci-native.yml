# Native C Addon CI — ML-KEM-768 (Multi-Platform Matrix)
#
# Verifies the C addon compiles and works across platforms.
# Separate from ci.yml which covers JS-level API tests.

name: Native Addon CI

on:
  push:
    paths:
      - 'packages/pqc-kem/native/**'
      - '.github/workflows/ci-native.yml'
      - 'packages/pqc-kem/package.json'
  pull_request:
    paths:
      - 'packages/pqc-kem/native/**'
      - '.github/workflows/ci-native.yml'
      - 'packages/pqc-kem/package.json'
  workflow_dispatch:

jobs:
  build-native:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
      fail-fast: false
    runs-on: ${{ matrix.os }}

    env:
      # GYP_MSVS_OVERRIDE_PATH overrides info.path used in getMSBuild() to locate MSBuild.exe.
      # This bypasses the broken PowerShell vswhere detection that fails on VS 2022 Enterprise
      # (unknown version "undefined" at VS\18\Enterprise causes RangeError).
      # Combined with --msvs-version 2022 in package.json, node-gyp v11 finds MSBuild directly.
      GYP_MSVS_OVERRIDE_PATH: 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise'

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: npm install (addon deps)
        working-directory: packages/pqc-kem
        run: npm install

      - name: Build C addon
        working-directory: packages/pqc-kem
        run: npm run build:native:release

      - name: Run native tests
        working-directory: packages/pqc-kem
        run: node ../../scripts/test-native-addon.cjs

      - name: Performance benchmark (500 rounds)
        working-directory: packages/pqc-kem
        run: node ../../scripts/mlkem-bench-native.cjs 500

  # Nightly: full 10000-round regression
  nightly-regression:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: sudo apt-get update && sudo apt-get install -y build-essential
      - working-directory: packages/pqc-kem
        run: npm install && npm run build:native:release
      - working-directory: packages/pqc-kem
        run: node ../../scripts/mlkem-bench-native.cjs 10000
