# nginx-drift -- keep the tracked nginx site config honest against the live host.
#
# The production config is edited on the server, so deploy/nginx/*.conf can rot.
# The offline job always runs; the live job runs only when the NGINX_SSH_KEY
# secret is configured (it needs ssh access to the host, which CI has no other
# reason to hold).
#
# Repository settings used by the live job:
#   secret NGINX_SSH_KEY   private half of a key restricted on the host to
#                          `command="cat /etc/nginx/sites-enabled/fibemate.net",restrict`
#   var    NGINX_HOST      host name or address of the server (required)
#   var    NGINX_USER      ssh user, default root
#   var    NGINX_PORT      ssh port, default 22
name: nginx-drift
permissions:
  contents: read

on:
  push:
    branches: [ main ]
    paths:
      # Deploy debt is created by merging runtime code, not by editing this workflow.
      # Without src/packages/www here, the alignment job only woke up when someone
      # touched its own files: the one event it exists to measure never triggered it.
      # (Observed 2026-11-20: three merges to main after #611, one drift run.)
      - 'src/**'
      - 'packages/**'
      - 'www/**'
      - 'deploy/nginx/**'
      - 'scripts/check-nginx-drift.cjs'
      - 'scripts/probe-live-http.cjs'
      - 'scripts/check-deploy-alignment.cjs'
      - '.github/workflows/nginx-drift.yml'
  pull_request:
    paths:
      - 'deploy/nginx/**'
      - 'scripts/check-nginx-drift.cjs'
      - 'scripts/probe-live-http.cjs'
      - 'scripts/check-deploy-alignment.cjs'
      - '.github/workflows/nginx-drift.yml'
  schedule:
    # 03:17 UTC = 11:17 Asia/Shanghai. The path filter above means this gate only
    # woke up when someone edited nginx; the schedule makes rot surface on its own.
    - cron: '17 3 * * *'
  workflow_dispatch:

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: Tracked copy has no secrets, addresses or mojibake
        run: node scripts/check-nginx-drift.cjs --offline

      # The comparison used to walk both files by index, so one inserted line made
      # every following line look different: a real four-line drift (2026-11-24)
      # printed dozens of phantom lines. Drift that noisy is drift nobody reads.
      - name: Comparison locates insertions instead of cascading
        run: node scripts/check-nginx-drift.cjs --self-test

  live:
    runs-on: ubuntu-latest
    needs: offline
    env:
      NGINX_SSH_KEY: ${{ secrets.NGINX_SSH_KEY }}
      NGINX_HOST: ${{ vars.NGINX_HOST }}
      NGINX_USER: ${{ vars.NGINX_USER || 'root' }}
      NGINX_PORT: ${{ vars.NGINX_PORT || '22' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22

      - name: Live comparison is not configured
        if: env.NGINX_SSH_KEY == '' || env.NGINX_HOST == ''
        run: 'echo "::notice::live drift check skipped (NGINX_SSH_KEY / vars.NGINX_HOST not set)"'

      - name: Install deploy key
        if: env.NGINX_SSH_KEY != '' && env.NGINX_HOST != ''
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$NGINX_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$NGINX_PORT" -H "$NGINX_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Tracked copy matches the live file
        if: env.NGINX_SSH_KEY != '' && env.NGINX_HOST != ''
        run: node scripts/check-nginx-drift.cjs --host "$NGINX_HOST" --user "$NGINX_USER" --port "$NGINX_PORT"

  http:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22

      # Negative E2E: the assertion function must reject each known-bad shape.
      - name: Assertions reject bad responses (self-test)
        run: node scripts/probe-live-http.cjs --self-test

      # The response layer needs no ssh and no secret. Skipped on pull_request so
      # a production hiccup cannot red a docs-only PR; push/schedule/dispatch run it.
      - name: Live responses match the retired-route contract
        if: github.event_name != 'pull_request'
        run: node scripts/probe-live-http.cjs --base https://fibemate.net

  # Non-required on purpose. The first period is observation: a red run reports a
  # real gap between main and what nginx serves, but it must not block merges until
  # the negative controls have been seen failing for a while.
  alignment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22

      # Negative control: the classifier must call a behind tree DRIFT and an
      # unknown commit UNKNOWN, otherwise the live check below proves nothing.
      - name: Classifier rejects a behind tree (self-test)
        run: node scripts/check-deploy-alignment.cjs --self-test

      # Skipped on pull_request for the same reason as the http job: reading the
      # production state is not a property of the change under review.
      - name: Served tree contains the deploy paths of main
        if: github.event_name != 'pull_request'
        run: node scripts/check-deploy-alignment.cjs --repo . --ref origin/main --max-debt 2
