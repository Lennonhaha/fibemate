# pr-body-gate -- the PR description is part of the change.
#
# A reviewer must be able to see what was done, what proves it, and what moved,
# without reading the diff first. Required check on main; bots are exempt because
# Dependabot cannot fill a template.
name: pr-body-gate

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-body-gate:
    runs-on: ubuntu-latest
    # Skip the bot branches, not just the bot actor: a maintainer who rebases or
    # edits a Dependabot PR becomes the actor, and the bump still cannot fill a
    # template. The dependency review happens on the PR, not in this gate.
    if: github.actor != 'dependabot[bot]' && github.actor != 'renovate[bot]' && !startsWith(github.head_ref, 'dependabot/')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: Require Action / Evidence / Delta
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh pr view "$PR" --json body --jq .body > body.md
          node scripts/check-pr-body.cjs body.md
