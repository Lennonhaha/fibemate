# SPDX-License-Identifier: GPL-3.0-only
name: site-versions
# Fails when www/tools/ advertises a package version the registry does not call
# latest - the failure mode that stayed green for hours on 2026-11-23 because
# www/** is excluded from verifact's scan.
#
# www/index.html advertises the same npm/PyPI versions in badge markup; the parser reads
# both shapes, and the homepage is checked here so a stale badge cannot hide behind a
# green tools page.
#
# Exit codes from scripts/check-site-versions.cjs:
#   0 matched   1 mismatch (real drift)   2 parse/usage   3 registry unreachable
#
# Alert level, decided 2026-11-23 after measuring the noise: three runs in one
# hour produced two transient registry failures. Exit 3 therefore does not block
# on the paths where a human is mid-change:
#   - page-in-tree      blocking: the tree is ours, the registry is only a lookup
#   - live (scheduled)  blocking: once a day, a site that lags main is news
#   - live (advisory)   not a gate: named "advisory" so its green is never read
#                       as "the live site was verified"
# No `|| true` anywhere. The advisory job passes --allow-advisory, which prints
# ADVISORY (not a pass) and leaves every row `unknown`.
on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'www/tools/**.html'
      - 'www/index.html'
      - 'scripts/check-site-versions.cjs'
      - '.github/workflows/site-versions.yml'
  pull_request:
    paths:
      - 'www/tools/**.html'
      - 'www/index.html'
      - 'scripts/check-site-versions.cjs'
      - '.github/workflows/site-versions.yml'

permissions:
  contents: read

concurrency:
  group: site-versions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  page-in-tree:
    name: page in tree vs registries
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - name: selftest - red on old version, red on no-network
        run: node scripts/check-site-versions.cjs --selftest
      - name: compare the tree
        run: node scripts/check-site-versions.cjs --no-cache --verbose --retries 3
      - name: compare the homepage badges in the tree
        run: node scripts/check-site-versions.cjs --file www/index.html --no-cache --verbose --retries 3

  live-scheduled:
    name: live site (scheduled gate)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - name: compare the live page
        run: |
          node scripts/check-site-versions.cjs --url https://fibemate.net/tools/ --no-cache --verbose --retries 3
          node scripts/check-site-versions.cjs --url https://fibemate.net/ --no-cache --verbose --retries 3

  live-advisory:
    name: live site (advisory, not a gate)
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - name: compare the live page (network failure is not a verdict)
        run: |
          node scripts/check-site-versions.cjs --url https://fibemate.net/tools/ --no-cache --verbose --retries 2 --allow-advisory
          node scripts/check-site-versions.cjs --url https://fibemate.net/ --no-cache --verbose --retries 2 --allow-advisory
