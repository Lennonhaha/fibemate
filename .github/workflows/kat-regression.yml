# FIBEMATE KAT Regression — deep known-answer regression on demand + nightly
#
# Purpose: systematic regression against committed KAT vectors and
# cross-implementation oracles. Runs DEEPER than ci.yml (which is fast-path)
# without the full Nightly-Full load.
#
# Trigger:
#   - workflow_dispatch (manual, on demand — e.g. before a release)
#   - schedule daily 22:30 UTC (offset from Nightly 06:00/06:30 UTC)
#   - every pull_request (NO paths filter — see "Why this always runs" below)
#
# Why this always runs: KAT-Regression is a required status check on main. A
# required check that is filtered by `paths:` never reports on pull requests that
# touch other paths, and GitHub then blocks those pull requests forever with
# `Required status check "KAT-Regression" is expected.` (observed on #496, a
# docs-only change, 2026-11-15). So the workflow always runs, decides in ~15s
# whether any crypto source changed, skips the four heavy jobs when nothing did,
# and still reports the one context main requires — `KAT-Regression`.
#
# What it validates (when crypto paths changed):
#   - ML-KEM-768: 10,000-round roundtrip + key uniqueness (kat-quick full)
#   - ML-KEM-768: FIPS 203 KAT .rsp header + vector presence (ci-mlkem-kat)
#   - fml-dsa (ML-DSA FIPS 204): KeyGen KAT 75/75 vs noble oracle (kat-verify)
#   - SM2/SM3/SM4 national-standard CI (100+30+30)
#   - Keccak/SHA-3/SHAKE vectors (test-keccak)
#   - Integrity baseline (test-fibemate Track 3b, FIPS 140-3 §11.9)

name: KAT Regression

permissions:
  contents: read

on:
  schedule:
    - cron: '30 22 * * *'
  workflow_dispatch:
  pull_request:

concurrency:
  group: kat-regression
  cancel-in-progress: false

env:
  NODE_VERSION: '22'

jobs:

  # Decides whether the heavy jobs are worth running. Cheap on purpose: a
  # docs-only pull request should cost seconds, not half an hour.
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Decide whether crypto code changed
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "event=$EVENT_NAME: running the full suite"
            exit 0
          fi
          changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          echo "changed files: $(printf '%s' "$changed" | grep -c '' || true)"
          if printf '%s\n' "$changed" | grep -Eq '^(packages/|src/|lib/|scripts/kat-|scripts/ci-mlkem-|scripts/ci-gm-)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "crypto paths changed: running the full suite"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "no crypto paths in this pull request: heavy jobs will be skipped"
          fi

  mlkem-kat:
    needs: scope
    if: needs.scope.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: ML-KEM-768 full KAT — 10,000 rounds roundtrip + uniqueness
        run: node scripts/kat-quick.js --samples 10000
      - name: FIPS 203 KAT .rsp header + vector presence
        run: node scripts/ci-mlkem-kat.cjs
      - name: NIST ACVP vectors - 240 cases (keyGen, encaps, decaps, key checks)
        run: |
          node packages/pqc-kem/test/acvp-kat.test.cjs
          node packages/pqc-kem/test/acvp-encapDecap.test.cjs
      - name: Internal-step invariants (NTT, codec, compress, samplers)
        run: node packages/pqc-kem/test/internal-invariants.test.js

  fml-dsa-kat:
    needs: scope
    if: needs.scope.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        working-directory: ./packages/fml-dsa
        run: npm ci --ignore-scripts
      - name: ML-DSA KeyGen KAT — 75 vectors vs noble oracle
        working-directory: ./packages/fml-dsa
        run: node test/kat-verify.mjs
      - name: fml-dsa unit suites
        working-directory: ./packages/fml-dsa
        run: |
          node test/ntt.test.js
          node test/shakestream.test.js
          node test/fml-dsa.test.js
          node test/context-passthrough.test.js

  gm-standards:
    needs: scope
    if: needs.scope.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: SM2 sign/verify + encrypt/decrypt (100+100)
        run: node scripts/ci-gm-sm2.cjs
      - name: SM3 hash (30)
        run: node scripts/ci-gm-sm3.cjs
      - name: SM4-GCM AEAD (30)
        run: node scripts/ci-gm-sm4.cjs

  integrity-and-keccak:
    needs: scope
    if: needs.scope.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Keccak/SHA-3/SHAKE vectors
        run: node test/test-keccak.js
      - name: FIPS 140-3 §11.9 integrity baseline + harness
        run: node test/test-fibemate.js

  # The only context main requires. It reports success when nothing needed to
  # run, and fails if the scope job could not decide — an undecidable state must
  # not be reported as green.
  kat-regression-gate:
    name: KAT-Regression
    needs: [scope, mlkem-kat, fml-dsa-kat, gm-standards, integrity-and-keccak]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report the combined result
        env:
          NEEDED: ${{ needs.scope.outputs.run }}
          MLKEM: ${{ needs.mlkem-kat.result }}
          FMLDSA: ${{ needs.fml-dsa-kat.result }}
          GM: ${{ needs.gm-standards.result }}
          INTEG: ${{ needs.integrity-and-keccak.result }}
        run: |
          set -eu
          echo "scope.run=$NEEDED mlkem=$MLKEM fml-dsa=$FMLDSA gm=$GM integrity=$INTEG"
          if [ "$NEEDED" = "false" ]; then
            echo "No crypto source changed in this pull request: nothing to regress."
            exit 0
          fi
          if [ "$NEEDED" != "true" ]; then
            echo "The scope job did not produce a decision ('$NEEDED'). Refusing to report green."
            exit 1
          fi
          bad=0
          for r in "$MLKEM" "$FMLDSA" "$GM" "$INTEG"; do
            if [ "$r" != "success" ]; then
              echo "heavy job result: $r"
              bad=1
            fi
          done
          if [ "$bad" -eq 0 ]; then echo "All KAT jobs passed."; fi
          exit "$bad"
