name: Native Addon Build

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - 'packages/pqc-kem/native/**'
      - 'packages/pqc-kem/index.js'
      - '.github/workflows/native-build.yml'
  pull_request:
    paths:
      - 'packages/pqc-kem/native/**'
      - '.github/workflows/native-build.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    # Needed only by the publish step below. Pull requests from forks never reach it
    # (the step is gated on the event), so a fork gets read-only permissions as usual.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04]
        node: [20, 22]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}

      # The key is the identity of the build inputs: the native source tree and the
      # workflow that holds the flags. Keying by commit would leave every deploy of a
      # non-native commit without an artifact, and "keep whatever is on disk" is how
      # packages/ drifted (#507). Same key means the artifact can be reused as-is.
      - name: Compute the artifact key
        id: key
        run: |
          node scripts/native-artifact-key.cjs --repo . --commit HEAD --json > native-key.json
          {
            echo "key=$(node -p "require('./native-key.json').key")"
            echo "native_tree=$(node -p "require('./native-key.json').nativeTree")"
            echo "workflow_sha=$(node -p "require('./native-key.json').workflowSha")"
          } >> "$GITHUB_OUTPUT"
          rm -f native-key.json

      - name: Install npm dependencies
        working-directory: packages/pqc-kem
        run: npm install

      - name: Build native addon
        working-directory: packages/pqc-kem
        run: npx node-gyp rebuild -C native --release

      # The addon is deployed to hosts whose CPU we do not know at build time, so
      # the instruction set has to be pinned by us. -march=native made the binary
      # depend on the build machine: #535 shipped AVX512_VBMI (vpermt2b) to a host
      # without vbmi and the process died with SIGILL on the first ML-KEM call,
      # and #533 is the same flag producing different bytes on different runners.
      - name: Assert a portable ISA baseline
        run: |
          # Comments mention -march=native on purpose (they explain why it must not
          # come back), so the check has to look at the live flags only.
          flags=$(grep -v '^[[:space:]]*#' packages/pqc-kem/native/binding.gyp)
          if printf '%s\n' "$flags" | grep -q -- '-march=native'; then
            echo "FATAL: -march=native ties the artifact to the build CPU (issues #533, #535)" >&2
            exit 1
          fi
          if ! printf '%s\n' "$flags" | grep -q -- '-march=x86-64-v3'; then
            echo "FATAL: the documented baseline -march=x86-64-v3 is missing" >&2
            exit 1
          fi
          echo "baseline: x86-64-v3 (AVX2/BMI2/FMA)"

      # x86-64-v3 tops out at 256-bit vectors, so a zmm register can only come
      # from an AVX-512 target - exactly the defect class of #535. Fail here, on
      # the builder, rather than on the deploy host with SIGILL.
      - name: Assert the artifact contains no AVX-512
        working-directory: packages/pqc-kem/native/build/Release
        run: |
          zmm=$(objdump -d mlkem.node | grep -c 'zmm' || true)
          echo "zmm references: $zmm"
          if [ "$zmm" != "0" ]; then
            objdump -d mlkem.node | grep -m5 -B1 'zmm' || true
            echo "FATAL: the artifact uses AVX-512, above the documented x86-64-v3 baseline" >&2
            exit 1
          fi

      # The commit/ref values are passed through env, never interpolated into the
      # script body: a branch name is attacker-controlled on a fork PR, and
      # inserting it into a shell line is code injection (CodeQL, this PR).
      - name: Record build provenance
        working-directory: packages/pqc-kem/native/build/Release
        env:
          SRC_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SRC_REF: ${{ github.event.pull_request.head.ref || github.ref }}
          WORKFLOW_REF: ${{ github.ref }}
          ARTIFACT_KEY: ${{ steps.key.outputs.key }}
          NATIVE_TREE: ${{ steps.key.outputs.native_tree }}
          WORKFLOW_SHA: ${{ steps.key.outputs.workflow_sha }}
        run: |
          sha256sum mlkem.node > mlkem.node.sha256
          sha256sum -c mlkem.node.sha256
          {
            echo "file: mlkem.node"
            echo "bytes: $(stat -c %s mlkem.node)"
            echo "commit: $SRC_SHA"
            echo "ref: $SRC_REF"
            echo "workflow_ref: $WORKFLOW_REF"
            echo "native_tree: $NATIVE_TREE"
            echo "workflow_sha: $WORKFLOW_SHA"
            echo "artifact_key: $ARTIFACT_KEY"
            echo "node: $(node -v)"
            echo "gcc: $(cc --version | head -1)"
            echo "glibc: $(ldd --version | head -1)"
            echo "runner: ${{ matrix.os }}"
            echo "march: $(grep -v '^[[:space:]]*#' ../../binding.gyp | grep -o -- '-march=[a-z0-9-]*' | head -1)"
            echo "avx512_zmm_refs: $(objdump -d mlkem.node | grep -c 'zmm' || true)"
          } > build-info.txt
          cat mlkem.node.sha256
          cat build-info.txt

      # The deploy host verifies the runtime addon against mlkem.node.sha256
      # (scripts/deploy-fibemate.sh, step [3d]). Without this artifact the
      # manifest could only come from whoever built the addon by hand.
      - name: Upload addon and its manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mlkem-node-${{ matrix.os }}-node${{ matrix.node }}-${{ steps.key.outputs.key }}
          path: |
            packages/pqc-kem/native/build/Release/mlkem.node
            packages/pqc-kem/native/build/Release/mlkem.node.sha256
            packages/pqc-kem/native/build/Release/build-info.txt
          if-no-files-found: error
          retention-days: 14

      # Issue #570: the deploy host must not hold a credential that expires. Actions
      # artifacts need an authenticated API call and are deleted after 14 days, so the
      # host could only ever consume them through a token, or through a hand-filled local
      # cache whose freshness nobody checks. A public release asset is fetched with plain
      # HTTPS: no token on the host, no expiry date, and "not published" is a 404 that the
      # deploy reports as such instead of falling back to whatever is lying around.
      #
      # The tag carries the build key and the Node major. The key names the inputs, so the
      # same key must always yield the same bytes; if it does not, the publish fails rather
      # than replacing an asset that consumers resolve by key (issue #533).
      - name: Publish the addon as a release asset
        if: github.event_name != 'pull_request'
        working-directory: packages/pqc-kem/native/build/Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACT_KEY: ${{ steps.key.outputs.key }}
          NODE_MAJOR_FOR_TAG: ${{ matrix.node }}
        run: |
          set -euo pipefail
          tag="native-node${NODE_MAJOR_FOR_TAG}-${ARTIFACT_KEY}"
          new="$(awk '{print $1}' mlkem.node.sha256)"
          if gh release view "$tag" >/dev/null 2>&1; then
            ( gh release download "$tag" -p mlkem.node.sha256 -D "$RUNNER_TEMP/existing" ) || true
            if [ -s "$RUNNER_TEMP/existing/mlkem.node.sha256" ]; then
              old="$(awk '{print $1}' "$RUNNER_TEMP/existing/mlkem.node.sha256")"
              if [ "$old" != "$new" ]; then
                echo "FATAL: build key $ARTIFACT_KEY produced different bytes than the published asset" >&2
                echo "       published ${old:0:12}  this build ${new:0:12}" >&2
                echo "       the key names the inputs, so identical inputs must give identical bytes" >&2
                echo "       (issue #533). Refusing to overwrite an asset consumers resolve by key." >&2
                exit 1
              fi
              echo "already published with identical bytes: ${new:0:12}"
              exit 0
            fi
            echo "release $tag exists but has no sidecar yet; uploading"
          else
            gh release create "$tag" \
              --title "Native addon node${NODE_MAJOR_FOR_TAG} ${ARTIFACT_KEY}" \
              --notes "CI-built ML-KEM addon. Deploy hosts fetch these assets over HTTPS and verify mlkem.node.sha256 before use. Key: ${ARTIFACT_KEY} (native tree + workflow). This release is a build cache, not a supported download." \
              --latest=false
          fi
          gh release upload "$tag" mlkem.node mlkem.node.sha256 build-info.txt
          echo "published $tag: ${new:0:12}"

      - name: Verify native addon loads
        run: |
          node -e "
          const pk = require('./packages/pqc-kem');
          console.log('Backend:', pk.usingNative ? 'C NATIVE' : 'JS (no addon)');
          // A missing addon would otherwise still pass the roundtrip below on
          // the JS fallback - the same silent degradation that ran in
          // production for ~75 days (issue #520).
          if (!pk.usingNative) {
            console.error('FATAL: the addon did not load; the roundtrip would only prove the JS path');
            process.exit(2);
          }
          const k = pk.generateKeypair();
          console.log('pk bytes:', k.publicKey.length);
          const e = pk.encapsulate(k.publicKey);
          console.log('ct bytes:', e.ciphertext.length);
          const d = pk.decapsulate(k.secretKey, e.ciphertext);
          const ok = Buffer.from(e.sharedSecret).equals(Buffer.from(d));
          console.log('roundtrip:', ok ? 'PASS' : 'FAIL');
          process.exit(ok ? 0 : 1);
          "

      - name: Self-KAT (100 rounds)
        run: |
          node -e "
          const pk = require('./packages/pqc-kem');
          let pass = 0;
          for (let i = 0; i < 100; i++) {
            const k = pk.generateKeypair();
            const e = pk.encapsulate(k.publicKey);
            const d = pk.decapsulate(k.secretKey, e.ciphertext);
            if (Buffer.from(e.sharedSecret).equals(Buffer.from(d))) pass++;
          }
          console.log('Self-KAT 100:', pass + '/100');
          process.exit(pass === 100 ? 0 : 1);
          "

      - name: Verify NIST KAT (100 vectors, spot-check)
        if: vars.ENABLE_NIST_KAT == 'true'  # off by default; TODO: replace with ACVP-based KAT for C addon
        run: |
          node -e "
          const fs = require('fs');
          const pk = require('./packages/pqc-kem');
          const ref = fs.readFileSync('packages/pqc-kem/test/kat/mlkem-768-KAT.rsp', 'utf8');
          var count = 0, pass = 0;
          var seed = '', dk = '', c = '', k = '';
          for (const line of ref.split('\n')) {
            if (line.startsWith('count =')) { count++; continue; }
            if (line.startsWith('dk =')) dk = line.slice(5);
            else if (line.startsWith('c =')) c = line.slice(4);
            else if (line.startsWith('k =')) k = line.slice(4);
            if (dk && c && k) {
              try {
                const sk = Buffer.from(dk.substring(0,4800), 'hex');
                const ct = Buffer.from(c, 'hex');
                const d = pk.decapsulate(sk, ct);
                if (Buffer.from(d).toString('hex') === k) pass++;
                else process.stderr.write('KAT #' + count + ' mismatch\n');
              } catch(e) { process.stderr.write('KAT #' + count + ' error: ' + e.message + '\n'); }
              dk = ''; c = ''; k = '';
            }
          }
          console.log('KAT verify:', pass + '/' + count);
          process.exit(pass === count ? 0 : 1);
          "

      - name: Compat fixtures test
        continue-on-error: true  # golden JSON sk format not aligned with C addon yet
        run: node test/run-compat-fixtures.mjs || echo "(compat fixtures skipped — known gap)"

      - name: JS fallback verify (no addon)
        run: |
          node -e "
          const JS = require('./packages/pqc-kem/src/ml-kem-768.js');
          let pass = 0;
          for (let i = 0; i < 10; i++) {
            const kp = JS.generateKeypair();
            const enc = JS.encapsulate(kp.publicKey);
            const d = JS.decapsulate(kp.secretKey, enc.ciphertext);
            if (Buffer.from(enc.sharedSecret).equals(Buffer.from(d))) pass++;
          }
          console.log('JS fallback roundtrip:', pass + '/10');
          process.exit(pass === 10 ? 0 : 1);
          "
