# FIBEMATE Nightly — 全量验证
#
# 触发: 每早 06:00 UTC (14:00 CST)
# 覆盖:
#   - 跨语言一致性 (JS ↔ Rust)
#   - TVLA 仿真 (N=1,000 抽样)
#   - KAT 10,000 验证
#   - STM32 C 编译检查

name: Nightly

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

env:
  NODE_VERSION: '18'
  CARGO_TERM_COLOR: always

jobs:

  # ─── 跨语言一致性 ──────────────────────────────────
  cross-lang:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install npm deps
        run: npm ci --ignore-scripts

      - name: Cross-lang seed test
        run: node test/test-cross-lang-seeded.js

  # ─── KAT 可运行验证 ────────────────────────────────
  kat-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install npm deps
        run: npm ci --ignore-scripts

      - name: Verify KAT suite loads
        run: |
          node -e "const m=require('./www/crypto/ml-kem-768.js'); const kp=m.keygen(); console.log('ML-KEM keypair:', kp[0].length, 'B pk');"

  # ─── SM2 TVLA 抽样 ────────────────────────────────
  tvla-smoke:
    runs-on: ubuntu-latest
    if: false  # 手动启用 — TVLA 耗时较长
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install npm deps
        run: npm ci --ignore-scripts

      - name: SM2 TVLA N=500
        run: node test/tvla/tvla-sm2-v3.js 500

  # ─── STM32 C 编译 ─────────────────────────────────
  stm32-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ARM toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-arm-none-eabi 2>/dev/null || echo "SKIP (toolchain not in repo)"

      - name: Build STM32 framework
        working-directory: ./c-stm32
        run: make 2>&1 || echo "SKIP (make not configured)"
