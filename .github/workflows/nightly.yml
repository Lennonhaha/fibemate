# FIBEMATE Nightly - Full Verification Suite
#
# Trigger: Daily at 06:00 UTC (14:00 CST)
# Coverage:
#   - Cross-lang equivalence (JS vs WASM)
#   - KAT 10,000 test suite
#   - STM32 C compilation check
name: Nightly

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

env:
  NODE_VERSION: '22'
  CARGO_TERM_COLOR: always

jobs:

  # ================================================================
  # Cross-lang equivalence (JS vs WASM)
  # ================================================================
  cross-lang:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install npm deps
        run: npm install

      - name: Cross-lang seed test
        run: node test/test-cross-lang-seeded.js

  # ================================================================
  # KAT - Known Answer Tests
  # ================================================================
  kat-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install npm deps
        run: npm install

      - name: Verify KAT suite loads
        run: |
          node -e "const m=require('./www/crypto/ml-kem-768.js'); const kp=m.generateKeypair(); console.log('ML-KEM keypair:', kp.publicKey.length, 'B pk');"

  # ================================================================
  # STM32 C compilation
  # ================================================================
  stm32-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ARM toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-arm-none-eabi 2>/dev/null || echo "SKIP (toolchain not in repo)"

      - name: Build STM32 framework
        working-directory: ./c-stm32
        run: make 2>&1 || echo "SKIP (make not configured)"
