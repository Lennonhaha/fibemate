# FIBEMATE Nightly 鈥?鍏ㄩ噺楠岃瘉
#
# 瑙﹀彂: 姣忔棭 06:00 UTC (14:00 CST)
# 瑕嗙洊:
#   - 璺ㄨ瑷€涓€鑷存€?(JS ? Rust)
#   - KAT 10,000 楠岃瘉
#   - STM32 C 缂栬瘧妫€鏌?
name: Nightly

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

env:
  NODE_VERSION: '18'
  CARGO_TERM_COLOR: always

jobs:

  # 鈹€鈹€鈹€ 璺ㄨ瑷€涓€鑷存€?鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€
  cross-lang:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install npm deps
        run: npm install --ignore-scripts

      - name: Cross-lang seed test
        run: node test/test-cross-lang-seeded.js

  # 鈹€鈹€鈹€ KAT 鍙繍琛岄獙璇?鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€
  kat-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install npm deps
        run: npm install --ignore-scripts

      - name: Verify KAT suite loads
        run: |
          node -e "const m=require('./www/crypto/ml-kem-768.js'); const kp=m.keygen(); console.log('ML-KEM keypair:', kp[0].length, 'B pk');"

  # 鈹€鈹€鈹€ STM32 C 缂栬瘧 鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€
  stm32-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ARM toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-arm-none-eabi 2>/dev/null || echo "SKIP (toolchain not in repo)"

      - name: Build STM32 framework
        working-directory: ./c-stm32
        run: make 2>&1 || echo "SKIP (make not configured)"
