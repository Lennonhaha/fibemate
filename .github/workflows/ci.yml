name: CI

on:
  push:
    branches: [experimental/vwz-lg]
  pull_request:
    branches: [experimental/vwz-lg]

jobs:
  guard:
    name: Encoding & Secret Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Encoding check (no mojibake / U+FFFD)
        run: |
          python3 - <<'PYEOF'
          import os, sys
          SKIP_EXT = {'.tsr','.wasm','.pdf','.png','.jpg','.jpeg','.gif',
                      '.zip','.gz','.tar','.bin','.so','.dll','.exe','.pdb',
                      '.rmeta','.node'}
          bad = []
          for root, dirs, files in os.walk('.'):
              if '.git' in root:
                  continue
              for fn in files:
                  if os.path.splitext(fn)[1].lower() in SKIP_EXT:
                      continue
                  p = os.path.join(root, fn)
                  try:
                      with open(p, 'rb') as fh:
                          data = fh.read()
                  except OSError:
                      continue
                  if b'\x00' in data[:8192]:
                      continue
                  try:
                      text = data.decode('utf-8')
                  except UnicodeDecodeError:
                      bad.append(p + ': invalid UTF-8')
                      continue
                  if '\ufffd' in text:
                      bad.append(p + ': contains U+FFFD (mojibake)')
          if bad:
              print('ENCODING ISSUES FOUND:')
              for b in bad:
                  print('  ' + b)
              sys.exit(1)
          print('OK: no encoding issues')
          PYEOF

      - name: Secret scan (no leaked credentials)
        run: |
          python3 - <<'PYEOF'
          import os, re, sys
          AK = re.compile(r'LTAI[0-9A-Z]{12,}')
          KEY = re.compile(r'-----BEGIN (?:RSA |EC |OPENSSH |DSA |PKCS8 )?PRIVATE KEY-----')
          bad = []
          for root, dirs, files in os.walk('.'):
              if '.git' in root:
                  continue
              for fn in files:
                  if os.path.splitext(fn)[1].lower() in {'.png','.jpg','.pdf','.zip','.gz','.wasm','.tsr','.bin'}:
                      continue
                  p = os.path.join(root, fn)
                  try:
                      with open(p, 'r', encoding='utf-8', errors='ignore') as fh:
                          text = fh.read()
                  except OSError:
                      continue
                  if AK.search(text):
                      bad.append(p + ': Alibaba AccessKey ID pattern')
                  if KEY.search(text):
                      bad.append(p + ': private key PEM header')
          if bad:
              print('SECRET ISSUES FOUND:')
              for b in bad:
                  print('  ' + b)
              sys.exit(1)
          print('OK: no leaked credentials')
          PYEOF

      - name: Python syntax check
        run: |
          find . -name '*.py' -not -path './.git/*' -print0 | xargs -0 -r python3 -m py_compile

      - name: Rust check (vwz-sign-wasm)
        continue-on-error: true
        run: |
          if [ -f rust/vwz-sign-wasm/Cargo.toml ]; then
            (cd rust/vwz-sign-wasm && cargo check --all-features)
          fi

      - name: Rust check (lg-v2.3)
        continue-on-error: true
        run: |
          if [ -f experimental/vwz-lg/lg-v2.3/Cargo.toml ]; then
            (cd experimental/vwz-lg/lg-v2.3 && cargo check --all-features)
          fi
