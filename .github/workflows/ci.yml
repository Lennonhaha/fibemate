# FIBEMATE CI Pipeline
#
# 触发: push / PR to main
# 覆盖:
#   - 国密三件套 (SM2/SM3/SM4-GCM) JS↔Python 跨语言验证
#   - ML-KEM-768 KAT 自验证
#   - Node.js 单元测试
#   - ESLint 静态分析
#   - 文档检查

name: CI
permissions: read-all

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: '18'

jobs:

  # ─── 国密跨语言 KAT 验证 ─────────────────────────────
  gm-crossval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: SM2 sign/verify + encrypt/decrypt (100 vectors)
        run: node scripts/ci-gm-sm2.cjs

      - name: SM3 hash (30 vectors)
        run: node scripts/ci-gm-sm3.cjs

      - name: SM4-GCM (30 vectors)
        run: node scripts/ci-gm-sm4.cjs

  # ─── ML-KEM-768 KAT ─────────────────────────────────
  mlkem-kat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: ML-KEM-768 cross-language validation
        run: node test/test-cross-lang.js

  # ─── Node.js 单元测试 ───────────────────────────────
  node-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Run unit tests
        run: |
          node test/test-keccak.js
          node test/test-fibemate.js

  # ─── ESLint 静态分析 ─────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install ESLint
        run: npm install --no-save eslint

      - name: Run ESLint
        run: npx eslint packages/pqc-kem/src/ scripts/ test/ --max-warnings 50

  # ─── 文档检查 ───────────────────────────────────────
  docs-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Check markdown formatting
        run: |
          npx --yes markdownlint-cli@0.40.0 \
            --disable MD013 MD033 MD041 MD046 \
            README.md CONTRIBUTING.md BUILD.md *.md docs/*.md 2>/dev/null || true

      - name: Check dead links in docs
        run: |
          npx --yes markdown-link-check@3.12.2 README.md 2>/dev/null || true
