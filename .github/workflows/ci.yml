# FIBEMATE CI Pipeline — Multi-Platform Matrix
#
# 触发: push / PR to main
# 覆盖:
#   - 国密三件套 (SM2/SM3/SM4-GCM) 跨平台 JS 验证
#   - ML-KEM-768 KAT 自验证 (x86: ubuntu/macos/windows)
#   - Node.js 单元测试 (keccak + fibemate)
#   - ESLint 静态分析
#   - 文档检查 + BOM 检查

name: CI
permissions: read-all

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  CARGO_TERM_COLOR: always

jobs:

  # ─── 国密跨语言 KAT 验证 (JS only, multi-platform) ──
  gm-crossval:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 22]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}

      - name: SM2 sign/verify + encrypt/decrypt (100 vectors)
        run: node scripts/ci-gm-sm2.cjs

      - name: SM3 hash (30 vectors)
        run: node scripts/ci-gm-sm3.cjs

      - name: SM4-GCM (30 vectors)
        run: node scripts/ci-gm-sm4.cjs

  # ─── ML-KEM-768 KAT (JS only, multi-platform) ───────
  mlkem-kat:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 22]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: ML-KEM-768 roundtrip + KAT self-validation
        shell: bash
        run: |
          set -o pipefail
          node scripts/ci-mlkem-kat.cjs 2>&1 | tee "$RUNNER_TEMP/mlkem-kat.log"

      - name: NIST ACVP vectors - 240 cases (keyGen, encaps, decaps, key checks)
        shell: bash
        run: |
          set -o pipefail
          node packages/pqc-kem/test/acvp-kat.test.cjs
          node packages/pqc-kem/test/acvp-encapDecap.test.cjs

      - name: Internal-step invariants (NTT, codec, compress, samplers)
        shell: bash
        run: node packages/pqc-kem/test/internal-invariants.test.js

      - name: Attribute - ML-KEM KAT digest
        if: always()
        shell: bash
        run: |
          {
            echo "### ML-KEM-768 KAT digest - ${{ matrix.os }} / node ${{ matrix.node }}"
            echo '```'
            if [ -f "$RUNNER_TEMP/mlkem-kat.log" ]; then
              grep -E 'roundtrip:|Mismatch round|Error round|KAT vectors:|KAT header|FATAL|unique' "$RUNNER_TEMP/mlkem-kat.log" \
                || echo '(no digest lines)'
            else
              echo '(log missing - step did not run)'
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ─── Node.js 单元测试 (multi-platform) ──────────────
  # node-test requires Node >=22: better-sqlite3@13 declares engines >=22,
  # src/index.js loads db-sqlite.js at startup, and Node 18 segfaults
  # on new Database(...). Node 18 EOL 2025-04-30. Cross-version crypto
  # coverage kept via gm-crossval / mlkem-kat.
  node-test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run unit tests
        run: |
          node test/test-keccak.js
          node test/test-fibemate.js
          node --test test/totp.test.js
          node --test test/2fa-integration.test.js
          node --test test/ratchet-pq.test.js
          node test/lockout.test.js
          node test/smoke-backend.js

      # FIPS 204 byte-level gate: pk/sk must equal the @noble/post-quantum oracle on three
      # fixed seeds, and signatures must verify in both directions. See
      # packages/fml-dsa/src/core/README.md for the four gates this enforces.
      - name: fml-dsa byte-level oracle comparison
        run: node packages/fml-dsa/test/interop-oracle.test.js

      # The committed WASM artifact, not a rebuild: deploys must not need a Rust
      # toolchain. Byte-compares against @noble/post-quantum on fixed seeds.
      - name: ML-KEM-768 WASM artifact is FIPS 203 (vs noble)
        run: node --test test/mlkem-wasm-fips.test.cjs

  # ─── C 原生 addon：构建后与 JS 后端对拍 ───────────────────
  # index.js prefers the C addon whenever it is present, so this is the path
  # users actually execute in a native build. Nothing else in CI compiles it.
  native-parity:
    strategy:
      matrix:
        # windows-2022 rather than -latest: the latest image now carries Visual
        # Studio 18, whose install node-gyp 11.5 parses as version "undefined"
        # and then reports "could not find a version of Visual Studio 2017 or
        # newer". Revisit when node-gyp learns to read it.
        os: [ubuntu-latest, windows-2022]
        node: [22]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install build toolchain
        run: npm install --no-save --no-package-lock --no-audit --no-fund node-gyp@11 node-addon-api@8

      - name: Build the native addon
        run: npx --no-install node-gyp rebuild -C packages/pqc-kem/native --release

      - name: Native self-test
        run: node scripts/test-native-addon.cjs

      - name: C <-> JS parity (deterministic vectors, implicit rejection, validation)
        env:
          REQUIRE_NATIVE: '1'
        run: node packages/pqc-kem/test/native-parity.test.js

  # ─── PQC 性能基准（single platform，回归检测）────────────
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run PQC benchmark
        run: node scripts/bench-pqc.js

  # ─── SBOM 生成校验（确保 sbom.cdx.json 与 lock 同步）────
  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate SBOM
        run: node scripts/gen-sbom.js /tmp/sbom.cdx.json

      - name: Schema validation test (CycloneDX 1.4)
        run: node --test test/schema-validation.test.cjs

      - name: Verify SBOM is committed and up-to-date
        shell: bash
        run: |
          set -o pipefail
          node scripts/check-sbom-drift.cjs /tmp/sbom.cdx.json ./sbom.cdx.json 2>&1 | tee "$RUNNER_TEMP/sbom.log"

      # www/docs/sbom.cdx.json 是随站点一起发布的副本（#206）。只查根目录那份，
      # 副本就能悄悄过期 —— 而读者看到的是副本。
      - name: Verify the published SBOM copy matches
        shell: bash
        run: |
          set -o pipefail
          node scripts/check-sbom-drift.cjs /tmp/sbom.cdx.json ./www/docs/sbom.cdx.json 2>&1 | tee -a "$RUNNER_TEMP/sbom.log"

      - name: Attribute - SBOM digest
        if: always()
        shell: bash
        run: |
          {
            echo "### SBOM - consistency"
            echo '```'
            if [ -f "$RUNNER_TEMP/sbom.log" ]; then
              grep -E 'SBOM (out of date|up-to-date)' "$RUNNER_TEMP/sbom.log" || echo '(no SBOM verdict line)'
            else
              echo '(log missing - step did not run)'
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ─── ESLint 静态分析 (single platform, lint only) ────
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'

      - name: Install ESLint
        run: npm install --no-save eslint@9.39.5 @eslint/js@9.39.5

      - name: Run ESLint
        run: npx eslint packages/pqc-kem/src/ test/ src/ --max-warnings 0

      - name: Check SPDX headers
        run: node tools/add-spdx-headers.cjs check --root .

  # ─── 文档检查 (single platform) ─────────────────────
  docs-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'

      - name: Check markdown formatting
        run: |
          npx --yes markdownlint-cli@0.40.0 \
            --disable MD013 MD033 MD041 MD046 \
            README.md CONTRIBUTING.md BUILD.md docs/*.md 2>/dev/null || true

      - name: Check dead links in docs
        run: |
          npx --yes markdown-link-check@3.12.2 README.md docs/*.md 2>/dev/null || true

  # ─── UTF-8 BOM check (single platform) ──────────────
  # 注意：这个 job 叫 bom-check，但它查的是 BOM（字节序标记）、编码损坏与实验代码隔离，
  # 与 CycloneDX CBOM 无关。CBOM 的漂移与 schema 校验在下面的 `cbom` job 里。
  # 两个名字只差一个字母，历史上一度让读者以为 schema 校验已被覆盖 —— 保持此注释。
  bom-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'

      - name: Scan tracked text files for UTF-8 BOM
        run: node scripts/check-bom.cjs

      - name: Scan tracked text files for encoding corruption (U+FFFD / GBK / NUL)
        run: node scripts/check-encoding.cjs

      - name: Verify experimental code isolation (P0-01)
        run: node scripts/check-experimental-isolation.cjs

  # ─── CBOM 门禁（#298）：漂移 + 官方 CycloneDX schema ───
  # 这两条以前只在 release.yml 里跑，于是 PR 可以改坏 CBOM 或生成器而保持全绿，
  # 直到发版才暴露。校验器 tools/validate-cbom.cjs 用的是仓库自带的官方 schema
  # （bom-1.6 + spdx + jsf），不是自家解析器 —— 外部参照必须在环路里。
  cbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'

      # ajv 是 devDependency，validate-cbom.cjs 从 node_modules 解析它
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: CBOM drift (committed artifact must match the generator)
        run: node scripts/build-cbom.js --check

      - name: CBOM schema (official CycloneDX 1.6 + spdx + jsf)
        run: node tools/validate-cbom.cjs tools/cbom-cyclonedx.json

      - name: Attribute - CBOM verdict
        if: always()
        shell: bash
        run: |
          {
            echo '### CBOM - drift + schema'
            echo ''
            echo 'generator: scripts/build-cbom.js --check'
            echo 'validator: tools/validate-cbom.cjs tools/cbom-cyclonedx.json'
          } >> "$GITHUB_STEP_SUMMARY"

  # ─── 公开措辞检查 R1（docs/pre-release-claims.md §三；single platform）──
  claim-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'

      - name: Check public-facing wording (R1 — CII / BP mixed spelling)
        run: node scripts/check-claims.cjs
