# FIBEMATE CI Pipeline — Multi-Platform Matrix
#
# 触发: push / PR to main
# 覆盖:
#   - 国密三件套 (SM2/SM3/SM4-GCM) 跨平台 JS 验证
#   - ML-KEM-768 KAT 自验证 (x86: ubuntu/macos/windows)
#   - Node.js 单元测试 (keccak + fibemate)
#   - ESLint 静态分析
#   - 文档检查 + BOM 检查

name: CI
permissions: read-all

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  CARGO_TERM_COLOR: always

jobs:

  # ─── 国密跨语言 KAT 验证 (JS only, multi-platform) ──
  gm-crossval:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 22]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: SM2 sign/verify + encrypt/decrypt (100 vectors)
        run: node scripts/ci-gm-sm2.cjs

      - name: SM3 hash (30 vectors)
        run: node scripts/ci-gm-sm3.cjs

      - name: SM4-GCM (30 vectors)
        run: node scripts/ci-gm-sm4.cjs

  # ─── ML-KEM-768 KAT (JS only, multi-platform) ───────
  mlkem-kat:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 22]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: ML-KEM-768 roundtrip + KAT self-validation
        run: node scripts/ci-mlkem-kat.cjs

  # ─── Node.js 单元测试 (multi-platform) ──────────────
  node-test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 22]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Run unit tests
        run: |
          node test/test-keccak.js
          node test/test-fibemate.js

  # ─── PQC 性能基准（single platform，回归检测）────────────
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Run PQC benchmark
        run: node scripts/bench-pqc.js

  # ─── ESLint 静态分析 (single platform, lint only) ────
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install ESLint
        run: npm install --no-save eslint @eslint/js@^9

      - name: Run ESLint
        run: npx eslint packages/pqc-kem/src/ test/ --max-warnings 0

  # ─── 文档检查 (single platform) ─────────────────────
  docs-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Check markdown formatting
        run: |
          npx --yes markdownlint-cli@0.40.0 \
            --disable MD013 MD033 MD041 MD046 \
            README.md CONTRIBUTING.md BUILD.md docs/*.md 2>/dev/null || true

      - name: Check dead links in docs
        run: |
          npx --yes markdown-link-check@3.12.2 README.md docs/*.md 2>/dev/null || true

  # ─── UTF-8 BOM check (single platform) ──────────────
  bom-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Scan tracked text files for UTF-8 BOM
        run: node scripts/check-bom.cjs

      - name: Scan tracked text files for encoding corruption (U+FFFD / GBK / NUL)
        run: node scripts/check-encoding.cjs

      - name: Verify experimental code isolation (P0-01)
        run: node scripts/check-experimental-isolation.cjs
