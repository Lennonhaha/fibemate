# FIBEMATE CI Pipeline — Multi-Platform Matrix
#
# 触发: push / PR to main
# 覆盖:
#   - 国密三件套 (SM2/SM3/SM4-GCM) 跨平台 JS 验证
#   - ML-KEM-768 KAT 自验证 (x86: ubuntu/macos/windows)
#   - Node.js 单元测试 (keccak + fibemate)
#   - ESLint 静态分析
#   - 文档检查 + BOM 检查

name: CI
permissions: read-all

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  CARGO_TERM_COLOR: always

jobs:

  # ─── 国密跨语言 KAT 验证 (JS only, multi-platform) ──
  gm-crossval:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 22]
        # macOS runners are scarce, and a job cancelled while still queued shows
        # up as a red run with no steps executed (2026-11-16, twice on main).
        # Node 18 on macOS adds no coverage that ubuntu + windows do not have,
        # so keep one macOS configuration per job instead of two.
        exclude:
          - os: macos-latest
            node: 18
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}

      - name: SM2 sign/verify + encrypt/decrypt (100 vectors)
        run: node scripts/ci-gm-sm2.cjs

      - name: SM3 hash (30 vectors)
        run: node scripts/ci-gm-sm3.cjs

      - name: SM4-GCM (30 vectors)
        run: node scripts/ci-gm-sm4.cjs

  # ─── ML-KEM-768 KAT (JS only, multi-platform) ───────
  mlkem-kat:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 22]
        # See the note in gm-crossval: one macOS configuration per job.
        exclude:
          - os: macos-latest
            node: 18
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: ML-KEM-768 roundtrip + KAT self-validation
        shell: bash
        run: |
          set -o pipefail
          node scripts/ci-mlkem-kat.cjs 2>&1 | tee "$RUNNER_TEMP/mlkem-kat.log"

      - name: NIST ACVP vectors - 240 cases (keyGen, encaps, decaps, key checks)
        shell: bash
        run: |
          set -o pipefail
          node packages/pqc-kem/test/acvp-kat.test.cjs
          node packages/pqc-kem/test/acvp-encapDecap.test.cjs

      - name: Internal-step invariants (NTT, codec, compress, samplers)
        shell: bash
        run: node packages/pqc-kem/test/internal-invariants.test.js

      - name: Attribute - ML-KEM KAT digest
        if: always()
        shell: bash
        run: |
          {
            echo "### ML-KEM-768 KAT digest - ${{ matrix.os }} / node ${{ matrix.node }}"
            echo '```'
            if [ -f "$RUNNER_TEMP/mlkem-kat.log" ]; then
              grep -E 'roundtrip:|Mismatch round|Error round|KAT vectors:|KAT header|FATAL|unique' "$RUNNER_TEMP/mlkem-kat.log" \
                || echo '(no digest lines)'
            else
              echo '(log missing - step did not run)'
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ─── Node.js 单元测试 (multi-platform) ──────────────
  # node-test requires Node >=22: better-sqlite3@13 declares engines >=22,
  # src/index.js loads db-sqlite.js at startup, and Node 18 segfaults
  # on new Database(...). Node 18 EOL 2025-04-30. Cross-version crypto
  # coverage kept via gm-crossval / mlkem-kat.
  node-test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run unit tests
        run: |
          node test/test-keccak.js
          node test/test-fibemate.js
          node --test test/totp.test.js
          node --test test/2fa-integration.test.js
          node --test test/2fa-device-id.test.js
          node --test test/ratchet-pq.test.js
          node --test test/check-needed-results.test.js
          node test/lockout.test.js
          node test/smoke-backend.js

      # The aggregator (test/test-all.js). The explicit list above exists so a
      # failure points at one suite; this step exists so a suite added only to
      # the aggregator still runs here, on all three OSes. Without it, a new
      # suite is covered by the coverage job alone (ubuntu, single platform) and
      # nobody notices that the matrix never ran it.
      - name: Run aggregated suite (test/test-all.js)
        run: node test/test-all.js

      # /health reports two commits: the one this process started from and the one the
      # static tree on disk was built from (#603). This asserts the comparison cannot say
      # "match" while they differ, and cannot say "differ" when it simply cannot tell.
      # Static on purpose: no network, no database, no native addon, so it gates every OS.
      - name: /health never claims a match while the commits differ
        run: node scripts/test-health-same-source.cjs

      # N3 single source: docs/metrics.json is the only place an external number may be
      # written down. This recomputes the four git-derived counters and rejects the
      # retired transposed figure named in the discipline annex, anywhere in the tree. Design: docs/ENGINEERING-DISCIPLINE.md
      # N1-N5.
      - name: Metrics registry is consistent (N3)
        run: node scripts/check-metrics.cjs

      # FIPS 204 byte-level gate: pk/sk must equal the @noble/post-quantum oracle on three
      # fixed seeds, and signatures must verify in both directions. See
      # packages/fml-dsa/src/core/README.md for the four gates this enforces.
      - name: fml-dsa byte-level oracle comparison
        run: node packages/fml-dsa/test/interop-oracle.test.js

      # FIPS 204 canonical encoding: the unused tail of the hint block must be zero.
      # Before the decoder fix the same (pk, msg) had many accepted byte strings, so a
      # signature could not be used as an identifier (#456). This gate asserts rejection.
      - name: fml-dsa non-canonical signature gate
        run: node packages/fml-dsa/test/verify-canonical-signature.test.js --strict

      # The committed WASM artifact, not a rebuild: deploys must not need a Rust
      # toolchain. Byte-compares against @noble/post-quantum on fixed seeds.
      - name: ML-KEM-768 WASM artifact is FIPS 203 (vs noble)
        run: node --test test/mlkem-wasm-fips.test.cjs

      # A self-test that prints "FAILED" and returns cannot fail a build. verify.js
      # did exactly that until 2026-11-15, four months after its siblings were fixed.
      # Static on purpose: no keys, no runtime, so it can gate every platform first.
      - name: Self-tests fail loudly (no print-only FAIL)
        run: node scripts/check-selftest-throws.cjs

  # ─── C 原生 addon：构建后与 JS 后端对拍 ───────────────────
  # index.js prefers the C addon whenever it is present, so this is the path
  # users actually execute in a native build. Nothing else in CI compiles it.
  native-parity:
    strategy:
      matrix:
        # windows-2022 rather than -latest: the latest image now carries Visual
        # Studio 18, whose install node-gyp 11.5 parses as version "undefined"
        # and then reports "could not find a version of Visual Studio 2017 or
        # newer". Revisit when node-gyp learns to read it.
        os: [ubuntu-latest, windows-2022]
        node: [22]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install build toolchain
        run: npm install --no-save --no-package-lock --no-audit --no-fund node-gyp@11 node-addon-api@8

      - name: Build the native addon
        run: npx --no-install node-gyp rebuild -C packages/pqc-kem/native --release

      - name: Native self-test
        run: node scripts/test-native-addon.cjs

      - name: C <-> JS parity (deterministic vectors, implicit rejection, validation)
        env:
          REQUIRE_NATIVE: '1'
        run: node packages/pqc-kem/test/native-parity.test.js

  # ─── PQC 性能基准（single platform，回归检测）────────────
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run PQC benchmark
        run: node scripts/bench-pqc.js

  # ─── SBOM 生成校验（确保 sbom.cdx.json 与 lock 同步）────
  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate SBOM
        run: node scripts/gen-sbom.js /tmp/sbom.cdx.json

      - name: Schema validation test (CycloneDX 1.4)
        run: node --test test/schema-validation.test.cjs

      - name: Verify SBOM is committed and up-to-date
        shell: bash
        run: |
          set -o pipefail
          node scripts/check-sbom-drift.cjs /tmp/sbom.cdx.json ./sbom.cdx.json 2>&1 | tee "$RUNNER_TEMP/sbom.log"

      # www/docs/sbom.cdx.json 是随站点一起发布的副本（#206）。只查根目录那份，
      # 副本就能悄悄过期 —— 而读者看到的是副本。
      - name: Verify the published SBOM copy matches
        shell: bash
        run: |
          set -o pipefail
          node scripts/check-sbom-drift.cjs /tmp/sbom.cdx.json ./www/docs/sbom.cdx.json 2>&1 | tee -a "$RUNNER_TEMP/sbom.log"

      - name: Attribute - SBOM digest
        if: always()
        shell: bash
        run: |
          {
            echo "### SBOM - consistency"
            echo '```'
            if [ -f "$RUNNER_TEMP/sbom.log" ]; then
              grep -E 'SBOM (out of date|up-to-date)' "$RUNNER_TEMP/sbom.log" || echo '(no SBOM verdict line)'
            else
              echo '(log missing - step did not run)'
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ─── ESLint 静态分析 (single platform, lint only) ────
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'

      - name: Install ESLint
        run: npm install --no-save eslint@9.39.5 @eslint/js@9.39.5

      - name: Run ESLint
        run: npx eslint packages/pqc-kem/src/ test/ src/ --max-warnings 0

      - name: Check SPDX headers
        run: node tools/add-spdx-headers.cjs check --root .

      # Public TSR numbers were typed by hand for two weeks and drifted. The gate
      # reads the canonical counter and fails when any public sentence disagrees.
      - name: Check public TSR numbers against the counter
        run: node scripts/check-tsr-copy.cjs

      # The same claim also promises an itemised list. A list covering half the
      # files is not a weaker proof, it is a different one.
      - name: Check the TSR manifest covers every tracked .tsr
        run: node scripts/build-tsr-manifest.cjs --check

      # Both gates above are only worth their exit codes if they have been seen to
      # fail. These cases feed them trees and sentences that must be rejected.
      - name: Check the TSR gates can fail
        run: node scripts/test-tsr-gates.cjs

      # The copy gate compares digits. A sentence can carry the right number and a
      # two-day-old date; that is a weaker claim than no date, because it looks checked.
      - name: Check the measurement date next to every TSR count
        run: node scripts/check-measured-date.cjs

      - name: Check the date gate can fail
        run: node scripts/test-check-measured-date.cjs

      # Ten public pages named a timestamp authority whose certificate appears in no
      # token. A page may only claim an issuer the tokens carry, and the table that
      # decides that has to describe the current tree.
      - name: Check timestamp claims are evidenced by the tokens
        run: node scripts/check-tsa-claims.cjs

      - name: Check the timestamp-claim gate can fail
        run: node scripts/check-tsa-claims.cjs --self-test

      - name: Check the issuer table covers every tracked token
        run: node scripts/tsa-issuers.cjs --check

      - name: Check the issuer-table gate can fail
        run: node scripts/tsa-issuers.cjs --self-test-check

      # The daily verifier classifies every token and compares that against a measured
      # allowlist. Its own tests drive a stub openssl, so they assert that the gate
      # objects (new unverifiable file, class change, stale entry) rather than that it
      # prints something.
      - name: Check the TSR verifier can fail
        run: node scripts/test-tsr-verify.cjs

      # The deploy gate is only worth its exit code if it has been shown to fail.
      # This is the negative suite: one flipped byte, a missing file, a directory in
      # place of a file. It builds its own repository, so it needs no fixtures.
      - name: Test the deploy tree gate
        run: node scripts/test-verify-tree-sha.cjs

      # #507: the packages/ digest is only useful if the live check can say no.
      # This suite stubs /health and asserts FAIL on a wrong commit, a wrong digest,
      # a malformed manifest and a missing build block - the four ways it can rot.
      - name: Test the packages tree digest and its live check
        run: node scripts/test-tree-hash.cjs

      # #603: /health states both the process build and the served static tree. The block is
      # only worth reading if a missing, malformed or unreadable manifest produces a
      # distinguishable answer instead of a silent null.
      - name: Test the served-tree report
        run: node scripts/test-served-tree.cjs

      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck

      - name: Shellcheck the release deploy scripts
        run: >
          shellcheck -S error scripts/deploy-release.sh scripts/rollback-release.sh
          scripts/lib/release-common.sh scripts/test-deploy-release.sh

      # Sandbox only: throwaway git repo, fake pm2, local health server. Proves the
      # post-switch health failure rolls back and the legacy in-place script refuses
      # to run when the release layout is present.
      - name: Test the release deploy and rollback
        run: bash scripts/test-deploy-release.sh

      # Issue #570: the deploy host holds no credential, so the artifact has to arrive
      # over plain HTTPS or the deploy has to say it cannot. Six cases, five of them
      # failures the fetch must produce on purpose (absent, tampered, wrong key, missing
      # --key), using a file:// tree in place of the release assets.
      - name: Test the credential-free artifact channel
        run: bash scripts/test-fetch-native-artifact.sh

      # Signing is a workflow edit away from disappearing silently. This asserts the
      # publish job keeps the four properties Scorecard's Signed-Releases probe depends
      # on, and that each of them can be shown to fail when removed (--self-test).
      - name: Check that the published native assets are signed
        run: |
          node scripts/test-native-signing.cjs
          node scripts/test-native-signing.cjs --self-test

      # #582: the CodeQL gate is a summary job, and its verdict script is the part that can
      # be wrong. Both are tested: the workflow structure (with a mutation per rule) and the
      # verdict itself (skipped/cancelled/failure/neutral/empty must all exit 1).
      - name: Check that the CodeQL gate can fail
        run: |
          node scripts/test-codeql-gate.cjs
          node scripts/test-codeql-gate.cjs --self-test
          node scripts/codeql-gate.cjs --self-test

  # ─── 文档检查 (single platform) ─────────────────────
  docs-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'

      - name: Check markdown formatting
        run: |
          npx --yes markdownlint-cli@0.40.0 \
            --disable MD013 MD033 MD041 MD046 \
            README.md CONTRIBUTING.md BUILD.md docs/*.md 2>/dev/null || true

      - name: Check dead links in docs
        run: |
          npx --yes markdown-link-check@3.12.2 README.md docs/*.md 2>/dev/null || true

      - name: Check version consistency (VERSION.json is the single source)
        run: node scripts/check-version-consistency.cjs


      # The sitemap advertised four pages that were never in the tree, and the only
      # link step in this file ends in "|| true", so nothing could notice. This gate
      # fails on a new unlisted gap and on an allowlist entry that starts resolving.
      - name: "Gate self-test - sitemap resolves, and the gate can fail"
        run: node scripts/test-check-sitemap.cjs

      - name: Check that every sitemap url resolves in www/
        run: node scripts/check-sitemap.cjs

      # The TVLA gate shipped in #510 with no failing path ever executed, which is
      # how it stayed green while the live test leaked. These fixtures drive both
      # scripts through their real CLIs and assert the exit codes.
      - name: "Gate self-test - TVLA summary and live gate"
        run: node scripts/test-tvla-gates.cjs

  # ─── UTF-8 BOM check (single platform) ──────────────
  # 注意：这个 job 叫 bom-check，但它查的是 BOM（字节序标记）、编码损坏与实验代码隔离，
  # 与 CycloneDX CBOM 无关。CBOM 的漂移与 schema 校验在下面的 `cbom` job 里。
  # 两个名字只差一个字母，历史上一度让读者以为 schema 校验已被覆盖 —— 保持此注释。
  bom-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'

      - name: Scan tracked text files for UTF-8 BOM
        run: node scripts/check-bom.cjs

      - name: Scan tracked text files for encoding corruption (U+FFFD / GBK / NUL)
        run: node scripts/check-encoding.cjs

      - name: Test the encoding gate against known corruption
        run: node scripts/test-check-encoding.cjs

      - name: Verify experimental code isolation (P0-01)
        run: node scripts/check-experimental-isolation.cjs

  # ─── CBOM 门禁（#298）：漂移 + 官方 CycloneDX schema ───
  # 这两条以前只在 release.yml 里跑，于是 PR 可以改坏 CBOM 或生成器而保持全绿，
  # 直到发版才暴露。校验器 tools/validate-cbom.cjs 用的是仓库自带的官方 schema
  # （bom-1.6 + spdx + jsf），不是自家解析器 —— 外部参照必须在环路里。
  cbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'

      # ajv 是 devDependency，validate-cbom.cjs 从 node_modules 解析它
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: CBOM drift (committed artifact must match the generator)
        run: node scripts/build-cbom.js --check

      - name: CBOM schema (official CycloneDX 1.6 + spdx + jsf)
        run: node tools/validate-cbom.cjs tools/cbom-cyclonedx.json

      - name: Attribute - CBOM verdict
        if: always()
        shell: bash
        run: |
          {
            echo '### CBOM - drift + schema'
            echo ''
            echo 'generator: scripts/build-cbom.js --check'
            echo 'validator: tools/validate-cbom.cjs tools/cbom-cyclonedx.json'
          } >> "$GITHUB_STEP_SUMMARY"

  # ─── 公开措辞检查 R1（docs/pre-release-claims.md §三；single platform）──
  claim-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'

      - name: Check public-facing wording (R1 — CII / BP mixed spelling)
        run: node scripts/check-claims.cjs

  # Is every declared contract bound to a check that this workflow actually runs?
  # The gate validates both halves: the script exists, and the named job's run:
  # block invokes it. A script that exists but is never executed is the same
  # false green as a job that exists but never runs.
  claim-coverage:
    name: claim-coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'

      - name: Every contract is bound to a check CI runs
        run: node scripts/claims/coverage.cjs

      - name: Check the claim-coverage gate can fail
        run: node scripts/claims/coverage.cjs --self-test

  # --- Aggregate gate: did the jobs that were supposed to run, run? -------
  # GitHub counts a skipped required check as a pass, and only blocks on
  # cancelled when that exact context is required. On 2026-11-25 PR #703
  # merged with node-test (macos-latest, 22) = CANCELLED and
  # mergeStateStatus=UNSTABLE, because no matrix leg was a required context.
  # This job turns that into an explicit verdict over `needs`: failure,
  # cancelled and timed_out always block; skipped blocks only when the job is
  # in the must-run list (path-filtered skips are legitimate and are named).
  # Keep it out of the ruleset until it has run green once on a real PR.
  all-checks:
    name: all-checks
    if: always()
    needs: [gm-crossval, mlkem-kat, node-test, native-parity, bench, sbom, lint, docs-check, bom-check, cbom, claim-check, claim-coverage]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'

      - name: Nothing that was supposed to run was skipped, cancelled or failed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node scripts/check-needed-results.cjs
