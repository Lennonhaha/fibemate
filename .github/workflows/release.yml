# FIBEMATE Release — 验证 + 打包
#
# 触发: 手动 (workflow_dispatch) 或 tag push v*
# 覆盖:
#   - 全量测试
#   - WASM 构建
#   - npm package 验证
#   - 生成校验和

name: Release
permissions:
  contents: read
  id-token: write  # cosign keyless signing (GitHub OIDC)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

env:
  NODE_VERSION: '18'
  CARGO_TERM_COLOR: always

jobs:

  release-check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install deps
        run: npm install --ignore-scripts

      - name: Run full test battery
        run: |
          node test/test-keccak.js
          node test/test-fibemate.js
          node test/test-cross-lang.js
          node test/test-cross-lang-seeded.js

      - name: Verify key modules load
        run: |
          node -e "
            const m = require('./www/crypto/ml-kem-768.js');
            const kp = m.generateKeypair();
            const enc = m.encapsulate(kp.publicKey);
            const ss = m.decapsulate(enc.ciphertext, kp.secretKey);
            console.log('ML-KEM-768: OK |', kp.publicKey.length+'B pk |', ss.length+'B shared');
          "

      - name: Generate SHA256 manifest
        run: |
          find . -type f \
            ! -path './.git/*' \
            ! -path './node_modules/*' \
            ! -path './target/*' \
            ! -name '*.tsr' \
            | sort | xargs sha256sum > RELEASE_CHECKSUMS.txt 2>/dev/null
          cat RELEASE_CHECKSUMS.txt | head -5
          echo "... $(wc -l < RELEASE_CHECKSUMS.txt) files checksummed"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign release checksums (keyless)
        run: |
          cosign sign-blob --yes \
            --new-bundle-format=false \
            --use-signing-config=false \
            --output-signature RELEASE_CHECKSUMS.sig \
            --output-certificate RELEASE_CHECKSUMS.pem \
            RELEASE_CHECKSUMS.txt

      - name: Upload signed assets to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          rc=0
          gh release view "$TAG" --json tagName >/dev/null 2>&1 || rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "release $TAG exists; uploading assets"
          elif [ "$rc" -eq 1 ]; then
            echo "release $TAG not found; creating"
            gh release create "$TAG" --title "$TAG" --generate-notes
          else
            echo "gh release view failed (exit $rc); aborting"
            exit 1
          fi
          gh release upload "$TAG" \
            RELEASE_CHECKSUMS.txt \
            RELEASE_CHECKSUMS.sig \
            RELEASE_CHECKSUMS.pem \
            --clobber
