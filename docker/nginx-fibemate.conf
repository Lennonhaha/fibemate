# FIBEMATE nginx 站点配置（容器内）
# 服务于 /opt/fibemate-full/www 静态资源，并将 API/WS 反代到各 Node 服务。
server {
    listen 8080;
    server_name _;

    charset utf-8;

    # 静态站点
    root /opt/fibemate-full/www;
    index index.html;

    # 预压缩静态资源（仓库已放置 .gz）
    gzip_static on;
    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 时间戳存证目录（含中文 .txt 报告，需声明 charset）
    location /docs/tsa/ {
        charset utf-8;
        autoindex on;
        try_files $uri =404;
    }

    # Web/ZX 服务 (www/src/server-main.js) -> 3002
    location /api/ {
        proxy_pass http://127.0.0.1:3002/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /health {
        proxy_pass http://127.0.0.1:3002/health;
    }
    location /ws {
        proxy_pass http://127.0.0.1:3002/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # 主 API (noir-backend/src/index.js) -> 3001（需原生 ML-KEM 插件）
    location /v1/ {
        proxy_pass http://127.0.0.1:3001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
