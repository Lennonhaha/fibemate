server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 放宽 CSP 以支持 inline script（教育环境，非生产）
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' wss: https:; media-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # gzip
    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/wasm;
    gzip_static on;
}
