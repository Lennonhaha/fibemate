user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log;
include /etc/nginx/modules-enabled/*.conf;

events {
	worker_connections 768;
	# multi_accept on;
}

http {
    # Map bad user agents
    map $http_user_agent $bad_ua {
        default 0;
        ~curl 1;
        ~wget 1;
        ~python-requests 1;
        ~libwww-perl 1;
        ~scrapy 1;
        ~httpclient 1;
        ~java 1;
        ~nikto 1;
        ~sqlmap 1;
        ~nmap 1;
        ~masscan 1;
        ~zgrab 1;
        ~gobuster 1;
        ~dirbuster 1;
        ~wfuzz 1;
        ~burp 1;
        ~acunetix 1;
        ~netsparker 1;
        ~appscan 1;
    }

	map $http_user_agent $bad_bot {
		default 0;
		~*(curl|wget|python-requests|libwww-perl|scrapy|httpclient|java|nikto|sqlmap|nmap|masscan|zgrab) 1;
	}

	map $host $bad_host {
		default 0;
		"" 1;
	}


	##
	
    # Rate Limiting
	##
	limit_req_log_level info;
	limit_req_zone $remote_addr zone=api_limit:10m rate=10r/s;
	limit_req_zone $remote_addr zone=find_create_limit:10m rate=5r/m;
	limit_req_zone $remote_addr zone=api_search:10m rate=2r/m;
	limit_req_zone $remote_addr zone=api_login:10m rate=5r/m;
set_real_ip_from 127.0.0.1;
	real_ip_header proxy_protocol;
	real_ip_recursive on;

limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

	##
	# Basic Settings
	##

	sendfile on;
	tcp_nopush on;
	types_hash_max_size 2048;
	server_tokens off;

	# server_names_hash_bucket_size 64;
	# server_name_in_redirect off;

	include /etc/nginx/mime.types;
	default_type application/octet-stream;

	##
	# SSL Settings
	##

	ssl_protocols TLSv1.3; # Dropping SSLv3, ref: POODLE
	ssl_prefer_server_ciphers on;

	##
	# Logging Settings
	##

	access_log /var/log/nginx/access.log;

	##
	# Gzip Settings
	##

	gzip on;

	# gzip_vary on;
	# gzip_proxied any;
	# gzip_comp_level 6;
	# gzip_buffers 16 8k;
	# gzip_http_version 1.1;
	# gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

	##
	# Virtual Host Configs
	##

	include /etc/nginx/conf.d/*.conf;
	include /etc/nginx/sites-enabled/*;
}

# === SSH + HTTPS multiplex via nginx stream (2026-07-16) ===
stream {
    # SNI-based routing: TLS (HTTPS) → 8443, fallback → SSH
    map $ssl_preread_server_name $upstream {
        fibemate.net    127.0.0.1:8443;
        www.fibemate.net    127.0.0.1:8443;
        fibemate.link   127.0.0.1:8443;
        # Keep this route so the legacy www host can reach the redirect vhost;
        # the certificate has no www SAN, so this is redirect-only, not a site.
        www.fibemate.link 127.0.0.1:8443;
        default         127.0.0.1:65535;  # P1 fix: SSH fallback removed
    }

    server {
        listen 443;
        proxy_pass $upstream;
        proxy_protocol on;
        ssl_preread on;
        proxy_timeout 300s;
    }
}
