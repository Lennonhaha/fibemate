# FIBEMATE Nginx Configuration - Fixed
# Legacy fibemate.link host: redirect-only. No site content is served here.
# The current Let's Encrypt certificate has SAN DNS:fibemate.link only.
# www.fibemate.link is kept in server_name for redirect compatibility; browsers
# will report a certificate-name mismatch unless they are told to ignore it.
# This is a tracked copy, not a deploy artefact. See #584 / #696.

# HTTP to HTTPS redirect
server {
    listen 80;
    server_name fibemate.link www.fibemate.link;

    # Allow ACME challenges without redirect
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://fibemate.net$request_uri;
    }
}

# HTTPS server: redirect only
server {
    listen 8443 ssl proxy_protocol;
    http2 on;

    server_name fibemate.link www.fibemate.link;
    port_in_redirect off;

    ssl_certificate /etc/letsencrypt/live/fibemate.link/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fibemate.link/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/fibemate.link/chain.pem;

    ssl_protocols TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    return 301 https://fibemate.net$request_uri;
}
