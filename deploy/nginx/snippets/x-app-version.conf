# X-App-Version stamp — rendered at deploy time. Do not edit on the server.
#
# scripts/deploy-fibemate.sh overwrites this file with a single directive:
#
#     add_header X-App-Version "v<package.json version> (<commit sha8>)" always;
#
# built from the commit that was just checked out, then runs `nginx -t` and reloads,
# restoring the previous file if the config is rejected.
#
# scripts/check-live-version.sh compares the served value against the checkout's
# HEAD and fails when they disagree. The placeholder below is deliberately obvious:
# seeing "undeployed" means the site was not stamped by the deploy script, never
# that v0.0.0 is deployed.
add_header X-App-Version "v0.0.0 (undeployed)" always;
