# fibemate.net nginx site config -- tracked copy of the live file.
#
# Live source: /etc/nginx/sites-enabled/fibemate.net on the production host.
# Drift check: node scripts/check-nginx-drift.cjs --host fibemate
#
# No credentials live in this file: TLS material is referenced by path under
# /etc/letsencrypt and never inlined. Re-run the drift check before committing
# and redact if that ever changes.
#
# Captured 2026-10-22, including the issue #252 fix (unknown paths return 404).

server {
    listen 80;
    server_name fibemate.net www.fibemate.net;
    
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    
    location / {
        return 301 https://$server_name$request_uri;
    }
}

server {
    listen 8443 ssl;
    http2 on;
    limit_conn conn_per_ip 30;
    limit_conn_status 429;
    listen [::]:8443 ssl;
    server_name fibemate.net www.fibemate.net;

    # ---- Core Performance ----
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 100;
    server_tokens off;
    add_header X-App-Version "v3.3.2 (48fc029a)" always;
    gzip_static on;
    gzip_vary on;

    # ---- SSL ----
    ssl_certificate /etc/letsencrypt/live/fibemate.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fibemate.net/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/fibemate.net/chain.pem;

    ssl_protocols TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;
    

    # ---- Security Headers (apply to all responses) ----
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' wss: https:; media-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    root /opt/fibemate-repo/www;
    index index.html;

    # ---- Static Assets: long cache + pre-compressed .gz ----
    location ~* \.(css|js|woff2|wasm|png|jpg|svg|ico|webp|gif)$ {
        expires 30d;
    include snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header Vary "Accept-Encoding";
        try_files $uri =404;
    }

    # ---- HTML: short cache, revalidate ----
    location ~* \.html$ {
        expires -1;
    include snippets/security-headers.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        charset utf-8;
        etag on;
        gzip_static on;
        try_files $uri =404;
    }



    # --- Registration Backend WebSocket ---
    location /reg/ws {
        proxy_pass http://127.0.0.1:3082;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }

    # ---- Main: no cache for SPA routing ----
    location / {
    include snippets/x-app-version.conf;
        # issue #252: an unknown path must be a 404, not the 175 KB app shell
        try_files $uri $uri/ $uri.html =404;
    include snippets/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }
    # ---- Research: internal-only ----
    location /research/ {
        return 403;
    }
    # ---- TSA directory listing ----
    location /docs/tsa/ {
        alias /opt/fibemate-repo/www/docs/tsa/;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
        charset utf-8;
    }


    # ---- API: no cache, rate-limited ----
    # ---- API: PQC hybrid + TLS session binding ----
    # ---- PQC Probe API (port 9004) ----
    location /api/v1/probe {
        limit_req zone=api_limit burst=15 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:9004;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
        add_header Access-Control-Allow-Origin "https://fibemate.net" always;
    }

    location /api/ {
        limit_req zone=api_limit burst=30 nodelay;
        limit_req_status 429;
    include snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-TLS-Session-Id $ssl_session_id;
    }

    location /a2a/ {
    include snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /rust/ws {
        proxy_pass http://127.0.0.1:3002/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }

    location /rust/api/ {
    include snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        proxy_pass http://127.0.0.1:3002/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /rust/health {
        proxy_pass http://127.0.0.1:3002/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /ws {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }

    location /api/conversations/find-or-create {
        limit_req zone=find_create_limit burst=2 nodelay;
        limit_req_status 429;
    include snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        access_log off;
    }

    location /mixnet/ {
        proxy_pass http://127.0.0.1:9001/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }

    # VWZ challenge datasets
    location ~* /vwz-challenge/datasets/ {
        root /opt/fibemate-repo/www;
    }

    # ---- Block probes ----
    location ~* ^/(\.env|\.git|\.svn|\.htaccess|config\.xml|config\.json|admin\.php|wp-admin|phpmyadmin|xmlrpc\.php|shell\.php|cmd\.php|backup|dump|sql|\.bak|\.swp|\.old|nuxt\.config|vite\.config|firebase\.json|amplify\.yml|wp-config|\.aws|\.docker|composer\.json|package\.json|composer\.lock) {
        deny all;
        return 403;
    }

    location ~* \.(bak|config|sql|fla|psd|ini|log|sh|inc|swp|dist|old|orig|save|zip|tar\.gz|sqlite|db)$ {
        deny all;
        return 403;
    }
}

