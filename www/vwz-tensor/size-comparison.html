<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VWZ · 密钥/签名尺寸对比</title>
<style>
  :root {
    --bg: #08080d; --card: #0f0f18; --surf: #141424;
    --text: #d0d0d0; --muted: rgba(255,255,255,.35);
    --accent: #10b981; --violet: #8b5cf6; --blue: #3b82f6;
    --orange: #f59e0b; --red: #ef4444; --cyan: #06b6d4;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--text);
    font-family: 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh; display: flex; flex-direction: column;
  }
  #topBar {
    padding: 10px 20px; background: var(--card);
    border-bottom: 1px solid rgba(255,255,255,.06);
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  }
  #topBar h1 { font-size: 1rem; color: var(--accent); }
  #topBar .sep { width: 1px; height: 18px; background: rgba(255,255,255,.1); }
  #topBar button {
    background: var(--surf); color: var(--text);
    border: 1px solid rgba(255,255,255,.1); border-radius: 4px;
    padding: 5px 14px; font-size: 0.78rem; cursor: pointer;
  }
  #topBar button:hover { border-color: var(--accent); }
  #topBar button.active { background: var(--accent); color: #000; font-weight: 600; }
  label { font-size: 0.72rem; color: var(--muted); }
  select {
    background: var(--surf); color: var(--text);
    border: 1px solid rgba(255,255,255,.1); border-radius: 4px;
    padding: 4px 10px; font-size: 0.75rem; cursor: pointer;
  }

  #main { flex: 1; display: flex; }
  #chartArea { flex: 1; position: relative; }
  #chartArea canvas { display: block; width: 100%; height: 100%; }

  /* Legend */
  #chartLegend {
    position: absolute; right: 16px; top: 16px; z-index: 10;
    background: rgba(15,15,24,.92); border: 1px solid rgba(255,255,255,.1);
    border-radius: 8px; padding: 10px 14px; font-size: 0.7rem;
  }
  .leg-item { display: flex; align-items: center; gap: 6px; margin: 3px 0; }
  .leg-dot { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }
  .leg-name { color: var(--text); }
  .leg-vwz { font-weight: 700; }

  #bottom {
    padding: 6px 20px; font-size: 0.65rem; color: var(--muted);
    border-top: 1px solid rgba(255,255,255,.04);
    display: flex; gap: 20px;
  }
</style>
</head>
<body>

<div id="topBar">
  <h1>📊 VWZ · 密钥/签名尺寸对比</h1>
  <span class="sep"></span>
  <label>对比维度</label>
  <select id="metricSel" onchange="redraw()">
    <option value="sig">仅签名</option>
    <option value="pk">仅公钥</option>
    <option value="total" selected>公钥+签名</option>
  </select>
  <span class="sep"></span>
  <button id="btnBar" class="active" onclick="switchView('bar')">📊 柱状图</button>
  <button id="btnRadar" onclick="switchView('radar')">🕸️ 雷达图</button>
  <span class="sep"></span>
  <label>含 PQ-only</label>
  <input type="checkbox" id="pqOnly" onchange="redraw()" style="accent-color:var(--accent)">
</div>

<div id="main">
  <div id="chartArea">
    <canvas id="chart"></canvas>
    <div id="chartLegend"></div>
  </div>
</div>

<div id="bottom">
  <span>🔒 安全级别: NIST-I (~128-bit)</span>
  <span>⚠️ VWZ: 实验性 — 非生产用途</span>
  <span>数据来源: NIST PQC Standards + vwz-kat-gen.js</span>
  <span style="margin-left:auto"><a href="performance.html" style="color:var(--accent);text-decoration:underline">→ 性能基准看板</a></span>
</div>

<script>
// —————————————————————————————————————————————
// Data
// —————————————————————————————————————————————
const SCHEMES = [
  { name: 'ECDSA\nP-256',      pk: 65,    sig: 72,    color: '#3b82f6', type: 'classical' },
  { name: 'VWZ\nk=8',          pk: 468,   sig: 36,    color: '#10b981', type: 'vwz' },
  { name: 'VWZ\nk=16',         pk: 1700,  sig: 68,    color: '#34d399', type: 'vwz' },
  { name: 'FALCON-512',        pk: 897,   sig: 666,   color: '#8b5cf6', type: 'pq' },
  { name: 'ML-DSA-44',         pk: 1312,  sig: 2420,  color: '#f59e0b', type: 'pq' },
  { name: 'ML-DSA-65',         pk: 1952,  sig: 3293,  color: '#ef4444', type: 'pq' },
  { name: 'SLH-DSA-128s',      pk: 32,    sig: 7856,  color: '#06b6d4', type: 'pq' },
];

let currentView = 'bar';

// —————————————————————————————————————————————
// Draw
// —————————————————————————————————————————————
function redraw() {
  const pqOnly = document.getElementById('pqOnly').checked;
  const schemes = pqOnly ? SCHEMES.filter(s => s.type !== 'classical') : SCHEMES;
  if (currentView === 'bar') drawBar(schemes);
  else drawRadar(schemes);
  drawLegend(schemes);
}

function switchView(v) {
  currentView = v;
  document.getElementById('btnBar').classList.toggle('active', v === 'bar');
  document.getElementById('btnRadar').classList.toggle('active', v === 'radar');
  redraw();
}

// ——— Bar Chart ———
function drawBar(schemes) {
  const c = document.getElementById('chart');
  const area = document.getElementById('chartArea');
  const w = area.clientWidth, h = area.clientHeight;
  const dpr = Math.min(window.devicePixelRatio, 2);
  c.width = w * dpr; c.height = h * dpr;
  c.style.width = w + 'px'; c.style.height = h + 'px';

  const ctx = c.getContext('2d');
  ctx.fillStyle = '#08080d'; ctx.fillRect(0, 0, c.width, c.height);
  ctx.save(); ctx.scale(dpr, dpr);

  const metric = document.getElementById('metricSel').value;
  const vals = schemes.map(s => metric === 'sig' ? s.sig : metric === 'pk' ? s.pk : s.pk + s.sig);
  const labels = schemes.map(s => s.name.replace('\n',' '));
  const maxVal = Math.max(...vals) * 1.15;

  const margin = { top: 40, right: 60, bottom: 60, left: 70 };
  const gw = w - margin.left - margin.right;
  const gh = h - margin.top - margin.bottom;
  const barW = Math.min(60, gw / schemes.length * 0.65);
  const gap = gw / schemes.length;

  // Grid + axes
  ctx.strokeStyle = 'rgba(255,255,255,.06)'; ctx.lineWidth = 0.5;
  const yTicks = 6;
  for (let i = 0; i <= yTicks; i++) {
    const y = margin.top + (gh / yTicks) * i;
    ctx.beginPath(); ctx.moveTo(margin.left, y); ctx.lineTo(w - margin.right, y); ctx.stroke();
    const val = Math.round(maxVal * (yTicks - i) / yTicks);
    ctx.fillStyle = 'rgba(255,255,255,.3)'; ctx.font = '10px monospace'; ctx.textAlign = 'right';
    ctx.fillText(val + ' B', margin.left - 6, y + 4);
  }

  // Bars
  schemes.forEach((s, i) => {
    const x = margin.left + gap * i + (gap - barW) / 2;
    const val = vals[i];
    const barH = (val / maxVal) * gh;
    const y = margin.top + gh - barH;

    // Bar
    const grad = ctx.createLinearGradient(x, y, x, margin.top + gh);
    grad.addColorStop(0, s.color);
    grad.addColorStop(1, s.color + '44');
    ctx.fillStyle = grad;
    roundRect(ctx, x, y, barW, barH, 4); ctx.fill();

    // Border
    ctx.strokeStyle = s.color; ctx.lineWidth = 1.5;
    roundRect(ctx, x, y, barW, barH, 4); ctx.stroke();

    // Value on top
    ctx.fillStyle = s.color; ctx.font = 'bold 9px monospace'; ctx.textAlign = 'center';
    ctx.fillText(val + 'B', x + barW / 2, y - 6);

    // Label
    ctx.fillStyle = 'rgba(255,255,255,.6)'; ctx.font = '9px system-ui';
    const lns = s.name.split('\n');
    lns.forEach((ln, li) => ctx.fillText(ln, x + barW / 2, margin.top + gh + 14 + li * 12));
    if (s.type === 'vwz') {
      s.name.split('\n').forEach((ln, li) => {
        ctx.fillStyle = '#10b981'; ctx.font = 'bold 9px system-ui';
        ctx.fillText(ln, x + barW / 2, margin.top + gh + 14 + li * 12);
      });
    }
  });

  // Title
  const titles = { sig: '签名尺寸对比', pk: '公钥尺寸对比', total: '公钥 + 签名 总尺寸对比' };
  ctx.fillStyle = 'rgba(255,255,255,.6)'; ctx.font = '12px system-ui'; ctx.textAlign = 'center';
  ctx.fillText(titles[metric] + ' — VWZ 的尺寸优势', w / 2, 18);

  ctx.restore();
}

// ——— Radar Chart ———
function drawRadar(schemes) {
  const c = document.getElementById('chart');
  const area = document.getElementById('chartArea');
  const w = area.clientWidth, h = area.clientHeight;
  const dpr = Math.min(window.devicePixelRatio, 2);
  c.width = w * dpr; c.height = h * dpr;
  c.style.width = w + 'px'; c.style.height = h + 'px';

  const ctx = c.getContext('2d');
  ctx.fillStyle = '#08080d'; ctx.fillRect(0, 0, c.width, c.height);
  ctx.save(); ctx.scale(dpr, dpr);

  // Radar axes: Public Key Size, Signature Size
  const cx = w / 2, cy = h / 2 + 10;
  const R = Math.min(w, h) * 0.35;

  // Normalize: log scale for huge range (32B ~ 7856B)
  const maxPK = Math.max(...schemes.map(s => s.pk));
  const maxSig = Math.max(...schemes.map(s => s.sig));

  const axes = [
    { label: '公钥尺寸', angle: -Math.PI / 2, max: maxPK },
    { label: '签名尺寸', angle: Math.PI / 2, max: maxSig },
  ];

  // Grid rings
  for (let ring = 1; ring <= 4; ring++) {
    const r = R * ring / 4;
    ctx.strokeStyle = 'rgba(255,255,255,.05)'; ctx.lineWidth = 0.5;
    ctx.beginPath();
    ctx.moveTo(cx, cy - r);
    ctx.lineTo(cx, cy + r);
    ctx.stroke();
    // Tick labels on PK axis (left)
    ctx.fillStyle = 'rgba(255,255,255,.25)'; ctx.font = '8px monospace'; ctx.textAlign = 'right';
    ctx.fillText(Math.round(maxPK * ring / 4) + 'B', cx - r - 6, cy + 4);
    // Tick labels on Sig axis (right)
    ctx.textAlign = 'left';
    ctx.fillText(Math.round(maxSig * ring / 4) + 'B', cx + r + 6, cy + 4);
  }

  // Axis labels
  ctx.fillStyle = 'rgba(255,255,255,.5)'; ctx.font = '10px system-ui'; ctx.textAlign = 'center';
  ctx.fillText('公钥尺寸 (PK)', cx - R * 0.7, cy - R - 20);
  ctx.fillText('签名尺寸 (Sig)', cx + R * 0.7, cy - R - 20);

  // Center dot
  ctx.fillStyle = 'rgba(255,255,255,.1)'; ctx.beginPath(); ctx.arc(cx, cy, 3, 0, Math.PI * 2); ctx.fill();

  // Arrows
  ctx.strokeStyle = 'rgba(255,255,255,.15)'; ctx.lineWidth = 0.5;
  const arrowLen = 8;
  // Left arrow (small ← good for PK)
  ctx.beginPath(); ctx.moveTo(cx, cy - R); ctx.lineTo(cx - arrowLen, cy - R + arrowLen); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx, cy - R); ctx.lineTo(cx + arrowLen, cy - R + arrowLen); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,.3)'; ctx.font = '7px system-ui'; ctx.textAlign = 'center';
  ctx.fillText('← 越小越好', cx, cy - R - arrowLen);

  // Right arrow (small ← good for Sig)
  ctx.strokeStyle = 'rgba(255,255,255,.15)';
  ctx.beginPath(); ctx.moveTo(cx, cy + R); ctx.lineTo(cx - arrowLen, cy + R - arrowLen); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx, cy + R); ctx.lineTo(cx + arrowLen, cy + R - arrowLen); ctx.stroke();
  ctx.fillText('← 越小越好', cx, cy + R + arrowLen + 10);

  // Plot each scheme
  schemes.forEach(s => {
    const pkR = (s.pk / maxPK) * R;
    const sigR = (s.sig / maxSig) * R;
    const x = cx - pkR, y = cy + sigR;

    // Point
    ctx.fillStyle = s.color; ctx.beginPath(); ctx.arc(x, y, 5, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 0.5; ctx.stroke();

    // Label
    const labelX = x + (x > cx ? 14 : -14);
    const labelY = y - 10;
    ctx.fillStyle = s.color; ctx.font = s.type === 'vwz' ? 'bold 9px system-ui' : '9px system-ui'; ctx.textAlign = x > cx ? 'left' : 'right';
    ctx.fillText(s.name.replace('\n',' '), labelX, labelY);
    ctx.fillStyle = 'rgba(255,255,255,.4)'; ctx.font = '8px monospace';
    ctx.fillText(`PK:${s.pk}B Sig:${s.sig}B`, labelX, labelY + 12);
  });

  // Title
  ctx.fillStyle = 'rgba(255,255,255,.6)'; ctx.font = '12px system-ui'; ctx.textAlign = 'center';
  ctx.fillText('公钥 vs 签名 — 双维平衡性', w / 2, 18);
  ctx.fillStyle = 'rgba(255,255,255,.3)'; ctx.font = '9px system-ui';
  ctx.fillText('左下角 = 最优 (PK小 + Sig小)', w / 2, 34);

  ctx.restore();
}

// ——— Legend ———
function drawLegend(schemes) {
  const div = document.getElementById('chartLegend');
  div.innerHTML = schemes.map(s => `
    <div class="leg-item">
      <span class="leg-dot" style="background:${s.color}"></span>
      <span class="leg-name${s.type==='vwz'?' leg-vwz':''}">${s.name.replace('\n',' ')}</span>
      <span style="color:var(--muted);font-size:0.62rem">PK:${s.pk}B Sig:${s.sig}B</span>
    </div>
  `).join('');
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

window.redraw = redraw;
window.switchView = switchView;

// Init
redraw();
window.addEventListener('resize', redraw);
</script>
<div id="fibemate-footer" style="position:fixed;bottom:0;left:0;right:0;height:22px;background:rgba(8,8,13,.92);border-top:1px solid rgba(239,68,68,.15);display:flex;align-items:center;justify-content:center;gap:16px;font-size:10px;color:rgba(255,255,255,.35);z-index:9999;font-family:system-ui,sans-serif;backdrop-filter:blur(4px);"><span style="color:#ef4444;font-weight:600;">⚠ 实验性研究组件 · 不用于生产环境</span><span>·</span><span>FIBEMATE v3.3.0</span><span>·</span><span>2026-08-12</span></div>
</body>
</html>
