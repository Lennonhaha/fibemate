<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VWZ · 性能基准看板</title>
<style>
  :root {
    --bg: #08080d; --card: #0f0f18; --surf: #141424;
    --text: #d0d0d0; --muted: rgba(255,255,255,.35);
    --accent: #10b981; --warn: #f59e0b; --red: #ef4444;
    --violet: #8b5cf6; --blue: #3b82f6; --cyan: #06b6d4;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--text);
    font-family: 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh; display: flex; flex-direction: column;
  }
  #topBar {
    padding: 10px 16px; background: var(--card);
    border-bottom: 1px solid rgba(255,255,255,.06);
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  }
  #topBar h1 { font-size: 1rem; color: var(--accent); }
  .sep { width: 1px; height: 18px; background: rgba(255,255,255,.1); }
  #topBar button, #topBar .btn {
    background: var(--surf); color: var(--text);
    border: 1px solid rgba(255,255,255,.1); border-radius: 4px;
    padding: 5px 12px; font-size: 0.76rem; cursor: pointer;
    white-space: nowrap;
  }
  #topBar button:hover, #topBar .btn:hover { border-color: var(--accent); }
  #topBar button.active, #topBar .btn.active { background: var(--accent); color: #000; font-weight: 600; }
  label { font-size: 0.72rem; color: var(--muted); }
  select, input[type=range] {
    background: var(--surf); color: var(--text);
    border: 1px solid rgba(255,255,255,.1); border-radius: 4px;
    padding: 4px 10px; font-size: 0.75rem; cursor: pointer;
  }
  input[type=range] { padding: 0; width: 100px; accent-color: var(--accent); }
  #kLabel { font-size: 0.72rem; color: var(--accent); font-weight: 700; min-width: 20px; }

  #main {
    flex: 1; display: grid; grid-template-rows: 1fr;
    gap: 1px; background: rgba(255,255,255,.03);
  }
  .panel { background: var(--bg); position: relative; overflow: hidden; }
  .panel-label {
    position: absolute; top: 8px; left: 12px; z-index: 5;
    font-size: 0.68rem; color: var(--muted); pointer-events: none;
  }
  canvas { display: block; width: 100%; height: 100%; }

  .legend-box {
    position: absolute; right: 12px; top: 8px; z-index: 6;
    background: rgba(15,15,24,.92); border: 1px solid rgba(255,255,255,.1);
    border-radius: 8px; padding: 8px 12px; font-size: 0.66rem;
  }
  .leg-row { display: flex; align-items: center; gap: 5px; margin: 2px 0; }
  .leg-dot { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }
  .leg-vwz { font-weight: 700; color: var(--accent); }

  #tableWrap {
    overflow: auto; padding: 8px 12px;
    background: var(--card); border-top: 1px solid rgba(255,255,255,.06);
    display: none;
  }
  table { width: 100%; border-collapse: collapse; font-size: 0.7rem; font-variant-numeric: tabular-nums; }
  th, td { padding: 5px 10px; text-align: right; border-bottom: 1px solid rgba(255,255,255,.04); white-space: nowrap; }
  th { color: var(--muted); font-weight: 600; text-align: center; border-bottom: 1px solid rgba(255,255,255,.1); }
  td:first-child, th:first-child { text-align: left; }
  .vwz-row { background: rgba(16,185,129,.04); }
  .vwz-row td:first-child { color: var(--accent); font-weight: 700; }
  .best { color: var(--accent); font-weight: 700; }

  #bottom {
    padding: 4px 16px; font-size: 0.62rem; color: var(--muted);
    border-top: 1px solid rgba(255,255,255,.04);
    display: flex; gap: 20px; flex-wrap: wrap;
  }
</style>
</head>
<body>

<div id="topBar">
  <h1>⚡ VWZ · 性能基准看板</h1>
  <span class="sep"></span>
  <button id="btnBar" class="active" onclick="switchView('bar')">📊 柱状</button>
  <button id="btnRadar" onclick="switchView('radar')">🎯 雷达</button>
  <button id="btnBatch" onclick="switchView('batch')">⚡ 批处理</button>
  <button id="btnTable" onclick="switchView('table')">📋 数据</button>
  <span class="sep"></span>
  <select id="opSel" onchange="redraw()">
    <option value="sign">签名 ops/s</option>
    <option value="verify">验证 ops/s</option>
    <option value="both">签名+验证</option>
  </select>
  <span class="sep"></span>
  <label>k=</label>
  <input type="range" id="kSlider" min="4" max="32" value="8" step="4" oninput="onKChange()">
  <span id="kLabel">8</span>
  <span class="sep"></span>
  <label style="color:var(--accent);font-size:0.68rem">✅ VWZ 实测 · k=4/32 为理论外推</label>
</div>

<div id="main">
  <div class="panel" id="chartPanel">
    <span class="panel-label" id="chartLabel">性能基准对比</span>
    <div class="legend-box" id="legend"></div>
    <canvas id="chart"></canvas>
  </div>
</div>

<div id="tableWrap"><table id="tbl"></table></div>

<div id="bottom">
  <span>🔒 VWZ 实验性 · 未标准化</span>
  <span>✅ VWZ k=8/16: WASM 实测 (Intel Xeon Platinum, Node v22)</span>
  <span style="color:var(--warn)">⚠️ k=4/32: 理论外推 (O(k²·³) 复杂度模型)</span>
  <span style="margin-left:auto"><a href="size-comparison.html" style="color:var(--accent);text-decoration:underline">→ 尺寸对比</a></span>
</div>

<script>
// ──────────────────────────────────────────
// 性能数据
//   VWZ k=8/16: 实测  k=4/32: O(k²·³) 外推
//   对比方案: NIST Round 3 / liboqs 参考值
// ──────────────────────────────────────────

// VWZ 按 k 值的独立数据点（k=4/32 为理论外推）
const VWZ_K_DATA = {
  4:  { pk: 244,  sig: 20,  sign_ops: 98000, verify_ops: 10300,  measured: false },
  8:  { pk: 468,  sig: 36,  sign_ops: 24527, verify_ops: 2581,   measured: true  },
  16: { pk: 1700, sig: 68,  sign_ops: 4765,  verify_ops: 404,    measured: true  },
  32: { pk: 6300, sig: 132, sign_ops: 1190,  verify_ops: 101,    measured: false },
};

// 对比方案（与 k 无关）
const COMPETITORS = [
  { name: 'VWZ k=8',    vwz: true, color: '#10b981' },
  { name: 'VWZ k=16',   vwz: true, color: '#34d399' },
  { name: 'ECDSA P-256', type: 'classical', pk: 65,  sig: 72,   sign_ops: 45000, verify_ops: 22000, color: '#3b82f6' },
  { name: 'FALCON-512',  type: 'pq',       pk: 897, sig: 666,  sign_ops: 6000,  verify_ops: 28000, color: '#8b5cf6' },
  { name: 'ML-DSA-44',   type: 'pq',       pk: 1312,sig: 2420, sign_ops: 3500,  verify_ops: 9000,  color: '#f59e0b' },
  { name: 'ML-DSA-65',   type: 'pq',       pk: 1952,sig: 3293, sign_ops: 1800,  verify_ops: 5000,  color: '#ef4444' },
  { name: 'SLH-DSA-128s',type: 'pq',       pk: 32,  sig: 7856, sign_ops: 15,    verify_ops: 120,   color: '#06b6d4' },
];

let currentView = 'bar';
let selectedK = 8;

// VWZ 雷达图四维（归一化用）
const RADAR_DIMS = [
  { key: 'sign_ops',   label: '签名速度',  invert: false },
  { key: 'verify_ops', label: '验证速度',  invert: false },
  { key: 'sig',        label: '签名尺寸',  invert: true  },
  { key: 'pk',         label: '公钥尺寸',  invert: true  },
];

// ── 从 k 值与竞赛者构建当前方案表 ──
function getSchemes() {
  const vwzData = VWZ_K_DATA[selectedK] || VWZ_K_DATA[8];
  const vwz = {
    name: 'VWZ k=' + selectedK, type: 'vwz',
    pk: vwzData.pk, sig: vwzData.sig,
    sign_ops: vwzData.sign_ops, verify_ops: vwzData.verify_ops,
    color: '#10b981', measured: vwzData.measured,
  };
  return [vwz, ...COMPETITORS.filter(c => !c.vwz)];
}

// ── 雷达图数据 ──
function getRadarSchemes() {
  return [
    {
      name: 'VWZ k=' + selectedK,
      color: '#10b981',
      ...VWZ_K_DATA[selectedK],
    },
    { name: 'ML-DSA-65',  color: '#ef4444', pk: 1952, sig: 3293, sign_ops: 1800,  verify_ops: 5000  },
    { name: 'FALCON-512', color: '#8b5cf6', pk: 897,  sig: 666,  sign_ops: 6000,  verify_ops: 28000 },
    { name: 'ECDSA P-256',color: '#3b82f6', pk: 65,   sig: 72,   sign_ops: 45000, verify_ops: 22000 },
  ];
}

// ──────────────────────────────────────────
function onKChange() {
  selectedK = parseInt(document.getElementById('kSlider').value);
  document.getElementById('kLabel').textContent = selectedK;
  redraw();
}

function redraw() {
  if (currentView === 'bar')   drawBarChart();
  else if (currentView === 'radar') drawRadarChart();
  else if (currentView === 'batch') drawBatchChart();
  else if (currentView === 'table') drawTable();
}

function switchView(v) {
  currentView = v;
  ['btnBar','btnRadar','btnBatch','btnTable'].forEach(id => {
    document.getElementById(id).classList.toggle('active', id === 'btn' + v.charAt(0).toUpperCase() + v.slice(1));
  });
  document.getElementById('chartPanel').style.display = (v === 'table') ? 'none' : '';
  document.getElementById('tableWrap').style.display  = (v === 'table') ? '' : 'none';
  document.getElementById('opSel').style.display      = (v === 'bar')  ? '' : 'none';
  document.getElementById('legend').style.display     = (v === 'radar' || v === 'batch') ? 'none' : '';
  const labels = { bar: '性能基准对比 — 签名/验证每秒操作数',
                   radar: '四维雷达对比 — 签名·验证·尺寸·公钥',
                   batch: '批处理验证理论加速比 — 公式预测, 非实测',
                   table: '数据表' };
  document.getElementById('chartLabel').textContent = labels[v] || '';
  redraw();
}

// ──────────────────────────────────────────
// 柱状图（原有逻辑，增强 k 联动）
// ──────────────────────────────────────────
function drawBarChart() {
  const schemes = getSchemes();
  const c = document.getElementById('chart');
  const panel = document.getElementById('chartPanel');
  const w = panel.clientWidth, h = panel.clientHeight;
  const dpr = Math.min(window.devicePixelRatio, 2);
  c.width = w * dpr; c.height = h * dpr; c.style.width = w + 'px'; c.style.height = h + 'px';

  const ctx = c.getContext('2d');
  ctx.fillStyle = '#08080d'; ctx.fillRect(0, 0, c.width, c.height);
  ctx.save(); ctx.scale(dpr, dpr);

  const op = document.getElementById('opSel').value;
  const mg = { top: 48, right: 50, bottom: 60, left: 75 };
  const gw = w - mg.left - mg.right;
  const gh = h - mg.top - mg.bottom;

  const bars = [];
  for (const s of schemes) {
    if (op === 'sign' || op === 'both')   bars.push({ scheme: s, op: 'sign',   val: s.sign_ops });
    if (op === 'verify' || op === 'both') bars.push({ scheme: s, op: 'verify', val: s.verify_ops });
  }

  const nGroups = schemes.length;
  const groupW = gw / nGroups;
  const barW = Math.min(32, groupW * (op === 'both' ? 0.35 : 0.55));
  const maxVal = Math.max(...bars.map(b => b.val ?? 1)) * 1.15;

  // Grid
  const yTicks = 6;
  for (let i = 0; i <= yTicks; i++) {
    const y = mg.top + (gh / yTicks) * i;
    ctx.strokeStyle = 'rgba(255,255,255,.05)'; ctx.beginPath();
    ctx.moveTo(mg.left, y); ctx.lineTo(w - mg.right, y); ctx.stroke();
    const val = Math.round(maxVal * (yTicks - i) / yTicks);
    ctx.fillStyle = 'rgba(255,255,255,.25)'; ctx.font = '9px monospace'; ctx.textAlign = 'right';
    ctx.fillText(val >= 1000 ? (val/1000).toFixed(0) + 'k' : val, mg.left - 6, y + 4);
  }

  const signColors = { sign: '#10b981', verify: '#8b5cf6' };
  schemes.forEach((s, gi) => {
    const gx = mg.left + groupW * gi + groupW / 2;

    const drawBar = (val, offset, color) => {
      if (val != null) {
        const hBar = (val / maxVal) * gh;
        const y = mg.top + gh - hBar;
        const x = gx - barW + offset;
        const grad = ctx.createLinearGradient(x, y, x, mg.top + gh);
        grad.addColorStop(0, color); grad.addColorStop(1, color + '33');
        ctx.fillStyle = grad;
        roundRect(ctx, x, y, barW * 2, hBar, 3); ctx.fill();
        ctx.strokeStyle = color; ctx.lineWidth = 1.2;
        roundRect(ctx, x, y, barW * 2, hBar, 3); ctx.stroke();
        const label = val >= 1000 ? (val / 1000).toFixed(1) + 'k' : val;
        ctx.fillStyle = color; ctx.font = 'bold 7px monospace'; ctx.textAlign = 'center';
        ctx.fillText(label, gx, y - 5);
      }
    };

    if (op === 'both') {
      drawBar(s.sign_ops, -barW, signColors.sign);
      drawBar(s.verify_ops, barW, signColors.verify);
    } else {
      drawBar(op === 'sign' ? s.sign_ops : s.verify_ops, 0, s.color);
    }

    // Label
    const isVWZ = s.type === 'vwz';
    const labelLines = s.name.split('\n');
    labelLines.forEach((ln, li) => {
      ctx.fillStyle = isVWZ ? '#10b981' : 'rgba(255,255,255,.4)';
      ctx.font = (isVWZ ? 'bold ' : '') + '8px system-ui';
      ctx.textAlign = 'center';
      ctx.fillText(ln, gx, mg.top + gh + 13 + li * 10);
    });
    // 实测/外推 标记
    if (isVWZ && !s.measured) {
      ctx.fillStyle = '#f59e0b'; ctx.font = '6px system-ui';
      ctx.fillText('(外推)', gx, mg.top + gh + 13 + labelLines.length * 10);
    }
  });

  // Title
  const titles = { sign: '签名性能 (ops/s) — k='+selectedK, verify: '验证性能 (ops/s) — k='+selectedK, both: '签名 + 验证 — k='+selectedK };
  ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.font = '11px system-ui'; ctx.textAlign = 'center';
  ctx.fillText(titles[op], w / 2, 16);

  if (op === 'both') {
    ctx.fillStyle = signColors.sign; ctx.font = '8px system-ui'; ctx.textAlign = 'right';
    ctx.fillText('■ 签名', w - mg.right, mg.top - 14);
    ctx.fillStyle = signColors.verify;
    ctx.fillText('■ 验证', w - mg.right, mg.top - 2);
  }

  ctx.restore();

  // Legend
  const div = document.getElementById('legend');
  if (div) div.innerHTML = schemes.map(s => `
    <div class="leg-row" style="color:${s.color}">
      <span class="leg-dot" style="background:${s.color}"></span>
      <span class="${s.type==='vwz'?'leg-vwz':''}">${s.name.replace('\n',' ')}</span>
      <span style="color:var(--muted);font-size:0.58rem">${(s.sign_ops>=1000?(s.sign_ops/1000).toFixed(1)+'k':s.sign_ops)} sign/s</span>
    </div>
  `).join('');
}

// ──────────────────────────────────────────
// 雷达图
// ──────────────────────────────────────────
function drawRadarChart() {
  const schemes = getRadarSchemes();
  const c = document.getElementById('chart');
  const panel = document.getElementById('chartPanel');
  const w = panel.clientWidth, h = panel.clientHeight;
  const dpr = Math.min(window.devicePixelRatio, 2);
  c.width = w * dpr; c.height = h * dpr; c.style.width = w + 'px'; c.style.height = h + 'px';

  const ctx = c.getContext('2d');
  ctx.fillStyle = '#08080d'; ctx.fillRect(0, 0, c.width, c.height);
  ctx.save(); ctx.scale(dpr, dpr);

  const cx = w / 2, cy = h / 2 + 10;
  const R = Math.min(w, h) * 0.36;
  const n = RADAR_DIMS.length;
  const angle = -Math.PI / 2; // start from top

  // Normalize: gather min/max per dimension
  const ranges = RADAR_DIMS.map(d => {
    const vals = schemes.map(s => s[d.key]);
    return { min: Math.min(...vals) * 0.85, max: Math.max(...vals) * 1.15, ...d };
  });

  function valToR(scheme, dimIdx) {
    const d = ranges[dimIdx];
    const raw = scheme[d.key];
    const norm = d.invert ? (d.max - raw) / (d.max - d.min) : (raw - d.min) / (d.max - d.min);
    return R * Math.max(0.05, norm);
  }

  // Grid circles
  for (let g = 1; g <= 4; g++) {
    const r = R * g / 4;
    ctx.strokeStyle = 'rgba(255,255,255,' + (g === 4 ? '.15' : '.04') + ')';
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();
    if (g === 4) {
      for (let i = 0; i < n; i++) {
        const a = angle + (2 * Math.PI * i) / n;
        const x = cx + Math.cos(a) * R, y = cy + Math.sin(a) * R;
        ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.font = '9px system-ui'; ctx.textAlign = 'center';
        const lab = ranges[i].label + '\n' +
          (ranges[i].invert ? '越小越好' : '越大越好');
        const lines = lab.split('\n');
        lines.forEach((ln, li) => ctx.fillText(ln, x + Math.cos(a) * 28, y + Math.sin(a) * 28 + li * 10));
      }
    }
  }
  // Axis lines
  for (let i = 0; i < n; i++) {
    const a = angle + (2 * Math.PI * i) / n;
    ctx.strokeStyle = 'rgba(255,255,255,.08)'; ctx.lineWidth = 0.5;
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(a) * R, cy + Math.sin(a) * R); ctx.stroke();
  }

  // Draw polygons
  schemes.forEach(s => {
    ctx.beginPath();
    for (let i = 0; i < n; i++) {
      const a = angle + (2 * Math.PI * i) / n;
      const r = valToR(s, i);
      const x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.fillStyle = s.color + '18';
    ctx.fill();
    ctx.strokeStyle = s.color; ctx.lineWidth = 2;
    ctx.stroke();

    // Vertex dots
    for (let i = 0; i < n; i++) {
      const a = angle + (2 * Math.PI * i) / n;
      const r = valToR(s, i);
      ctx.fillStyle = s.color; ctx.beginPath();
      ctx.arc(cx + Math.cos(a) * r, cy + Math.sin(a) * r, 3, 0, Math.PI * 2); ctx.fill();
    }
  });

  // Legend — bottom
  const legY = h - 20;
  schemes.forEach((s, i) => {
    const lx = 20 + i * 130;
    ctx.fillStyle = s.color; ctx.fillRect(lx, legY, 10, 10);
    ctx.fillText(s.name, lx + 14, legY + 9);
  });

  // VWZ measured note
  const vwz = schemes[0];
  if (!VWZ_K_DATA[selectedK].measured) {
    ctx.fillStyle = '#f59e0b'; ctx.font = '9px system-ui'; ctx.textAlign = 'center';
    ctx.fillText('⚠️ VWZ k=' + selectedK + ' 为 O(k²·³) 理论外推', cx, h - 4);
  }

  // Title
  ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.font = '11px system-ui'; ctx.textAlign = 'center';
  ctx.fillText('四维雷达图 — 签名·验证·尺寸·公钥 综合平衡 (k=' + selectedK + ')', cx, 16);

  ctx.restore();
  document.getElementById('legend').style.display = 'none';
}

// ──────────────────────────────────────────
// 批处理验证理论加速比
// ──────────────────────────────────────────
function drawBatchChart() {
  const c = document.getElementById('chart');
  const panel = document.getElementById('chartPanel');
  const w = panel.clientWidth, h = panel.clientHeight;
  const dpr = Math.min(window.devicePixelRatio, 2);
  c.width = w * dpr; c.height = h * dpr; c.style.width = w + 'px'; c.style.height = h + 'px';

  const ctx = c.getContext('2d');
  ctx.fillStyle = '#08080d'; ctx.fillRect(0, 0, c.width, c.height);
  ctx.save(); ctx.scale(dpr, dpr);

  const mg = { top: 50, right: 140, bottom: 55, left: 65 };
  const gw = w - mg.left - mg.right;
  const gh = h - mg.top - mg.bottom;

  // Theory: independent verify = N * O(k³) / batch verify ≈ N * O(k²)
  // Speedup = independent / batch → approaches k (for k=8 → ~8x, k=16 → ~16x)
  const k = selectedK;
  const theoreticalMax = k; // 渐近加速比
  const Nmax = 1000;

  // Generate curve
  const pts = [];
  for (let i = 0; i <= 60; i++) {
    const N = Math.max(1, Math.round(Math.pow(10, i / 20)));
    if (N > Nmax) break;
    // Speedup(N) = theoreticalMax * (1 - 1/(1 + N/theoreticalMax))
    const speedup = theoreticalMax * (1 - 1 / (1 + N / theoreticalMax));
    pts.push({ N, speedup });
  }
  if (pts[pts.length - 1].N < Nmax) pts.push({ N: Nmax, speedup: theoreticalMax * (1 - 1 / (1 + Nmax / theoreticalMax)) });

  const maxN = pts[pts.length - 1].N;
  const maxSp = theoreticalMax * 1.15;

  // Grid
  const yTicks = 6;
  for (let i = 0; i <= yTicks; i++) {
    const y = mg.top + (gh / yTicks) * i;
    ctx.strokeStyle = 'rgba(255,255,255,.05)'; ctx.beginPath();
    ctx.moveTo(mg.left, y); ctx.lineTo(w - mg.right, y); ctx.stroke();
    const val = (maxSp * (yTicks - i) / yTicks).toFixed(1) + '×';
    ctx.fillStyle = 'rgba(255,255,255,.25)'; ctx.font = '9px monospace'; ctx.textAlign = 'right';
    ctx.fillText(val, mg.left - 6, y + 4);
  }

  // X axis — key N markers
  const xMarkers = [1, 5, 10, 50, 100, 500, 1000].filter(n => n <= maxN);
  xMarkers.forEach(N => {
    const x = mg.left + (Math.log(N) / Math.log(maxN)) * gw;
    ctx.strokeStyle = 'rgba(255,255,255,.06)'; ctx.beginPath();
    ctx.moveTo(x, mg.top); ctx.lineTo(x, mg.top + gh); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.3)'; ctx.font = '8px monospace'; ctx.textAlign = 'center';
    ctx.fillText(N >= 1000 ? (N/1000).toFixed(0)+'k' : N, x, mg.top + gh + 14);
  });

  // Curve
  ctx.beginPath();
  let first = true;
  pts.forEach(p => {
    const x = mg.left + (Math.log(p.N) / Math.log(maxN)) * gw;
    const y = mg.top + gh - (p.speedup / maxSp) * gh;
    if (first) { ctx.moveTo(x, y); first = false; } else ctx.lineTo(x, y);
  });
  ctx.strokeStyle = '#10b981'; ctx.lineWidth = 2.5;
  ctx.stroke();

  // Asymptote
  const yAsym = mg.top + gh - (theoreticalMax / maxSp) * gh;
  ctx.strokeStyle = 'rgba(16,185,129,.3)'; ctx.lineWidth = 1; ctx.setLineDash([6, 4]);
  ctx.beginPath(); ctx.moveTo(mg.left, yAsym); ctx.lineTo(w - mg.right, yAsym); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = 'rgba(16,185,129,.4)'; ctx.font = '9px monospace'; ctx.textAlign = 'right';
  ctx.fillText(theoreticalMax.toFixed(0) + '× 渐近', w - mg.right - 6, yAsym - 4);

  // Info panel — right side
  const ix = w - mg.right + 12;
  const lines = [
    '批处理验证', '(理论预测)',
    '',
    '独立验证:',
    ' O(N·k³)',
    '',
    '批量验证:',
    ' O(k³+N·k²)',
    '',
    '渐近加速比:',
    ' ≈ k = ' + k + '×',
    '',
    'k 值越大,',
    '批处理收益越高',
    '',
    '⚠️ 纯数学预测',
    '实测待 verify_batch',
    'Rust 侧实现',
  ];
  lines.forEach((ln, li) => {
    const y = mg.top + li * 11;
    ctx.fillStyle = li < 1 ? '#10b981' : 'rgba(255,255,255,.4)';
    ctx.font = (li === 0 || li === 4 || li === 9) ? 'bold 8px system-ui' : '7px monospace';
    ctx.textAlign = 'left';
    ctx.fillText(ln, ix, y);
  });

  // k 切换提示
  ctx.fillStyle = 'rgba(255,255,255,.5)'; ctx.font = '10px system-ui'; ctx.textAlign = 'center';
  ctx.fillText('批处理验证理论加速比 (k=' + k + ') — 调滑块观察不同 k 的收益', w / 2, 16);
  ctx.fillStyle = 'rgba(255,255,255,.2)'; ctx.font = '7px system-ui';
  ctx.fillText('横轴: 批量验证的签名数量 N (对数坐标)  纵轴: 加速比 (独立/批量)', w / 2, mg.top + gh + 38);
  ctx.fillText('公式: speedup(N) = k × (1 − 1/(1 + N/k))  → 渐近 k×', w / 2, mg.top + gh + 50);

  ctx.restore();
  document.getElementById('legend').style.display = 'none';
}

  `;
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}
