 var gHeight=grid[Math.min(res-1,Math.floor(pt.p.n/4200*(res-1)))][Math.min(res-1,Math.floor((pt.p.logq-8)/(12)*(res-1)))]/80;
 var lg=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(pt.x,pt.y,pt.z),new THREE.Vector3(pt.x,gHeight,pt.z)]);
 group.add(new THREE.Line(lg,new THREE.LineBasicMaterial({color:color,transparent:true,opacity:0.3})));
}

function colorForBits(bits){
 if(bits<64)return[0,0.8,0.5];       // green: solvable
 if(bits<128)return[1,0.6,0];        // orange: Level 1
 if(bits<192)return[1,0.3,0];        // red: Level 3
 return[0.9,0.2,1];                   // purple: Level 5+
}

function viewClassic(){
 document.getElementById('btnBoth').classList.remove('active');
 document.querySelectorAll('.btn')[0].classList.add('active');
 ptsGroup.visible=true;qptsGroup.visible=false;
}
function viewQuantum(){
 document.getElementById('btnBoth').classList.remove('active');
 document.querySelectorAll('.btn')[1].classList.add('active');
 ptsGroup.visible=false;qptsGroup.visible=true;
}
function viewBoth(){
 document.getElementById('btnBoth').classList.add('active');
 document.querySelectorAll('.btn')[0].classList.remove('active');
 document.querySelectorAll('.btn')[1].classList.remove('active');
 ptsGroup.visible=true;qptsGroup.visible=true;
}

// Place all points
allPointData.forEach(function(ad){
 var catColor=ad.p.cat==='quantum'?'#4488ff':ad.p.cat==='standard'?'#ffd700':ad.p.cat==='benchmark'?'#ff9800':ad.p.cat==='threshold'?'#f44336':ad.p.cat==='hard'?'#e040fb':'#00ff88';
 var group=ad.p.cat==='quantum'?qptsGroup:ptsGroup;
 addPoint(ad,group,catColor,ad.p.cat==='standard'||ad.p.cat==='threshold'?0.25:ad.p.cat==='benchmark'?0.2:0.18,ad.p.cat==='standard'||ad.p.cat==='threshold');
});

// Key NIST thresholds: horizontal planes
[{bits:128,color:0xff9800,lbl:'NIST Level 1 (128-bit)'},{bits:192,color:0xf44336,lbl:'NIST Level 3 (192-bit)'},{bits:256,color:0xe040fb,lbl:'NIST Level 5 (256-bit)'}].forEach(function(t){
 var y=t.bits/80;
 var pg=new THREE.PlaneGeometry(25,30);
 var pm=new THREE.MeshBasicMaterial({color:t.color,side:THREE.DoubleSide,transparent:true,opacity:0.06,depthWrite:false});
 var plane=new THREE.Mesh(pg,pm);plane.rotation.x=-Math.PI/2;plane.position.y=y;
 scene.add(plane);
 // Label
 var cv=document.createElement('canvas');cv.width=512;cv.height=24;
 var ctx=cv.getContext('2d');ctx.fillStyle='rgba(0,0,0,0)';ctx.fillRect(0,0,512,24);
 ctx.fillStyle='#'+t.color.toString(16).padStart(6,'0');ctx.font='11px monospace';ctx.textAlign='right';ctx.fillText(t.lbl,500,16);
 var tex=new THREE.CanvasTexture(cv);tex.minFilter=THREE.LinearFilter;
 var sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,opacity:0.6,depthTest:false}));
 sp.position.set(10,y,17);sp.scale.set(7,0.4,1);scene.add(sp);
});

function animate(){
 requestAnimationFrame(animate);
 controls.update();
 // Animate surface slightly
 surface.rotation.y+=0.0001;
 wire.rotation.y=surface.rotation.y;
 ptsGroup.rotation.y=surface.rotation.y;
 qptsGroup.rotation.y=surface.rotation.y;
 labelsGroup.rotation.y=surface.rotation.y;
 renderer.render(scene,camera);
}
animate();
window.addEventListener('resize',function(){camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight);});
</script>
