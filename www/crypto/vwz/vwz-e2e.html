<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VWZ Signature — E2E Test</title>
<style>
  :root { color-scheme: dark; }
  body { font-family: system-ui, sans-serif; background: #0d1117; color: #c9d1d9; max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
  h1 { color: #58a6ff; font-size: 1.3rem; }
  .card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 1.2rem; margin: 1rem 0; }
  .row { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; margin: 0.5rem 0; }
  label { font-size: 0.85rem; color: #8b949e; min-width: 5rem; }
  input, select, textarea { background: #0d1117; border: 1px solid #30363d; color: #c9d1d9; padding: 0.4rem 0.6rem; border-radius: 4px; font-family: inherit; font-size: 0.9rem; }
  button { background: #238636; color: #fff; border: none; padding: 0.5rem 1.2rem; border-radius: 6px; cursor: pointer; font-size: 0.9rem; }
  button:hover { background: #2ea043; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .log { background: #0d1117; border: 1px solid #30363d; border-radius: 4px; padding: 0.8rem; font-family: 'Cascadia Code', 'Fira Code', monospace; font-size: 0.8rem; white-space: pre-wrap; max-height: 300px; overflow-y: auto; }
  .pass { color: #3fb950; }
  .fail { color: #f85149; }
  .info { color: #8b949e; }
  .stat { background: #1c2128; padding: 0.3rem 0.6rem; border-radius: 4px; font-family: monospace; font-size: 0.8rem; }
</style>
</head>
<body>

<h1>🔐 VWZ Hash-and-Sign — Browser E2E Test</h1>

<div class="card">
  <div class="row">
    <label>Security param k:</label>
    <select id="kSelect">
      <option value="2">k=2 (lab)</option>
      <option value="4">k=4</option>
      <option value="8" selected>k=8 (~73 bits)</option>
      <option value="12">k=12</option>
      <option value="16">k=16 (~113 bits)</option>
    </select>
    <button id="btnKeygen">Keygen</button>
    <span id="keygenTime" class="stat">—</span>
  </div>
  <div class="row">
    <label>Message:</label>
    <input id="msgInput" value="FIBEMATE VWZ E2E test 2026-06-26" style="flex:1; min-width: 200px;">
    <button id="btnSign">Sign</button>
    <span id="signTime" class="stat">—</span>
  </div>
  <div class="row">
    <button id="btnVerify">Verify</button>
    <button id="btnTamper" style="background:#da3633">Tamper & Verify</button>
    <button id="btnBattery" style="background:#1f6feb">Run Battery (10×)</button>
  </div>
</div>

<div class="card">
  <strong>Log</strong>
  <div id="log" class="log"><span class="info">Loading VWZ WASM module...</span></div>
</div>

<script type="module">
import { initVwz, vwzKeygen, vwzSign, vwzVerify, vwzSerializePK, vwzSerializeSig, vwzEstimateSizes } from './vwz-loader.js';

const logEl = document.getElementById('log');
function log(msg, cls = '') {
  const t = new Date().toISOString().slice(11, 19);
  logEl.innerHTML += `\n[${t}] <span class="${cls}">${msg}</span>`;
  logEl.scrollTop = logEl.scrollHeight;
}

let kp = null;
let sig = null;
let k = 8;

// Init WASM
(async () => {
  try {
    await initVwz();
    log('VWZ WASM module loaded ✅', 'pass');
    log(vwzEstimateSizes(8));
  } catch (e) {
    log(`Init failed: ${e.message}`, 'fail');
  }
})();

// UI bindings
document.getElementById('kSelect').addEventListener('change', e => { k = +e.target.value; });

function timeIt(fn) {
  const t0 = performance.now();
  const result = fn();
  const dt = (performance.now() - t0).toFixed(1);
  return { result, dt };
}

document.getElementById('btnKeygen').onclick = () => {
  try {
    const { result, dt } = timeIt(() => vwzKeygen(k));
    kp = result;
    sig = null;
    document.getElementById('keygenTime').textContent = `${dt}ms`;
    const pkBytes = vwzSerializePK(kp.publicKey()).length;
    log(`Keygen k=${k} — ${dt}ms, PK=${pkBytes}B ${vwzEstimateSizes(k)}`, 'pass');
  } catch (e) {
    log(`Keygen failed: ${e.message}`, 'fail');
  }
};

document.getElementById('btnSign').onclick = () => {
  if (!kp) { log('Run Keygen first', 'fail'); return; }
  try {
    const msg = document.getElementById('msgInput').value;
    const { result, dt } = timeIt(() => vwzSign(kp.secretKey(), msg));
    sig = result;
    document.getElementById('signTime').textContent = `${dt}ms`;
    const sigBytes = vwzSerializeSig(sig).length;
    log(`Sign "${msg.slice(0, 30)}..." — ${dt}ms, sig=${sigBytes}B`, 'pass');
  } catch (e) {
    log(`Sign failed: ${e.message}`, 'fail');
  }
};

document.getElementById('btnVerify').onclick = () => {
  if (!kp || !sig) { log('Run Keygen + Sign first', 'fail'); return; }
  try {
    const msg = document.getElementById('msgInput').value;
    const { result, dt } = timeIt(() => vwzVerify(kp.publicKey(), msg, sig));
    if (result) log(`Verify ✅ (${dt}ms)`, 'pass');
    else log('Verify FAILED ❌', 'fail');
  } catch (e) {
    log(`Verify error: ${e.message}`, 'fail');
  }
};

document.getElementById('btnTamper').onclick = () => {
  if (!kp || !sig) { log('Run Keygen + Sign first', 'fail'); return; }
  try {
    const msg = document.getElementById('msgInput').value + 'X'; // tampered
    const { result, dt } = timeIt(() => vwzVerify(kp.publicKey(), msg, sig));
    if (!result) log(`Tamper rejected ✅ (${dt}ms) — correct rejection`, 'pass');
    else log('Tamper NOT rejected ❌ — BUG!', 'fail');
  } catch (e) {
    log(`Tamper error: ${e.message}`, 'fail');
  }
};

document.getElementById('btnBattery').onclick = async () => {
  if (!kp) { log('Run Keygen first', 'fail'); return; }
  const msg = document.getElementById('msgInput').value;
  log('Running 10× sign+verify battery...', 'info');
  const times = [];
  for (let i = 0; i < 10; i++) {
    const { result: s, dt: t1 } = timeIt(() => vwzSign(kp.secretKey(), msg));
    const { result: ok, dt: t2 } = timeIt(() => vwzVerify(kp.publicKey(), msg, s));
    if (!ok) { log(`Battery round ${i+1} FAILED`, 'fail'); return; }
    times.push({ sign: +t1, verify: +t2 });
  }
  const avgSign = (times.reduce((a,b)=>a+b.sign,0)/10).toFixed(1);
  const avgVerify = (times.reduce((a,b)=>a+b.verify,0)/10).toFixed(1);
  log(`Battery 10/10 ✅ — avg sign ${avgSign}ms, avg verify ${avgVerify}ms`, 'pass');
};
</script>
</body>
</html>
