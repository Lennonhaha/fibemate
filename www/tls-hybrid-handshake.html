<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FIBEMATE · TLS 1.3 Hybrid Handshake — 10-Step Live</title>
<meta name="description" content="TLS 1.3 PQ Hybrid Handshake: IANA #4590 SM2-MLKEM768 + #4588 X25519MLKEM768. 10-step interactive 3D visualization.">
<style>
:root {
  --bg: #060a10;
  --panel-bg: rgba(8,12,22,0.94);
  --teal: #00e5c3;
  --blue: #0052CC;
  --purple: #a855f7;
  --orange: #ff9100;
  --red: #ff5252;
  --green: #5ecf8a;
  --text: #c8d0e0;
  --dim: #5a6a8a;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);overflow:hidden;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;color:var(--text)}

canvas{display:block;position:fixed;top:0;left:0;z-index:0}

/* Top overlay */
#top{position:fixed;top:0;left:0;right:0;z-index:10;padding:16px 20px;
  background:linear-gradient(180deg,var(--panel-bg) 0%,transparent 100%);
  display:flex;align-items:flex-start;justify-content:space-between;pointer-events:none}
#top-left{max-width:55%}
#top-badge{display:inline-flex;align-items:center;gap:6px;
  background:linear-gradient(135deg,var(--blue),#0077ff);color:#fff;
  font-size:11px;font-weight:700;padding:5px 14px;border-radius:20px;
  letter-spacing:0.5px;text-transform:uppercase;margin-bottom:6px}
#top-badge .pulse{width:7px;height:7px;border-radius:50%;background:#fff;animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 4px #fff}50%{opacity:0.4;box-shadow:0 0 12px #fff}}
#top-title{font-size:20px;font-weight:700;color:#fff;letter-spacing:0.3px;margin-bottom:2px}
#top-desc{font-size:13px;color:var(--dim);line-height:1.5;max-width:480px}
#top-right{text-align:right;font-size:11px;color:var(--dim);line-height:1.8}
#top-right .hl{color:var(--teal)}

/* Bottom panel */
#bottom{position:fixed;bottom:0;left:0;right:0;z-index:10;padding:14px 20px 18px;
  background:linear-gradient(0deg,var(--panel-bg) 0%,transparent 100%);
  display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:all}

#formula-bar{font-family:'JetBrains Mono','Cascadia Code',monospace;font-size:11px;color:var(--teal);
  background:rgba(0,229,195,0.06);padding:7px 16px;border-radius:8px;
  border:1px solid rgba(0,229,195,0.15);max-width:620px;text-align:center;word-break:break-all;display:none}

#data-strip{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:640px}
.dp{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--dim);
  background:rgba(20,24,40,0.8);padding:4px 10px;border-radius:5px;
  border:1px solid rgba(80,100,140,0.2);max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dp .key{color:#8ab4e0}
.dp .val{color:var(--teal)}

#nav-row{display:flex;align-items:center;gap:14px}
.nav-btn{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);color:var(--text);
  font-size:13px;padding:9px 20px;border-radius:8px;cursor:pointer;transition:all 0.2s;font-family:inherit;
  display:flex;align-items:center;gap:6px}
.nav-btn:hover{background:rgba(255,255,255,0.12);color:#fff;border-color:rgba(255,255,255,0.2)}
.nav-btn:active{transform:scale(0.97)}
#prevBtn{opacity:0.4;pointer-events:none}
#nextBtn{background:linear-gradient(135deg,var(--blue),#0077ff);border:none;color:#fff;font-weight:600;min-width:110px;justify-content:center}
#nextBtn:hover{background:linear-gradient(135deg,#0066dd,#0088ff);box-shadow:0 0 20px rgba(0,82,204,0.3)}
#step-counter{font-size:12px;color:var(--dim);min-width:80px;text-align:center}

#progress-bar{display:flex;gap:4px;margin-top:2px}
.pb-dot{width:28px;height:4px;border-radius:2px;background:rgba(255,255,255,0.08);transition:all 0.4s}
.pb-dot.active{background:var(--blue);box-shadow:0 0 8px rgba(0,82,204,0.6)}
.pb-dot.done{background:rgba(0,82,204,0.25)}

/* Legend float */
#legend-float{position:fixed;right:20px;top:50%;transform:translateY(-50%);z-index:9;
  display:flex;flex-direction:column;gap:8px;pointer-events:none}
.lg-item{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--dim)}
.lg-dot{width:10px;height:10px;border-radius:50%}

/* Key schedule highlight */
.kh-highlight{font-size:10px;color:var(--teal);opacity:0;transition:opacity 0.5s}
.kh-highlight.show{opacity:1}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="top">
  <div id="top-left">
    <div id="top-badge"><span class="pulse"></span>Step <span id="stepN">1</span> / 10</div>
    <div id="top-title">ClientHello — Propose Hybrid Groups</div>
    <div id="top-desc">Client proposes IANA #4590 + #4588, sends ML-KEM-768 public key + P-256 key share.</div>
  </div>
  <div id="top-right">
    <div><span class="hl">CARS 75.20</span> · IBM 63.70</div>
    <div>20 可视化 · 7 npm 包</div>
    <div style="color:var(--orange)">D-26 开源倒计时</div>
  </div>
</div>

<div id="legend-float">
  <div class="lg-item"><div class="lg-dot" style="background:#00e5c3"></div> Client</div>
  <div class="lg-item"><div class="lg-dot" style="background:#ff7043"></div> Server</div>
  <div class="lg-item"><div class="lg-dot" style="background:#0052CC"></div> Key Exchange</div>
  <div class="lg-item"><div class="lg-dot" style="background:#a855f7"></div> HKDF</div>
  <div class="lg-item"><div class="lg-dot" style="background:#ff9100"></div> Handshake Msg</div>
  <div class="lg-item"><div class="lg-dot" style="background:#00b4d8"></div> ML-KEM</div>
</div>

<div id="bottom">
  <div id="formula-bar"></div>
  <div id="data-strip"></div>
  <div id="nav-row">
    <button class="nav-btn" id="prevBtn" onclick="prevStep()">◀ 上一步</button>
    <button class="nav-btn" id="nextBtn" onclick="nextStep()">下一步 ▶</button>
    <span id="step-counter">Step 1 of 10</span>
  </div>
  <div id="progress-bar"></div>
</div>

<script src="/docs/lib/three.min.js?v=20260803"></script>
<script>
// ═══════════════════════════════════════════════════════════════
//  THREE.JS SETUP — rich scene
// ═══════════════════════════════════════════════════════════════
var W=window.innerWidth, H=window.innerHeight;
var renderer=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.setSize(W,H);
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.2;

var scene=new THREE.Scene();
scene.fog=new THREE.FogExp2(0x060a10,0.0004);

var camera=new THREE.PerspectiveCamera(50,W/H,0.5,80);
camera.position.set(0,3,14);
camera.lookAt(0,0,0);

// ═══════════════════════════════════════════════════════════════
//  BACKGROUND — starfield + grid floor + ambient particles
// ═══════════════════════════════════════════════════════════════
(function(){
  // Starfield
  var sg=new THREE.BufferGeometry();
  var stars=[]; for(var i=0;i<600;i++){stars.push((Math.random()-0.5)*40,(Math.random()-0.5)*25,(Math.random()-0.5)*10-8)}
  sg.setAttribute('position',new THREE.BufferAttribute(new Float32Array(stars),3));
  var sm=new THREE.PointsMaterial({color:0x3a4a7a,size:0.03,transparent:true,opacity:0.6,depthWrite:false});
  scene.add(new THREE.Points(sg,sm));

  // Grid floor
  var grid=new THREE.GridHelper(20,40,0x1a2a4a,0x0a1220);
  grid.position.y=-5.5;
  scene.add(grid);

  // Ambient floating dots
  var ag=new THREE.BufferGeometry();
  var adots=[]; for(var j=0;j<80;j++){adots.push((Math.random()-0.5)*18,Math.random()*10-5,(Math.random()-0.5)*6)}
  ag.setAttribute('position',new THREE.BufferAttribute(new Float32Array(adots),3));
  var am=new THREE.PointsMaterial({color:0x0052CC,size:0.05,transparent:true,opacity:0.3,depthWrite:false});
  var ap=new THREE.Points(ag,am);
  ap.name='ambientPts'; scene.add(ap);
})();

// ═══════════════════════════════════════════════════════════════
//  LIGHTS
// ═══════════════════════════════════════════════════════════════
scene.add(new THREE.AmbientLight(0x1a2a4a,0.6));
var dl=new THREE.DirectionalLight(0xffffff,0.3); dl.position.set(5,10,8); scene.add(dl);

// ═══════════════════════════════════════════════════════════════
//  NODE FACTORY — platform + label + glow ring
// ═══════════════════════════════════════════════════════════════
function createNode(pos,color,label,size){
  size=size||0.5;
  var g=new THREE.Group();
  g.position.copy(pos);
  g._baseColor=color;
  g._pos=pos.clone();

  // Platform disc
  var disc=new THREE.Mesh(
    new THREE.CylinderGeometry(size*0.7,size*0.8,0.06,32),
    new THREE.MeshStandardMaterial({color:color,metalness:0.3,roughness:0.5,emissive:color,emissiveIntensity:0.2})
  );
  disc.position.y=-0.03; g.add(disc);

  // Glow ring (always on, wider than disc)
  var ring=new THREE.Mesh(
    new THREE.TorusGeometry(size*0.85,0.04,16,32),
    new THREE.MeshBasicMaterial({color:color,transparent:true,opacity:0.35,depthWrite:false})
  );
  ring.rotation.x=-Math.PI/2; ring.position.y=0.01;
  ring.name='glowRing'; g.add(ring);

  // Core sphere
  var core=new THREE.Mesh(
    new THREE.SphereGeometry(size*0.35,16,16),
    new THREE.MeshStandardMaterial({color:color,metalness:0.2,roughness:0.3,emissive:color,emissiveIntensity:0.4})
  );
  g.add(core);

  // Label sprite
  var cv=document.createElement('canvas'); cv.width=256; cv.height=64;
  var cx=cv.getContext('2d');
  cx.font='bold 14px Segoe UI,system-ui'; cx.textAlign='center'; cx.textBaseline='middle';
  cx.fillStyle='#'+color.toString(16).padStart(6,'0'); cx.fillText(label,128,32);
  var spr=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(cv),transparent:true,depthTest:false}));
  spr.scale.set(size*3.5,size*0.9,1); spr.position.y=size*1.1;
  g.add(spr);

  // Pulse halo (for highlight)
  var halo=new THREE.Mesh(
    new THREE.RingGeometry(size*0.9,size*1.15,32),
    new THREE.MeshBasicMaterial({color:color,side:THREE.DoubleSide,transparent:true,opacity:0,depthWrite:false})
  );
  halo.rotation.x=-Math.PI/2; halo.position.y=0.02;
  halo.name='halo'; g.add(halo);

  scene.add(g);
  return g;
}

// ═══════════════════════════════════════════════════════════════
//  EDGE FACTORY — tube geometry with glow
// ═══════════════════════════════════════════════════════════════
function createEdge(a,b,color){
  color=color||0x1a3050;
  var curve=new THREE.LineCurve3(a.clone(),b.clone());
  var tube=new THREE.TubeGeometry(curve,24,0.03,8,false);
  var mat=new THREE.MeshBasicMaterial({color:color,transparent:true,opacity:0.25,depthWrite:true});
  var mesh=new THREE.Mesh(tube,mat);
  mesh._baseColor=color;
  scene.add(mesh);
  return mesh;
}

// ═══════════════════════════════════════════════════════════════
//  NODE LAYOUT — horizontal flow: Client | Msg Flow | Server
//                 Key Schedule below
// ═══════════════════════════════════════════════════════════════
var CLR={client:0x00e5c3,server:0xff7043,kex:0x0052CC,hkdf:0xa855f7,msg:0xff9100,mlkem:0x00b4d8,done:0x5ecf8a};

// Client column
var cCl   = createNode(new THREE.Vector3(-7, 3.5,0), CLR.client, 'Client',0.5);
var cKEM  = createNode(new THREE.Vector3(-7, 1.5,0), CLR.mlkem, 'KeyGen\nML-KEM',0.45);
var cDH   = createNode(new THREE.Vector3(-7,-0.5,0), CLR.kex, 'KeyGen\nP-256',0.45);
var cDone = createNode(new THREE.Vector3(-7,-2.8,0), CLR.done, 'Finished',0.4);

// Server column
var sCl   = createNode(new THREE.Vector3(7, 3.5,0), CLR.server, 'Server',0.5);
var sKEM  = createNode(new THREE.Vector3(7, 1.5,0), CLR.mlkem, 'Encaps\nML-KEM',0.45);
var sDH   = createNode(new THREE.Vector3(7,-0.5,0), CLR.kex, 'KeyGen\nP-256',0.45);
var sDone = createNode(new THREE.Vector3(7,-2.8,0), CLR.done, 'Finished',0.4);

// Message flow center
var ch    = createNode(new THREE.Vector3(0, 5.0,0), CLR.msg, '① ClientHello',0.48);
var sh    = createNode(new THREE.Vector3(0, 3.8,0), CLR.msg, '② ServerHello',0.48);
var ee    = createNode(new THREE.Vector3(0, 2.6,0), CLR.msg, '③ EncryptedExt',0.45);
var cert  = createNode(new THREE.Vector3(0, 1.4,0), CLR.msg, '④ Certificate',0.45);
var cv    = createNode(new THREE.Vector3(0, 0.2,0), CLR.msg, '⑤ CertVerify',0.45);
var sfin  = createNode(new THREE.Vector3(0,-0.8,0), CLR.msg, '⑦ Svr Finished',0.45);
var cfin  = createNode(new THREE.Vector3(0,-1.8,0), CLR.msg, '⑨ Cli Finished',0.45);
var app   = createNode(new THREE.Vector3(0,-3.2,0), CLR.done, '★ App Data',0.5);

// Key schedule (vertical chain, bottom area)
var es   = createNode(new THREE.Vector3(-3.5, 3.0,1), CLR.hkdf, 'early_secret',0.4);
var hs   = createNode(new THREE.Vector3(-3.5, 1.5,1), CLR.hkdf, 'handshake\n_secret',0.4);
var ms   = createNode(new THREE.Vector3(-3.5,-0.8,1), CLR.hkdf, 'master\n_secret',0.4);
var ts   = createNode(new THREE.Vector3(3.5,-0.8,1), CLR.hkdf, 'traffic\n_secret',0.4);

// Hybrid share node
var hb   = createNode(new THREE.Vector3(-3.5, -0.5,0), CLR.kex, 'Hybrid\nShare',0.45);

// ═══════════════════════════════════════════════════════════════
//  EDGES — tube meshes
// ═══════════════════════════════════════════════════════════════
var E={};
function posOf(n){return n._pos;}
E.e1 =createEdge(posOf(cCl), posOf(ch));        // Client → ClientHello
E.e2 =createEdge(posOf(ch),  posOf(sCl));       // ClientHello → Server
E.e3 =createEdge(posOf(sCl), posOf(sh));        // Server → ServerHello
E.e4 =createEdge(posOf(sh),  posOf(cCl));       // ServerHello → Client
E.e5 =createEdge(posOf(sCl), posOf(ee));        // Server → EncryptedExt
E.e6 =createEdge(posOf(ee),  posOf(cCl));       // EncryptedExt → Client
E.e7 =createEdge(posOf(cKEM),posOf(hb));        // Client KEM → Hybrid
E.e8 =createEdge(posOf(cDH), posOf(hb));        // Client DH → Hybrid
E.e9 =createEdge(posOf(ch),  posOf(es));        // ClientHello → early_secret
E.e10=createEdge(posOf(sh),  posOf(hs));        // ServerHello → handshake_secret
E.e11=createEdge(posOf(es),  posOf(hs));        // early → handshake
E.e12=createEdge(posOf(hs),  posOf(ms));        // handshake → master
E.e13=createEdge(posOf(ms),  posOf(ts));        // master → traffic
E.e14=createEdge(posOf(sfin),posOf(sDone));     // Server Fin → Server Done
E.e15=createEdge(posOf(cDone),posOf(app));      // Client Done → App Data
E.e16=createEdge(posOf(sCl), posOf(cert));      // Server → Cert
E.e17=createEdge(posOf(cert),posOf(cv));        // Cert → CertVerify
E.e18=createEdge(posOf(cv),  posOf(cfin));      // CertVerify → Client Fin
E.e19=createEdge(posOf(cfin),posOf(sfin));      // Client Fin → Server Fin

// ═══════════════════════════════════════════════════════════════
//  FLOW PARTICLES — visible, animated orbs
// ═══════════════════════════════════════════════════════════════
var flows=[];
function FlowParticle(from,to,color,speed){
  this.from=from.clone(); this.to=to.clone(); this.t=Math.random();
  this.speed=speed||0.008; this.alive=true;
  var m=new THREE.Mesh(
    new THREE.SphereGeometry(0.08,8,8),
    new THREE.MeshBasicMaterial({color:color,transparent:true,opacity:0.85})
  );
  m.position.lerpVectors(this.from,this.to,this.t);
  scene.add(m); this.mesh=m;
  this.update=function(dt){
    this.t=(this.t+this.speed)%1;
    this.mesh.position.lerpVectors(this.from,this.to,this.t);
    this.mesh.material.opacity=0.3+Math.sin(this.t*Math.PI)*0.55;
  };
  this.remove=function(){scene.remove(this.mesh);this.alive=false;this.mesh.geometry.dispose();this.mesh.material.dispose();};
}

function spawnFlow(from,to,color,n,speed){
  var arr=[]; for(var i=0;i<n;i++){var f=new FlowParticle(from,to,color,speed||0.01);f.t=i/n;flows.push(f);arr.push(f);}
  return arr;
}

function clearFlows(){flows.forEach(function(f){f.remove();});flows=[];}

// ═══════════════════════════════════════════════════════════════
//  HIGHLIGHT SYSTEM — per-step node/edge glow
// ═══════════════════════════════════════════════════════════════
function hiNode(n,color,brightness){
  var g=n.children;
  for(var i=0;i<g.length;i++){
    if(g[i].name==='glowRing'){g[i].material.opacity=0.9;g[i].material.color.set(color||n._baseColor);}
    if(g[i].name==='halo'){g[i].material.opacity=brightness||0.5;g[i].material.color.set(color||n._baseColor);}
    if(g[i].isSprite){g[i].material.opacity=1;}
  }
  // Also brighten disc
  if(g[0]&&g[0].material&&g[0].material.emissiveIntensity!==undefined){g[0].material.emissiveIntensity=0.6;}
}
function loNode(n){
  var g=n.children;
  for(var i=0;i<g.length;i++){
    if(g[i].name==='glowRing'){g[i].material.opacity=0.15;g[i].material.color.set(n._baseColor);}
    if(g[i].name==='halo'){g[i].material.opacity=0;}
    if(g[i].isSprite){g[i].material.opacity=0.5;}
  }
  if(g[0]&&g[0].material&&g[0].material.emissiveIntensity!==undefined){g[0].material.emissiveIntensity=0.2;}
}
function hiEdge(e,color,opacity){e.material.color.set(color||0x0052CC);e.material.opacity=opacity||0.7;}
function loEdge(e){e.material.color.set(e._baseColor);e.material.opacity=0.12;}

function dimScene(allNodes){
  allNodes.forEach(function(n){if(n._baseColor)loNode(n);});
  Object.values(E).forEach(function(e){loEdge(e);});
  document.getElementById('formula-bar').style.display='none';
  document.getElementById('data-strip').innerHTML='';
}

// ═══════════════════════════════════════════════════════════════
//  CAMERA ANIMATION — move to focus area per step
// ═══════════════════════════════════════════════════════════════
var camTarget=new THREE.Vector3(0,0,0);
var camGoal=new THREE.Vector3(0,3,14);
var camLookGoal=new THREE.Vector3(0,0,0);
var cameraLerp=0.08;

function setCamera(pos,look){
  camGoal.copy(pos); camLookGoal.copy(look);
}

// ═══════════════════════════════════════════════════════════════
//  10 STEPS DATA
// ═══════════════════════════════════════════════════════════════
var STEPS=[
  {
    title:'ClientHello — Propose Hybrid Groups',
    desc:'Client sends ClientHello with supported_groups: [IANA #4590, IANA #4588] and key_share for ML-KEM-768 + P-256 ECDH.',
    formula:'supported_groups = [4590(SM2-MLKEM768), 4588(X25519MLKEM768)]',
    cam:{pos:[0,4,12],look:[0,1.5,0]},
    hiNodes:[cCl,ch], hiEdges:[E.e1],
    flows:[{from:posOf(cCl),to:posOf(ch),c:CLR.msg,n:8,spd:0.012}],
    data:[['TLS version','0x0304'],['supported_groups','[4590, 4588]'],['key_share','ML-KEM pk(1184B)+P-256(65B)'],['Cipher','TLS_AES_256_GCM_SHA384']]
  },{
    title:'ServerHello — Select Hybrid Group',
    desc:'Server selects IANA #4590 and responds with ServerHello containing SM2-ECDH share + ML-KEM-768 ciphertext.',
    formula:'key_share(server) = SM2_pub(65B) || MLKEM_ct(1088B) = 1153B',
    cam:{pos:[0,3.5,10],look:[0,3,0]},
    hiNodes:[ch, sCl, sh], hiEdges:[E.e2, E.e3],
    flows:[{from:posOf(ch),to:posOf(sCl),c:CLR.msg,n:6},{from:posOf(sCl),to:posOf(sh),c:CLR.server,n:6}],
    data:[['selected_group','IANA #4590'],['Server key_share','1153 bytes'],['Random','32B nonce'],['Session ID','32 bytes']]
  },{
    title:'Early Secret — HKDF-Extract(0, 0)',
    desc:'Both sides derive early_secret from PSK (zero here). Root of TLS 1.3 key schedule.',
    formula:'early_secret = HKDF-Extract(salt=0, IKM=0)',
    cam:{pos:[-2,4,10],look:[-1,2,1]},
    hiNodes:[ch, sh, es], hiEdges:[E.e9, E.e11],
    flows:[{from:posOf(ch),to:posOf(es),c:CLR.hkdf,n:5},{from:posOf(sh),to:posOf(es),c:CLR.hkdf,n:4}],
    data:[['PSK','None (0-length)'],['HKDF-Extract salt','0 (32 bytes)'],['HKDF-Extract IKM','0 (32 bytes)'],['early_secret','32 bytes']]
  },{
    title:'Derive Handshake Secret — Hybrid Key Exchange',
    desc:'Client ML-KEM decaps + P-256 ECDH → combined 64B shared secret → handshake_secret via HKDF.',
    formula:'shared_secret = ECDH_sec || MLKEM_ss; handshake_secret = HKDF-Extract(early_secret, shared_secret)',
    cam:{pos:[-3.5,1,8],look:[-2,0,0]},
    hiNodes:[cKEM, cDH, hb, hs], hiEdges:[E.e7, E.e8, E.e12],

// ═══════════════════════════════════════════════════════════════
//  ALL NODES for dimming
// ═══════════════════════════════════════════════════════════════
var ALL_N=[cCl,cKEM,cDH,cDone,sCl,sKEM,sDH,sDone,ch,sh,ee,cert,cv,sfin,cfin,app,es,hs,ms,ts,hb];

// ═══════════════════════════════════════════════════════════════
//  STEP ENGINE
// ═══════════════════════════════════════════════════════════════
var step=0;
var elBadge=document.getElementById('top-badge'),elStepN=document.getElementById('stepN');
var elTitle=document.getElementById('top-title'),elDesc=document.getElementById('top-desc');
var elFormula=document.getElementById('formula-bar'),elDS=document.getElementById('data-strip');
var elCounter=document.getElementById('step-counter'),elProg=document.getElementById('progress-bar');
var elPrev=document.getElementById('prevBtn');

function applyStep(i){
  step=i; dimScene(ALL_N); clearFlows();
  var s=STEPS[i];
  elStepN.textContent=i+1;
  elBadge.innerHTML='<span class="pulse"></span>Step '+(i+1)+' / 10';
  elTitle.textContent=s.title;
  elDesc.textContent=s.desc;

  // Camera
  setCamera(new THREE.Vector3(s.cam.pos[0],s.cam.pos[1],s.cam.pos[2]),
            new THREE.Vector3(s.cam.look[0],s.cam.look[1],s.cam.look[2]));

  // Highlights
  s.hiNodes.forEach(function(n){hiNode(n);});
  s.hiEdges.forEach(function(e){hiEdge(e);});

  // Flows
  s.flows.forEach(function(f){
    spawnFlow(f.from,f.to,f.c,f.n||6,f.spd||0.01);
  });

  // Formula
  if(s.formula){elFormula.style.display='block';elFormula.textContent=s.formula;}
  else elFormula.style.display='none';

  // Data strip
  elDS.innerHTML=s.data.map(function(d){return '<div class="dp"><span class="key">'+d[0]+':</span> <span class="val">'+d[1]+'</span></div>';}).join('');

  // Progress
  var dots='';
  for(var j=0;j<10;j++){dots+='<div class="pb-dot'+(j<i?' done':j===i?' active':'')+'"></div>';}
  elProg.innerHTML=dots;

  // Nav
  elCounter.textContent='Step '+(i+1)+' of 10';
  elPrev.style.opacity=i===0?'0.3':'';elPrev.style.pointerEvents=i===0?'none':'auto';
  document.getElementById('nextBtn').innerHTML=i===9?'↻ 重新开始':'下一步 ▶';
}

function nextStep(){applyStep((step+1)%10);}
function prevStep(){if(step>0)applyStep(step-1);}
document.addEventListener('keydown',function(e){
  if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();nextStep();}
  if(e.key==='ArrowLeft'){e.preventDefault();prevStep();}
});

// ═══════════════════════════════════════════════════════════════
//  ANIMATION LOOP
// ═══════════════════════════════════════════════════════════════
var clock=new THREE.Clock();
function animate(t){
  requestAnimationFrame(animate);
  var dt=Math.min(clock.getDelta(),0.1);

  // Smooth camera
  camera.position.lerp(camGoal,cameraLerp);
  camera.lookAt(camLookGoal);

  // Update flows
  for(var i=flows.length-1;i>=0;i--){
    if(!flows[i].alive){flows.splice(i,1);continue;}
    flows[i].update(dt);
  }

  // Rotate ambient particles slowly
  var ap=scene.getObjectByName('ambientPts');
  if(ap)ap.rotation.y+=dt*0.08;

  // Pulse highlighted nodes
  ALL_N.forEach(function(n){
    var h=n.getObjectByName('halo');
    if(h&&h.material.opacity>0.01){h.material.opacity-=dt*0.5;h.material.opacity=Math.max(h.material.opacity,0.01);}
  });

  renderer.render(scene,camera);
}

// ═══════════════════════════════════════════════════════════════
//  RESIZE
// ═══════════════════════════════════════════════════════════════
window.addEventListener('resize',function(){
  W=window.innerWidth;H=window.innerHeight;
  camera.aspect=W/H;camera.updateProjectionMatrix();
  renderer.setSize(W,H);
});

// ═══════════════════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════════════════
applyStep(0);
requestAnimationFrame(animate);
</script>
