<script>
// ============================================================
//  CONSTANTS — TLS 1.3 Hybrid Handshake real data
// ============================================================
var HYBRID_GROUP_4590 = 'IANA #4590 SM2-MLKEM768';
var HYBRID_GROUP_4588 = 'IANA #4588 X25519MLKEM768';
var SM2_SHARE_SIZE = 65;
var MLKEM_PK_SIZE  = 1184;
var MLKEM_CT_SIZE  = 1088;
var TOTAL_SHARE    = 1249;
var SHARED_SECRET  = 'a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2c3d4e5f6a7b8c9d0e1f2a3b4';
function hx(s){return s.slice(0,8)+'\u2026';}

// ============================================================
//  THREE.JS SETUP
// ============================================================
var canvas = document.getElementById('c');
var renderer = new THREE.WebGLRenderer({canvas:canvas, antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x0b0f19);
var scene = new THREE.Scene();
var camera = new THREE.PerspectiveCamera(55, window.innerWidth/window.innerHeight, 0.1, 100);
camera.position.set(0, 1.5, 16);
camera.lookAt(0, 0, 0);
var controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping=true; controls.dampingFactor=0.07;
controls.minDistance=6; controls.maxDistance=32;
controls.autoRotate=true; controls.autoRotateSpeed=0.3;
var sGroups = new THREE.Scene();
sGroups.fog = new THREE.FogExp2(0x0b0f19, 0.02);

// ============================================================
//  SPRITE CACHE
// ============================================================
var _spriteCache = new Map();

function makeSprite(text, color, x, y, z) {
  var key = text+'|'+color;
  if (_spriteCache.has(key)) {
    var sp = _spriteCache.get(key).clone();
    sp.position.set(x,y,z);
    return sp;
  }
  var cv = document.createElement('canvas');
  cv.width = 512; cv.height = 128;
  var cx = cv.getContext('2d');
  cx.clearRect(0,0,512,128);
  cx.font = 'bold 18px -apple-system,Segoe UI,sans-serif';
  cx.fillStyle = '#'+color.toString(16).padStart(6,'0');
  cx.textAlign = 'center'; cx.textBaseline = 'middle';
  cx.fillText(text, 256, 64);
  var tex = new THREE.CanvasTexture(cv);
  var sp = new THREE.Sprite(new THREE.SpriteMaterial({map:tex, transparent:true, depthTest:false}));
  sp.scale.set(3.5, 0.875, 1);
  sp.position.set(x,y,z);
  _spriteCache.set(key, sp);
  return sp;
}

// ============================================================
//  NODE FACTORY
// ============================================================
function mmn(pos, color, label) {
  var m = new THREE.Group();
  var ring = new THREE.Mesh(
    new THREE.RingGeometry(0.52, 0.65, 48),
    new THREE.MeshBasicMaterial({color:color, side:THREE.DoubleSide, transparent:true, opacity:0.5, depthTest:false})
  );
  ring.rotation.x = -Math.PI/2;
  ring.position.copy(pos);
  m.add(ring);
  var halo = new THREE.Mesh(
    new THREE.SphereGeometry(0.7, 16, 16),
    new THREE.MeshBasicMaterial({color:color, transparent:true, opacity:0.07, depthWrite:false})
  );
  halo.position.copy(pos);
  m.add(halo);
  var sp = makeSprite(label, color, pos.x, pos.y+0.95, pos.z);
  m.add(sp);
  m._ring = ring; m._halo = halo;
  m._origColor = color; m._pos = pos.clone();
  return m;
}

// ============================================================
//  EDGE FACTORY
// ============================================================
function makeEdge(a, b) {
  var positions = new Float32Array([a.x,a.y,a.z, b.x,b.y,b.z]);
  var geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  var mat = new THREE.LineBasicMaterial({color:0x2a3a5a, transparent:true, opacity:0.5});
  var line = new THREE.Line(geo, mat);
  scene.add(line);
  return line;
}

// ============================================================
//  FLOW PARTICLES
// ============================================================
function FP(a, b, col, spd) {
  this.a = a.clone(); this.b = b.clone(); this.t = 0;
  this.spd = spd; this.alive = true;
  this.mesh = new THREE.Mesh(
    new THREE.SphereGeometry(0.08, 8, 8),
    new THREE.MeshBasicMaterial({color:col, transparent:true})
  );
  sGroups.add(this.mesh);
  this.update();
}
FP.prototype.update = function(dt) {
  this.t = (this.t + this.spd) % 1;
  this.mesh.position.lerpVectors(this.a, this.b, this.t);
  this.mesh.material.opacity = Math.sin(this.t * Math.PI) * 0.9;
};
FP.prototype.remove = function(){ sGroups.remove(this.mesh); this.alive=false; };

var FPARTS = [];
function spawn(a, b, col, n, spd) {
  for (var i=0; i<n; i++) {
    var p = new FP(a, b, col, spd||0.012);
    p.t = i/n;
    FPARTS.push(p);
  }
}

// ============================================================
//  NODES — 3-column layout: Client | Handshake Flow | Server
// ============================================================
// Client side
var clientNode    = mmn(new THREE.Vector3(-6,  3.2, 0), 0x00c896, 'Client');
var clientKEMNode = mmn(new THREE.Vector3(-6,  1.2, 0), 0x00b4d8, 'KeyGen (ML-KEM)');
var clientDHNode  = mmn(new THREE.Vector3(-6, -1.0, 0), 0x0052CC, 'KeyGen (P-256)');
var clientDoneNode = mmn(new THREE.Vector3(-6, -3.5, 0), 0x5ecf8a, 'Finished');

// Server side
var serverNode    = mmn(new THREE.Vector3(6,  3.2, 0), 0xff7043, 'Server');
var serverKEMNode = mmn(new THREE.Vector3(6,  1.2, 0), 0x00b4d8, 'Encaps (ML-KEM)');
var serverDHNode  = mmn(new THREE.Vector3(6, -1.0, 0), 0x0052CC, 'KeyGen (P-256)');
var serverDoneNode = mmn(new THREE.Vector3(6, -3.5, 0), 0x5ecf8a, 'Finished');

// Handshake message nodes (center, arranged vertically)
var chNode       = mmn(new THREE.Vector3(0, 5, 0), 0xff9800, 'ClientHello');
var shNode       = mmn(new THREE.Vector3(0, 3.8, 0), 0xff9800, 'ServerHello');
var eeNode       = mmn(new THREE.Vector3(0, 2.6, 0), 0xff9800, 'EncryptedExt');
var certNode     = mmn(new THREE.Vector3(0, 1.4, 0), 0xff9800, 'Certificate');
var cvNode       = mmn(new THREE.Vector3(0, 0.2, 0), 0xff9800, 'CertVerify');
var finNode      = mmn(new THREE.Vector3(0, -1.3, 0), 0xff9800, 'Finished');
var appNode       = mmn(new THREE.Vector3(0, -3.0, 0), 0x5ecf8a, 'Application Data');

// Derived secrets
var earlySecretNode = mmn(new THREE.Vector3(-3, 4.2, 0), 0x9c27b0, 'early_secret');
var hsSecretNode    = mmn(new THREE.Vector3(-3, 1.6, 0), 0x9c27b0, 'handshake_secret');
var masterSecretNode= mmn(new THREE.Vector3(-3,-2.2, 0), 0x9c27b0, 'master_secret');
var appSecretNode   = mmn(new THREE.Vector3(3, -2.2, 0), 0x9c27b0, 'traffic_secret');

// Combined key share node
var hybridShareNode  = mmn(new THREE.Vector3(-3, -0.5, 0), 0x0052CC, 'Hybrid Share');

var ALL_NODES = [clientNode,clientKEMNode,clientDHNode,clientDoneNode,
  serverNode,serverKEMNode,serverDHNode,serverDoneNode,
  chNode,shNode,eeNode,certNode,cvNode,finNode,appNode,
  earlySecretNode,hsSecretNode,masterSecretNode,appSecretNode,hybridShareNode];
ALL_NODES.forEach(function(n){sGroups.add(n);});

// ============================================================
//  EDGES
// ============================================================
var edges = {};
var allEdges = null;

function initEdges() {
  if (allEdges) return;
  edges.e1  = makeEdge(clientNode._pos,   chNode._pos);
  edges.e2  = makeEdge(chNode._pos,       serverNode._pos);
  edges.e3  = makeEdge(serverNode._pos,   shNode._pos);
  edges.e4  = makeEdge(shNode._pos,       clientNode._pos);
  edges.e5  = makeEdge(serverNode._pos,   eeNode._pos);
  edges.e6  = makeEdge(eeNode._pos,       clientNode._pos);
  edges.e7  = makeEdge(clientKEMNode._pos,hybridShareNode._pos);
  edges.e8  = makeEdge(clientDHNode._pos, hybridShareNode._pos);
  edges.e9  = makeEdge(chNode._pos,     earlySecretNode._pos);
  edges.e10 = makeEdge(shNode._pos,       hsSecretNode._pos);
  edges.e11 = makeEdge(hsSecretNode._pos, masterSecretNode._pos);
  edges.e12 = makeEdge(clientNode._pos,   finNode._pos);
  edges.e13 = makeEdge(finNode._pos,      serverNode._pos);
  edges.e14 = makeEdge(serverDoneNode._pos,appNode._pos);
  edges.e15 = makeEdge(masterSecretNode._pos,appSecretNode._pos);
  allEdges = [edges.e1,edges.e2,edges.e3,edges.e4,edges.e5,edges.e6,
    edges.e7,edges.e8,edges.e9,edges.e10,edges.e11,edges.e12,edges.e13,
    edges.e14,edges.e15];
}
initEdges();

// ============================================================
//  HIGHLIGHT HELPERS
// ============================================================
function hiNode(n, color, intensity) {
  if (!n._ring) return;
  var c=color||n._origColor, i=intensity!==undefined?intensity:0.9;
  n._ring.material.color.set(c); n._ring.material.opacity=i;
  if(n._halo){n._halo.material.color.set(c);n._halo.material.opacity=i*0.15;}
}
function loNode(n) {
  if(!n._ring)return;
  n._ring.material.opacity=0.12; n._ring.material.color.set(n._origColor);
  if(n._halo)n._halo.material.opacity=0.03;
}
function hiEdge(e, color, opacity) {
  if(!e)return;
  e.material.color.set(color||0x0052CC);
  e.material.opacity=opacity!==undefined?opacity:0.85;
}
function loEdge(e){if(!e)return;e.material.opacity=0.1;e.material.color.set(0x2a3a5a);}

function resetAll(){FPARTS.forEach(function(p){p.remove();});FPARTS=[];}
function dimAll(){
  ALL_NODES.forEach(function(n){loNode(n);});
  if(allEdges)allEdges.forEach(function(e){loEdge(e);});
  document.getElementById('fw').style.display='none';
  document.getElementById('dp').innerHTML='';
}

function applyHL(nh,eh,fp) {
  if(nh)(nh||[]).forEach(function(n){hiNode(window[n]);});
  if(eh)(eh||[]).forEach(function(e){hiEdge(edges[e]||window[e]);});
  if(fp)(fp||[]).forEach(function(f){
    var a=typeof f.from==='string'?window[f.from]._pos:f.from;
    var b=typeof f.to==='string'?window[f.to]._pos:f.to;
    spawn(a,b,f.c,f.n||5,f.spd||0.012);
  });
}

// ============================================================
//  STEPS DATA — 10-step TLS 1.3 hybrid handshake
// ============================================================
var STEPS = [

    fp:[{from:'hsSecretNode',to:'masterSecretNode',c:0x9c27b0,n:6}],
    data:[
      {l:'Input',v:'handshake_secret (32B)'},

    badge:'Step 9 / 10',
    title:'Client Finished — Mutual Authentication',
    desc:'Client sends its Finished message. Both sides now derive application traffic secrets and can exchange encrypted application data.',
    formula:'client_traffic_secret = HKDF-Expand-Label(master_secret, "c ap traffic", handshake_hash, 32)',
    nh:['clientNode','finNode','appSecretNode'],
    eh:['e12','e15'],

        {from:'masterSecretNode',to:'appSecretNode',c:0x9c27b0,n:4}],

  {
    badge:'Step 10 / 10',
    title:'Application Data — Post-Quantum Secure Channel',
    desc:'TLS 1.3 hybrid handshake complete. All application data is encrypted with AES-256-GCM using keys derived from the post-quantum hybrid key exchange. Forward secrecy maintained even against quantum attackers.',
    formula:'AES-256-GCM(data, traffic_key, iv, AAD) — PQ hybrid channel established via IANA #4590',
    nh:['clientDoneNode','serverDoneNode','appNode','appSecretNode'],
    eh:['e14'],
    fp:[{from:'clientDoneNode',to:'serverDoneNode',c:0x5ecf8a,n:8,spd:0.018}],
    data:[
      {l:'Encryption',v:'AES-256-GCM'},
      {l:'Key source',v:'ML-KEM-768 + P-256 ECDH'},
      {l:'Forward secrecy',v:'Yes (hybrid FS)'},
      {l:'Quantum-safe',v:'Harvest-now-decrypt-later resistant'}
    ]
  }
];

// ============================================================
//  APPLY STEP
// ============================================================
var curStep = -1;
var elBadge=document.getElementById('badge'), elTitle=document.getElementById('title');
var elSub=document.getElementById('subtitle'), elCount=document.getElementById('counter');
var elProg=document.getElementById('progress'), elFW=document.getElementById('fw');
var elFormula=document.getElementById('formula'), elDP=document.getElementById('dp');
var elPrev=document.getElementById('prevBtn'), elNext=document.getElementById('nextBtn');

function applyStep(idx) {
  dimAll(); resetAll(); curStep=idx;
  var st=STEPS[idx];
  applyHL(st.nh, st.eh, st.fp);

  elBadge.textContent=st.badge; elTitle.textContent=st.title;
  elSub.textContent=st.desc; elCount.textContent=st.badge;

  var dots=[];
  for(var i=0;i<STEPS.length;i++) dots.push('<div class="pg'+(i<idx?' done':i===idx?' active':'')+'"></div>');
  elProg.innerHTML=dots.join('');

  if(st.formula){elFW.style.display='block';elFormula.textContent=st.formula;}
  else elFW.style.display='none';

  var items=[];
  (st.data||[]).forEach(function(d){items.push('<div class="dp"><span>'+d.l+':</span> '+d.v+'</div>');});
  elDP.innerHTML=items.join('');

  elPrev.style.opacity=idx===0?'0.25':'';
  elNext.textContent=idx===STEPS.length-1?'Restart \u21bb':'Next \u2192';
}

function nextStep(){applyStep((curStep+1)%STEPS.length);}
function prevStep(){if(curStep>0)applyStep(curStep-1);}
document.addEventListener('keydown',function(e){
  if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();nextStep();}
  if(e.key==='ArrowLeft'){e.preventDefault();prevStep();}
});

function animate(){
  requestAnimationFrame(animate); controls.update();
  FPARTS=FPARTS.filter(function(p){return p.alive;});
  FPARTS.forEach(function(p){p.update(0.016);});
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize',function(){
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

applyStep(0);
</script>
</body>
</html>
