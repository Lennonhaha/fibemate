            background: linear-gradient(135deg, rgba(0, 229, 195, 0.05) 0%, rgba(124, 77, 255, 0.05) 100%);
            border-bottom: 1px solid var(--border);
            padding: 60px 0 40px;
            position: relative;
            overflow: hidden;
        }

        /* 3D Background Effects */
        .hero-3d-background {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            overflow: hidden;
            perspective: 1000px;
        }

        .grid-floor {
            position: absolute;
            bottom: -50%;
            left: -50%;
            right: -50%;
            height: 100%;
            background: 
                linear-gradient(90deg, rgba(0, 229, 195, 0.03) 1px, transparent 1px),
                linear-gradient(rgba(0, 229, 195, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            transform: rotateX(60deg);
            transform-origin: center bottom;
            animation: grid-move 20s linear infinite;
        }

        @keyframes grid-move {
            0% { transform: rotateX(60deg) translateY(0); }
            100% { transform: rotateX(60deg) translateY(50px); }
        }

        .floating-shapes {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
        }

        .shape {
            position: absolute;
            border: 1px solid rgba(0, 229, 195, 0.2);
            background: rgba(0, 229, 195, 0.05);
            backdrop-filter: blur(10px);
        }

        .shape-1 {
            width: 80px;
            height: 80px;
            top: 20%;
            left: 10%;
            transform: rotate(45deg);
            animation: float-1 6s ease-in-out infinite;
        }

        .shape-2 {
            width: 120px;
            height: 120px;
            top: 60%;
            right: 15%;
            border-radius: 50%;
            animation: float-2 8s ease-in-out infinite;
        }

        .shape-3 {
            width: 60px;
            height: 60px;
            bottom: 30%;
            left: 20%;
            transform: rotate(30deg);
            animation: float-3 7s ease-in-out infinite;
        }

        @keyframes float-1 {
            0%, 100% { transform: translateY(0) rotate(45deg); }
            50% { transform: translateY(-20px) rotate(50deg); }
        }

        @keyframes float-2 {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-30px) scale(1.1); }
        }

        @keyframes float-3 {
            0%, 100% { transform: translateY(0) rotate(30deg); }
            50% { transform: translateY(-15px) rotate(35deg); }
        }

        .glow-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.3;
        }

        .glow-orb.orb-1 {
            width: 300px;
            height: 300px;
            background: var(--gradient-1);
            top: -100px;
            right: -100px;
        }

        .glow-orb.orb-2 {
            width: 250px;
            height: 250px;
            background: var(--gradient-2);
            bottom: -50px;
            left: -50px;
        }
