        for (var i = 0; i < N; i++) {

            ringPts.push(new THREE.Vector2(Math.cos(a)*r, Math.sin(a)*r));

    for (var i2 = 0; i2 < N; i2++) {
        var a2 = (i2/N)*Math.PI*2 - Math.PI/2;
        var ex = Math.cos(a2)*4.7, ez = Math.sin(a2)*4.7;
        var axGeo = new THREE.BufferGeometry();
        axGeo.setFromPoints([new THREE.Vector3(0,-0.4,0), new THREE.Vector3(ex,-0.4,ez)]);
        scene.add(new THREE.Line(axGeo, new THREE.LineBasicMaterial({color:0x1a1a3e,opacity:0.5,transparent:true})));
    }

    // ── Dimension labels ──
    for (var i3 = 0; i3 < N; i3++) {
        var a3 = (i3/N)*Math.PI*2 - Math.PI/2;
        var lr = 5.1;
        var s = makeTextSprite(dimensions[i3].name, '#00d4ff', 28);
        s.position.set(Math.cos(a3)*lr, 0.1, Math.sin(a3)*lr);
        s.scale.set(1.7,0.85,1); scene.add(s);
    }

    // ── Fill ──
    var fillGroup = new THREE.Group(); scene.add(fillGroup);
    function buildFill(scores) {
        while (fillGroup.children.length) fillGroup.remove(fillGroup.children[0]);
        var pts = [];
        for (var i = 0; i < N; i++) {
            var a = (i/N)*Math.PI*2 - Math.PI/2;
            var r = (scores[i]/maxScore)*4.5;
            pts.push(new THREE.Vector2(Math.cos(a)*r, Math.sin(a)*r));
        }
        var shape = new THREE.Shape(pts);
        var g = new THREE.ShapeGeometry(shape);
        var m = new THREE.MeshBasicMaterial({color:0x00d4ff,side:2,transparent:true,opacity:0.28,depthWrite:false});
        var mesh = new THREE.Mesh(g,m); mesh.rotation.x = -Math.PI/2; mesh.position.y = -0.35;
        fillGroup.add(mesh);
        pts.push(pts[0].clone());
        var geo = new THREE.BufferGeometry();
        geo.setFromPoints(pts.map(function(v){ return new THREE.Vector3(v.x,-0.35,v.y); }));
        fillGroup.add(new THREE.Line(geo, new THREE.LineBasicMaterial({color:0x00d4ff,opacity:0.9,transparent:true})));
    }
    buildFill(dimensions.map(function(d){return d.score;}));

    // ── Improved (dashed) ──
    var improvedGroup = new THREE.Group(); improvedGroup.visible = false; scene.add(improvedGroup);
    function buildImproved() {
        while (improvedGroup.children.length) improvedGroup.remove(improvedGroup.children[0]);
        var pts = [];
        for (var i = 0; i < N; i++) {
            var a = (i/N)*Math.PI*2 - Math.PI/2;
            pts.push(new THREE.Vector3(Math.cos(a)*(improved[i]/maxScore)*4.5, -0.34, Math.sin(a)*(improved[i]/maxScore)*4.5));
        }
        pts.push(pts[0].clone());
        var DL=0.3,GL=0.25;
        for (var s=0; s<N; s++) {
            var st=pts[s],en=pts[s+1];
            var dx=en.x-st.x,dz=en.z-st.z;
            var seg=Math.sqrt(dx*dx+dz*dz);
            var nx=dx/seg,nz=dz/seg,drawn=0;
            while (drawn < seg) {
                var d0=drawn,d1=Math.min(drawn+DL,seg);
                var sg=new THREE.BufferGeometry();
                sg.setFromPoints([new THREE.Vector3(st.x+nx*d0,-0.34,st.z+nz*d0), new THREE.Vector3(st.x+nx*d1,-0.34,st.z+nz*d1)]);
                improvedGroup.add(new THREE.Line(sg,new THREE.LineBasicMaterial({color:0xffc107,opacity:0.7,transparent:true})));
                drawn=d1+GL;
            }
        }
        for (var i2=0;i2<N;i2++) {
            var a2=(i2/N)*Math.PI*2-Math.PI/2;
            var r2=(improved[i2]/maxScore)*4.5;
            var dot=new THREE.Mesh(new THREE.SphereGeometry(0.08,12,12),new THREE.MeshBasicMaterial({color:0xffc107}));
            dot.position.set(Math.cos(a2)*r2,-0.33,Math.sin(a2)*r2);
            improvedGroup.add(dot);
        }
    }
    buildImproved();

    // ── Node spheres (clickable) ──
    var nodeSpheres = [];
    for (var i4 = 0; i4 < N; i4++) {
        var a4 = (i4/N)*Math.PI*2 - Math.PI/2;
        var r4 = (dimensions[i4].score/maxScore)*4.5;
        var sGeo = new THREE.SphereGeometry(0.12, 24, 24);
        var colorHex = parseInt(DIM_COLORS[i4].replace('#',''), 16);
        var sMat = new THREE.MeshStandardMaterial({
            color: colorHex, emissive: colorHex, emissiveIntensity: 0.35,
            roughness: 0.25, metalness: 0.3
        });
        var sphere = new THREE.Mesh(sGeo, sMat);
        sphere.position.set(Math.cos(a4)*r4, -0.33, Math.sin(a4)*r4);
        sphere.name = 'node-'+i4;
        sphere.userData = { dimIndex: i4 };
        scene.add(sphere);
        nodeSpheres.push(sphere);
    }

    // ── Center ──
    var cs = new THREE.Mesh(new THREE.SphereGeometry(0.18,24,24),
        new THREE.MeshStandardMaterial({color:0xff9800,emissive:0x441100,roughness:0.2,metalness:0.4}));
    cs.position.y = -0.34; scene.add(cs);
    var halo = new THREE.Mesh(new THREE.TorusGeometry(0.28,0.03,16,48),
        new THREE.MeshBasicMaterial({color:0xffc107,opacity:0.5,transparent:true}));
    halo.rotation.x = Math.PI/2; halo.position.y = -0.33; scene.add(halo);

    // ── Particles ──
    var pGeo = new THREE.BufferGeometry();
    var pPos = new Float32Array(200*3);
    for (var p=0;p<200;p++) {
        var rad=1.5+Math.random()*5,th=Math.random()*Math.PI*2;
        pPos[p*3]=Math.cos(th)*rad;pPos[p*3+1]=(Math.random()-0.5)*2;pPos[p*3+2]=Math.sin(th)*rad;
    }
    pGeo.setAttribute('position',new THREE.BufferAttribute(pPos,3));
    var part = new THREE.Points(pGeo,new THREE.PointsMaterial({color:0x334466,size:0.02,opacity:0.5,transparent:true}));
    scene.add(part);

    // ── Text sprite ──
    function makeTextSprite(text, color, size) {
        var c=document.createElement('canvas');c.width=256;c.height=128;
        var ctx=c.getContext('2d');
        ctx.font='bold '+size+'px -apple-system,"Noto Sans SC",sans-serif';
        ctx.fillStyle=color;ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.fillText(text,128,64);
        var tex=new THREE.CanvasTexture(c);tex.minFilter=THREE.LinearFilter;
        return new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true}));
    }

    // ═══════════ Raycaster ═══════════
    var raycaster = new THREE.Raycaster();
    raycaster.params.Points.threshold = 0.3;
    var mouse = new THREE.Vector2();
    var tooltip = document.getElementById('tooltip');
    var hoveredNode = -1;

    function onMouseMove(e) {
        mouse.x = (e.clientX/container.clientWidth)*2-1;
        mouse.y = -(e.clientY/container.clientHeight)*2+1;
        raycaster.setFromCamera(mouse, camera);
        var hits = raycaster.intersectObjects(nodeSpheres);
        if (hits.length > 0) {
            var idx = hits[0].object.userData.dimIndex;
            hoveredNode = idx;
            var dim = dimensions[idx];
            tooltip.querySelector('.tt-name').textContent = dim.cn;
            tooltip.querySelector('.tt-score').textContent = dim.score+' / 100';
            tooltip.style.color = DIM_COLORS[idx];
            tooltip.style.display = 'block';
            tooltip.style.left = (e.clientX+20)+'px';
            tooltip.style.top = (e.clientY-40)+'px';
            document.body.style.cursor = 'pointer';
        } else {
            hoveredNode = -1;
            tooltip.style.display = 'none';
            document.body.style.cursor = 'default';
        }
    }

    function onClick(e) {
        // Ignore clicks on the evidence panel or left panel
        if (e.target.closest('#evidence-panel') || e.target.closest('#panel') || e.target.closest('button')) return;

        raycaster.setFromCamera(mouse, camera);
        var hits = raycaster.intersectObjects(nodeSpheres);
        if (hits.length > 0) {
            var idx = hits[0].object.userData.dimIndex;
            openEvidence(idx);
        }
    }

    // ═══════════ Evidence panel logic ═══════════
    var evPanel = document.getElementById('evidence-panel');

    function openEvidence(idx) {
        activeDim = idx;
        var dim = dimensions[idx];

        document.getElementById('ev-dim-name').textContent = dim.cn + ' (' + dim.name + ')';
        document.getElementById('ev-dim-score').textContent = '得分 ' + dim.score + '/100 · 改进后 → ' + improved[idx];
        document.getElementById('ev-summary').textContent = dim.note;

        var list = document.getElementById('ev-list');
        list.innerHTML = dim.evidence.map(function(ev, ei) {
            var tagsHtml = (ev.tags||[]).map(function(t) {
                var cls = t==='risk'?'risk':(t==='good'?'good':'info');
                var label = t==='risk'?'⚠ 问题':(t==='good'?'✅ 优势':'ℹ 说明');
                return '<span class="ev-tag '+cls+'">'+label+'</span>';
            }).join('');
            // Simple syntax highlighting
            var code = ev.code
                .replace(/\/\/.*/g, '<span class="cm">$&</span>')
                .replace(/\b(const|let|var|function|module|export|class|async|await|return|if|else|for|while|switch|case|break|default)\b/g, '<span class="kw">$1</span>')
                .replace(/=>(?=\s)/g, '<span class="fn">=&gt;</span>')
                .replace(/\b\d+(\.\d+)?\b/g, '<span class="num">$&</span>')
                .replace(/(['\"`])(?:(?!\1).)*?\1/g, '<span class="str">$&</span>')
                .replace(/\*(\s*\S.*?)\*/g, '<span class="hl">*$1*</span>')
                .replace(/───.*/g, '<span class="hl">$&</span>')
                .replace(/\b(Bus Factor|第三方|审计|Q4|P0|TODO|TLA\+|TLC|violations|states)\b/g, '<span class="hl">$1</span>');

            return '<div class="ev-item">' +
                '<div class="ev-file">' +
                    '<span class="ev-file-icon">📄</span>' +
                    '<span class="ev-file-path">' + ev.file + '</span>' +
                    '<span class="ev-file-lines">' + ev.lines + '</span>' +
                '</div>' +
                '<div class="ev-finding">' + ev.finding + '</div>' +
                (tagsHtml ? '<div style="margin-bottom:6px">'+tagsHtml+'</div>' : '') +
                '<div class="ev-code">' + code + '</div>' +
            '</div>';
        }).join('');

        evPanel.classList.add('open');

        // Highlight left panel row
        var rows = document.querySelectorAll('.dim-row');
        rows.forEach(function(r) { r.classList.remove('active'); });
        var targetRow = document.querySelector('.dim-row[data-idx="'+idx+'"]');
        if (targetRow) targetRow.classList.add('active');

        // Highlight node sphere
        nodeSpheres.forEach(function(ns, i) {
            ns.material.emissiveIntensity = (i===idx) ? 1.2 : 0.35;
            ns.scale.setScalar(i===idx ? 1.6 : 1.0);
        });
    }

    function closeEvidence() {
        activeDim = -1;
        evPanel.classList.remove('open');
        document.querySelectorAll('.dim-row').forEach(function(r){ r.classList.remove('active'); });
        nodeSpheres.forEach(function(ns) {
            ns.material.emissiveIntensity = 0.35;
            ns.scale.setScalar(1.0);
        });
    }

    window.closeEvidence = closeEvidence;
    window.togglePanel = function() {
        var p = document.getElementById('panel');
        p.classList.toggle('collapsed');
        var btn = document.getElementById('panel-toggle');
        btn.textContent = p.classList.contains('collapsed') ? '▶' : '☰';
    };

    window.addEventListener('mousemove', onMouseMove, { passive:true });
    window.addEventListener('click', onClick);
    window.addEventListener('resize', function() {
        camera.aspect = container.clientWidth/container.clientHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(container.clientWidth, container.clientHeight);
    });

    // ═══════════ Left panel dim list ═══════════
    var dimList = document.getElementById('dim-list');
    dimensions.forEach(function(dim, i) {
        var row = document.createElement('div');
        row.className = 'dim-row';
        row.setAttribute('data-idx', i);
        row.innerHTML =
            '<div class="dot" style="background:'+DIM_COLORS[i]+';box-shadow:0 0 6px '+DIM_COLORS[i]+';"></div>' +
            '<span class="dim-name">'+dim.cn+'</span>' +
            '<span class="dim-score" style="color:'+DIM_COLORS[i]+';">'+dim.score+'</span>' +
            '<span class="dim-arrow">▸</span>';
        row.onclick = function(e) {
            e.stopPropagation();
            if (activeDim === i) closeEvidence();
            else openEvidence(i);
        };
        dimList.appendChild(row);
    });

    // ═══════════ Improved toggle ═══════════
    window.toggleImprovement = function() {
        showImproved = !showImproved;
        var btn = document.getElementById('improve-toggle');
        if (showImproved) {
            btn.textContent = '隐藏改进路线';
            btn.classList.add('active');
        } else {
            btn.textContent = '显示改进路线';
            btn.classList.remove('active');
        }
    };

    // ═══════════ Animate ═══════════
    var clock = new THREE.Clock();
    function animate() {
        requestAnimationFrame(animate);
        var dt = Math.min(clock.getDelta(), 0.1);
        controls.update();
        improvedGroup.visible = showImproved;
        part.rotation.y += dt*0.05;
        var pulse = 1 + Math.sin(Date.now()*0.002)*0.1;
        halo.scale.setScalar(pulse);
        nodeSpheres.forEach(function(ns,i) {
            if (activeDim !== i) {
                ns.position.y = -0.33 + Math.sin(Date.now()*0.003+i*1.2)*0.03;
            }
        });
        renderer.render(scene, camera);
    }

    animate();
})();
</script>
</body>
</html>
