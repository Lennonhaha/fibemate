<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PQC 部署验证器 · FIBEMATE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
/* ═════════════════════════════════════════════════════════════════════
   Quantum Terminal — PQC Deployment Checker
   Aesthetic: Security-grade diagnostics. Dark void, neon precision.
   FIBEMATE © 2026 — Model 2: Deployment Verification Framework
   ═════════════════════════════════════════════════════════════════════ */

:root {
  --void: #0a0a0f;
  --void-deep: #05050a;
  --panel: #0f0f1a;
  --panel-raised: #141425;
  --border: #1a1a2e;
  --border-active: #2a2a4a;
  
  --neon-green: #00ff88;
  --neon-cyan: #00e5ff;
  --neon-amber: #ffb347;
  --neon-red: #ff4757;
  --neon-blue: #3498ff;
  
  --text-primary: #e0e0e8;
  --text-secondary: #8088a0;
  --text-muted: #4a4a60;
  
  --grade-a: #00ff88;
  --grade-b: #ffb347;
  --grade-c: #ffa502;
  --grade-d: #ff6348;
  --grade-f: #ff4757;
  
  --font-mono: 'JetBrains Mono', 'Cascadia Code', 'Fira Code', monospace;
  --font-display: 'Share Tech Mono', monospace;
  
  --radius-sm: 3px;
  --radius: 6px;
  --radius-lg: 10px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--void);
  color: var(--text-primary);
  font-family: var(--font-mono);
  font-size: 13px;
  line-height: 1.6;
  min-height: 100vh;
  overflow-x: hidden;
}

/* Scanline overlay */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 2px,
    rgba(0,0,0,0.03) 2px,
    rgba(0,0,0,0.03) 4px
  );
  pointer-events: none;
  z-index: 9999;
}

/* Noise texture */
body::after {
  content: '';
  position: fixed;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.02'/%3E%3C/svg%3E");
  pointer-events: none;
  z-index: 9998;
}

/* ─── Layout ──────── */
.app {
  max-width: 1100px;
  margin: 0 auto;
  padding: 32px 24px 64px;
  position: relative;
  z-index: 1;
}

/* ─── Header ──────── */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-bottom: 24px;
  margin-bottom: 28px;
  border-bottom: 1px solid var(--border);
}

.header-brand {
  display: flex;
  align-items: center;
  gap: 14px;
}

.header-logo {
  width: 36px;
  height: 36px;
  border: 2px solid var(--neon-cyan);
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  color: var(--neon-cyan);
  position: relative;
}
.header-logo::after {
  content: '';
  position: absolute;
  inset: -4px;
  border: 1px solid var(--neon-cyan);
  opacity: 0.3;
  border-radius: 5px;
}

.header-titles h1 {
  font-family: var(--font-display);
  font-size: 20px;
  font-weight: 400;
  color: var(--text-primary);
  letter-spacing: 1.5px;
  text-transform: uppercase;
}
.header-titles span {
  font-size: 11px;
  color: var(--text-secondary);
  letter-spacing: 2px;
  text-transform: uppercase;
}

.header-badge {
  font-size: 10px;
  color: var(--neon-cyan);
  border: 1px solid rgba(0,229,255,0.3);
  padding: 4px 10px;
  border-radius: var(--radius-sm);
  letter-spacing: 1.5px;
  text-transform: uppercase;
  animation: badgePulse 3s ease-in-out infinite;
}
@keyframes badgePulse {
  0%, 100% { border-color: rgba(0,229,255,0.3); }
  50% { border-color: rgba(0,229,255,0.6); }
}

/* ─── Input Bar ──────── */
.input-bar {
  display: flex;
  gap: 10px;
  margin-bottom: 32px;
  position: relative;
}

.input-bar input {
  flex: 1;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 18px;
  color: var(--text-primary);
  font-family: var(--font-mono);
  font-size: 14px;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.input-bar input:focus {
  border-color: var(--neon-cyan);
  box-shadow: 0 0 0 3px rgba(0,229,255,0.08);
}
.input-bar input::placeholder {
  color: var(--text-muted);
}

.btn-probe {
  background: transparent;
  border: 1px solid var(--neon-cyan);
  color: var(--neon-cyan);
  font-family: var(--font-mono);
  font-size: 13px;
  font-weight: 500;
  padding: 14px 28px;
  border-radius: var(--radius);
  cursor: pointer;
  letter-spacing: 1px;
  text-transform: uppercase;
  transition: all 0.2s;
  white-space: nowrap;
  position: relative;
  overflow: hidden;
}
.btn-probe::before {
  content: '';
  position: absolute;
  inset: 0;
  background: var(--neon-cyan);
  opacity: 0;
  transition: opacity 0.2s;
}
.btn-probe:hover::before { opacity: 0.08; }
.btn-probe:hover {
  box-shadow: 0 0 20px rgba(0,229,255,0.15);
  border-color: var(--neon-cyan);
}
.btn-probe:active { transform: scale(0.98); }
.btn-probe.loading {
  border-color: var(--text-muted);
  color: var(--text-muted);
  cursor: wait;
}

/* ─── Result Card ──────── */
.result-card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  overflow: hidden;
  margin-bottom: 24px;
  opacity: 0;
  transform: translateY(12px);
  animation: cardIn 0.4s ease-out forwards;
}
@keyframes cardIn {
  to { opacity: 1; transform: translateY(0); }
}

.result-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 22px;
  border-bottom: 1px solid var(--border);
  background: var(--panel-raised);
}

.result-endpoint {
  font-size: 15px;
  font-weight: 500;
  color: var(--text-primary);
  display: flex;
  align-items: center;
  gap: 10px;
}
.result-endpoint .dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--neon-green);
  box-shadow: 0 0 8px var(--neon-green);
}
.result-endpoint .dot.fail {
  background: var(--neon-red);
  box-shadow: 0 0 8px var(--neon-red);
}

/* Grade badge */
.grade-badge {
  font-family: var(--font-display);
  font-size: 28px;
  font-weight: 700;
  min-width: 56px;
  height: 56px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: var(--radius);
  border: 2px solid;
  letter-spacing: 2px;
}
.grade-badge.A { color: var(--grade-a); border-color: var(--grade-a); box-shadow: 0 0 16px rgba(0,255,136,0.15); }
.grade-badge.B { color: var(--grade-b); border-color: var(--grade-b); box-shadow: 0 0 16px rgba(255,179,71,0.15); }
.grade-badge.C { color: var(--grade-c); border-color: var(--grade-c); }
.grade-badge.D { color: var(--grade-d); border-color: var(--grade-d); }
.grade-badge.F { color: var(--grade-f); border-color: var(--grade-f); }

/* ─── Metric Grid ──────── */
.metrics {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 0;
  border-bottom: 1px solid var(--border);
}
.metric {
  padding: 18px 22px;
  border-right: 1px solid var(--border);
  position: relative;
}
.metric:last-child { border-right: none; }
.metric-label {
  font-size: 10px;
  color: var(--text-secondary);
  letter-spacing: 1.5px;
  text-transform: uppercase;
  margin-bottom: 6px;
}
.metric-value {
  font-family: var(--font-display);
  font-size: 18px;
  font-weight: 400;
  color: var(--text-primary);
}
.metric-value.good { color: var(--neon-green); }
.metric-value.warn { color: var(--neon-amber); }
.metric-value.bad { color: var(--neon-red); }

/* ─── Checks ──────── */
.checks-section {
  padding: 18px 22px;
}
.checks-title {
  font-size: 10px;
  color: var(--text-secondary);
  letter-spacing: 1.5px;
  text-transform: uppercase;
  margin-bottom: 12px;
}
.check-row {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  margin-bottom: 4px;
  transition: background 0.15s;
}
.check-row:hover {
  background: rgba(255,255,255,0.02);
}
.check-icon {
  flex-shrink: 0;
  width: 22px;
  font-size: 14px;
  text-align: center;
  padding-top: 1px;
}
.check-body {}
.check-name {
  font-size: 13px;
  font-weight: 500;
  color: var(--text-primary);
  margin-bottom: 2px;
}
.check-detail {
  font-size: 11px;
  color: var(--text-secondary);
}
.check-weight {
  font-size: 10px;
  color: var(--text-muted);
  white-space: nowrap;
  padding-top: 2px;
}

.status-pass { color: var(--neon-green); }
.status-warn { color: var(--neon-amber); }
.status-fail { color: var(--neon-red); }
.status-unknown { color: var(--text-muted); }

/* ─── Certificate Info ──────── */
.cert-block {
  padding: 16px 22px;
  border-top: 1px solid var(--border);
  background: rgba(0,0,0,0.15);
}
.cert-block summary {
  cursor: pointer;
  font-size: 12px;
  color: var(--text-secondary);
  letter-spacing: 1px;
  text-transform: uppercase;
  user-select: none;
}
.cert-block summary:hover { color: var(--text-primary); }
.cert-details {
  margin-top: 12px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px 24px;
}
.cert-row {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  padding: 4px 0;
}
.cert-row .k { color: var(--text-secondary); }
.cert-row .v { color: var(--text-primary); font-family: var(--font-mono); }

/* ─── Compare Panel ──────── */
.compare-section { margin-top: 36px; }
.section-title {
  font-family: var(--font-display);
  font-size: 14px;
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-bottom: 16px;
  color: var(--text-secondary);
  display: flex;
  align-items: center;
  gap: 10px;
}
.section-title::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border);
}

.compare-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 14px;
}

.compare-card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px;
  cursor: pointer;
  transition: border-color 0.2s, box-shadow 0.2s, transform 0.15s;
  position: relative;
  overflow: hidden;
}
.compare-card:hover {
  border-color: var(--border-active);
  box-shadow: 0 4px 24px rgba(0,0,0,0.3);
  transform: translateY(-2px);
}
.compare-card .endpoint {
  font-size: 14px;
  font-weight: 500;
  margin-bottom: 12px;
  color: var(--text-primary);
}
.compare-card .mini-grade {
  position: absolute;
  top: 16px;
  right: 18px;
  font-family: var(--font-display);
  font-size: 22px;
  font-weight: 700;
}
.compare-card .mini-grade.A { color: var(--grade-a); }
.compare-card .mini-grade.B { color: var(--grade-b); }
.compare-card .mini-grade.C { color: var(--grade-c); }
.compare-card .mini-grade.F { color: var(--grade-f); }

.compare-metrics {
  display: flex;
  gap: 24px;
  font-size: 11px;
}
.compare-metrics .cmp-item .cmp-label {
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 2px;
}
.compare-metrics .cmp-item .cmp-val {
  color: var(--text-primary);
  font-weight: 500;
  font-size: 12px;
}

/* ─── Footer ──────── */
.footer {
  margin-top: 48px;
  padding-top: 20px;
  border-top: 1px solid var(--border);
  text-align: center;
  font-size: 10px;
  color: var(--text-muted);
  letter-spacing: 1px;
}
.footer a {
  color: var(--neon-cyan);
  text-decoration: none;
  opacity: 0.7;
  transition: opacity 0.2s;
}
.footer a:hover { opacity: 1; }

/* ─── Spinner ──────── */
.spinner {
  display: inline-block;
  width: 14px; height: 14px;
  border: 2px solid var(--text-muted);
  border-top-color: var(--neon-cyan);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin-right: 8px;
  vertical-align: middle;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ─── Error Banner ──────── */
.error-banner {
  background: rgba(255,71,87,0.08);
  border: 1px solid rgba(255,71,87,0.3);
  border-radius: var(--radius);
  padding: 14px 18px;
  margin-bottom: 24px;
  color: var(--neon-red);
  font-size: 12px;
  display: none;
}

/* ─── Empty State ──────── */
.empty-state {
  text-align: center;
  padding: 64px 24px;
  color: var(--text-muted);
}
.empty-state .icon {
  font-size: 48px;
  margin-bottom: 16px;
  opacity: 0.4;
}
.empty-state p {
  font-size: 14px;
  letter-spacing: 1px;
}

/* ─── URL Hash ──────── */
.hash-badge {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-muted);
  padding: 4px 8px;
  background: var(--void-deep);
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
}

/* ─── Responsive ──────── */
@media (max-width: 700px) {
  .metrics { grid-template-columns: repeat(2, 1fr); }
  .metric:nth-child(2) { border-right: none; }
  .header { flex-wrap: wrap; gap: 12px; }
  .header-badge { display: none; }
  .input-bar { flex-direction: column; }
  .btn-probe { text-align: center; }
  .cert-details { grid-template-columns: 1fr; }
  .compare-grid { grid-template-columns: 1fr; }
}

/* Tab bar */
.tab-bar { display: flex; gap: 2px; margin-bottom: 16px; border-bottom: 1px solid rgba(255,255,255,0.06); }
.tab-btn { background: none; border: none; color: var(--text-muted); font-family: var(--font-mono); font-size: 12px; padding: 8px 20px; cursor: pointer; border-bottom: 2px solid transparent; transition: all .2s; letter-spacing: .5px; }
.tab-btn:hover { color: var(--text); }
.tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
.tab-panel { display: none; }
.tab-panel.active { display: block; }

/* History list */
.history-list { max-height: 420px; overflow-y: auto; }
.history-item { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-bottom: 1px solid rgba(255,255,255,0.04); cursor: pointer; transition: background .15s; border-radius: 6px; margin-bottom: 2px; }
.history-item:hover { background: rgba(255,255,255,0.03); }
.history-item .hi-time { font-size: 10px; color: var(--text-muted); min-width: 120px; font-family: var(--font-mono); }
.history-item .hi-endpoint { font-size: 13px; color: var(--text); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: var(--font-mono); }
.history-item .hi-grade { font-size: 11px; font-weight: 700; min-width: 28px; text-align: center; padding: 2px 6px; border-radius: 3px; }
.history-item .hi-score { font-size: 11px; color: var(--text-muted); min-width: 50px; text-align: right; font-family: var(--font-mono); }
.history-item .hi-kex { font-size: 10px; color: var(--text-muted); min-width: 70px; text-align: right; font-family: var(--font-mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.history-empty { text-align: center; padding: 40px; color: var(--text-muted); font-size: 12px; }
.history-actions { display: flex; gap: 8px; margin-bottom: 12px; justify-content: flex-end; }
.btn-sm { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); color: var(--text-muted); font-family: var(--font-mono); font-size: 11px; padding: 5px 12px; border-radius: 4px; cursor: pointer; transition: all .15s; }
.btn-sm:hover { background: rgba(255,71,87,0.12); color: var(--grade-f); border-color: rgba(255,71,87,0.25); }

/* Trend chart */
.trend-section { margin-top: 20px; }
.trend-header { font-size: 11px; color: var(--text-muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; font-family: var(--font-mono); }
.trend-canvas-wrap { background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.06); border-radius: 8px; padding: 12px; }
#trendCanvas { display: block; width: 100%; height: 200px; }
.trend-legend { display: flex; gap: 14px; margin-top: 8px; font-size: 10px; font-family: var(--font-mono); }
.trend-legend-item { display: flex; align-items: center; gap: 5px; color: var(--text-muted); }
.trend-legend-dot { width: 8px; height: 8px; border-radius: 50%; }
.trend-legend-dot.fibemate { background: #0052CC; box-shadow: 0 0 6px rgba(0,82,204,0.4); }
.trend-legend-dot.cloudflare { background: #ff9800; box-shadow: 0 0 6px rgba(255,152,0,0.4); }
.no-data { text-align: center; padding: 30px; color: var(--text-muted); font-size: 11px; font-family: var(--font-mono); }

/* Summary dashboard */
.summary-badges { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
.summ-badge { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); border-radius: 8px; padding: 10px 16px; min-width: 80px; text-align: center; }
.summ-badge .val { font-size: 22px; font-weight: 700; font-family: var(--font-mono); }
.summ-badge .lbl { font-size: 10px; color: var(--text-muted); margin-top: 2px; text-transform: uppercase; letter-spacing: .5px; }
.summ-badge .val.green { color: var(--grade-a); }
.summ-badge .val.amber { color: var(--grade-b); }
.summ-badge .val.red { color: var(--grade-f); }

</style>
</head>
<body>

<div class="app">
  <!-- Header -->
  <header class="header">
    <div class="header-brand">
      <div class="header-logo">◇</div>
      <div class="header-titles">
        <h1>PQC 部署验证器</h1>
        <span>Deployment Verification Framework · FIBEMATE</span>
      </div>
    </div>
    <div class="header-badge">Model 2 · LIVE</div>
  </header>

  <!-- Input -->
  
  <div class="tab-bar">
    <button class="tab-btn active" data-tab="probe" onclick="switchTab('probe')">🔍 探测 (Probe)</button>
    <button class="tab-btn" data-tab="history" onclick="switchTab('history')">📈 历史 (History)</button>
  </div>

  <div class="tab-panel active" id="panel-probe">
    <div class="input-bar">
      <input type="text" id="endpointInput"
             placeholder="输入端点 (host:port)"
             value="fibemate.net:443"
             autofocus />
      <button class="btn-probe" id="probeBtn" onclick="doProbe()">
        开始检测
      </button>
    </div>
    <div class="error-banner" id="errorBanner"></div>
    <div id="results"></div>
    <div class="empty-state" id="emptyState">
      <div class="icon">🛡️</div>
      <p>输入 TLS 端点地址进行 PQC 部署验证</p>
      <p style="font-size:11px;color:var(--text-muted);margin-top:8px;">
        基于 TLS 1.3 NamedGroup 协商 · ML-KEM hybrid KEM · 证书链分析
      </p>
    </div>
  </div>

  <div class="tab-panel" id="panel-history">
    <div class="summary-badges" id="summaryBadges"></div>
    <div class="history-actions">
      <button class="btn-sm" onclick="clearHistory()">🗑 清空历史</button>
    </div>
    <div class="history-list" id="historyList">
      <div class="history-empty">暂无探测记录 · 切换到「探测」标签页开始</div>
    </div>
    <div class="trend-section">
      <div class="trend-header">📊 评分趋势</div>
      <div class="trend-canvas-wrap">
        <canvas id="trendCanvas"></canvas>
        <div class="trend-legend" id="trendLegend"></div>
      </div>
    </div>
  </div>


  <!-- Compare: Demo data from known endpoints -->
  <div class="compare-section" id="compareSection">
    <div class="section-title">▸ 已知端点对比</div>
    <div class="compare-grid" id="compareGrid"></div>
  </div>

  <!-- Footer -->
  <div class="footer">

    Model 2: Deployment Verification Framework ·

  </div>
</div>

<script>
/* ═══════════════════════════════════════════════════════════════════════
   PQC Deployment Checker — Client-side logic + demo data
   Architecture: fetches /api/probe?endpoint=... or uses demo data
   ═══════════════════════════════════════════════════════════════════════ */

// Demo data from live probes
const DEMO_ENDPOINTS = [

/* ─── Render ──────── */
let activeResult = null;

function doProbe() {
  const input = document.getElementById('endpointInput').value.trim();
  if (!input) return;

  const [hostname, portStr] = input.split(':');
  const port = portStr || '443';
  const endpoint = `${hostname}:${port}`;

  // Show loading
  const btn = document.getElementById('probeBtn');
  btn.innerHTML = '<span class="spinner"></span>检测中...';
  btn.classList.add('loading');
  btn.disabled = true;

  // Try API first, fallback to demo data
  fetch(`/api/probe?endpoint=${encodeURIComponent(endpoint)}`)
    .then(r => r.json())
    .then(data => {
      activeResult = data;
      renderResult(data);
    })
    .catch(() => {
      // Fallback: use demo data for known endpoints
      const demo = DEMO_ENDPOINTS.find(e => e.endpoint === endpoint);
      if (demo) {
        activeResult = { ...demo, timestamp: new Date().toISOString() };
        renderResult(activeResult);
      } else {
        // Generate synthetic result for unknown endpoints
        activeResult = generatePlaceholder(endpoint);
        renderResult(activeResult);
      }
    })
    .finally(() => {
      btn.innerHTML = '开始检测';
      btn.classList.remove('loading');
      btn.disabled = false;
    });

  // Update URL hash
  window.location.hash = encodeURIComponent(endpoint);
}

function renderResult(r) {
  const el = document.getElementById('results');
  document.getElementById('emptyState').style.display = 'none';

  if (!r || !r.reachable) {
    el.innerHTML = renderUnreachable(r);
    return;
  }

  el.innerHTML = `
    <div class="result-card">
      <div class="result-header">
        <div class="result-endpoint">
          <span class="dot"></span>
          ${esc(r.endpoint)}
          <span class="hash-badge">#${sha256short(r.endpoint)}</span>
        </div>
        <div class="grade-badge ${r.compliance.grade}">${r.compliance.grade}</div>
      </div>

      <div class="metrics">
        <div class="metric">
          <div class="metric-label">TLS 版本</div>
          <div class="metric-value good">${r.tlsVersion || 'N/A'}</div>
        </div>
        <div class="metric">
          <div class="metric-label">密钥交换</div>
          <div class="metric-value ${r.keyExchange?.name?.includes('MLKEM') ? 'good' : 'warn'}">${r.keyExchange?.name || '未检测到'}</div>
        </div>
        <div class="metric">
          <div class="metric-label">PQC 就绪度</div>
          <div class="metric-value ${r.compliance.grade === 'A' ? 'good' : r.compliance.grade === 'B' ? 'warn' : 'bad'}">${r.compliance.score}/100</div>
        </div>
        <div class="metric">
          <div class="metric-label">密码套件</div>
          <div class="metric-value good">${r.cipher?.name?.replace('TLS_','').replace(/_/g,'-') || 'N/A'}</div>
        </div>
      </div>

      <div class="checks-section">
        <div class="checks-title">合规性检查</div>
        ${r.compliance.checks.map(c => renderCheck(c)).join('')}
      </div>

      ${r.cert ? renderCertBlock(r.cert) : ''}
    </div>
  `;

  // Animate re-render
  const card = el.querySelector('.result-card');
  if (card) {
    card.style.animation = 'none';
    card.offsetHeight;
    card.style.animation = 'cardIn 0.4s ease-out forwards';
  }
}

function renderCheck(c) {
  const icons = { PASS: '✅', WARN: '⚠️', FAIL: '❌' };
  const cls = { PASS: 'status-pass', WARN: 'status-warn', FAIL: 'status-fail' };
  return `
    <div class="check-row">
      <div class="check-icon ${cls[c.status] || 'status-unknown'}">${icons[c.status] || '—'}</div>
      <div class="check-body">
        <div class="check-name">${esc(c.check)}</div>
        ${c.detail ? `<div class="check-detail">${esc(c.detail)}</div>` : ''}
        ${c.value ? `<div class="check-detail">当前值：${esc(String(c.value))}</div>` : ''}
      </div>
      <div class="check-weight">${c.weight}pt</div>
    </div>
  `;
}

function renderCertBlock(cert) {
  return `
    <div class="cert-block">
      <details>
        <summary>📜 证书详情</summary>
        <div class="cert-details">
          <div class="cert-row"><span class="k">Subject CN</span><span class="v">${esc(cert.subject?.CN || '?')}</span></div>
          <div class="cert-row"><span class="k">Issuer CN</span><span class="v">${esc(cert.issuer?.CN || '?')}</span></div>
          <div class="cert-row"><span class="k">公钥类型</span><span class="v">${esc(cert.publicKey?.type || '?')}</span></div>
          <div class="cert-row"><span class="k">密钥长度</span><span class="v">${cert.publicKey?.bits || '?'} bit</span></div>
          <div class="cert-row"><span class="k">签名算法</span><span class="v">${esc(cert.sigAlgorithm || '?')}</span></div>
          <div class="cert-row"><span class="k">有效期至</span><span class="v">${esc(cert.validTo || '?')}</span></div>
        </div>
      </details>
    </div>
  `;
}

function renderUnreachable(r) {
  const ep = r?.endpoint || 'unknown';
  return `
    <div class="result-card" style="border-color:rgba(255,71,87,0.3);">
      <div class="result-header">
        <div class="result-endpoint">
          <span class="dot fail"></span> ${esc(ep)}
        </div>
        <div class="grade-badge F">F</div>
      </div>
      <div class="checks-section">
        <div class="check-row">
          <div class="check-icon status-fail">❌</div>
          <div class="check-body">
            <div class="check-name">连接失败</div>
            <div class="check-detail">无法建立 TLS 连接到 ${esc(ep)}。请检查防火墙/网络。</div>
          </div>
          <div class="check-weight">—</div>
        </div>
      </div>
    </div>
  `;
}

function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function sha256short(s) {
  return s.split('').reduce((a,b) => { a = ((a << 5) - a) + b.charCodeAt(0); return a & a; }, 0).toString(16).slice(0,8).toUpperCase();
}

function generatePlaceholder(endpoint) {
  const [h] = endpoint.split(':');
  return {
    endpoint,
    timestamp: new Date().toISOString(),
    reachable: false,
    tlsVersion: null,
    cipher: null,
    keyExchange: null,
    cert: null,
    compliance: {
      score: 0, maxScore: 100, grade: 'F',
      checks: [
        { check: "TLS 1.3", status: "FAIL", weight: 30, detail: "无法连接。请在后端执行 node pqc-check.js 获取实时数据。" },
        { check: "PQC key exchange", status: "FAIL", weight: 25, detail: "需要后端探测。" },
        { check: "建议", status: "WARN", weight: 45, detail: "前端演示模式下仅展示预置端点数据。部署后端即可实时探测任意端点。" }
      ]
    }
  };
}

/* ─── Compare Grid ──────── */
function renderCompareGrid() {
  const grid = document.getElementById('compareGrid');

    <div class="compare-card" onclick="loadDemo('${ep.endpoint}')">

      <div class="compare-metrics">
        <div class="cmp-item">
          <div class="cmp-label">TLS</div>

        </div>
        <div class="cmp-item">
          <div class="cmp-label">KEX</div>
          <div class="cmp-val">${ep.keyExchange?.name || '—'}</div>
        </div>
        <div class="cmp-item">
          <div class="cmp-label">得分</div>
          <div class="cmp-val">${ep.compliance.score}/100</div>
        </div>
      </div>
    </div>
  `).join('');
}

function loadDemo(endpoint) {
  document.getElementById('endpointInput').value = endpoint;
  doProbe();
}

/* ─── Init ──────── */
function init() {
  renderCompareGrid();

  // Check URL hash
  const hash = window.location.hash.slice(1);
  if (hash) {
    document.getElementById('endpointInput').value = decodeURIComponent(hash);
    doProbe();
  }
}

window.addEventListener('DOMContentLoaded', init);

// Enter key trigger
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && document.activeElement?.id === 'endpointInput') {
    doProbe();
  }
});

// Update version tag
document.getElementById('versionTag').textContent = 'v0.1.0-alpha';

/* ===== History Engine ===== */
var HISTORY_KEY = 'pqc-checker-history-v1';
var MAX_HISTORY = 50;

function loadHistory() {
  try { return JSON.parse(localStorage.getItem(HISTORY_KEY)) || []; }
  catch(e) { return []; }
}

function saveHistory(arr) {
  try { localStorage.setItem(HISTORY_KEY, JSON.stringify(arr.slice(-MAX_HISTORY))); }
  catch(e) {}
}

function addHistory(data) {
  var h = loadHistory();
  h.push({
    ts: Date.now(),
    endpoint: data.endpoint || 'unknown',
    grade: data.compliance ? data.compliance.grade : 'F',
    score: data.compliance ? data.compliance.score : 0,
    kex: data.keyExchange ? data.keyExchange.name || '-' : '-',
    tls: data.tlsVersion || 'N/A',
    cipher: data.cipher ? data.cipher.name : 'N/A'
  });
  saveHistory(h);
  if (document.getElementById('panel-history').classList.contains('active')) {
    renderHistory();
    renderTrend();
  }
}

function clearHistory() {
  if (!confirm('确认清除所有探测历史？')) return;
  localStorage.removeItem(HISTORY_KEY);
  renderHistory();
  renderTrend();
}

function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.remove('active'); });
  document.querySelectorAll('.tab-panel').forEach(function(p){ p.classList.remove('active'); });
  document.querySelector('.tab-btn[data-tab="' + tab + '"]').classList.add('active');
  document.getElementById('panel-' + tab).classList.add('active');
  if (tab === 'history') { renderHistory(); renderTrend(); }
}

function renderHistory() {
  var h = loadHistory();
  var list = document.getElementById('historyList');
  var badges = document.getElementById('summaryBadges');

  if (h.length === 0) {
    list.innerHTML = '<div class="history-empty">暂无探测记录</div>';
    badges.innerHTML = '';
    return;
  }

  // Count by grade
  var counts = {}; var total = 0; var sumScore = 0;
  h.forEach(function(e){ counts[e.grade] = (counts[e.grade]||0) + 1; total++; sumScore += e.score; });
  var avgScore = Math.round(sumScore / total);
  var latest = h[h.length - 1];
  badges.innerHTML =
    '<div class="summ-badge"><div class="val ' + (avgScore>=90?'green':avgScore>=70?'amber':'red') + '">' + avgScore + '</div><div class="lbl">平均分</div></div>' +
    '<div class="summ-badge"><div class="val" style="color:var(--text)">' + total + '</div><div class="lbl">探测数</div></div>' +
    '<div class="summ-badge"><div class="val ' + (latest.grade==='A'?'green':latest.grade==='B'?'amber':'red') + '">' + latest.grade + '</div><div class="lbl">最新评级</div></div>' +
    '<div class="summ-badge"><div class="val" style="color:var(--text)">' + (counts.A||0)+(counts.B||0) + '</div><div class="lbl">A+B 次数</div></div>';

  // Render list (newest first)
  var items = h.slice().reverse().slice(0, 30);
  list.innerHTML = items.map(function(e){
    var when = new Date(e.ts);
    var timeStr = when.toISOString().replace('T',' ').slice(0,19);
    var gradeColor = e.grade === 'A' ? 'var(--grade-a)' : e.grade === 'B' ? 'var(--grade-b)' : e.grade === 'F' ? 'var(--grade-f)' : 'var(--text-muted)';
    return '<div class="history-item" onclick="loadDemoHistory('' + e.endpoint + '')">' +
      '<div class="hi-time">' + timeStr + '</div>' +
      '<div class="hi-endpoint">' + esc(String(e.endpoint)) + '</div>' +
      '<div class="hi-kex">' + esc(String(e.kex)) + '</div>' +
      '<div class="hi-grade" style="color:' + gradeColor + ';background:' + (e.grade==='A'?'rgba(0,255,136,0.1)':e.grade==='B'?'rgba(255,179,71,0.1)':e.grade==='F'?'rgba(255,71,87,0.1)':'rgba(255,255,255,0.04)') + '">' + e.grade + '</div>' +
      '<div class="hi-score">' + e.score + '/100</div>' +
      '</div>';
  }).join('');
}

function loadDemoHistory(endpoint) {
  switchTab('probe');
  document.getElementById('endpointInput').value = endpoint;
  doProbe();
}

/* ===== Trend Chart (Canvas) ===== */
function renderTrend() {
  var h = loadHistory();
  var canvas = document.getElementById('trendCanvas');
  var ctx = canvas.getContext('2d');
  var dpr = window.devicePixelRatio || 1;

  // Size canvas
  var wrap = canvas.parentElement;
  var w = wrap.clientWidth - 24;
  canvas.width = w * dpr;
  canvas.height = 200 * dpr;
  canvas.style.width = w + 'px';
  canvas.style.height = '200px';
  ctx.scale(dpr, dpr);

  if (h.length < 2) {
    ctx.fillStyle = '#4a5a7a';
    ctx.font = '11px "JetBrains Mono", "Fira Code", monospace';
    ctx.textAlign = 'center';
    ctx.fillText('需要 ≥2 条记录才能绘制趋势图', w/2, 100);
    document.getElementById('trendLegend').innerHTML = '';
    return;
  }

  // Group by endpoint
  var groups = {};
  h.forEach(function(e, i){
    var key = e.endpoint.replace(/:d+/, '');
    if (!groups[key]) groups[key] = [];
    groups[key].push({ idx: i, score: e.score, grade: e.grade });
  });

  var colors = ['#0052CC', '#ff9800', '#00c896', '#9c27b0', '#ff7043'];
  var colorIdx = 0;
  var legends = [];
  var allScores = [];

  // Draw grid
  var pad = { top: 20, right: 20, bottom: 30, left: 35 };
  var pw = w - pad.left - pad.right;
  var ph = 200 - pad.top - pad.bottom;

  // Background
  ctx.fillStyle = 'rgba(255,255,255,0.01)';
  ctx.fillRect(0, 0, w, 200);

  // Grid lines
  ctx.strokeStyle = 'rgba(255,255,255,0.04)';
  ctx.lineWidth = 0.5;
  for (var y = 0; y <= 100; y += 10) {
    var gy = pad.top + ph - (y / 100 * ph);
    ctx.beginPath(); ctx.moveTo(pad.left, gy); ctx.lineTo(w - pad.right, gy); ctx.stroke();
    ctx.fillStyle = '#3a4a6a';
    ctx.font = '9px "JetBrains Mono", monospace';
    ctx.textAlign = 'right';
    ctx.fillText(y, pad.left - 6, gy + 3);
  }

  // Y-axis labels
  ctx.fillStyle = '#5a6a8a';
  ctx.font = '10px "JetBrains Mono", monospace';
  ctx.textAlign = 'center';
  ctx.save();
  ctx.translate(10, pad.top + ph/2);
  ctx.rotate(-Math.PI/2);
  ctx.fillText('SCORE', 0, 0);
  ctx.restore();

  // X-axis: use sequential index
  var maxIdx = h.length - 1;

  // Draw lines for each group
  Object.keys(groups).forEach(function(ep){
    var c = colors[colorIdx % colors.length];
    colorIdx++;
    var pts = groups[ep];
    pts.forEach(function(p){ allScores.push(p.score); });

    // X-axis ticks
    ctx.fillStyle = '#3a4a6a';
    ctx.font = '8px "JetBrains Mono", monospace';
    ctx.textAlign = 'center';
    var step = Math.max(1, Math.floor(h.length / 8));
    for (var i = 0; i < h.length; i += step) {
      var x = pad.left + (i / maxIdx) * pw;
      var d = new Date(h[i].ts);
      var label = (d.getMonth()+1) + '/' + d.getDate() + ' ' + d.getHours() + ':' + String(d.getMinutes()).padStart(2,'0');
      ctx.fillText(label, x, pad.top + ph + 14);
    }

    // Draw line
    ctx.strokeStyle = c;
    ctx.lineWidth = 1.5;
    ctx.setLineDash([]);
    ctx.lineJoin = 'round';
    ctx.beginPath();
    pts.forEach(function(p, pi){
      var x = pad.left + (p.idx / maxIdx) * pw;
      var y = pad.top + ph - (p.score / 100 * ph);
      if (pi === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    ctx.stroke();

    // Draw dots
    pts.forEach(function(p){
      var x = pad.left + (p.idx / maxIdx) * pw;
      var y = pad.top + ph - (p.score / 100 * ph);
      ctx.fillStyle = c;
      ctx.beginPath(); ctx.arc(x, y, 3, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#0d1117';
      ctx.beginPath(); ctx.arc(x, y, 1.5, 0, Math.PI*2); ctx.fill();
    });

    legends.push('<div class="trend-legend-item"><div class="trend-legend-dot ' + (ep === 'fibemate.net' ? 'fibemate' : ep === 'cloudflare.com' ? 'cloudflare' : '') + '" style="background:' + c + '"></div>' + ep + '</div>');
  });

  document.getElementById('trendLegend').innerHTML = legends.join('');
}

/* ===== Hook into existing doProbe to save history ===== */
var _doProbe_original = doProbe;
doProbe = async function() {
  var input = document.getElementById('endpointInput').value.trim();
  if (!input) return;
  var target = input.includes(':') ? input : input + ':443';
  var btn = document.getElementById('probeBtn');
  btn.innerHTML = '<span class="spinner"></span>'; btn.classList.add('loading'); btn.disabled = true;

  try {
    var resp = await fetch(API_BASE + '?target=' + encodeURIComponent(target));
    var data = await resp.json();
    if (data.error) throw new Error(data.error);
    renderResult(data);
    addHistory(data);  // ← new
  } catch (err) {
    showError('探测失败: ' + (err.message || '网络错误'));
  } finally {
    btn.innerHTML = '开始检测'; btn.classList.remove('loading'); btn.disabled = false;
  }
  window.location.hash = encodeURIComponent(target);
};

window.addEventListener('resize', function(){
  if (document.getElementById('panel-history').classList.contains('active')) {
    renderTrend();
  }
});

</script>
