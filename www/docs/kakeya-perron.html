        <button class="btn" id="exportSVG">瀵煎嚭 SVG 鎴浘</button>
        
        <div class="info-box">

    </div>
    
    <div id="legend">
        <div class="legend-item">

        <div class="legend-item">

    <!-- Three.js r128 鈥?鏈湴鎵樼 (鏈嶅姟鍣ㄤ笉渚濊禆 CDN) -->
    <script src="./lib/three.min.js"></script>
    <script>
        // CDN 鍚庡锛屼粎褰撴湰鍦版枃浠跺姞杞藉け璐?        if (typeof THREE === 'undefined') {
            document.write('<script src="lib/three.min.js"><\/script>');

    </script>
    <script>
        // OrbitControls 鈥?鏈湴鎵樼
        if (typeof THREE !== 'undefined' && typeof THREE.OrbitControls === 'undefined') {
            document.write('<script src="./lib/OrbitControls.js"><\/script>');
        }
        // CDN 鍚庡
        if (typeof THREE !== 'undefined' && typeof THREE.OrbitControls === 'undefined') {
            document.write('<script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"><\/script>');
        }
    </script>
    
    <script>
        // 璋冭瘯鏃ュ織
        window.addEventListener('error', function(e) {
            console.error('鍏ㄥ眬閿欒:', e.message, e.filename, e.lineno);
        });
        
        window.addEventListener('load', function() {
            console.log('=== 鍔犺浇鐘舵€?===');
            console.log('THREE:', typeof THREE);
            console.log('OrbitControls:', typeof THREE !== 'undefined' ? typeof THREE.OrbitControls : 'N/A');
            console.log('DOMContentLoaded 宸茶Е鍙?);
        });
    </script>
    
    <script>
        // ============================================================
        // 绂绘暎鎸傝胺闆嗗悎鐢熸垚鍣?        // ============================================================
        
        class DiscreteKakeya {
            constructor(dimension, resolution) {
                this.dimension = dimension;
                this.resolution = resolution;
                this.directions = [];
            }
            
            /**
             * 鐢熸垚 Perron 鏍戞瀯閫犵殑绂绘暎鏂瑰悜闆?             * 杩斿洖锛氭柟鍚戝悜閲忔暟缁?[[x1,y1,z1], [x2,y2,z2], ...]
             */
            generateDirections() {
                this.directions = [];
                
                const n = this.resolution;
                const d = Math.min(this.dimension, 256); // 闄愬埗鏈€澶х淮搴?                
                // 鐢熸垚涓昏酱鏂瑰悜
                this.addAxisDirections(d, n);
                
                // 鐢熸垚瀵硅绾挎柟鍚?                this.addDiagonalDirections(d, n);
                
                // 鐢熸垚 Perron 鏍戠殑閫掑綊鏂瑰悜
                this.addPerronDirections(d, n);
                
                return this.directions;
            }
            
            // 涓昏酱鏂瑰悜 (X, Y, Z)
            addAxisDirections(d, n) {
                // X 杞存柟鍚戠殑绾挎
                for (let i = 0; i < n; i++) {
                    for (let j = 0; j < n; j++) {
                        this.directions.push({
                            start: [-d/2, i - n/2, j - n/2],
                            end: [d/2, i - n/2, j - n/2],
                            color: new THREE.Color(0xff6b6b), // 绾㈣壊
                            type: 'axis-x'
                        });
                    }
                }
                
                // Y 杞存柟鍚?                for (let i = 0; i < n; i++) {
                    for (let j = 0; j < n; j++) {
                        this.directions.push({
                            start: [i - n/2, -d/2, j - n/2],
                            end: [i - n/2, d/2, j - n/2],
                            color: new THREE.Color(0x4ecdc4), // 闈掕壊
                            type: 'axis-y'
                        });
                    }
                }
                
                // Z 杞存柟鍚?                for (let i = 0; i < n; i++) {
                    for (let j = 0; j < n; j++) {
                        this.directions.push({
                            start: [i - n/2, j - n/2, -d/2],
                            end: [i - n/2, j - n/2, d/2],
                            color: new THREE.Color(0xffe66d), // 榛勮壊
                            type: 'axis-z'
                        });
                    }
                }
            }
            
            // 瀵硅绾挎柟鍚?            addDiagonalDirections(d, n) {
                const diagonalLength = d * 0.7;
                
                // 涓诲瑙掔嚎
                for (let i = 0; i < Math.floor(n/2); i++) {
                    const offset = i - n/4;
                    this.directions.push({
                        start: [-diagonalLength/2 + offset, -diagonalLength/2 + offset, -diagonalLength/2],
                        end: [diagonalLength/2 + offset, diagonalLength/2 + offset, diagonalLength/2],
                        color: new THREE.Color(0xa855f7), // 绱壊
                        type: 'diagonal'
                    });
                }
            }
            
            // Perron 鏍戦€掑綊鏂瑰悜锛堢畝鍖栫増锛?            addPerronDirections(d, n) {
                const depth = Math.floor(Math.log2(d));
                const scale = d / 4;
                
                // 鐢熸垚閫掑綊鍒嗗舰缁撴瀯
                for (let level = 1; level <= Math.min(depth, 4); level++) {
                    const numBranches = Math.pow(2, level);
                    const branchLength = scale / level;
                    
                    for (let i = 0; i < numBranches; i++) {
                        const angle = (i / numBranches) * Math.PI * 2;
                        const x = Math.cos(angle) * branchLength;
                        const y = Math.sin(angle) * branchLength;
                        
                        this.directions.push({
                            start: [x - branchLength/2, y, 0],
                            end: [x + branchLength/2, y, 0],
                            color: new THREE.Color().setHSL(angle / (Math.PI * 2), 0.7, 0.6),
                            type: `perron-${level}`
                        });
                    }
                }
            }
            
            // 璁＄畻瀹夊叏鎬т及璁?            getSecurityEstimate() {
                const d = this.dimension;
                
                // BKZ 澶嶆潅搴︿及璁★細2^(d * log2(d) / 2)
                const bkzComplexity = Math.pow(2, d * Math.log2(d) / 2);
                
                // LWE 澶嶆潅搴︼紙绠€鍖栵級锛?^(d / 2) * q
                const q = 3329; // ML-KEM 妯℃暟
                const lweComplexity = Math.pow(2, d / 2) * q;
                
                // 瀹夊叏绛夌骇浼拌
                let securityLevel = '浣?;
                if (d >= 128) securityLevel = '楂?(128-bit+)';
                else if (d >= 64) securityLevel = '涓瓑 (64-bit)';
                else if (d >= 32) securityLevel = '浣?(32-bit)';
                
                return {
                    dimension: d,
                    lines: this.directions.length,
                    bkz: this.formatComplexity(bkzComplexity),
                    lwe: this.formatComplexity(lweComplexity),
                    security: securityLevel
                };
            }
            
            formatComplexity(n) {
                if (n < 1e6) return n.toFixed(0);
                if (n < 1e9) return (n / 1e6).toFixed(1) + 'M';
                if (n < 1e12) return (n / 1e9).toFixed(1) + 'G';
                if (n < 1e15) return (n / 1e12).toFixed(1) + 'T';
                return '2^' + Math.log2(n).toFixed(0);
            }
        }
        
        // ============================================================
        // Three.js 鍦烘櫙鍒濆鍖?        // ============================================================
        
        let scene, camera, renderer, controls;
        let lineSegments, axesHelper;
        let kakeya;
        
        function init() {
            const container = document.getElementById('canvas-container');
            const loadingEl = document.getElementById('loading');
            if (loadingEl) loadingEl.style.display = 'none';
            
            // 妫€鏌?THREE 鏄惁鍔犺浇
            if (typeof THREE === 'undefined') {
                console.error('THREE.js 鏈姞杞斤紒CDN 澶辫触');
                container.innerHTML = '<div style="color:#ff6b6b;padding:40px;text-align:center;font-size:14px;"><h2>鈿狅笍 Three.js 鍔犺浇澶辫触</h2><p>璇锋鏌ョ綉缁滆繛鎺ワ紙闇€瑕佽闂?unpkg.com 鎴?jsdelivr.net锛?/p><p style="margin-top:20px;font-size:12px;color:#a0a0c0;">澶囩敤鏂规锛氳浣跨敤鏈湴瀹夎鏂瑰紡鎴栨鏌?CDN 鍙敤鎬?/p></div>';
                return;
            }
            
            if (typeof THREE.OrbitControls === 'undefined') {
                console.warn('OrbitControls 鏈姞杞斤紝灏嗕娇鐢ㄥ熀纭€鎺у埗');
                THREE.OrbitControls = function() {
                    return { update: function() {}, reset: function() {}, autoRotate: false };
                };
            }
            
            console.log('寮€濮嬪垵濮嬪寲 Three.js 鍦烘櫙...');
            
            // 鍦烘櫙
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0f0f1e);
            
            // 鐩告満
            camera = new THREE.PerspectiveCamera(
                60,
                window.innerWidth / window.innerHeight,
                0.1,
                1000
            );
            camera.position.set(30, 20, 30);
            
            // 娓叉煋鍣?            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);
            
            // 鎺у埗鍣?            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.autoRotate = true;
            controls.autoRotateSpeed = 0.5;
            
            // 鍧愭爣杞?            axesHelper = new THREE.AxesHelper(20);
            scene.add(axesHelper);
            
            // 鍏夌収
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);
            
            // 鍒濆鍖栨寕璋烽泦鍚?            kakeya = new DiscreteKakeya(16, 8);
            updateVisualization();
            
            // 浜嬩欢鐩戝惉
            setupEventListeners();
            
            // 娓叉煋寰幆
            animate();
        }
        
        // ============================================================
        // 鍙鍖栨洿鏂?        // ============================================================
        
        function updateVisualization() {
            // 娓呴櫎鏃х殑绾挎
            if (lineSegments) {
                scene.remove(lineSegments);
                lineSegments.geometry.dispose();
                lineSegments.material.dispose();
            }
            
            // 鐢熸垚鏂扮殑鏂瑰悜闆?            const directions = kakeya.generateDirections();
            const opacity = parseInt(document.getElementById('opacity').value) / 100;
            
            // 鍒涘缓绾挎鍑犱綍浣?            const geometry = new THREE.BufferGeometry();
            const positions = [];
            const colors = [];
            
            directions.forEach(dir => {
                positions.push(
                    dir.start[0], dir.start[1], dir.start[2],
                    dir.end[0], dir.end[1], dir.end[2]
                );
                colors.push(
                    dir.color.r, dir.color.g, dir.color.b,
                    dir.color.r, dir.color.g, dir.color.b
                );
            });
            
            geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
            
            // 鏉愯川
            const material = new THREE.LineBasicMaterial({
                vertexColors: true,
                transparent: true,
                opacity: opacity,
                linewidth: 1
            });
            
            lineSegments = new THREE.LineSegments(geometry, material);
            scene.add(lineSegments);
            
            // 鏇存柊淇℃伅闈㈡澘
            updateInfoPanel();
        }
        
        function updateInfoPanel() {
            const info = kakeya.getSecurityEstimate();
            
            document.getElementById('info-dimension').textContent = info.dimension;
            document.getElementById('info-lines').textContent = info.lines.toLocaleString();
            document.getElementById('info-bkz').textContent = info.bkz;
            document.getElementById('info-lwe').textContent = info.lwe;
            document.getElementById('info-status').textContent = info.security;
            
            // 鏍规嵁瀹夊叏绛夌骇鏀瑰彉棰滆壊
            const statusEl = document.getElementById('info-status');
            if (info.dimension >= 128) {
                statusEl.style.color = '#00ff88';
            } else if (info.dimension >= 64) {
                statusEl.style.color = '#ffe66d';
            } else {
                statusEl.style.color = '#ff6b6b';
            }
        }
        
        // ============================================================
        // 浜嬩欢鐩戝惉
        // ============================================================
        
        function setupEventListeners() {
            // 缁村害婊戝潡
            document.getElementById('dimension').addEventListener('input', (e) => {
                const value = parseInt(e.target.value);
                document.getElementById('dimension-value').textContent = value;
                kakeya.dimension = value;
                updateVisualization();
            });
            
            // 鍒嗚鲸鐜囨粦鍧?            document.getElementById('resolution').addEventListener('input', (e) => {
                const value = parseInt(e.target.value);
                document.getElementById('resolution-value').textContent = value;
                kakeya.resolution = value;
                updateVisualization();
            });
            
            // 閫忔槑搴︽粦鍧?            document.getElementById('opacity').addEventListener('input', (e) => {
                const value = parseInt(e.target.value);
                document.getElementById('opacity-value').textContent = value + '%';
                if (lineSegments) {
                    lineSegments.material.opacity = value / 100;
                }
            });
            
            // 鑷姩鏃嬭浆
            document.getElementById('autoRotate').addEventListener('change', (e) => {
                controls.autoRotate = e.target.checked;
            });
            
            // 鏄剧ず鍧愭爣杞?            document.getElementById('showAxes').addEventListener('change', (e) => {
                axesHelper.visible = e.target.checked;
            });
            
            // 閲嶇疆瑙嗚
            document.getElementById('resetCamera').addEventListener('click', () => {
                camera.position.set(30, 20, 30);
                controls.reset();
            });
            
            // 瀵煎嚭 SVG 鎴浘
            document.getElementById('exportSVG').addEventListener('click', () => {
                const d = kakeya.dimension;
                const res = kakeya.resolution;
                const lines = kakeya.directions.length;
                const info = kakeya.getSecurityEstimate();
                const w = renderer.domElement.width;
                const h = renderer.domElement.height;
                const pngDataUrl = renderer.domElement.toDataURL('image/png');
                const now = new Date().toISOString().replace('T', ' ').replace(/\..+/, '');

                const svg = `<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="${w}" height="${h + 56}" viewBox="0 0 ${w} ${h + 56}">
  <defs>
    <style>
      text { font-family: -apple-system, sans-serif; font-size: 13px; fill: #c0c0d0; }
      .title { font-size: 16px; font-weight: 700; fill: #00d4ff; }
    </style>
  </defs>
  <image x="0" y="0" width="${w}" height="${h}" xlink:href="${pngDataUrl}" />
  <rect x="0" y="${h}" width="${w}" height="56" fill="#0f0f1e" />
  <line x1="0" y1="${h}" x2="${w}" y2="${h}" stroke="#3a3a5a" stroke-width="1" />
  <text x="12" y="${h + 22}" class="title">FIBEMATE 鎸傝胺闆嗗悎 鈥?d=${d} 路 ${lines.toLocaleString()} 绾挎 路 BKZ ${info.bkz}</text>
  <text x="12" y="${h + 42}" fill="#8b949e" font-size="11">鍒嗚鲸鐜?${res}/缁?路 LWE 澶嶆潅搴?${info.lwe} 路 ${now} UTC</text>
</svg>`;

                const blob = new Blob([svg], { type: 'image/svg+xml;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `kakeya-d${d}-r${res}-${Date.now()}.svg`;
                a.click();
                URL.revokeObjectURL(url);
                console.log('SVG exported:', a.download, (blob.size / 1024).toFixed(0) + ' KB');
            });
            
            // 绐楀彛澶у皬璋冩暣
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }
        
        // ============================================================
        // 娓叉煋寰幆
        // ============================================================
        
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        
        // 鍚姩
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            // DOM 宸茬粡灏辩华锛岀洿鎺ュ垵濮嬪寲
            init();
        }
        
        // 鏈€缁堜繚闅滐細濡傛灉 5 绉掑悗浠嶆湭鍒濆鍖栵紝寮哄埗灏濊瘯
        setTimeout(function() {
            if (typeof scene === 'undefined' && typeof THREE !== 'undefined') {
                console.warn('5 绉掕秴鏃舵湭鍒濆鍖栵紝寮哄埗璋冪敤 init()');
                init();
            }
        }, 5000);
    </script>
</body>
</html>
