<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>交互式依赖下钻 · FIBEMATE</title>
<meta name="description" content="点击算法节点展开完整信息：依赖链路 · 引用文件 · KAT/TVLA · 风险评分 · 迁移路径">
<style>
:root { --bg:#0b0f19; --card:#131827; --border:#1f2a44; --text:#b8c0d0; }
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif; background:var(--bg); color:var(--text); overflow:hidden; height:100vh; }
#canvas-container { position:fixed; inset:0; }

#drill-panel { position:fixed; z-index:10; top:0; right:-420px; width:400px; height:100vh; background:rgba(19,24,39,0.95); backdrop-filter:blur(16px); border-left:1px solid var(--border); transition:right 0.35s cubic-bezier(0.4,0,0.2,1); overflow-y:auto; padding:20px 0; }
#drill-panel.open { right:0; }
#drill-panel .close { position:absolute; top:12px; right:14px; font-size:20px; color:#66708a; cursor:pointer; width:32px; height:32px; display:flex; align-items:center; justify-content:center; border-radius:6px; }
#drill-panel .close:hover { color:#e0e5f0; background:rgba(255,255,255,0.06); }
#drill-panel .dp-header { padding:0 20px 14px; border-bottom:1px solid var(--border); margin-bottom:12px; }
#drill-panel .dp-name { font-size:18px; font-weight:700; }
#drill-panel .dp-fips { font-size:11px; color:#66708a; margin-top:2px; }
#drill-panel .dp-meta { display:flex; gap:10px; margin-top:10px; flex-wrap:wrap; }
#drill-panel .dp-badge { padding:3px 10px; border-radius:6px; font-size:10px; font-weight:600; }
#drill-panel .dp-section { padding:8px 20px; }
#drill-panel .dp-sectitle { font-size:11px; font-weight:600; color:#66708a; text-transform:uppercase; letter-spacing:0.5px; margin-bottom:8px; }
#drill-panel .dp-row { display:flex; justify-content:space-between; padding:4px 0; font-size:10px; border-bottom:1px solid rgba(255,255,255,0.03); }
#drill-panel .dp-row .l { color:#66708a; }
#drill-panel .dp-row .r { color:#d0d6e6; font-weight:600; }
#drill-panel .dp-dep { display:flex; align-items:center; gap:6px; padding:4px 0; font-size:10px; }
#drill-panel .dp-dep-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
#drill-panel .dp-bar { height:4px; border-radius:2px; margin:4px 0; }
#drill-panel .dp-file { font-size:9px; color:#66708a; padding:2px 0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

#legend { position:fixed; z-index:10; bottom:20px; left:50%; transform:translateX(-50%); display:flex; gap:10px; background:rgba(19,24,39,0.85); backdrop-filter:blur(12px); border:1px solid var(--border); border-radius:20px; padding:8px 14px; font-size:10px; }
.leg { display:flex; align-items:center; gap:5px; }
.leg-dot { width:9px; height:9px; border-radius:50%; }

#hint { position:fixed; z-index:10; top:50%; left:50%; transform:translate(-50%,-50%); font-size:14px; color:#66708a; pointer-events:none; transition:opacity 0.5s; }
#hint.fade { opacity:0.2; }

#footer { position:fixed; z-index:10; bottom:12px; right:16px; font-size:10px; color:#66708a; }
#footer a { color:#0ea5e9; text-decoration:none; }
</style>
</head>
<body>
<div id="canvas-container"></div>
<div id="hint">🖱 点击任意节点下钻</div>

<div id="drill-panel">
  <div class="close" onclick="closePanel()">✕</div>
  <div class="dp-header">
    <div class="dp-name" id="dp-name"></div>
    <div class="dp-fips" id="dp-fips"></div>
    <div class="dp-meta" id="dp-meta"></div>
  </div>
  <div id="dp-content"></div>
</div>

<div id="legend">
  <div class="leg"><div class="leg-dot" style="background:#51cf66;box-shadow:0 0 4px #51cf66"></div> PQC 安全</div>
  <div class="leg"><div class="leg-dot" style="background:#c792ea;box-shadow:0 0 4px #c792ea"></div> 经典·警告</div>
  <div class="leg"><div class="leg-dot" style="background:#ff6b6b;box-shadow:0 0 4px #ff6b6b"></div> 经典·脆弱</div>
  <span style="color:#66708a;margin-left:8px">🖱 拖拽旋转 · 滚轮缩放 · 点击下钻</span>
</div>

<div id="footer"><a href="/docs/supply-chain-risk.html">供应链</a> · <a href="/docs/pqc-security-levels.html">安全等级</a></div>

<script src="lib/three.min.js?v=20260803"></script>
<script src="lib/OrbitControls.js?v=20260803"></script>

<script>
(function(){
if(typeof THREE==='undefined'){document.body.innerHTML='<div style="color:#e44;padding:40px;text-align:center;margin-top:20vh"><b>&#x2715;</b> THREE.js 未加载</div>';return;}

// ═══════ Algorithm data with dependencies ═══════
var ALGOS = [
  { id:'mlkem', name:'ML-KEM-768', cat:'pqc', risk:'safe', riskScore:5,
    pk:1184, sk:2400, ct:1088, ss:32, fips:'FIPS 203', cov:100,
    keygen:103, enc:120, dec:140, kat:'10000/10000', tvla:'33/36', nat:true, fpga:true,
    files:164, deps:['sha256','ntt'], depWeight:[3,2],
    desc:'FIPS 203 密钥封装 · C/WASM 双后端 · NTT 加速 · KAT 10,000 轮零偏差' },
  { id:'mldsa', name:'ML-DSA-65', cat:'pqc', risk:'safe', riskScore:8,
    pk:1952, sk:4032, sig:3309, ss:0, fips:'FIPS 204', cov:70,
    keygen:null, sign:2400, verify:700, kat:'270/270', tvla:'', nat:false, fpga:true,
    files:47, deps:['sha256','ntt'], depWeight:[2,1],
    desc:'FIPS 204 数字签名 · fml-dsa 实现 · Noble 交叉验证 7/7' },
  { id:'slhdsa', name:'SLH-DSA-128s', cat:'pqc', risk:'warning', riskScore:30,
    pk:32, sk:64, sig:7856, ss:0, fips:'FIPS 205', cov:65,
    keygen:489400, sign:4199500, verify:4200, kat:'148/148', tvla:'', nat:false, fpga:false,
    files:28, deps:['sha256'], depWeight:[2],
    desc:'FIPS 205 无状态哈希签名 · WASM · 签名 17KB · 极致安全性/性能折衷' },
  { id:'sm2', name:'SM2', cat:'classic', risk:'safe', riskScore:5,
    pk:64, sk:32, sig:70, ss:0, fips:'GM/T 0003', cov:90,
    keygen:null, sign:2800, verify:1400, kat:'100/100', tvla:'15/18', nat:true, fpga:false,
    files:90, deps:['sha256','sm3','p256'], depWeight:[2,3,3],
    desc:'国密椭圆曲线 · jsbn+BigInt 双后端 · wNAF 优化 · TVLA 3 已知差异' },
  { id:'sm3', name:'SM3', cat:'classic', risk:'warning', riskScore:25,
    pk:0, sk:0, sig:0, ss:0, fips:'GM/T 0004', cov:65,
    keygen:null, sign:null, verify:null, kat:'30/30', tvla:'', nat:false, fpga:false,
    files:52, deps:[], depWeight:[],
    desc:'国密哈希 · SM2 配套 · 纯 JS 实现' },
  { id:'sm4', name:'SM4-GCM', cat:'classic', risk:'warning', riskScore:25,
    pk:0, sk:0, sig:0, ss:0, fips:'GM/T 0002', cov:65,
    keygen:null, sign:null, verify:null, kat:'30/30', tvla:'', nat:false, fpga:false,
    files:39, deps:['sha256'], depWeight:[1],
    desc:'国密分组密码 · GCM AEAD 模式 · 纯 JS' },
  { id:'p256', name:'P-256 ECDH', cat:'classic', risk:'vulnerable', riskScore:40,
    pk:65, sk:32, ct:65, ss:32, fips:'SP 800-56A', cov:50,
    keygen:null, sign:null, verify:null, kat:'Verified', tvla:'', nat:false, fpga:false,
    files:65, deps:['sha256'], depWeight:[2],
    desc:'经典 ECDH · Shor 脆弱 (Q=0 bit) · 需迁移至 ML-KEM · 双棘轮桥接' },
  { id:'sha256', name:'SHA-256', cat:'hash', risk:'safe', riskScore:30,
    pk:0, sk:0, sig:0, ss:0, fips:'FIPS 180-4', cov:50,
    keygen:null, sign:null, verify:null, kat:'NIST vectors', tvla:'', nat:false, fpga:false,
    files:94, deps:[], depWeight:[],
    desc:'SHA-256 哈希 · 量子安全 · 全网 94 处引用 · 依赖枢纽' },
  { id:'aes', name:'AES-256-GCM', cat:'classic', risk:'safe', riskScore:20,
    pk:0, sk:0, sig:0, ss:0, fips:'FIPS 197', cov:50,
    keygen:null, sign:null, verify:null, kat:'NIST vectors', tvla:'', nat:false, fpga:false,
    files:39, deps:['sha256'], depWeight:[1],
    desc:'AES-256-GCM · 量子安全 · 消息加密' },
  { id:'ntt', name:'NTT', cat:'hardware', risk:'safe', riskScore:5,
    pk:0, sk:0, sig:0, ss:0, fips:'—', cov:70,
    keygen:null, sign:null, verify:null, kat:'Internal', tvla:'HW fault', nat:true, fpga:true,
    files:135, deps:[], depWeight:[],
    desc:'FPGA Artix-7 硬件加速 · pipe2 256/256 PASS · BRAM36+DSP48E1' },
];

var RISK_COL = { safe:'#51cf66', warning:'#ffd43b', vulnerable:'#ff6b6b' };
var CAT_COL = { pqc:'#51cf66', classic:'#c792ea', hash:'#51cf66', hardware:'#00d4ff' };
var nodeMap = {}; ALGOS.forEach(function(a) { nodeMap[a.id] = a; });

// ═══════ Compute incoming deps ═══════
var inDeg = {}; ALGOS.forEach(function(a) { inDeg[a.id] = 0; });
ALGOS.forEach(function(a) { a.deps.forEach(function(d) { inDeg[d] = (inDeg[d]||0) + 1; }); });

// ═══════ Layout: force-directed in 3D ═══════
var N = ALGOS.length;
// Init positions: SHA-256 at center, others in concentric rings
var R0 = 0, R1 = 4, R2 = 7.5;
ALGOS.forEach(function(a) {
  a.tp = { x: (Math.random()-0.5)*3, y: (Math.random()-0.5)*3, z: (Math.random()-0.5)*3 };
});
// Place SHA-256 at center
nodeMap['sha256'].tp = { x: 0, y: 1.5, z: 0 };
// High-degree nodes in inner ring
var innerRing = ['sm2','p256','mlkem','ntt','sm3'];
innerRing.forEach(function(id, i) {
  var ang = (2*Math.PI/innerRing.length)*i - Math.PI/2;
  nodeMap[id].tp = { x: Math.cos(ang)*R1, y: Math.sin(i*1.1)*1.2, z: Math.sin(ang)*R1 };
});
// Leaves in outer ring
var outerRing = ['mldsa','sm4','aes','slhdsa'];
outerRing.forEach(function(id, i) {
  var ang = (2*Math.PI/outerRing.length)*i;
  nodeMap[id].tp = { x: Math.cos(ang)*R2, y: -0.5, z: Math.sin(ang)*R2 };
});

// ═══════ Scene ═══════
var W=innerWidth,H=innerHeight;
var scene=new THREE.Scene(); scene.background=new THREE.Color('#0b0f19'); scene.fog=new THREE.Fog('#0b0f19',20,60);
var camera=new THREE.PerspectiveCamera(45,W/H,0.5,100); camera.position.set(-3,7,16); camera.lookAt(0,0,0);

var renderer=new THREE.WebGLRenderer({antialias:true}); renderer.setSize(W,H); renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.3;
document.getElementById('canvas-container').appendChild(renderer.domElement);

var controls=new THREE.OrbitControls(camera,renderer.domElement);
controls.enableDamping=true; controls.dampingFactor=0.08; controls.autoRotate=true; controls.autoRotateSpeed=0.25;
controls.minDistance=4; controls.maxDistance=40; controls.target.set(0,0.5,0); controls.update();

scene.add(new THREE.AmbientLight('#334466',2.5));
var dl=new THREE.DirectionalLight('#ccddff',2.5); dl.position.set(12,15,10); scene.add(dl);
scene.add(new THREE.DirectionalLight('#556688',1)).position.set(-6,3,-6);

var floor=new THREE.Mesh(new THREE.PlaneGeometry(28,22),new THREE.MeshStandardMaterial({color:'#111522',roughness:0.9,metalness:0}));
floor.rotation.x=-Math.PI/2; floor.position.y=-3.5; floor.receiveShadow=true; scene.add(floor);

// ═══════ Draw edges ═══════
var allEdges = [];
ALGOS.forEach(function(a) {
  if (!a.deps) return;
  a.deps.forEach(function(dep, j) {
    var from = nodeMap[dep]; var to = a.tp; if (!from) return;
    var w = (a.depWeight||[])[j]||1;
    var mid = { x: (from.tp.x+to.x)/2, y: Math.min(from.tp.y,to.y)-0.5, z: (from.tp.z+to.z)/2 };
    var curve = new THREE.QuadraticBezierCurve3(
      new THREE.Vector3(from.tp.x,from.tp.y,from.tp.z),
      new THREE.Vector3(mid.x,mid.y,mid.z),
      new THREE.Vector3(to.x,to.y,to.z)
    );
    var pts = curve.getPoints(16);
    var geo = new THREE.BufferGeometry().setFromPoints(pts);
    var edge = new THREE.Line(geo, new THREE.LineBasicMaterial({
      color: CAT_COL[a.cat]||'#66708a', transparent: true, opacity: 0.15+0.05*w
    }));
    edge.userData = { from: dep, to: a.id, fromNode: from, toNode: a, weight: w };
    scene.add(edge); allEdges.push(edge);
  });
});

// ═══════ Draw nodes ═══════
var allNodes = [];
var MAX_FILES = 164;
ALGOS.forEach(function(a) {
  var p = a.tp;
  var col = RISK_COL[a.risk] || CAT_COL[a.cat] || '#66708a';
  var sz = 0.22 + (a.files / MAX_FILES) * 0.6;

  var geo = new THREE.SphereGeometry(sz, 24, 12);
  var mat = new THREE.MeshStandardMaterial({ color: new THREE.Color(col), roughness: 0.2, metalness: 0.5, emissive: new THREE.Color(col), emissiveIntensity: 0.3 });
  var node = new THREE.Mesh(geo, mat); node.position.set(p.x, p.y, p.z);
  node.userData = { algo: a, col: col };
  scene.add(node); allNodes.push(node);

  // Aura
  var ag = new THREE.SphereGeometry(sz*1.35, 20, 10);
  var am = new THREE.MeshBasicMaterial({ color: new THREE.Color(col), transparent: true, opacity: 0.1, depthWrite: false });
  var au = new THREE.Mesh(ag, am); au.position.copy(node.position); scene.add(au);

  // Dependency count ring
  var dr = a.deps.length > 0 ? 1 + a.deps.length*0.25 : 0;
  if (dr > 0) {
    var rg = new THREE.TorusGeometry(sz*1.15, 0.02, 6, 28);
    var rm = new THREE.MeshBasicMaterial({ color: new THREE.Color(col), transparent: true, opacity: 0.3, depthWrite: false });
    var rn = new THREE.Mesh(rg, rm); rn.position.copy(node.position); rn.rotation.x = Math.PI/2; scene.add(rn);
  }

  // Label sprite
  var canvas = document.createElement('canvas'); canvas.width = 256; canvas.height = 48;
  var ctx = canvas.getContext('2d');
  ctx.font = 'bold 14px "Segoe UI","PingFang SC",sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = '#d0d6e6';
  ctx.fillText(a.name, 128, 20);
  ctx.font = '10px "Segoe UI",sans-serif'; ctx.fillStyle = '#66708a';
  ctx.fillText((a.deps||[]).length+' dep · '+a.files+' files', 128, 34);
  var tex = new THREE.CanvasTexture(canvas); tex.minFilter = THREE.LinearFilter;
  var sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false, depthWrite: false }));
  sp.position.set(p.x, p.y+(sz+0.5), p.z); sp.scale.set(1.8, 0.34, 1); scene.add(sp);
});

// ═══════ Raycaster ═══════
var tooltipStyle = { display:'none' };
var mouse = new THREE.Vector2(), hovered = null, activeAlgo = null;
var raycaster = new THREE.Raycaster();

window.addEventListener('mousemove', function(ev) {
  mouse.x = (ev.clientX/W)*2-1; mouse.y = -(ev.clientY/H)*2+1;
  raycaster.setFromCamera(mouse, camera);
  var hits = raycaster.intersectObjects(allNodes);
  if (hits.length > 0) {
    if (hovered !== hits[0].object) {
      if (hovered) hovered.material.emissiveIntensity = 0.3;
      hovered = hits[0].object; hovered.material.emissiveIntensity = 0.9;
      document.body.style.cursor = 'pointer';
    }
  } else {
    if (hovered) { hovered.material.emissiveIntensity = 0.3; hovered = null; }
    document.body.style.cursor = '';
  }
});

window.addEventListener('click', function(ev) {
  mouse.x = (ev.clientX/W)*2-1; mouse.y = -(ev.clientY/H)*2+1;
  raycaster.setFromCamera(mouse, camera);
  var hits = raycaster.intersectObjects(allNodes);
  if (hits.length > 0) {
    var algo = hits[0].object.userData.algo;
    openPanel(algo);
    document.getElementById('hint').classList.add('fade');
  }
});

// ═══════ Panel ═══════
function openPanel(a) {
  activeAlgo = a;
  var panel = document.getElementById('drill-panel');
  document.getElementById('dp-name').textContent = a.name;
  document.getElementById('dp-name').style.color = RISK_COL[a.risk] || CAT_COL[a.cat];
  document.getElementById('dp-fips').textContent = a.fips + (a.desc ? ' · ' + a.desc : '');

  var riskLabels = { safe:{ text:'安全', bg:'rgba(81,207,102,0.15)', col:'#51cf66' },
    warning:{ text:'警告', bg:'rgba(255,212,59,0.15)', col:'#ffd43b' },
    vulnerable:{ text:'脆弱', bg:'rgba(255,107,107,0.15)', col:'#ff6b6b' } };
  var rl = riskLabels[a.risk];

  var catLabels = { pqc:'PQC', classic:'经典', hash:'哈希', hardware:'硬件加速' };
  var cName = catLabels[a.cat] || a.cat;

  var migLabels = ['立即迁移','计划迁移','监控'];
  var mig = a.riskScore >= 30 ? 0 : a.riskScore >= 15 ? 1 : 2;

  var nativeBadge = a.nat ? '<span class="dp-badge" style="background:rgba(81,207,102,0.15);color:#51cf66">Native</span>' : '';
  var fpgaBadge = a.fpga ? '<span class="dp-badge" style="background:rgba(0,212,255,0.15);color:#00d4ff">FPGA</span>' : '';
  var katBadge = a.tvla ? '<span class="dp-badge" style="background:rgba(192,146,234,0.15);color:#c792ea">TVLA</span>' : '';

  var depList = (a.deps||[]).map(function(d) {
    var dn = nodeMap[d]; if (!dn) return '<div class="dp-dep"><div class="dp-dep-dot" style="background:'+(CAT_COL[dn.cat]||'#66708a')+'"></div>'+dn.name+' ('+(RISK_COL[dn.risk]?'<span style="color:'+RISK_COL[dn.risk]+'">'+dn.risk+'</span>':'')+')</div>';
    return '<div class="dp-dep"><div class="dp-dep-dot" style="background:'+(CAT_COL[dn.cat]||'#66708a')+'"></div>'+dn.name+' <span style="color:'+RISK_COL[dn.risk]+'">'+dn.risk+'</span></div>';
  }).join('');

  var reverseDeps = ALGOS.filter(function(ad) { return (ad.deps||[]).indexOf(a.id) >= 0; });
  var revList = reverseDeps.map(function(dn) {
    return '<div class="dp-dep"><div class="dp-dep-dot" style="background:'+(CAT_COL[dn.cat]||'#66708a')+'"></div>'+dn.name+' <span style="color:'+RISK_COL[dn.risk]+'">'+dn.risk+'</span></div>';
  }).join('') || '<div class="dp-dep" style="color:#66708a">无下游依赖</div>';

  var covColor = a.cov >= 85 ? '#51cf66' : a.cov >= 60 ? '#ffd43b' : '#ff6b6b';

  var sampleFiles = 'packages/pqc-kem/src/ml-kem-768.js<br>packages/pqc-kem/src/params.js<br>www/crypto/hybrid-kem-client.js<br>packages/algorithm-registry/index.js';

  document.getElementById('dp-meta').innerHTML =
    '<span class="dp-badge" style="background:'+rl.bg+';color:'+rl.col+'">'+rl.text+' / score '+a.riskScore+'</span>'+
    '<span class="dp-badge" style="background:rgba(192,146,234,0.15);color:#c792ea">'+cName+'</span>'+
    nativeBadge + fpgaBadge + katBadge;

  document.getElementById('dp-content').innerHTML =

    '<div class="dp-section">'+
    '<div class="dp-sectitle">📏 尺寸</div>'+
    '<div class="dp-row"><span class="l">公钥 PK</span><span class="r">'+(a.pk||'—')+' B</span></div>'+
    '<div class="dp-row"><span class="l">私钥 SK</span><span class="r">'+(a.sk||'—')+' B</span></div>'+
    (a.ct?'<div class="dp-row"><span class="l">密文 CT</span><span class="r">'+a.ct+' B</span></div>':'')+
    (a.sig?'<div class="dp-row"><span class="l">签名</span><span class="r">'+a.sig+' B</span></div>':'')+
    (a.ss?'<div class="dp-row"><span class="l">共享密钥</span><span class="r">'+a.ss+' B</span></div>':'')+
    '</div>'+

    '<div class="dp-section">'+
    '<div class="dp-sectitle">⚡ 性能</div>'+
    (a.keygen?'<div class="dp-row"><span class="l">KeyGen</span><span class="r">'+(a.keygen>=1000?(a.keygen/1000).toFixed(1)+'ms':a.keygen+'µs')+'</span></div>':'')+
    (a.enc?'<div class="dp-row"><span class="l">Encaps</span><span class="r">'+(a.enc>=1000?(a.enc/1000).toFixed(1)+'ms':a.enc+'µs')+'</span></div>':'')+
    (a.dec?'<div class="dp-row"><span class="l">Decaps</span><span class="r">'+(a.dec>=1000?(a.dec/1000).toFixed(1)+'ms':a.dec+'µs')+'</span></div>':'')+
    (a.sign?'<div class="dp-row"><span class="l">Sign</span><span class="r">'+(a.sign>=1000000?(a.sign/1000000).toFixed(2)+'s':a.sign>=1000?(a.sign/1000).toFixed(1)+'ms':a.sign+'µs')+'</span></div>':'')+
    (a.verify?'<div class="dp-row"><span class="l">Verify</span><span class="r">'+(a.verify>=1000?(a.verify/1000).toFixed(1)+'ms':a.verify+'µs')+'</span></div>':'')+
    (!a.keygen&&!a.sign?'<div class="dp-row"><span class="l">性能</span><span class="r" style="color:#66708a">不适用</span></div>':'')+
    '</div>'+

    '<div class="dp-section">'+
    '<div class="dp-sectitle">✅ 验证</div>'+
    '<div class="dp-row"><span class="l">KAT</span><span class="r">'+(a.kat||'—')+'</span></div>'+
    '<div class="dp-row"><span class="l">TVLA</span><span class="r">'+(a.tvla||'—')+'</span></div>'+
    '<div class="dp-row"><span class="l">覆盖率</span><span class="r" style="color:'+covColor+'">'+a.cov+'%</span></div>'+
    '<div style="margin-top:4px;height:4px;border-radius:2px;background:#1f2a44"><div class="dp-bar" style="width:'+a.cov+'%;background:'+covColor+'"></div></div>'+
    '</div>'+

    '<div class="dp-section">'+
    '<div class="dp-sectitle">🔗 依赖关系 ('+(a.deps||[]).length+' → '+reverseDeps.length+' 被依赖)</div>'+
    '<div style="font-size:9px;color:#66708a;margin-bottom:4px">← 上游依赖：</div>'+depList+
    '<div style="font-size:9px;color:#66708a;margin-bottom:4px;margin-top:6px">↓ 下游被依赖：</div>'+revList+
    '</div>'+

    '<div class="dp-section">'+
    '<div class="dp-sectitle">🛡 风险评估</div>'+
    '<div class="dp-row"><span class="l">风险等级</span><span class="r" style="color:'+rl.col+'">'+rl.text+'</span></div>'+
    '<div class="dp-row"><span class="l">风险评分</span><span class="r">'+a.riskScore+'/100</span></div>'+
    '<div class="dp-row"><span class="l">迁移建议</span><span class="r">'+migLabels[mig]+'</span></div>'+
    '<div class="dp-row"><span class="l">引用文件数</span><span class="r">'+a.files+'</span></div>'+
    '</div>'+

    '<div class="dp-section" style="padding-bottom:20px">'+
    '<div class="dp-sectitle">📁 代表性文件</div>'+
    '<div class="dp-file">' + sampleFiles + '</div>'+
    '<div class="dp-file" style="color:#66708a;margin-top:4px">… 共 ' + a.files + ' 个文件引用</div>'+
    '</div>';

  panel.classList.add('open');

  // Highlight edges
  allEdges.forEach(function(e) {
    var ed = e.userData;
    var isIn = ed.from === a.id || ed.to === a.id;
    e.material.opacity = isIn ? 0.5 : 0.08;
    e.material.color.setStyle(isIn ? RISK_COL[a.risk] : '#1f2a44');
  });

  // Fly camera to node
  var p = a.tp;
  var startTarget = { x: controls.target.x, y: controls.target.y, z: controls.target.z };
  var endTarget = { x: p.x, y: p.y, z: p.z };
  var timer = 0;
  function flyCam() {
    timer += 0.03; var t = Math.min(timer, 1);
    t = t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t+2,2)/2;
    controls.target.x = startTarget.x + (endTarget.x - startTarget.x) * t;
    controls.target.y = startTarget.y + (endTarget.y - startTarget.y) * t;
    controls.target.z = startTarget.z + (endTarget.z - startTarget.z) * t;
    if (t < 1) requestAnimationFrame(flyCam);
  }
  flyCam();
}

window.closePanel = function() {
  document.getElementById('drill-panel').classList.remove('open');
  activeAlgo = null;
  allEdges.forEach(function(e) {
    var w = e.userData.weight || 1;
    e.material.opacity = 0.15 + 0.05*w;
    e.material.color.setStyle(CAT_COL[e.userData.toNode.cat] || '#66708a');
  });
  document.getElementById('hint').classList.remove('fade');
};

// ═══════ Animate ═══════
function animate() { requestAnimationFrame(animate); controls.update(); renderer.render(scene, camera); }
window.addEventListener('resize', function() { W=innerWidth;H=innerHeight;camera.aspect=W/H;camera.updateProjectionMatrix();renderer.setSize(W,H); });
animate();
console.log('✅ Dependency Drill-Down — ' + ALGOS.length + ' algorithms, ' + allEdges.length + ' edges, click to explore');
})();
</script>
</body>
</html>
