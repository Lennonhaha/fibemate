<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FIBEMATE · 可视化仪表盘</title>
<meta name="description" content="FIBEMATE 后量子密码学可视化索引 — 26 个交互式 3D 仪表盘，从数学到代码到硬件">
<style>
:root {
  --bg: #0a0a1a; --card-bg: #111128; --border: #1e1e3f;
  --text: #e0e0f0; --muted: #8888aa; --accent: #a78bfa; --accent2: #60a5fa;
  --green: #34d399; --amber: #fbbf24; --red: #f87171;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  background: var(--bg); color: var(--text);
  min-height: 100vh; line-height: 1.6;
}
.container { max-width: 1200px; margin: 0 auto; padding: 2rem 1.5rem; }

h1 { font-size: 2.2rem; background: linear-gradient(135deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 0.3rem; }
.subtitle { color: var(--muted); font-size: 1.05rem; margin-bottom: 1.5rem; }
.stats { display: flex; gap: 1.5rem; margin-bottom: 2rem; flex-wrap: wrap; }
.stat { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 1rem 1.5rem; text-align: center; min-width: 100px; }
.stat-num { font-size: 1.8rem; font-weight: 700; color: var(--accent); }
.stat-label { font-size: 0.8rem; color: var(--muted); margin-top: 0.2rem; }

.filter-bar { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
.filter-btn { background: var(--card-bg); border: 1px solid var(--border); color: var(--muted); padding: 0.4rem 0.9rem; border-radius: 8px; cursor: pointer; font-size: 0.85rem; transition: all 0.2s; }
.filter-btn:hover, .filter-btn.active { color: var(--text); border-color: var(--accent); }
.filter-btn.active { background: rgba(167,139,250,0.12); }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1rem; }
.card {
  background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px;
  padding: 1.3rem; transition: all 0.2s; cursor: pointer; text-decoration: none; color: inherit;
  display: block; position: relative; overflow: hidden;
}
.card:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: 0 8px 32px rgba(167,139,250,0.08); }
.card::before { content: ''; position: absolute; top: 0; left: 0; width: 3px; height: 100%; border-radius: 3px 0 0 3px; }
.card.cat-scorecard::before { background: var(--accent); }
.card.cat-dashboard::before { background: var(--accent2); }
.card.cat-analysis::before { background: var(--green); }
.card.cat-trend::before { background: var(--amber); }
.card.cat-overview::before { background: var(--red); }
.card-tag { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin-bottom: 0.4rem; }
.card-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 0.4rem; }
.card-desc { font-size: 0.85rem; color: var(--muted); line-height: 1.5; }

footer { text-align: center; color: var(--muted); font-size: 0.8rem; margin-top: 3rem; padding-top: 1.5rem; border-top: 1px solid var(--border); }
footer a { color: var(--accent); text-decoration: none; }
</style>
</head>
<body>
<div class="container">

<h1>FIBEMATE 可视化仪表盘</h1>
<p class="subtitle">26 个交互式 3D 可视化 — 从数学到代码到硬件，一站式探索后量子密码学</p>

<div class="stats">
  <div class="stat"><div class="stat-num">14</div><div class="stat-label">可视化页面</div></div>
  <div class="stat"><div class="stat-num">12</div><div class="stat-label">密码算法</div></div>
  <div class="stat"><div class="stat-num">77.30</div><div class="stat-label">CARS 评分</div></div>
  <div class="stat"><div class="stat-num">63.70</div><div class="stat-label">IBM 七维</div></div>
</div>

<div class="filter-bar">
  <button class="filter-btn active" onclick="filter('all')">全部</button>
  <button class="filter-btn" onclick="filter('scorecard')">🎯 评分卡</button>
  <button class="filter-btn" onclick="filter('dashboard')">📊 仪表盘</button>
  <button class="filter-btn" onclick="filter('analysis')">🔬 分析</button>
  <button class="filter-btn" onclick="filter('trend')">📈 趋势</button>
  <button class="filter-btn" onclick="filter('overview')">🗺️ 全景</button>
</div>

<div class="grid" id="grid">
</div>

<footer>
  <p>FIBEMATE v3.3.0 · GPL-3.0-only · <a href="https://fibemate.net">fibemate.net</a> · <a href="https://github.com/Lennonhaha/fibemate">GitHub</a></p>
</footer>
</div>

<script>
var pages = [
  { cat:'scorecard', title:'CARS 五维雷达', desc:'5 维度 3D 雷达图 · 键盘控制 (1-5/S/R/E) · 证据面板 · CARS 77.30', href:'cars-radar.html' },
  { cat:'scorecard', title:'IBM 七维雷达', desc:'7 维度加权评分雷达 · IBM 63.70 HIGH · D7 可观测性 92', href:'ibm-seven-radar.html' },
  { cat:'scorecard', title:'CARS vs IBM 双雷达', desc:'双框架并排 3D 对比 · CARS vs IBM 各维度差距', href:'cars-vs-ibm.html' },
  { cat:'dashboard', title:'PQC 就绪度仪表盘', desc:'算法覆盖率 · KAT · TVLA · 风险矩阵 · 14 列可排序表', href:'pqc-dashboard.html' },
  { cat:'dashboard', title:'PQC 性能基准', desc:'5 算法 × 4 后端 · 对数刻度 · 48µs→4.2s 跨度', href:'pqc-benchmark.html' },
  { cat:'dashboard', title:'双后端性能对比', desc:'C Native vs 纯 JS · µs 级精度 · 10 算法', href:'backend-benchmark.html' },
  { cat:'dashboard', title:'经典 vs PQC 并排', desc:'8 维度并排 3D 对比 · 引用文件数 · 红紫着色', href:'classic-vs-pqc.html' },
  { cat:'analysis', title:'TVLA 状态看板', desc:'5 算法 · 31/36 PASS · |t| 值 · 展开详情 · PASS/FAIL 徽章', href:'tvla-dashboard.html' },
  { cat:'analysis', title:'供应链依赖风险图', desc:'12 节点 · 21 边 · 370 文件 · 风险着色', href:'supply-chain-risk.html' },
  { cat:'analysis', title:'依赖深度下钻', desc:'点击节点 → 全维详情面板 · 摄像机飞向 · 上下游双列表', href:'dependency-drilldown.html' },
  { cat:'analysis', title:'FPGA 资源热力图', desc:'LUT/FF/BRAM/DSP · A7-35T · WNS 9.755ns · 43 测试', href:'fpga-heatmap.html' },
  { cat:'trend', title:'CARS/IBM 评分趋势', desc:'双线 3D 时间轴 · CatmullRom 平滑 · 16 里程碑', href:'cars-ibm-trend.html' },
  { cat:'trend', title:'项目演进螺旋', desc:'25 里程碑 · 4 阶段 · 进度动画', href:'project-timeline.html' },
  { cat:'overview', title:'3D 算法族谱树', desc:'18 节点 · 6 分支 · 径向布局 · 可拖拽旋转', href:'algo-family-tree.html' },
  { cat:'overview', title:'PQC 安全等级对比', desc:'10 算法 · 4 可切换指标 · FIPS 203/204/205 参考', href:'pqc-security-levels.html' },
];

function render(filterCat) {
  var html = '';
  var filtered = filterCat === 'all' ? pages : pages.filter(function(p){return p.cat===filterCat;});
  filtered.forEach(function(p){
    html += '<a class="card cat-'+p.cat+'" href="'+p.href+'">'
      + '<div class="card-tag">'+({scorecard:'🎯 评分卡',dashboard:'📊 仪表盘',analysis:'🔬 分析',trend:'📈 趋势',overview:'🗺️ 全景'})[p.cat]+'</div>'
      + '<div class="card-title">'+p.title+'</div>'
      + '<div class="card-desc">'+p.desc+'</div>'
      + '</a>';
  });
  document.getElementById('grid').innerHTML = html;
}

function filter(cat) {
  document.querySelectorAll('.filter-btn').forEach(function(b){b.classList.toggle('active',b.textContent.includes({all:'全部',scorecard:'评分卡',dashboard:'仪表盘',analysis:'分析',trend:'趋势',overview:'全景'}[cat]));});
  render(cat);
}

render('all');
</script>
</body>
</html>
