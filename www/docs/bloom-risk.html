    function onMouseMove(e) {
        var rect = renderer.domElement.getBoundingClientRect();
        mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
        mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

        raycaster.setFromCamera(mouse, camera);
        var intersects = raycaster.intersectObjects(nodes);
        if (intersects.length > 0) {
            var obj = intersects[0].object;
            if (obj.userData.algo) {
                renderer.domElement.style.cursor = 'pointer';
                tt.style.display = 'block';
                tt.style.left = (e.clientX - container.getBoundingClientRect().left + 16) + 'px';
                tt.style.top = (e.clientY - container.getBoundingClientRect().top - 20) + 'px';
                tt.innerHTML = '<div style="font-size:14px;font-weight:700;color:'+(ALGO_COLORS[obj.userData.algo]||'#fff')+';">'+obj.userData.algo+'</div>' +
                    '<div style="font-size:11px;color:#94a3b8;">爆炸半径: <b>'+obj.userData.br+'</b> 文件</div>' +
                    '<div style="font-size:9px;color:#64748b;margin-top:2px;">点击查看详情</div>';
            }
        } else {
            renderer.domElement.style.cursor = 'grab';
            tt.style.display = 'none';
        }
    }

    function onClick(e) {
        var rect = renderer.domElement.getBoundingClientRect();
        mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
        mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
        raycaster.setFromCamera(mouse, camera);
        var intersects = raycaster.intersectObjects(nodes);
        if (intersects.length > 0) {
            var algo = intersects[0].object.userData.algo;
            if (algo) showAlgoDetails(algo);
        }
    }

    renderer.domElement.addEventListener('mousemove', onMouseMove);
    renderer.domElement.addEventListener('click', onClick);

    function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', function() {
        camera.aspect = container.clientWidth/container.clientHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(container.clientWidth, container.clientHeight);
    });
})();

// ═══════════ Blast Radius Cards ═══════════
(function() {
    var container = document.getElementById('br-cards');
    var entries = Object.entries(BLOOM.blastRadius).sort(function(a,b) { return b[1].total - a[1].total; });
    var maxTotal = entries[0][1].total;
    entries.forEach(function(e) {
        var a = e[0], d = e[1];
        var color = ALGO_COLORS[a] || '#888';
        container.innerHTML +=
            '<div class="br-card" onclick="showAlgoDetails(\''+a.replace(/'/g,"\\'")+'\')" style="border-color:'+color+'44;min-width:100px;">' +
                '<div class="br-algo" style="color:'+color+';">'+a+'</div>' +
                '<div class="br-bar-bg"><div class="br-bar" style="width:'+(d.total/maxTotal*100)+'%;background:'+color+';"></div></div>' +
                '<div class="br-num">💥 '+d.total+' 文件 ('+d.direct+'直接 + '+d.indirect+'传染)</div>' +
            '</div>';
    });
})();

// ═══════════ Side Panel ═══════════
window.showAlgoDetails = function(algo) {
    var side = document.getElementById('side');
    var br = BLOOM.blastRadius[algo] || { direct:0, indirect:0, total:0 };
    var color = ALGO_COLORS[algo] || '#00d4ff';
    var risk = ALGO_RISK[algo] || 'safe';
    var riskEmoji = risk==='vulnerable'?'🔴':risk==='transition'?'⚠️':'✅';
    var riskText = risk==='vulnerable'?'量子脆弱 — Shor 算法可破解':risk==='transition'?'需关注 — 当前混合模式可用':'量子安全 — NIST 标准化';

    document.getElementById('side-title').innerHTML = '<span style="color:'+color+';">'+algo+'</span> '+riskEmoji;
    document.getElementById('side-subtitle').innerHTML = riskText + ' · 爆炸半径 <b style="color:'+color+';">'+br.total+'</b> 文件（'+br.direct+'直接 + '+br.indirect+'间接）';

    var list = document.getElementById('side-list');
    var allDirect = (br.directFiles || []).slice();
    var allIndirect = (br.indirectFiles || []).slice();
    var dr = br.downstreamAlgos || [];

    function renderFiles(filter) {
        filter = (filter || '').toLowerCase();
        var fd = allDirect.filter(function(f) { return !filter || f.toLowerCase().indexOf(filter)>=0; });
        var fi = allIndirect.filter(function(f) { return !filter || f.toLowerCase().indexOf(filter)>=0; });
        var showAll = fd.length <= 30 && fi.length <= 10;
        var displayD = showAll ? fd : fd.slice(0, 20);
        var displayI = showAll ? fi : fi.slice(0, 10);

        var html = '';
        if (dr.length > 0) {
            html += '<div style="font-size:10px;color:#ffa94d;margin-bottom:8px;padding:8px;background:rgba(255,152,0,0.08);border-radius:6px;">🔗 下游传染算法: ' + dr.map(function(a){return '<b style="color:'+(ALGO_COLORS[a]||'#ffa94d')+';">'+a+'</b>';}).join(', ') + '</div>';
        }
        html += '<input type="text" placeholder="🔍 搜索文件…" style="width:100%;padding:6px 10px;background:#1a1a30;border:1px solid #2a2a4a;border-radius:6px;color:#e0e0e0;font-size:10px;margin-bottom:10px;outline:none;" oninput="var f=document.getElementById(\'side-list\');f.setAttribute(\'data-filter\',this.value);showAlgoDetails(\''+algo.replace(/'/g,"\\'")+'\')" value="'+(filter||'')+'">';

        if (displayD.length > 0) {
            html += '<div style="font-size:11px;font-weight:600;color:#51cf66;margin-bottom:6px;">📁 直接使用 ('+fd.length+' 个'+(showAll?'':', 显示前20')+')</div>';
            displayD.forEach(function(f) { html += '<div class="side-item"><div class="fpath">'+f+'</div></div>'; });
            if (!showAll) html += '<div style="font-size:10px;color:#64748b;text-align:center;padding:6px;">… 还有 '+(fd.length-20)+' 个文件（用搜索过滤缩小范围）</div>';
        }
        if (displayI.length > 0) {
            html += '<div style="font-size:11px;font-weight:600;color:#ffa94d;margin:12px 0 6px;">🔗 间接依赖 ('+fi.length+' 个'+(showAll?'':', 显示前10')+')</div>';
            displayI.forEach(function(f) { html += '<div class="side-item"><div class="fpath" style="color:#ffa94d;">'+f+'</div></div>'; });
            if (!showAll) html += '<div style="font-size:10px;color:#64748b;text-align:center;padding:6px;">… 还有 '+(fi.length-10)+' 个文件</div>';
        }
        if (fd.length===0 && fi.length===0 && filter) {
            html += '<div style="padding:20px;text-align:center;color:#64748b;">没有匹配 "'+filter+'" 的文件</div>';
        }
        return html;
    }

    list.innerHTML = renderFiles(list.getAttribute('data-filter') || '');
    side.classList.add('open');
};

window.closeSide = function() {
    document.getElementById('side').classList.remove('open');
};

window.showAlgoDetails = window.showAlgoDetails;
window.closeSide = window.closeSide;
</script>
