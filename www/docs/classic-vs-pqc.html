<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>经典 vs PQC 并排对比 · FIBEMATE</title>
<meta name="description" content="经典密码学 vs 后量子密码学 — 安全等级/密钥尺寸/性能/算法数量 四维并排对比">
<style>
:root { --bg:#0b0f19; --card:#131827; --border:#1f2a44; --text:#b8c0d0; --classic:#ffa94d; --pqc:#c792ea; --accent:#0ea5e9; }
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif; background:var(--bg); color:var(--text); overflow:hidden; height:100vh; }
#canvas-container { position:fixed; inset:0; }

/* Overlay */
#overlay { position:fixed; z-index:10; top:12px; left:50%; transform:translateX(-50%); display:flex; gap:16px; }
.card { background:rgba(19,24,39,0.85); backdrop-filter:blur(12px); border:1px solid var(--border); border-radius:12px; padding:14px 22px; text-align:center; min-width:130px; }
.card h3 { font-size:11px; letter-spacing:1px; margin-bottom:4px; }
.card .big { font-size:30px; font-weight:800; }
.card .sub { font-size:10px; color:#66708a; margin-top:2px; }
.classic-card h3,.classic-card .big { color:var(--classic); }
.pqc-card h3,.pqc-card .big { color:var(--pqc); }

#legend { position:fixed; z-index:10; bottom:20px; left:50%; transform:translateX(-50%); display:flex; gap:16px; background:rgba(19,24,39,0.85); backdrop-filter:blur(12px); border:1px solid var(--border); border-radius:20px; padding:8px 20px; font-size:11px; }
.leg-item { display:flex; align-items:center; gap:6px; }
.leg-dot { width:10px; height:10px; border-radius:50%; }
.leg-dot.classic { background:var(--classic); box-shadow:0 0 6px var(--classic); }
.leg-dot.pqc { background:var(--pqc); box-shadow:0 0 6px var(--pqc); }

#tooltip { display:none; position:fixed; z-index:20; pointer-events:none; background:rgba(11,15,25,0.95); border:1px solid var(--border); border-radius:8px; padding:8px 12px; font-size:10px; color:var(--text); max-width:220px; }
#tooltip .head { font-size:12px; font-weight:600; margin-bottom:4px; }
#tooltip .row { display:flex; justify-content:space-between; gap:16px; color:#66708a; }
#tooltip .row .val { color:#d0d6e6; font-weight:600; }
#tooltip .row .hi { font-size:12px; }

#footer { position:fixed; z-index:10; bottom:12px; right:16px; font-size:10px; color:#66708a; }
#footer a { color:var(--accent); text-decoration:none; }
</style>
</head>
<body>

<div id="canvas-container"></div>

<div id="overlay">
  <div class="card classic-card">
    <h3>🔶 经典密码学</h3>
    <div class="big">6</div>
    <div class="sub">RSA · ECDH · AES · SM2 · SM4 · SHA-2</div>
  </div>
  <div class="card" style="min-width:80px">
    <div class="big" style="color:#66708a;font-size:20px">vs</div>
    <div class="sub">四维对比</div>
  </div>
  <div class="card pqc-card">
    <h3>🔮 后量子密码学</h3>
    <div class="big">3</div>
    <div class="sub">ML-KEM · ML-DSA · SLH-DSA</div>
  </div>
</div>

<div id="legend">
  <div class="leg-item"><div class="leg-dot classic"></div> 经典 (预量子)</div>
  <div class="leg-item"><div class="leg-dot pqc"></div> PQC (后量子)</div>
  <span style="color:#66708a;margin-left:8px">🖱 拖拽旋转 · 滚轮缩放 · 右键平移 · 悬停详情</span>
</div>

<div id="footer">
  <a href="/docs/pqc-dashboard.html">PQC 仪表盘</a> ·
  <a href="/docs/cbom-graph.html">CBOM 图</a> ·
  <a href="/docs/cars-radar.html">CARS</a>
</div>

<div id="tooltip"></div>

<script src="lib/three.min.js?v=20260803"></script>
<script src="lib/OrbitControls.js?v=20260803"></script>

<script>
(function() {
  if (typeof THREE === 'undefined') {
    document.body.innerHTML = '<div style="color:#e44;padding:40px;text-align:center;margin-top:20vh"><b>✕</b> THREE.js 未加载</div>';
    return;
  }

  // ═══════ Data — 4 dimensions, each with classic + pqc bars ═══════
  var CLASSIC_COLOR = '#ffa94d';
  var PQC_COLOR = '#c792ea';

  // Categories (X axis stations)
  var DIMENSIONS = [
    { id:'algos', label:'算法数量', unit:'种', classic:6, pqc:3, max:10 },
    { id:'classical', label:'经典安全位', unit:'bits', classic:128, pqc:128, max:256, note:'相同安全等级' },
    { id:'quantum', label:'量子安全位', unit:'bits', classic:0, pqc:128, max:200, note:'经典=0 (Shor)' },
    { id:'keySize', label:'密钥大小', unit:'B', classic:32, pqc:2400, max:2400, note:'SK Size' },
    { id:'ctSize', label:'密文开销', unit:'B', classic:65, pqc:1088, max:1200, note:'PK/CT Size' },
    { id:'perf', label:'操作速度', unit:'ops/s', classic:8041, pqc:4120, max:10000, note:'encap/encrypt' },
    { id:'standards', label:'标准成熟度', unit:'%', classic:100, pqc:85, max:100, note:'FIPS/NIST 发布状态' },
    { id:'files', label:'代码引用', unit:'处', classic:204, pqc:166, max:250, note:'CBOM 依赖计数' },
  ];

  var N = DIMENSIONS.length;

  // ═══════ Scene ═══════
  var W = window.innerWidth, H = window.innerHeight;
  var scene = new THREE.Scene();
  scene.background = new THREE.Color('#0b0f19');
  scene.fog = new THREE.Fog('#0b0f19', 20, 60);

  var camera = new THREE.PerspectiveCamera(45, W/H, 0.5, 100);
  camera.position.set(0, 5, 22);
  camera.lookAt(0, 0, 0);

  var renderer = new THREE.WebGLRenderer({ antialias:true, alpha:false });
  renderer.setSize(W, H);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.3;
  document.getElementById('canvas-container').appendChild(renderer.domElement);

  var controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.autoRotate = true;
  controls.autoRotateSpeed = 0.3;
  controls.minDistance = 6;
  controls.maxDistance = 50;
  controls.target.set((N-1)*0.9, 0, 0);
  controls.update();

  // Lighting
  scene.add(new THREE.AmbientLight('#334466', 2.5));
  var dLight = new THREE.DirectionalLight('#ccddff', 2.5);
  dLight.position.set(10, 15, 12);
  scene.add(dLight);
  var bLight = new THREE.DirectionalLight('#556688', 1.0);
  bLight.position.set(-8, 3, -5);
  scene.add(bLight);

  // Floor
  var floorGeo = new THREE.PlaneGeometry(N*3.5, 16);
  var floorMat = new THREE.MeshStandardMaterial({ color:'#111522', roughness:0.9, metalness:0 });
  var floor = new THREE.Mesh(floorGeo, floorMat);
  floor.rotation.x = -Math.PI/2;
  floor.position.set((N-1)*0.9, -0.02, 0);
  floor.receiveShadow = true;
  scene.add(floor);

  // ═══════ Stars + grid ═══════
  var starsGeo = new THREE.BufferGeometry();
  var starPos = new Float32Array(200*3);
  for (var i=0;i<200*3;i+=3){starPos[i]=(Math.random()-0.5)*35;starPos[i+1]=(Math.random()-0.5)*20;starPos[i+2]=(Math.random()-0.5)*25;}
  starsGeo.setAttribute('position', new THREE.BufferAttribute(starPos,3));
  scene.add(new THREE.Points(starsGeo, new THREE.PointsMaterial({color:'#334466',size:0.05,transparent:true,opacity:0.4})));

  // ═══════ Build bars ═══════
  var stationGap = 2.0;
  var barW = 0.5;
  var barDepth = 0.7;
  var barGap = 0.2;
  var maxBarH = 8;
  var allBars = [];

  for (var di=0; di<N; di++) {
    var dim = DIMENSIONS[di];
    var cx = di * stationGap;
    var max = dim.max;

    // Classic bar (left side of station)
    var ch = (dim.classic / max) * maxBarH;
    if (ch < 0.05) ch = 0.05; // 0 bits → tiny but visible
    var cGeo = new THREE.BoxGeometry(barW, ch, barDepth, 1, 1, 1);
    var cMat = new THREE.MeshStandardMaterial({
      color: new THREE.Color(CLASSIC_COLOR),
      roughness: 0.3, metalness: 0.5,
      emissive: new THREE.Color(CLASSIC_COLOR), emissiveIntensity: 0.2,
    });
    var cBar = new THREE.Mesh(cGeo, cMat);
    cBar.position.set(cx - barW/2 - barGap/2, ch/2, 0);
    cBar.castShadow = true;
    cBar.userData = { dim:dim, side:'classic', value:dim.classic, height:ch };
    scene.add(cBar);
    allBars.push(cBar);

    // PQC bar (right side of station)
    var ph = (dim.pqc / max) * maxBarH;
    if (ph < 0.05) ph = 0.05;
    var pGeo = new THREE.BoxGeometry(barW, ph, barDepth, 1, 1, 1);
    var pMat = new THREE.MeshStandardMaterial({
      color: new THREE.Color(PQC_COLOR),
      roughness: 0.3, metalness: 0.5,
      emissive: new THREE.Color(PQC_COLOR), emissiveIntensity: 0.2,
    });
    var pBar = new THREE.Mesh(pGeo, pMat);
    pBar.position.set(cx + barW/2 + barGap/2, ph/2, 0);
    pBar.castShadow = true;
    pBar.userData = { dim:dim, side:'pqc', value:dim.pqc, height:ph };
    scene.add(pBar);
    allBars.push(pBar);

    // Glow edge outlines
    [cGeo,pGeo].forEach(function(g, idx) {
      var eGeo = new THREE.EdgesGeometry(g);
      var eLine = new THREE.LineSegments(eGeo,
        new THREE.LineBasicMaterial({ color:idx===0?CLASSIC_COLOR:PQC_COLOR, transparent:true, opacity:0.25 })
      );
      eLine.position.copy(idx===0?cBar.position:pBar.position);
      scene.add(eLine);
    });

    // Top cap gems
    var gemGeo = new THREE.OctahedronGeometry(0.12, 0);
    [
      {pos:cBar.position.clone().add(new THREE.Vector3(0,ch/2,0)), color:CLASSIC_COLOR},
      {pos:pBar.position.clone().add(new THREE.Vector3(0,ph/2,0)), color:PQC_COLOR},
    ].forEach(function(g){
      var gem = new THREE.Mesh(gemGeo, new THREE.MeshStandardMaterial({
        color:new THREE.Color(g.color), roughness:0.1, metalness:0.8,
        emissive:new THREE.Color(g.color), emissiveIntensity:0.5
      }));
      gem.position.copy(g.pos);
      scene.add(gem);
    });

    // Station label (small sphere on floor)
    var lblGeo = new THREE.SphereGeometry(0.08, 6, 4);
    var lblDot = new THREE.Mesh(lblGeo, new THREE.MeshBasicMaterial({ color:'#66708a' }));
    lblDot.position.set(cx, 0.03, -1.2);
    scene.add(lblDot);
  }

  // ═══════ Central divider pillars ═══════
  for (var di=0; di<N; di++) {
    var pillarGeo = new THREE.CylinderGeometry(0.03, 0.03, maxBarH+1, 8);
    var pillar = new THREE.Mesh(pillarGeo, new THREE.MeshStandardMaterial({
      color:'#1f2a44', roughness:0.8, metalness:1, emissive:'#0a0f1f', emissiveIntensity:0.3
    }));
    pillar.position.set(di*stationGap, maxBarH/2, 0);
    scene.add(pillar);
  }

  // ═══════ Value labels on top of each bar ═══════
  function makeTextSprite(text, pos, color) {
    var canvas = document.createElement('canvas');
    canvas.width = 128; canvas.height = 64;
    var ctx = canvas.getContext('2d');
    ctx.fillStyle = color; ctx.font = 'bold 22px "Segoe UI","PingFang SC",sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(text, 64, 38);
    var tex = new THREE.CanvasTexture(canvas);
    tex.minFilter = THREE.LinearFilter;
    var mat = new THREE.SpriteMaterial({ map:tex, transparent:true, opacity:0.8, depthTest:false, depthWrite:false });
    var sprite = new THREE.Sprite(mat);
    sprite.position.copy(pos);
    sprite.scale.set(1.6, 0.6, 1);
    return sprite;
  }

  for (var di=0; di<N; di++) {
    var dim = DIMENSIONS[di];
    var cx = di * stationGap;
    var max = dim.max;
    var ch = (dim.classic/max)*maxBarH;
    var ph = (dim.pqc/max)*maxBarH;
    scene.add(makeTextSprite(dim.classic+dim.unit, new THREE.Vector3(cx-barW/2-barGap/2, ch+0.5, 0), CLASSIC_COLOR));
    scene.add(makeTextSprite(dim.pqc+dim.unit, new THREE.Vector3(cx+barW/2+barGap/2, ph+0.5, 0), PQC_COLOR));
    // Dimension label
    scene.add(makeTextSprite(dim.label, new THREE.Vector3(cx, -1.0, 0), '#66708a'));
  }

  // Side labels at scene edges
  scene.add(makeTextSprite('经典', new THREE.Vector3(-2, 5, 0), CLASSIC_COLOR));
  scene.add(makeTextSprite('PQC', new THREE.Vector3((N-1)*stationGap+2, 5, 0), PQC_COLOR));

  // ═══════ Raycaster ═══════
  var tooltip = document.getElementById('tooltip');
  var raycaster = new THREE.Raycaster();
  var mouse = new THREE.Vector2();
  var hovered = null;

  window.addEventListener('mousemove', function(ev) {
    mouse.x = (ev.clientX/W)*2-1;
    mouse.y = -(ev.clientY/H)*2+1;
    raycaster.setFromCamera(mouse, camera);
    var hits = raycaster.intersectObjects(allBars);
    if (hits.length>0) {
      var d = hits[0].object.userData;
      if (hovered !== hits[0].object) {
        if (hovered) hovered.material.emissiveIntensity=0.2;
        hovered = hits[0].object;
        hovered.material.emissiveIntensity = 0.8;
        document.body.style.cursor = 'pointer';
      }
      var col = d.side==='classic'?CLASSIC_COLOR:PQC_COLOR;
      tooltip.style.display = 'block';
      tooltip.innerHTML = '<div class="head" style="color:'+col+'">'+
        (d.side==='classic'?'🔶 经典':'🔮 PQC')+' · '+d.dim.label+'</div>'+
        '<div class="row"><span>数值</span><span class="val hi">'+d.value+d.dim.unit+'</span></div>'+
        '<div class="row"><span>对比</span><span class="val" style="font-size:10px;color:'+col+'">'+
        (d.side==='classic'?'经典级':'PQC级')+'</span></div>'+
        (d.dim.note?'<div class="row" style="font-size:10px;margin-top:4px;color:#8890a8">'+d.dim.note+'</div>':'');
      tooltip.style.left = (ev.clientX+16)+'px';
      tooltip.style.top = (ev.clientY-60)+'px';
    } else {
      if (hovered) { hovered.material.emissiveIntensity=0.2; hovered=null; }
      document.body.style.cursor = '';
      tooltip.style.display = 'none';
    }
  });

  // ═══════ Animate ═══════
  function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
  }
  window.addEventListener('resize', function() {
    W = window.innerWidth; H = window.innerHeight;
    camera.aspect = W/H; camera.updateProjectionMatrix();
    renderer.setSize(W, H);
  });
  animate();
  console.log('✅ Classic vs PQC — 4-dim side-by-side loaded');
})();
</script>
</body>
</html>
