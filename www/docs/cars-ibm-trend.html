<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CARS/IBM 评分历史趋势 · FIBEMATE</title>
<meta name="description" content="CARS 62→75.20 / IBM 39→62.50 — 双框架评分随时间演进的 3D 折线趋势图">
<style>
:root { --bg:#0b0f19; --text:#b8c0d0; --cars:#51cf66; --ibm:#c792ea; }
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif; background:var(--bg); color:var(--text); overflow:hidden; height:100vh; }
#canvas-container { position:fixed; inset:0; }
#overlay { position:fixed; z-index:10; top:12px; left:50%; transform:translateX(-50%); display:flex; gap:20px; }
.chip { background:rgba(19,24,39,0.85); backdrop-filter:blur(12px); border:1px solid #1f2a44; border-radius:12px; padding:12px 20px; text-align:center; min-width:110px; }
.chip h3 { font-size:11px; letter-spacing:0.5px; margin-bottom:4px; }
.chip .val { font-size:26px; font-weight:800; }
.chip .delta { font-size:10px; color:#66708a; margin-top:2px; }
.cars-chip h3,.cars-chip .val { color:var(--cars); }
.ibm-chip h3,.ibm-chip .val { color:var(--ibm); }

#legend { position:fixed; z-index:10; bottom:20px; left:50%; transform:translateX(-50%); display:flex; gap:20px; background:rgba(19,24,39,0.85); backdrop-filter:blur(12px); border:1px solid #1f2a44; border-radius:20px; padding:8px 20px; font-size:11px; }
.leg { display:flex; align-items:center; gap:6px; }
.leg-dot { width:10px; height:10px; border-radius:50%; }
.leg-dot.cars { background:var(--cars); box-shadow:0 0 6px var(--cars); }
.leg-dot.ibm { background:var(--ibm); box-shadow:0 0 6px var(--ibm); }

#tooltip { display:none; position:fixed; z-index:20; pointer-events:none; background:rgba(11,15,25,0.95); border:1px solid #1f2a44; border-radius:8px; padding:8px 12px; font-size:10px; color:#b8c0d0; }

#footer { position:fixed; z-index:10; bottom:12px; right:16px; font-size:10px; color:#66708a; }
#footer a { color:#0ea5e9; text-decoration:none; }
</style>
</head>
<body>

<div id="canvas-container"></div>

<div id="overlay">
  <div class="chip cars-chip">
    <h3>🔵 CARS 五维</h3>
    <div class="val">75.20</div>
    <div class="delta">62 → 75.20 (+13.20)</div>
  </div>
  <div class="chip" style="min-width:60px">
    <div class="val" style="color:#66708a;font-size:18px">+13/+23</div>
    <div class="delta">总提升</div>
  </div>
  <div class="chip ibm-chip">
    <h3>🟣 IBM 七维</h3>
    <div class="val">62.50</div>
    <div class="delta">39 → 62.50 (+23.10)</div>
  </div>
</div>

<div id="legend">
  <div class="leg"><div class="leg-dot cars"></div> CARS (0-100)</div>
  <div class="leg"><div class="leg-dot ibm"></div> IBM (0-100)</div>
  <span style="color:#66708a;margin-left:8px">🖱 拖拽旋转 · 滚轮缩放 · 右键平移 · 悬停节点</span>
</div>

<div id="footer">
  <a href="/docs/cars-radar.html">CARS 详情</a> ·
  <a href="/docs/ibm-seven-radar.html">IBM 详情</a> ·
  <a href="/docs/cars-vs-ibm.html">双框架对比</a>
</div>

<div id="tooltip"></div>

<script src="lib/three.min.js?v=20260803"></script>
<script src="lib/OrbitControls.js?v=20260803"></script>

<script>
(function() {
  if (typeof THREE === 'undefined') {
    document.body.innerHTML = '<div style="color:#e44;padding:40px;text-align:center;margin-top:20vh"><b>✕</b> THREE.js 未加载</div>';
    return;
  }

  // ═══════ Historical data ═══════
  var CARS_COLOR = '#51cf66';
  var IBM_COLOR = '#c792ea';

  var CARS_HISTORY = [
    { date:'2026-07-25', label:'项目评价 v9.3', score:62.00, note:'初始基线: CI 85/AA 30/KL 60/PC 45/OR 70' },
    { date:'2026-07-31', label:'宏观评估', score:63.50, note:'修正 v3 scorecard bias 分析' },
    { date:'2026-08-02T15:00', label:'P1-A 算法注册表', score:66.00, note:'12 算法 npm 包 + IBM D5/D7 +13' },
    { date:'2026-08-02T21:00', label:'P2 OpenSSF + 评分重校准', score:69.20, note:'AA 45→53, PC 55→63' },
    { date:'2026-08-03T07:00', label:'KL 密钥生命周期', score:71.60, note:'KL 70→82, 引擎 27/27 PASS' },
    { date:'2026-08-03T08:00', label:'AA AlgorithmResolver', score:73.20, note:'AA 53→61, resolver 35/35 PASS' },
    { date:'2026-08-03T08:30', label:'PC fallback 策略', score:75.20, note:'PC 63→73, gm.js 能力通告+回退' },
  ];

  var IBM_HISTORY = [
    { date:'2026-07-25', label:'项目评价 v9.3', score:39.40, note:'D1=25 D2=15 D3=40 D4=35 D5=20 D6=30 D7=65' },
    { date:'2026-07-31', label:'宏观评估', score:43.60, note:'D1→50 D3→90 D7→80, +9.20' },
    { date:'2026-08-02T21:00', label:'P1-A 算法注册表', score:60.40, note:'D1→60 D2→50 D5→60 D6→50, 等级→HIGH' },
    { date:'2026-08-03T09:00', label:'D4 格式耦合解耦', score:62.50, note:'D4 40→55, a2a-params.js 动态验证' },
  ];

  // Parse dates
  function parseDate(d) {
    var t = new Date(d);
    return isNaN(t) ? new Date(d+'T00:00:00Z') : t;
  }

  var allCARSDates = CARS_HISTORY.map(function(p){return parseDate(p.date).getTime();});
  var allIBMDates = IBM_HISTORY.map(function(p){return parseDate(p.date).getTime();});
  var tMin = Math.min(allCARSDates[0], allIBMDates[0]);
  var tMax = Math.max(allCARSDates[allCARSDates.length-1], allIBMDates[allIBMDates.length-1]);
  var tRange = tMax - tMin;

  // Map time → X coord, score → Y coord
  var X_SPAN = 16;
  var Y_MAX = 100;
  var Y_HEIGHT = 8;

  function toX(date) { return ((parseDate(date).getTime()-tMin)/tRange)*X_SPAN - X_SPAN/2; }
  function toY(score) { return (score/Y_MAX)*Y_HEIGHT; }

  // ═══════ Scene ═══════
  var W = window.innerWidth, H = window.innerHeight;
  var scene = new THREE.Scene();
  scene.background = new THREE.Color('#0b0f19');
  scene.fog = new THREE.Fog('#0b0f19', 20, 50);

  var camera = new THREE.PerspectiveCamera(45, W/H, 0.5, 100);
  camera.position.set(0, 8, 18);
  camera.lookAt(0, 3, 0);

  var renderer = new THREE.WebGLRenderer({ antialias:true, alpha:false });
  renderer.setSize(W, H);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.3;
  document.getElementById('canvas-container').appendChild(renderer.domElement);

  var controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.autoRotate = true;
  controls.autoRotateSpeed = 0.2;
  controls.minDistance = 6;
  controls.maxDistance = 50;
  controls.target.set(0, 3, 0);
  controls.update();

  // Lighting
  scene.add(new THREE.AmbientLight('#334466', 2.5));
  var dLight = new THREE.DirectionalLight('#ccddff', 2.5);
  dLight.position.set(10, 15, 12);
  scene.add(dLight);
  var bLight = new THREE.DirectionalLight('#556688', 1.0);
  bLight.position.set(-5, 3, -8);
  scene.add(bLight);

  // Floor
  var floorGeo = new THREE.PlaneGeometry(X_SPAN+4, 14);
  var floorMat = new THREE.MeshStandardMaterial({ color:'#111522', roughness:0.9, metalness:0 });
  var floor = new THREE.Mesh(floorGeo, floorMat);
  floor.rotation.x = -Math.PI/2;
  floor.position.y = -0.02;
  floor.receiveShadow = true;
  scene.add(floor);

  // Year grid labels
  var gridMat = new THREE.LineBasicMaterial({ color:'#1a2038', transparent:true, opacity:0.5 });
  for (var y=0; y<=Y_MAX; y+=20) {
    var yy = toY(y);
    var pts = [new THREE.Vector3(-X_SPAN/2-1, yy, 0.01), new THREE.Vector3(X_SPAN/2+1, yy, 0.01)];
    var geo = new THREE.BufferGeometry().setFromPoints(pts);
    scene.add(new THREE.Line(geo, gridMat));
  }

  // ═══════ Build lines ═══════
  function makeLine(history, color, zOffset) {
    var group = new THREE.Group();

    // Curve
    var pts3D = history.map(function(p){
      return new THREE.Vector3(toX(p.date), toY(p.score), zOffset);
    });
    var curve = new THREE.CatmullRomCurve3(pts3D, false, 'catmullrom', 0.5);
    var curvePts = curve.getPoints(history.length*8);
    var lineGeo = new THREE.BufferGeometry().setFromPoints(curvePts);
    var lineMat = new THREE.LineBasicMaterial({ color:new THREE.Color(color), linewidth:1 });
    group.add(new THREE.Line(lineGeo, lineMat));

    // Glow tube
    var tubeGeo = new THREE.TubeGeometry(curve, history.length*12, 0.06, 8, false);
    var tubeMat = new THREE.MeshStandardMaterial({
      color:new THREE.Color(color), roughness:0.2, metalness:0.6,
      emissive:new THREE.Color(color), emissiveIntensity:0.25, transparent:true, opacity:0.8
    });
    group.add(new THREE.Mesh(tubeGeo, tubeMat));

    // Nodes
    history.forEach(function(p){
      var pos = new THREE.Vector3(toX(p.date), toY(p.score), zOffset);
      var ndGeo = new THREE.SphereGeometry(0.18, 16, 12);
      var ndMat = new THREE.MeshStandardMaterial({
        color:new THREE.Color(color), roughness:0.1, metalness:0.7,
        emissive:new THREE.Color(color), emissiveIntensity:0.5
      });
      var node = new THREE.Mesh(ndGeo, ndMat);
      node.position.copy(pos);
      node.userData = { history:p, color:color };
      group.add(node);

      // Ring
      var ringGeo = new THREE.TorusGeometry(0.24, 0.03, 8, 24);
      var ring = new THREE.Mesh(ringGeo, new THREE.MeshBasicMaterial({
        color:new THREE.Color(color), transparent:true, opacity:0.4, depthWrite:false
      }));
      ring.position.copy(pos);
      group.add(ring);
    });

    return group;
  }

  var carsLine = makeLine(CARS_HISTORY, CARS_COLOR, -0.3);
  scene.add(carsLine);
  var ibmLine = makeLine(IBM_HISTORY, IBM_COLOR, 0.3);
  scene.add(ibmLine);

  // ═══════ Date markers on floor ═══════
  var dateLabels = ['7/25','7/31','8/2','8/2','8/3','8/3','8/3'];
  CARS_HISTORY.forEach(function(p, i){
    var x = toX(p.date);
    var dotGeo = new THREE.SphereGeometry(0.06, 6, 4);
    var dot = new THREE.Mesh(dotGeo, new THREE.MeshBasicMaterial({ color:'#66708a' }));
    dot.position.set(x, 0.01, -1.5);
    scene.add(dot);
  });

  // ═══════ Y axis ═══════
  var axisMat = new THREE.LineBasicMaterial({ color:'#1f2a44', transparent:true, opacity:0.6 });
  var axisPts = [new THREE.Vector3(-X_SPAN/2-1, 0, 0), new THREE.Vector3(-X_SPAN/2-1, Y_HEIGHT, 0)];
  scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(axisPts), axisMat));

  // Score axis rings
  for (var s=0; s<=100; s+=20) {
    var ringGeo = new THREE.TorusGeometry(0.06, 0.01, 8, 16);
    var ring = new THREE.Mesh(ringGeo, new THREE.MeshBasicMaterial({ color:'#334466' }));
    ring.position.set(-X_SPAN/2-1.1, toY(s), 0);
    scene.add(ring);
  }

  // ═══════ Progress vertical pillars ═══════
  [CARS_HISTORY, IBM_HISTORY].forEach(function(hist, idx){
    var color = idx===0?CARS_COLOR:IBM_COLOR;
    var z = idx===0?-0.3:0.3;
    hist.forEach(function(p){
      var x = toX(p.date);
      var y = toY(p.score);
      var geo = new THREE.CylinderGeometry(0.015, 0.015, y, 8);
      var mesh = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color:new THREE.Color(color), transparent:true, opacity:0.2 }));
      mesh.position.set(x, y/2, z);
      scene.add(mesh);
    });
  });

  // ═══════ Raycaster ═══════
  var tooltip = document.getElementById('tooltip');
  var raycaster = new THREE.Raycaster();
  var mouse = new THREE.Vector2();
  var hovered = null;

  var allNodes = [];
  carsLine.traverse(function(c){ if(c.userData.history) allNodes.push(c); });
  ibmLine.traverse(function(c){ if(c.userData.history) allNodes.push(c); });

  window.addEventListener('mousemove', function(ev) {
    mouse.x = (ev.clientX/W)*2-1;
    mouse.y = -(ev.clientY/H)*2+1;
    raycaster.setFromCamera(mouse, camera);
    var hits = raycaster.intersectObjects(allNodes);
    if (hits.length>0) {
      var d = hits[0].object.userData;
      if (hovered !== hits[0].object) {
        if (hovered) hovered.material.emissiveIntensity=0.5;
        hovered = hits[0].object;
        hovered.material.emissiveIntensity = 1.0;
        document.body.style.cursor = 'pointer';
      }
      var col = d.color;
      var p = d.history;
      tooltip.style.display = 'block';
      tooltip.innerHTML = '<strong style="color:'+col+'">'+p.label+'</strong> · '+
        formatDate(p.date)+'<br>评分: <strong style="font-size:14px">'+p.score.toFixed(2)+'</strong>'+
        '<br><span style="color:#66708a">'+p.note+'</span>';
      tooltip.style.left = (ev.clientX+16)+'px';
      tooltip.style.top = (ev.clientY-50)+'px';
    } else {
      if (hovered) { hovered.material.emissiveIntensity=0.5; hovered=null; }
      document.body.style.cursor = '';
      tooltip.style.display = 'none';
    }
  });

  function formatDate(d) {
    var t = parseDate(d);
    return t.getMonth()+1+'/'+t.getDate()+' '+
      t.getHours().toString().padStart(2,'0')+':'+t.getMinutes().toString().padStart(2,'0');
  }

  // ═══════ Animate ═══════
  function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
  }
  window.addEventListener('resize', function() {
    W = window.innerWidth; H = window.innerHeight;
    camera.aspect = W/H; camera.updateProjectionMatrix();
    renderer.setSize(W, H);
  });
  animate();
  console.log('✅ CARS/IBM trend loaded — '+CARS_HISTORY.length+' cars pts, '+IBM_HISTORY.length+' ibm pts');
})();
</script>
</body>
</html>
