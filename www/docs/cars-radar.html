<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIBEMATE — CARS 五维度评估雷达图</title>
    <meta name="description" content="FIBEMATE CARS（Crypto-Agility Readiness Scorecard）五维度评估雷达图 — 后量子密码学工程验证平台的首次自我审计可视化。">
    <meta property="og:title" content="FIBEMATE CARS 评估 — 五维度密码敏捷性雷达图">
    <meta property="og:description" content="Crypto Inventory 85 · Algorithm Agility 40 · Key Lifecycle 70 · Protocol Coupling 55 · Organizational Readiness 60 — 综合 63.50/100，首次在真实项目上实证 CARS 框架。">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://fibemate.net/docs/cars-radar.html">
    <meta property="og:site_name" content="FIBEMATE PQC Platform">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="FIBEMATE CARS 评估 — 密码敏捷性雷达图">
    <meta name="twitter:description" content="CARS 五维度 63.50/100，首次在真实 PQC 项目上实证 Crypto-Agility Readiness Scorecard 框架。">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans SC', sans-serif;
            background: #0f0f1e; color: #e0e0e0; overflow: hidden;
        }
        #canvas-container { width: 100vw; height: 100vh; position: relative; }

        #loader-overlay {
            position: absolute; inset: 0;
            background: #0f0f1e;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            z-index: 1000;
        }
        #loader-overlay .spinner {
            width: 36px; height: 36px;
            border: 3px solid #2a2a4a;
            border-top-color: #00d4ff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        #loader-status { font-size: 12px; color: #a0a0c0; }

        #tooltip {
            position: absolute; pointer-events: none;
            background: rgba(15,15,30,0.95); border: 1px solid #3a3a5a;
            border-radius: 8px; padding: 12px 16px; font-size: 12px;
            display: none; max-width: 300px;
            backdrop-filter: blur(8px); box-shadow: 0 4px 16px rgba(0,0,0,0.4);
            z-index: 100;
        }
        #tooltip .tt-name { font-size: 14px; font-weight: bold; color: #00d4ff; margin-bottom: 6px; }
        #tooltip .tt-row { display: flex; justify-content: space-between; gap: 16px; margin: 3px 0; }
        #tooltip .tt-label { color: #a0a0c0; }
        #tooltip .tt-val { font-weight: bold; }
        #tooltip .tt-note { color: #a0a0c0; font-size: 11px; margin-top: 6px; border-top: 1px solid #2a2a4a; padding-top: 6px; line-height: 1.5; }

        #panel {
            position: absolute; top: 20px; left: 20px;
            background: rgba(15,15,30,0.92); border: 1px solid #3a3a5a;
            border-radius: 12px; padding: 20px; width: 310px;
            backdrop-filter: blur(10px); box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            z-index: 10;
        }
        h1 {
            font-size: 16px; margin-bottom: 6px;
            color: #00d4ff;
        }
        .subtitle {
            font-size: 11px; color: #a0a0c0; margin-bottom: 12px;
            padding-bottom: 10px; border-bottom: 1px solid #3a3a5a;
        }
        .overall { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
        .overall .label { font-size: 12px; color: #a0a0c0; }
        .overall .score {
            font-size: 28px; font-weight: bold;
            background: linear-gradient(135deg, #ffc107, #ff9800);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .dim-list { margin-bottom: 14px; }
        .dim-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 5px 0; font-size: 11px;
            cursor: pointer; transition: background 0.2s;
            border-radius: 4px; padding-left: 6px; padding-right: 6px;
        }
        .dim-row:hover { background: rgba(0,212,255,0.08); }
        .dim-row .dot { width: 8px; height: 8px; border-radius: 50%; margin-right: 8px; flex-shrink: 0; }
        .dim-row .dim-name { flex: 1; color: #c0c0d0; }
        .dim-row .dim-score { font-weight: bold; min-width: 28px; text-align: right; }

        #legend {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 20px; align-items: center;
            background: rgba(15,15,30,0.92); border: 1px solid #3a3a5a;
            border-radius: 8px; padding: 10px 20px; font-size: 11px;
            backdrop-filter: blur(10px); z-index: 10;
        }
        #legend .leg-item { display: flex; align-items: center; gap: 6px; }
        #legend .leg-swatch { width: 24px; height: 2px; border-radius: 1px; }
        #legend .leg-swatch.dashed { border-top: 2px dashed #ffc107; width: 24px; background: transparent; }

        #improve-toggle {
            position: absolute; bottom: 30px; right: 30px;
            background: rgba(15,15,30,0.92); border: 1px solid #3a3a5a;
            border-radius: 8px; padding: 8px 16px; color: #00d4ff;
            font-size: 12px; cursor: pointer; z-index: 10;
            backdrop-filter: blur(10px); transition: all 0.2s;
        }
        #improve-toggle:hover { border-color: #00d4ff; box-shadow: 0 0 12px rgba(0,212,255,0.2); }
        #improve-toggle.active { background: rgba(0,212,255,0.15); border-color: #00d4ff; }

        @media (max-width: 768px) {
            #panel { width: 260px; padding: 14px; top: 10px; left: 10px; }
            h1 { font-size: 14px; }
            .overall .score { font-size: 24px; }
            #legend { gap: 12px; padding: 8px 14px; font-size: 10px; }
            #improve-toggle { right: 10px; bottom: 80px; }
        }
    </style>
</head>
<body>

<div id="canvas-container"></div>

<div id="loader-overlay">
    <div class="spinner"></div>
    <div id="loader-status">Loading Three.js…</div>
</div>

<div id="tooltip">
    <div class="tt-name"></div>
    <div class="tt-score-row" style="margin-bottom:6px;">
        <span class="tt-label">Score:</span> <span class="tt-val"></span>
    </div>
    <div class="tt-note"></div>
</div>

<div id="panel">
    <h1>FIBEMATE · CARS 评估</h1>
    <div class="subtitle">Crypto-Agility Readiness Scorecard — 首次真实项目实证</div>
    <div class="overall">
        <span class="label">综合得分</span>
        <span class="score">63.50 / 100</span>
    </div>
    <div class="dim-list" id="dim-list"></div>
    <div style="font-size:10px;color:#666;margin-top:8px;line-height:1.5;">
        旋转/缩放：鼠标拖拽 · 悬停雷达图节点查看详情 · 点击左侧维度高亮
    </div>
</div>

<div id="legend">
    <div class="leg-item"><div class="leg-swatch" style="background:#00d4ff;"></div> 当前得分</div>
    <div class="leg-item"><div class="leg-swatch dashed"></div> 改进路线（P0+P1）</div>
    <div class="leg-item" style="color:#ffc107;">→ 88</div>
</div>

<button id="improve-toggle" onclick="toggleImprovement()">显示改进路线</button>

<script src="lib/three.min.js"></script>
<script src="lib/OrbitControls.js"></script>

<script>
(function() {
    // ── CARS 数据 ──────────────────────────────────
    var dimensions = [
        { key: 'ci', name: 'Crypto Inventory',        cn: '加密资产盘点', score: 85, max: 100,
          note: '15 算法 + 2 FPGA 模块，每项含 KAT/Bench/TVLA/TSR 四维量化。CARS 框架最罕见的实证案例。' },
        { key: 'aa', name: 'Algorithm Agility',       cn: '算法敏捷性',   score: 40, max: 100,
          note: '无插件式热切换架构。算法替换需修改源码。但 fml-dsa 运行时参数集切换是全库最佳实践。' },
        { key: 'kl', name: 'Key Lifecycle',            cn: '密钥生命周期',  score: 70, max: 100,
          note: 'TLA+ 形式化验证 10 条不变量覆盖密钥状态机。CARS 框架未预期的加分项。但缺乏自动化轮换。' },
        { key: 'pc', name: 'Protocol Coupling',        cn: '协议耦合度',    score: 55, max: 100,
          note: '刻意避开标准 TLS 1.3（教育定位），走应用层混合密钥交换。解耦但非标准。' },
        { key: 'or', name: 'Organizational Readiness', cn: '组织准备度',   score: 60, max: 100,
          note: 'OpenSSF passing badge + 完整安全文档。Bus Factor=1 是硬伤。Q4 第三方审计后可达 75。' }
    ];

    // 改进后预测（P0+P1）
    var improved = [85, 65, 75, 70, 75]; // CI:85+0, AA:40→65(registry), KL:70→75, PC:55→70(negotiation frame), OR:60→75(audit)

    var N = dimensions.length;
    var maxScore = 100;
    var showImproved = false;
    var targetImproved = false; // 动画过渡目标

    // ── 工具 ──────────────────────────────────────
    function lerp(a, b, t) { return a + (b - a) * t; }

    // ── 场景 ──────────────────────────────────────
    var container = document.getElementById('canvas-container');
    var scene = new THREE.Scene();

    var camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 100);
    camera.position.set(0, 3.5, 8);
    camera.lookAt(0, 0, 0);

    var renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    container.appendChild(renderer.domElement);

    var controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.minDistance = 3.5;
    controls.maxDistance = 16;
    controls.maxPolarAngle = Math.PI * 0.65;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.5;

    // ── 光照 ──────────────────────────────────────
    scene.add(new THREE.AmbientLight(0x334466, 1.5));
    var dir = new THREE.DirectionalLight(0x8899ff, 1.2);
    dir.position.set(5, 8, 5);
    scene.add(dir);

    // ── 背景网格 ──────────────────────────────────
    var gridHelper = new THREE.PolarGridHelper(5.5, 40, 20, 64, 0x1a1a3e, 0x1a1a3e);
    gridHelper.position.y = -0.6;
    scene.add(gridHelper);

    // ── 五边形参考环 ──────────────────────────────
    for (var level = 20; level <= 100; level += 20) {
        var r = (level / maxScore) * 4.5;
        var ringPts = [];
        for (var i = 0; i < N; i++) {
            var angle = (i / N) * Math.PI * 2 - Math.PI / 2;
            ringPts.push(new THREE.Vector2(Math.cos(angle) * r, Math.sin(angle) * r));
        }
        ringPts.push(ringPts[0].clone());
        var ringGeo = new THREE.BufferGeometry();
        ringGeo.setFromPoints(ringPts.map(function(v) { return new THREE.Vector3(v.x, 0, v.y); }));
        var ring = new THREE.Line(ringGeo, new THREE.LineBasicMaterial({
            color: 0x2a2a4a,
            transparent: true,
            opacity: level === 100 ? 0.8 : 0.35,
            linewidth: level === 100 ? 1.5 : 0.5
        }));
        ring.name = 'ring-' + level;
        scene.add(ring);

        // 环标签
        if (level % 40 === 0 || level === 100) {
            var labelR = r + 0.25;
            var sprite = makeTextSprite(String(level), '#3a3a5a', 24);
            sprite.position.set(labelR, 0.05, 0);
            sprite.scale.set(0.6, 0.3, 1);
            sprite.name = 'ring-label-' + level;
            scene.add(sprite);
        }
    }

    // ── 轴射线 ─────────────────────────────────────
    for (var i2 = 0; i2 < N; i2++) {
        var angle2 = (i2 / N) * Math.PI * 2 - Math.PI / 2;
        var ex = Math.cos(angle2) * 4.7, ez = Math.sin(angle2) * 4.7;
        var axisGeom = new THREE.BufferGeometry();
        axisGeom.setFromPoints([new THREE.Vector3(0, -0.4, 0), new THREE.Vector3(ex, -0.4, ez)]);
        var axisLine = new THREE.Line(axisGeom, new THREE.LineBasicMaterial({
            color: 0x1a1a3e,
            transparent: true,
            opacity: 0.5
        }));
        scene.add(axisLine);
    }

    // ── 维度标签（3D 文字精灵） ────────────────────
    var labelSprites = [];
    for (var i3 = 0; i3 < N; i3++) {
        var angle3 = (i3 / N) * Math.PI * 2 - Math.PI / 2;
        var lr = 5.1;
        var sprite = makeTextSprite(dimensions[i3].name, '#00d4ff', 32);
        sprite.position.set(Math.cos(angle3) * lr, 0.1, Math.sin(angle3) * lr);
        sprite.scale.set(1.8, 0.9, 1);
        sprite.name = 'label-' + i3;
        scene.add(sprite);
        labelSprites.push(sprite);

        // 分数标签
        var scoreSprite = makeTextSprite(dimensions[i3].score + '%', '#ffc107', 28);
        var sr = (dimensions[i3].score / maxScore) * 4.5 + 0.4;
        scoreSprite.position.set(Math.cos(angle3) * sr, 0.05, Math.sin(angle3) * sr);
        scoreSprite.scale.set(0.7, 0.35, 1);
        scoreSprite.name = 'score-' + i3;
        scene.add(scoreSprite);
    }

    // ── 数据区域（填充） ──────────────────────────
    var fillGroup = new THREE.Group();
    fillGroup.name = 'fill-group';
    scene.add(fillGroup);

    function buildFill(scores, alpha) {
        while (fillGroup.children.length > 0) fillGroup.remove(fillGroup.children[0]);

        var pts3 = [];
        for (var i = 0; i < N; i++) {
            var a = (i / N) * Math.PI * 2 - Math.PI / 2;
            var r = (scores[i] / maxScore) * 4.5;
            pts3.push(new THREE.Vector2(Math.cos(a) * r, Math.sin(a) * r));
        }
        var shape = new THREE.Shape(pts3);
        var shapeGeo = new THREE.ShapeGeometry(shape);
        var mat = new THREE.MeshBasicMaterial({
            color: 0x00d4ff,
            side: THREE.DoubleSide,
            transparent: true,
            opacity: alpha,
            depthWrite: false
        });
        var mesh = new THREE.Mesh(shapeGeo, mat);
        mesh.rotation.x = -Math.PI / 2;
        mesh.position.y = -0.35;
        fillGroup.add(mesh);

        // 发光轮廓
        pts3.push(pts3[0].clone());
        var geo2 = new THREE.BufferGeometry();
        geo2.setFromPoints(pts3.map(function(v) { return new THREE.Vector3(v.x, -0.35, v.y); }));
        var outline = new THREE.Line(geo2, new THREE.LineBasicMaterial({
            color: 0x00d4ff,
            transparent: true,
            opacity: 0.9,
            linewidth: 2
        }));
        fillGroup.add(outline);
    }

    buildFill(showImproved ? improved : dimensions.map(function(d){return d.score;}), 0.3);

    // ── 改进路线（虚线五边形） ────────────────────
    var improvedGroup = new THREE.Group();
    improvedGroup.name = 'improved-group';
    improvedGroup.visible = false;
    scene.add(improvedGroup);

    function buildImproved() {
        while (improvedGroup.children.length > 0) improvedGroup.remove(improvedGroup.children[0]);

        var pts = [];
        for (var i = 0; i < N; i++) {
            var a = (i / N) * Math.PI * 2 - Math.PI / 2;
            var r = (improved[i] / maxScore) * 4.5;
            pts.push(new THREE.Vector3(Math.cos(a) * r, -0.34, Math.sin(a) * r));
        }
        pts.push(pts[0].clone());

        // 虚线实现：用多段短线
        var DASH_LEN = 0.3, GAP_LEN = 0.25;
        for (var s = 0; s < N; s++) {
            var start = pts[s], end = pts[s + 1];
            var dx = end.x - start.x, dz = end.z - start.z;
            var segLen = Math.sqrt(dx * dx + dz * dz);
            var nx = dx / segLen, nz = dz / segLen;
            var drawn = 0;
            while (drawn < segLen) {
                var d0 = drawn, d1 = Math.min(drawn + DASH_LEN, segLen);
                var subGeo = new THREE.BufferGeometry();
                subGeo.setFromPoints([
                    new THREE.Vector3(start.x + nx * d0, -0.34, start.z + nz * d0),
                    new THREE.Vector3(start.x + nx * d1, -0.34, start.z + nz * d1)
                ]);
                var subLine = new THREE.Line(subGeo, new THREE.LineBasicMaterial({
                    color: 0xffc107,
                    transparent: true,
                    opacity: 0.7
                }));
                improvedGroup.add(subLine);
                drawn = d1 + GAP_LEN;
            }
        }

        // 改进后的数据点
        for (var i2 = 0; i2 < N; i2++) {
            var a2 = (i2 / N) * Math.PI * 2 - Math.PI / 2;
            var r2 = (improved[i2] / maxScore) * 4.5;
            var dotGeo = new THREE.SphereGeometry(0.08, 12, 12);
            var dotMesh = new THREE.Mesh(dotGeo, new THREE.MeshBasicMaterial({ color: 0xffc107 }));
            dotMesh.position.set(Math.cos(a2) * r2, -0.33, Math.sin(a2) * r2);
            improvedGroup.add(dotMesh);
        }
    }

    buildImproved();

    // ── 数据节点球 ────────────────────────────────
    var nodeSpheres = [];
    for (var i4 = 0; i4 < N; i4++) {
        var a4 = (i4 / N) * Math.PI * 2 - Math.PI / 2;
        var r4 = (dimensions[i4].score / maxScore) * 4.5;
        var sphereGeo = new THREE.SphereGeometry(0.1, 16, 16);
        var sphereMat = new THREE.MeshStandardMaterial({
            color: 0x00d4ff,
            emissive: 0x006688,
            roughness: 0.3,
            metalness: 0.2
        });
        var sphere = new THREE.Mesh(sphereGeo, sphereMat);
        sphere.position.set(Math.cos(a4) * r4, -0.33, Math.sin(a4) * r4);
        sphere.name = 'node-' + i4;
        sphere.userData = { dimIndex: i4 };
        scene.add(sphere);
        nodeSpheres.push(sphere);
    }

    // ── 中心小球（综合得分） ──────────────────────
    var centerGeo = new THREE.SphereGeometry(0.18, 24, 24);
    var centerMat = new THREE.MeshStandardMaterial({
        color: 0xff9800,
        emissive: 0x441100,
        roughness: 0.2,
        metalness: 0.4
    });
    var centerSphere = new THREE.Mesh(centerGeo, centerMat);
    centerSphere.position.y = -0.34;
    scene.add(centerSphere);

    // 中心光环
    var ringHaloGeo = new THREE.TorusGeometry(0.28, 0.03, 16, 48);
    var ringHalo = new THREE.Mesh(ringHaloGeo, new THREE.MeshBasicMaterial({ color: 0xffc107, transparent: true, opacity: 0.5 }));
    ringHalo.rotation.x = Math.PI / 2;
    ringHalo.position.y = -0.33;
    ringHalo.name = 'center-ring';
    scene.add(ringHalo);

    // ── 粒子（装饰） ──────────────────────────────
    var particlesGeo = new THREE.BufferGeometry();
    var particleCount = 200;
    var particlePositions = new Float32Array(particleCount * 3);
    for (var p = 0; p < particleCount; p++) {
        var rad = 1.5 + Math.random() * 5;
        var th = Math.random() * Math.PI * 2;
        particlePositions[p * 3] = Math.cos(th) * rad;
        particlePositions[p * 3 + 1] = (Math.random() - 0.5) * 2;
        particlePositions[p * 3 + 2] = Math.sin(th) * rad;
    }
    particlesGeo.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
    var particlesMat = new THREE.PointsMaterial({ color: 0x334466, size: 0.02, transparent: true, opacity: 0.5 });
    var particles = new THREE.Points(particlesGeo, particlesMat);
    scene.add(particles);

    // ── 文字精灵工具 ──────────────────────────────
    function makeTextSprite(text, color, size) {
        var canvas = document.createElement('canvas');
        canvas.width = 256;
        canvas.height = 128;
        var ctx = canvas.getContext('2d');
        ctx.font = 'bold ' + size + 'px -apple-system, "Noto Sans SC", sans-serif';
        ctx.fillStyle = color;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(text, 128, 64);
        var tex = new THREE.CanvasTexture(canvas);
        tex.minFilter = THREE.LinearFilter;
        var spriteMat = new THREE.SpriteMaterial({ map: tex, transparent: true });
        return new THREE.Sprite(spriteMat);
    }

    // ── Raycaster ──────────────────────────────────
    var raycaster = new THREE.Raycaster();
    raycaster.params.Points.threshold = 0.3;
    raycaster.params.Line.threshold = 0.2;
    var mouse = new THREE.Vector2();
    var tooltip = document.getElementById('tooltip');

    function onMouseMove(e) {
        mouse.x = (e.clientX / container.clientWidth) * 2 - 1;
        mouse.y = -(e.clientY / container.clientHeight) * 2 + 1;

        raycaster.setFromCamera(mouse, camera);
        var intersects = raycaster.intersectObjects(nodeSpheres);

        if (intersects.length > 0) {
            var idx = intersects[0].object.userData.dimIndex;
            var dim = dimensions[idx];
            tooltip.querySelector('.tt-name').textContent = dim.cn + ' (' + dim.name + ')';
            tooltip.querySelector('.tt-val').textContent = dim.score + '/100';
            tooltip.querySelector('.tt-note').textContent = dim.note;
            tooltip.style.display = 'block';
            tooltip.style.left = (e.clientX + 20) + 'px';
            tooltip.style.top = (e.clientY - 20) + 'px';
            document.body.style.cursor = 'pointer';
        } else {
            tooltip.style.display = 'none';
            document.body.style.cursor = 'default';
        }
    }

    function onWindowResize() {
        camera.aspect = container.clientWidth / container.clientHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(container.clientWidth, container.clientHeight);
    }

    window.addEventListener('mousemove', onMouseMove, { passive: true });
    window.addEventListener('resize', onWindowResize, false);

    // ── 左侧面板维度列表 ──────────────────────────
    var dimList = document.getElementById('dim-list');
    var dimColors = ['#00d4ff', '#ff6b6b', '#51cf66', '#ffa94d', '#748ffc'];
    dimensions.forEach(function(dim, i) {
        var row = document.createElement('div');
        row.className = 'dim-row';
        row.setAttribute('data-idx', i);
        row.innerHTML = '<div class="dot" style="background:' + dimColors[i] + ';box-shadow:0 0 6px ' + dimColors[i] + ';"></div>' +
            '<span class="dim-name">' + dim.cn + '</span>' +
            '<span class="dim-score" style="color:' + dimColors[i] + ';">' + dim.score + '</span>';
        row.onclick = function() { highlightDimension(i); };
        dimList.appendChild(row);
    });

    function highlightDimension(idx) {
        var angle = (idx / N) * Math.PI * 2 - Math.PI / 2;
        var r = (dimensions[idx].score / maxScore) * 4.5 + 1.5;
        var targetX = Math.cos(angle) * r;
        var targetZ = Math.sin(angle) * r;
        // 简化的相机移动：tween 到该维度方向
        // 对于非专业的 tween，用 CSS 提示代替
        var target = new THREE.Vector3(targetX, 2, targetZ);
        var origin = new THREE.Vector3(0, 0, 0);
        // 更多用 camera.lookAt 提示
        controls.target.copy(origin);
        // 高亮对应的面板行
        var rows = dimList.querySelectorAll('.dim-row');
        rows.forEach(function(r, i) {
            r.style.background = i === idx ? 'rgba(0,212,255,0.12)' : '';
        });
    }

    // ── 改进路线切换 ──────────────────────────────
    window.toggleImprovement = function() {
        showImproved = !showImproved;
        targetImproved = showImproved;
        var btn = document.getElementById('improve-toggle');
        if (showImproved) {
            btn.textContent = '隐藏改进路线';
            btn.classList.add('active');
        } else {
            btn.textContent = '显示改进路线';
            btn.classList.remove('active');
        }
    };

    // ── 动画循环 ──────────────────────────────────
    var clock = new THREE.Clock();
    function animate() {
        requestAnimationFrame(animate);

        var dt = Math.min(clock.getDelta(), 0.1);
        var t = dt * 5;

        // 平滑过渡填充透明度
        var currentAlpha = fillGroup.children.length > 0 && fillGroup.children[0].material ? fillGroup.children[0].material.opacity : 0.3;
        var targetAlpha = 0.3;
        fillGroup.children.forEach(function(child) {
            if (child.material && child.material.opacity !== undefined) {
                child.material.opacity = lerp(child.material.opacity, targetAlpha, t);
            }
        });

        // 改进路线的可见性
        improvedGroup.visible = showImproved;

        controls.update();

        // 粒子微动
        particles.rotation.y += dt * 0.05;

        // 中心光环脉冲
        var pulse = 1 + Math.sin(Date.now() * 0.002) * 0.1;
        ringHalo.scale.setScalar(pulse);

        // 节点球微动
        nodeSpheres.forEach(function(s, i) {
            var bob = Math.sin(Date.now() * 0.003 + i * 1.2) * 0.03;
            s.position.y = -0.33 + bob;
        });

        renderer.render(scene, camera);
    }

    // ── 启动 ──────────────────────────────────────
    var loader = document.getElementById('loader-overlay');
    loader.style.display = 'none';
    animate();
    onWindowResize();
})();
</script>

</body>
</html>
