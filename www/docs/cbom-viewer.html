// The page carries two copies of the BOM: DATA (the scan view, with the
// per-file occurrence lists) and cbom (the canonical document, for the
// download button). Prefer cbom and fall back to DATA, so a mismatch between
// them cannot make the table disagree with the JSON the page hands out.
var d;
try { d = JSON.parse(DATA); } catch (e) { console.error("DATA parse error:", e); d = null; }
if (!d) { d = { components: [], properties: [] }; }

var sortCol = 3, sortDir = -1;

// --- field access ---------------------------------------------------------
// Risk lives in properties, under our own namespace, not in cryptoProperties.
// The CycloneDX 1.6 schema has no quantumSecurity key at all, so reading the
// old path would silently return undefined and mislabel every row.
function prop(obj, name) {
  var ps = (obj && obj.properties) || [];
  for (var i = 0; i < ps.length; i++) if (ps[i].name === name) return ps[i].value;
  return "";
}
function riskLevel(c) { return prop(c, "fibemate:quantumSecurity:level"); }
function languages(c) { return prop(c, "fibemate:implementationLanguages"); }
function occurrences(c) {
  return (c && c.evidence && c.evidence.occurrences) || [];
}
function primitive(c) {
  var ap = (c && c.cryptoProperties && c.cryptoProperties.algorithmProperties) || {};
  return ap.primitive || "";
}
function certification(c) {
  var ap = (c && c.cryptoProperties && c.cryptoProperties.algorithmProperties) || {};
  var cl = ap.certificationLevel;
  if (!cl) return "-";
  if (Array.isArray(cl)) return cl.length ? cl.join(", ") : "-";
  return String(cl);
}

function risk(c) {
  var level = riskLevel(c);
  if (level === "quantum-safe") return { label: "量子安全", cls: "badge-safe", rank: 2 };
  if (level === "quantum-vulnerable") return { label: "量子脆弱", cls: "badge-vul", rank: 0 };
  if (level === "quantum-weak") return { label: "量子弱化", cls: "badge-weak", rank: 1 };
  // Unknown is shown as unknown. It must not be coloured as weak: a missing
  // classification is an absence of evidence, not evidence of weakness.
  return { label: "未分类", cls: "badge-weak", rank: 3 };
}

function components() {
  return (d && d.components) || [];
}

// --- table ----------------------------------------------------------------
function sortTable(col) {
  if (sortCol === col) sortDir *= -1; else { sortCol = col; sortDir = -1; }
  renderTable();
}

function renderTable() {
  var q = (document.getElementById("search").value || "").toLowerCase();
  var rows = components().filter(function (c) {
    return String(c.name || "").toLowerCase().indexOf(q) >= 0;
  });

  rows.sort(function (a, b) {
    var va, vb;
    if (sortCol === 0) { va = String(a.name || ""); vb = String(b.name || ""); }
    else if (sortCol === 1) { va = primitive(a); vb = primitive(b); }
    else if (sortCol === 2) { va = risk(a).rank; vb = risk(b).rank; }
    else if (sortCol === 3) { va = occurrences(a).length; vb = occurrences(b).length; }
    else { va = certification(a); vb = certification(b); }
    if (va < vb) return -sortDir;
    if (va > vb) return sortDir;
    return 0;
  });

  var h = rows.map(function (c) {
    var r = risk(c);
    var occ = occurrences(c);
    var files = occ.slice(0, 50).map(function (o) {
      return '<div class="file-item">' + String(o.location || "") + '</div>';
    }).join("");
    var more = occ.length > 50 ? '<div class="file-item">… ' + (occ.length - 50) + ' more</div>' : "";
    return '<tr class="algo-row" onclick="this.nextElementSibling.classList.toggle(&quot;open&quot;)">'
      + '<td><strong>' + String(c.name || "") + '</strong></td>'
      + '<td>' + primitive(c) + '</td>'
      + '<td><span class="badge ' + r.cls + '">' + r.label + '</span></td>'
      + '<td>' + occ.length + '</td>'
      + '<td>' + certification(c) + '</td>'
      + '</tr>'
      + '<tr class="file-list"><td colspan="5">' + (files + more || '<div class="file-item">(no occurrences recorded)</div>') + '</td></tr>';
  });
  document.getElementById("tbody").innerHTML = h.join("");
}

function downloadCBOM() {
  var doc = cbom || d;
  var b = new Blob([JSON.stringify(doc, null, 2)], { type: "application/json" });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(b);
  a.download = "cbom-cyclonedx-fibemate-" + ((doc.metadata && doc.metadata.component && doc.metadata.component.version) || "unknown") + ".json";
  a.click();
  URL.revokeObjectURL(a.href);
}

function toggleJSON() {
  var e = document.getElementById("json-view");
  if (!e.textContent) e.textContent = JSON.stringify(cbom || d, null, 2);
  e.classList.toggle("open");
  document.getElementById("json-toggle").textContent =
    e.classList.contains("open") ? "🔼 隐藏原始 CBOM JSON" : "🔍 查看原始 CBOM JSON";
}

// --- totals ---------------------------------------------------------------
// Every figure is derived from the document. Nothing is hardcoded: a stale
// literal here would be a number the page asserts without any source.
// Two different counts, and conflating them would overstate the footprint by
// more than a factor of two:
//   totalOccurrences -- how many (component, file) pairs there are, 647 here
//   totalFiles       -- how many DISTINCT files those pairs touch, 304 here
// A single HTML page can mention nine algorithms; counting it nine times and
// calling the result "files" would be wrong.
var totalOccurrences = 0;
var fileSet = {};
components().forEach(function (c) {
  occurrences(c).forEach(function (o) {
    totalOccurrences++;
    if (o.location) fileSet[o.location] = true;
  });
});
var totalFiles = Object.keys(fileSet).length;

var qs = 0, qv = 0, qw = 0, qu = 0;
components().forEach(function (c) {
  var cls = risk(c).cls;
  if (cls === "badge-safe") qs++;
  else if (cls === "badge-vul") qv++;
  else if (cls === "badge-weak") qw++;
  else qu++;
});

document.getElementById("total-algos").textContent = components().length;
document.getElementById("total-files").textContent = totalFiles;
document.getElementById("total-files").title = totalOccurrences + " component/file occurrences across these files";
document.getElementById("q-safe").textContent = qs;
document.getElementById("q-vul").textContent = qv;
document.getElementById("q-weak").textContent = qw;

// Excluded assets are recorded as root properties rather than components, so
// they would otherwise be invisible on this page. They are part of the answer
// to "what is in this codebase", so surface them.
(function showExcluded() {
  var root = { properties: (d && d.properties) || [] };
  var excluded = [];
  for (var i = 0; i < root.properties.length; i++) {
    var n = root.properties[i].name;
    if (n.indexOf("fibemate:excludedAsset:") === 0) {
      excluded.push(n.slice("fibemate:excludedAsset:".length) + " — " + root.properties[i].value);
    }
  }
  var el = document.getElementById("excluded-list");
  if (!el) return;
  el.innerHTML = excluded.length
    ? excluded.map(function (x) { return '<div class="file-item">' + x + '</div>'; }).join("")
    : '<div class="file-item">(none)</div>';
})();

renderTable();
