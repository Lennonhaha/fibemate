<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FIBEMATE Poseidon ZK 测试</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
      background: #1a1a2e;
      color: #eee;
    }
    h1 { color: #00d4ff; }
    .section {
      background: #16213e;
      border-radius: 8px;
      padding: 20px;
      margin: 20px 0;
    }
    button {
      background: #00d4ff;
      color: #1a1a2e;
      border: none;
      padding: 10px 20px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
      margin: 5px;
    }
    button:hover { background: #00a8cc; }
    button:disabled { background: #555; cursor: not-allowed; }
    input {
      padding: 10px;
      margin: 5px;
      border-radius: 4px;
      border: 1px solid #444;
      background: #0f3460;
      color: #fff;
      width: 200px;
    }
    #log {
      background: #0f0f23;
      border: 1px solid #333;
      border-radius: 4px;
      padding: 10px;
      height: 300px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 12px;
      margin-top: 20px;
    }
    .success { color: #00ff88; }
    .error { color: #ff4444; }
    .info { color: #00d4ff; }
    .status {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      margin-left: 10px;
    }
    .status.ready { background: #00ff88; color: #1a1a2e; }
    .status.loading { background: #ffaa00; color: #1a1a2e; }
    .status.error { background: #ff4444; color: #fff; }
  </style>
</head>
<body>
  <h1>🔐 FIBEMATE Poseidon ZK 测试</h1>
  
  <div class="section">
    <h2>状态</h2>
    <p>
      snarkjs: <span id="snarkjs-status" class="status loading">加载中...</span>
    </p>
    <p>
      Poseidon ZK: <span id="zk-status" class="status loading">初始化...</span>
    </p>
  </div>

  <div class="section">
    <h2>测试 Poseidon 承诺</h2>
    <input type="text" id="test-username" placeholder="用户名" value="testuser">
    <button onclick="testCommitment()">生成承诺</button>
    <div id="commitment-result"></div>
  </div>

  <div class="section">
    <h2>测试 ZK 证明生成</h2>
    <button onclick="testProofGeneration()" id="btn-proof" disabled>生成 ZK 证明</button>
    <div id="proof-result"></div>
  </div>

  <div class="section">
    <h2>测试 ZK 证明验证</h2>
    <button onclick="testProofVerification()" id="btn-verify" disabled>验证 ZK 证明</button>
    <div id="verify-result"></div>
  </div>

  <div class="section">
    <h2>完整 ZK 注册流程</h2>
    <input type="text" id="reg-username" placeholder="用户名" value="zktest">
    <input type="password" id="reg-password" placeholder="密码" value="testpass123">
    <button onclick="testZKRegister()" id="btn-register" disabled>ZK 注册</button>
    <div id="register-result"></div>
  </div>

  <div id="log"></div>

  <!-- 加载 snarkjs -->
  <script src="snarkjs.min.js"></script>
  <!-- 加载 Poseidon ZK 认证模块 -->
  <script src="zk-auth-poseidon.js"></script>

  <script>
    let lastProof = null;
    let lastPublicSignals = null;
    let lastCommitment = null;

    function log(msg, type = 'info') {
      const logEl = document.getElementById('log');
      const time = new Date().toLocaleTimeString();
      const className = type === 'error' ? 'error' : type === 'success' ? 'success' : 'info';
      logEl.innerHTML += `<div class="${className}">[${time}] ${msg}</div>`;
      logEl.scrollTop = logEl.scrollHeight;
      console.log(`[${type}]`, msg);
    }

    // 检查 snarkjs 加载状态
    function checkSnarkJS() {
      const statusEl = document.getElementById('snarkjs-status');
      if (typeof window.snarkjs !== 'undefined') {
        statusEl.textContent = '已加载';
        statusEl.className = 'status ready';
        log('snarkjs loaded successfully', 'success');
        return true;
      } else {
        statusEl.textContent = '未加载';
        statusEl.className = 'status error';
        log('snarkjs not loaded', 'error');
        return false;
      }
    }

    // 检查 ZK 模块状态
    function checkZK() {
      const statusEl = document.getElementById('zk-status');
      if (window.FIBEMATE_ZK_POSEIDON) {
        statusEl.textContent = '就绪';
        statusEl.className = 'status ready';
        log('Poseidon ZK module ready', 'success');
        return true;
      } else {
        statusEl.textContent = '未加载';
        statusEl.className = 'status error';
        log('Poseidon ZK module not loaded', 'error');
        return false;
      }
    }

    // 页面加载完成后检查
    window.addEventListener('load', () => {
      log('Page loaded, checking dependencies...');
      setTimeout(() => {
        const snarkjsReady = checkSnarkJS();
        const zkReady = checkZK();
        
        if (snarkjsReady && zkReady) {
          document.getElementById('btn-proof').disabled = false;
          document.getElementById('btn-register').disabled = false;
          log('All dependencies ready!', 'success');
        }
      }, 1000);
    });

    // 测试承诺生成
    async function testCommitment() {
      const username = document.getElementById('test-username').value;
      log(`Testing commitment generation for: ${username}`);
      
      try {
        // 使用 zk-auth-poseidon.js 中的函数
        const commitmentData = await poseidonCommit(username);
        log(`Username hash: ${commitmentData.username_hash}`, 'info');
        log(`Salt: ${commitmentData.salt}`, 'info');
        
        document.getElementById('commitment-result').innerHTML = `
          <p class="success">承诺数据生成成功!</p>
          <pre>${JSON.stringify(commitmentData, null, 2)}</pre>
        `;
      } catch (e) {
        log(`Error: ${e.message}`, 'error');
        document.getElementById('commitment-result').innerHTML = `
          <p class="error">错误: ${e.message}</p>
        `;
      }
    }

    // 测试证明生成
    async function testProofGeneration() {
      log('Testing ZK proof generation...');
      
      try {
        const username = document.getElementById('test-username').value;
        const commitmentData = await poseidonCommit(username);
        
        log('Loading snarkjs...');
        const snarkjs = window.snarkjs;
        
        log('Fetching WASM and zKey...');
        const wasmResponse = await fetch('circuits/build/identity_js/identity.wasm');
        const wasmBuffer = await wasmResponse.arrayBuffer();
        
        const zkeyResponse = await fetch('circuits/build/setup/identity_final.zkey');
        const zkeyBuffer = await zkeyResponse.arrayBuffer();
        
        log('Generating proof...');
        const input = {
          username_hash: commitmentData.username_hash,
          salt: commitmentData.salt,
          expectedCommitment: "0"
        };
        
        const { proof, publicSignals } = await snarkjs.groth16.fullProve(
          input,
          new Uint8Array(wasmBuffer),
          new Uint8Array(zkeyBuffer)
        );
        
        lastProof = proof;
        lastPublicSignals = publicSignals;
        lastCommitment = publicSignals[0];
        
        log(`Proof generated!`, 'success');
        log(`Commitment: ${publicSignals[0]}`, 'info');
        log(`Proof size: ${JSON.stringify(proof).length} bytes`, 'info');
        
        document.getElementById('proof-result').innerHTML = `
          <p class="success">ZK 证明生成成功!</p>
          <p>Commitment: ${publicSignals[0]}</p>
          <pre>${JSON.stringify(proof, null, 2).substring(0, 500)}...</pre>
        `;
        
        document.getElementById('btn-verify').disabled = false;
      } catch (e) {
        log(`Error: ${e.message}`, 'error');
        document.getElementById('proof-result').innerHTML = `
          <p class="error">错误: ${e.message}</p>
        `;
      }
    }

    // 测试证明验证
    async function testProofVerification() {
      if (!lastProof || !lastPublicSignals) {
        log('No proof to verify. Generate one first.', 'error');
        return;
      }
      
      log('Verifying ZK proof...');
      
      try {
        const snarkjs = window.snarkjs;
        
        const vkeyResponse = await fetch('circuits/build/setup/verification_key.json');
        const vkey = await vkeyResponse.json();
        
        const isValid = await snarkjs.groth16.verify(vkey, lastPublicSignals, lastProof);
        
        if (isValid) {
          log('Proof verification: VALID', 'success');
          document.getElementById('verify-result').innerHTML = `
            <p class="success">✅ 证明验证通过!</p>
          `;
        } else {
          log('Proof verification: INVALID', 'error');
          document.getElementById('verify-result').innerHTML = `
            <p class="error">❌ 证明验证失败!</p>
          `;
        }
      } catch (e) {
        log(`Error: ${e.message}`, 'error');
        document.getElementById('verify-result').innerHTML = `
          <p class="error">错误: ${e.message}</p>
        `;
      }
    }

    // 测试完整 ZK 注册
    async function testZKRegister() {
      const username = document.getElementById('reg-username').value;
      const password = document.getElementById('reg-password').value;
      
      log(`Testing ZK register for: ${username}`);
      
      try {
        const result = await doPoseidonZKRegister(username, password);
        log(`ZK Register success! User ID: ${result.userId}`, 'success');
        document.getElementById('register-result').innerHTML = `
          <p class="success">✅ ZK 注册成功!</p>
          <pre>${JSON.stringify(result, null, 2)}</pre>
        `;
      } catch (e) {
        log(`Error: ${e.message}`, 'error');
        document.getElementById('register-result').innerHTML = `
          <p class="error">错误: ${e.message}</p>
        `;
      }
    }
  </script>
</body>
</html>
