<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>KAT 娴嬭瘯璇婃柇</title>
<style>
body { font-family: system-ui; max-width: 700px; margin: 40px auto; background: #0a0a0f; color: #e8e8ed; }
div { margin: 8px 0; padding: 10px; border-radius: 6px; font-family: monospace; font-size: 13px; }
.ok { background: #0a2a1a; color: #00e5c3; }
.err { background: #2a0a0a; color: #ff4757; }
.info { background: #1a1a2e; color: #8a8a96; }
button { padding: 12px 28px; border-radius: 100px; font-size: 14px; cursor: pointer; border: none; margin: 5px; }
.btn-run { background: #00e5c3; color: #000; }
.btn-run:disabled { opacity: 0.4; }
#log { max-height: 400px; overflow-y: auto; margin-top: 16px; }
</style>
</head>
<body>
<h2>馃敩 KAT 1000 杞祴璇曡瘖鏂?/h2>
<p class="info" id="status">绛夊緟鎵ц...</p>
<button class="btn-run" id="btn1" onclick="testSingle()">娴嬭瘯鍗曡疆 API</button>
<button class="btn-run" id="btn2" onclick="testBatch()">娴嬭瘯 10 杞苟鍙?/button>
<button class="btn-run" id="btn3" onclick="runFull()" disabled>杩愯 1000 杞?/button>
<div id="log"></div>

<script>
const API = '/api/mlkem/test';
const APIS = ['/api/mlkem/test'];

function log(cls, msg) {
  var d = document.createElement('div');
  d.className = cls;
  d.textContent = new Date().toISOString().slice(11,19) + ' ' + msg;
  document.getElementById('log').appendChild(d);
}

async function testSingle() {
  document.getElementById('log').innerHTML = '';
  document.getElementById('status').textContent = '娴嬭瘯涓?..';
  log('info', '=== 鍗曡疆娴嬭瘯 ===');
  
  for (var api of APIS) {
    try {
      var t0 = performance.now();
      var resp = await fetch(api);
      var data = await resp.json();
      var ms = (performance.now() - t0).toFixed(1);
      log('ok', api + ' 鈫?' + ms + 'ms, roundTrip=' + data.roundTrip + ', status=' + data.status);
    } catch(e) {
      log('err', api + ' 鈫?FAILED: ' + e.message);
    }
  }
  
  document.getElementById('status').textContent = '鍗曡疆娴嬭瘯瀹屾垚';
}

async function testBatch() {
  document.getElementById('log').innerHTML = '';
  document.getElementById('status').textContent = '10杞苟鍙戞祴璇曚腑...';
  log('info', '=== 10 杞苟鍙戞祴璇?===');
  
  var api = APIS[0];
  var t0 = performance.now();
  var promises = [];
  for (var i = 0; i < 10; i++) promises.push(fetch(api).then(r => r.json()));
  
  var ok = 0, fail = 0;
  var results = await Promise.allSettled(promises);
  for (var r of results) {
    if (r.status === 'fulfilled' && r.value.roundTrip === true) ok++;
    else fail++;
  }
  
  var ms = (performance.now() - t0).toFixed(0);
  log(ok === 10 ? 'ok' : 'err', '10杞畬鎴? ' + ok + ' pass / ' + fail + ' fail, 鎬昏€楁椂 ' + ms + 'ms');
  
  document.getElementById('status').textContent = '10杞祴璇? ' + ok + '/' + 10 + ' 閫氳繃';
  if (ok === 10) document.getElementById('btn3').disabled = false;
}

async function runFull() {
  document.getElementById('log').innerHTML = '';
  document.getElementById('status').textContent = '1000杞祴璇曡繍琛屼腑...';
  log('info', '=== 1000 杞叏閲忔祴璇?===');
  
  var TOTAL = 1000, BATCH = 20;
  var passed = 0, failed = 0, latencies = [];
  var api = APIS[0];
  var start = performance.now();
  
  var remaining = TOTAL;
  while (remaining > 0) {
    var n = Math.min(BATCH, remaining);
    var ps = [];
    for (var i = 0; i < n; i++) {
      ps.push((async () => {
        var t0 = performance.now();
        var resp = await fetch(api);
        var data = await resp.json();
        latencies.push(performance.now() - t0);
        return data.roundTrip === true;
      })());
    }
    
    var results = await Promise.allSettled(ps);
    for (var r of results) {
      if (r.status === 'fulfilled' && r.value) passed++;
      else failed++;
    }
    
    remaining -= n;
    document.getElementById('status').textContent = passed + '/' + TOTAL + ' (鍓╀綑 ' + remaining + ')';
    await new Promise(r => setTimeout(r, 10));
  }
  
  var totalTime = ((performance.now() - start) / 1000).toFixed(1);
  var avg = (latencies.reduce((a,b)=>a+b,0) / latencies.length).toFixed(1);
  log(passed === TOTAL ? 'ok' : 'err', '鉁?瀹屾垚! ' + passed + '/' + TOTAL + ' 閫氳繃, 骞冲潎 ' + avg + 'ms, 鎬昏€楁椂 ' + totalTime + 's');
  document.getElementById('status').textContent = passed + '/' + TOTAL + ' 閫氳繃, 骞冲潎 ' + avg + 'ms/杞?;
}
</script>
</body>
</html>
