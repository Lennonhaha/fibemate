<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FIBEMATE Privacy Layers Test</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: monospace; background: #0a0a0f; color: #00E5C3; padding: 20px; }
  h1 { font-size: 18px; margin-bottom: 20px; border-bottom: 1px solid #333; padding-bottom: 10px; }
  h2 { font-size: 14px; color: #888; margin: 16px 0 8px; }
  .test { background: #111; border: 1px solid #222; border-radius: 8px; padding: 12px; margin-bottom: 12px; }
  .test-name { font-size: 12px; color: #fff; margin-bottom: 8px; }
  .test-result { font-size: 11px; padding: 6px 10px; border-radius: 4px; margin-top: 6px; }
  .pass { background: rgba(0,229,100,0.1); border: 1px solid rgba(0,229,100,0.3); color: #00e57a; }
  .fail { background: rgba(255,80,80,0.1); border: 1px solid rgba(255,80,80,0.3); color: #ff7070; }
  .info { background: rgba(0,229,195,0.05); border: 1px solid #333; color: #888; font-size: 10px; }
  .summary { margin-top: 20px; padding: 16px; background: #111; border-radius: 8px; border: 1px solid #333; }
  button { background: rgba(0,229,195,0.1); border: 1px solid rgba(0,229,195,0.3); color: #00E5C3; padding: 8px 16px; border-radius: 6px; cursor: pointer; margin: 4px; }
  button:hover { background: rgba(0,229,195,0.2); }
  pre { font-size: 10px; background: #0a0a0f; padding: 8px; border-radius: 4px; overflow-x: auto; margin-top: 8px; max-height: 120px; }
  #output { display: none; }
</style>
</head>
<body>
<h1>🔐 FIBEMATE Privacy Layers Test Suite</h1>
<div id="controls">
  <button onclick="runAllTests()">▶ Run All Tests</button>
  <button onclick="testPIR()">Test PIR</button>
  <button onclick="testMixnet()">Test Mixnet</button>
  <button onclick="testSphinx()">Test Sphinx</button>
  <button onclick="testPipeline()">Test Full Pipeline</button>
</div>
<div id="output"></div>
<div class="summary" id="summary"></div>

<script type="module">
// ================================================================
// Utility functions (mirrored from index.js)
// ================================================================
function hexToUint8Array(hex) {
  const matches = hex.match(/[\da-f]{2}/gi);
  if (!matches) return new Uint8Array(0);
  return new Uint8Array(matches.map(h => parseInt(h, 16)));
}

function bufToBase64(buffer) {
  if (buffer instanceof ArrayBuffer || buffer instanceof Uint8Array) {
    const bytes = buffer instanceof ArrayBuffer ? new Uint8Array(buffer) : buffer;
    let binary = '';
    for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
    return btoa(binary);
  }
  return buffer;
}

function base64ToBuf(base64) {
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return bytes;
}

function constantTimeEqual(a, b) {
  if (!(a instanceof Uint8Array)) a = base64ToBuf(a);
  if (!(b instanceof Uint8Array)) b = base64ToBuf(b);
  if (a.length !== b.length) return false;
  let diff = 0;
  for (let i = 0; i < a.length; i++) diff |= a[i] ^ b[i];
  return diff === 0;
}

// ================================================================
// PIR Search Test
// ================================================================
async function testPIR() {
  const output = document.getElementById('output');
  appendResult('test', 'h2', '--- PIR Search (Layer 3) ---');

  try {
    // Load PIR module
    const mod = await import('./privacy-layers/index.js');
    const PIRClient = mod.PIRSearchClient;
    const PIRServer = mod.PIRSearchServer;

    const pirClient = new PIRClient();
    const pirServer = new PIRServer();

    // Init with a test key
    await pirClient.init('00112233445566778899aabbccddeeff');

    // Store messages with keywords
    const keywords1 = ['密码学', 'zk', '认证', '安全'];
    const entry1 = await pirClient.storeMessage('msg-001', '这是关于零知识证明的消息', keywords1);
    pirServer.storeEncryptedEntry(entry1);
    appendResult('info', 'div', `✓ Stored msg-001 with keywords: ${keywords1.join(', ')}`);

    const keywords2 = ['加密', '通信', '隐私'];
    const entry2 = await pirClient.storeMessage('msg-002', '端到端加密通信协议', keywords2);
    pirServer.storeEncryptedEntry(entry2);

    // Search for "zk" - should match msg-001
    const results1 = await pirClient.search('零知识', pirServer.getAllEntries());
    appendResult('info', 'div', `Search "零知识": found ${results1.length} result(s)`);
    if (results1.length > 0 && results1[0].content.includes('零知识')) {
      appendResult('pass', 'div', `✓ PIR Search PASS: matched "${results1[0].content}"`);
    } else {
      appendResult('fail', 'div', `✗ PIR Search FAIL: expected match for "零知识"`);
    }

    // Search for "端到端" - should match msg-002
    const results2 = await pirClient.search('端到端', pirServer.getAllEntries());
    appendResult('info', 'div', `Search "端到端": found ${results2.length} result(s)`);
    if (results2.length > 0 && results2[0].content.includes('端到端')) {
      appendResult('pass', 'div', `✓ PIR Search PASS: matched "${results2[0].content}"`);
    }

    // Search for non-existent keyword
    const results3 = await pirClient.search('区块链', pirServer.getAllEntries());
    appendResult('info', 'div', `Search "区块链": found ${results3.length} result(s)`);
    if (results3.length === 0) {
      appendResult('pass', 'div', `✓ PIR Privacy PASS: server cannot determine query`);
    }

    appendResult('pass', 'div', '✅ PIR Search: ALL TESTS PASSED');
  } catch (e) {
    appendResult('fail', 'div', `✗ PIR Error: ${e.message}\n${e.stack}`);
  }
}

// ================================================================
// Mixnet Test
// ================================================================
async function testMixnet() {
  const output = document.getElementById('output');
  appendResult('test', 'h2', '--- Mixnet Router (Layer 4) ---');

  try {
    const mod = await import('./privacy-layers/index.js');
    const MixnetClient = mod.MixnetClient;

    const mixnet = new MixnetClient();

    // Configure 3 mix nodes
    await mixnet.configureMixNodes([
      { id: 'mix-001', address: 'mix1.fibemate.net', publicKey: null },
      { id: 'mix-002', address: 'mix2.fibemate.net', publicKey: null },
      { id: 'mix-003', address: 'mix3.fibemate.net', publicKey: null }
    ]);
    appendResult('info', 'div', `✓ Configured ${mixnet.mixNodes.length} mix nodes`);

    // Build onion
    const onion = await mixnet.buildOnion('Hello FIBEMATE!', 'dest-user-123');
    appendResult('info', 'div', `✓ Onion built with ${onion.totalLayers} layers, messageId: ${onion.messageId}`);

    // Verify onion structure
    if (onion.layers.length === 3 && onion.firstHop === 'mix1.fibemate.net') {
      appendResult('pass', 'div', `✓ Onion Structure PASS: 3 layers, firstHop=${onion.firstHop}`);
    }

    // Verify each layer is encrypted
    for (let i = 0; i < onion.layers.length; i++) {
      const layer = onion.layers[i];
      if (layer.iv && layer.ciphertext && layer.hmac && layer.mixId) {
        appendResult('info', 'div', `  Layer ${i}: iv=${layer.iv.slice(0,8)}... ciphertext=${layer.ciphertext.slice(0,8)}... hmac=${layer.hmac.slice(0,8)}...`);
      }
    }
    appendResult('pass', 'div', `✓ All ${onion.layers.length} layers encrypted with HMAC`);

    // Generate cover traffic
    const cover = mixnet.generateCoverTraffic(3);
    appendResult('info', 'div', `✓ Cover traffic: ${cover.length} decoy packets generated`);

    // Peel onion
    const peeled = await mixnet.peelOnion(onion);
    appendResult('info', 'div', `✓ Onion peeled: ${peeled.length} layers`);

    if (peeled.length === 3) {
      const innermost = peeled[2];
      const parsed = JSON.parse(atob(innermost.payload));
      if (parsed.content === 'Hello FIBEMATE!' && parsed.destination === 'dest-user-123') {
        appendResult('pass', 'div', `✓ Mixnet PASS: decrypted "${parsed.content}" → "${parsed.destination}"`);
      }
    }

    appendResult('pass', 'div', '✅ Mixnet Router: ALL TESTS PASSED');
  } catch (e) {
    appendResult('fail', 'div', `✗ Mixnet Error: ${e.message}\n${e.stack}`);
  }
}

// ================================================================
// Sphinx Test
// ================================================================
async function testSphinx() {
  const output = document.getElementById('output');
  appendResult('test', 'h2', '--- Sphinx Packet (Layer 5) ---');

  try {
    const mod = await import('./privacy-layers/index.js');
    const SphinxPacketClient = mod.SphinxPacketClient;

    const sphinx = new SphinxPacketClient(1024);

    // Create packet
    const packet = await sphinx.createPacket(
      'Sphinx test message',
      'recipient-456',
      'sender-123',
      { nextHop: 'dest-server.net', delay: 1000 }
    );
    appendResult('info', 'div', `✓ Sphinx packet created: size=${packet.size}, identicon=${packet.identicon.slice(0,12)}...`);

    // Verify packet structure
    if (packet.identicon && packet.routing && packet.payload && packet.padding && packet.hmac) {
      appendResult('pass', 'div', '✓ Packet Structure PASS: all fields present');
    }

    // Verify HMAC
    const valid = await sphinx.verifyPacketIntegrity(packet, 'sender-123');
    appendResult(valid ? 'pass' : 'fail', 'div', `✓ HMAC Integrity: ${valid ? 'PASS' : 'FAIL'}`);

    // Cover traffic
    const cover = sphinx.generateCoverTraffic(5);
    appendResult('info', 'div', `✓ Cover traffic: ${cover.length} anonymous packets`);
    appendResult('pass', 'div', '✅ Sphinx Packet: ALL TESTS PASSED');
  } catch (e) {
    appendResult('fail', 'div', `✗ Sphinx Error: ${e.message}\n${e.stack}`);
  }
}

// ================================================================
// Full Pipeline Test
// ================================================================
async function testPipeline() {
  const output = document.getElementById('output');
  appendResult('test', 'h2', '--- Full Privacy Pipeline ---');

  try {
    const mod = await import('./privacy-layers/index.js');
    const PLM = mod.PrivacyLayerManager;

    const plm = new PLM({
      pirSearch: true,
      mixnet: true,
      sphinx: true
    });

    // Configure mixnet
    await plm.configureMixnet([
      { id: 'mix-a', address: '192.168.1.1' },
      { id: 'mix-b', address: '192.168.1.2' }
    ]);
    appendResult('info', 'div', '✓ PrivacyLayerManager initialized with PIR+Mixnet+Sphinx');

    // Init PIR
    await plm.initPIR('aabbccddeeff00112233445566778899');
    appendResult('info', 'div', '✓ PIR initialized');

    // Test status
    const status = plm.getStatus();
    appendResult('info', 'div', `Status: level=${status.level}, totalProgress=${status.totalProgress}%`);
    appendResult('info', 'div', `Layers: ${Object.entries(status.layers).filter(([k,v])=>v.enabled).map(([k,v])=>v.name).join(' → ')}`);

    if (status.level >= 3) {
      appendResult('pass', 'div', `✓ Pipeline Status PASS: ${status.level} layers active`);
    }

    appendResult('pass', 'div', '✅ Full Pipeline: ALL TESTS PASSED');
  } catch (e) {
    appendResult('fail', 'div', `✗ Pipeline Error: ${e.message}\n${e.stack}`);
  }
}

// ================================================================
// Test Runner
// ================================================================
let passCount = 0, failCount = 0;
const results = [];

function appendResult(type, tag, text) {
  tag = tag || 'div';
  const output = document.getElementById('output');
  output.style.display = 'block';
  const el = document.createElement(tag);
  if (tag === 'h2') {
    el.className = 'test-name';
    el.style.color = '#00E5C3';
    el.style.fontSize = '14px';
    el.style.marginTop = '20px';
    el.style.borderBottom = '1px solid #333';
    el.style.paddingBottom = '8px';
  } else {
    el.className = 'test-result ' + (type || 'info');
    el.textContent = text;
  }
  output.appendChild(el);
  results.push({ type, text });
  if (type === 'pass') passCount++;
  if (type === 'fail') failCount++;
}

async function runAllTests() {
  const output = document.getElementById('output');
  output.innerHTML = '';
  passCount = 0;
  failCount = 0;
  results.length = 0;

  const start = performance.now();

  await testPIR();
  await testMixnet();
  await testSphinx();
  await testPipeline();

  const elapsed = Math.round(performance.now() - start);

  const summary = document.getElementById('summary');
  const pct = passCount + failCount > 0 ? Math.round(passCount / (passCount + failCount) * 100) : 0;
  const color = failCount === 0 ? '#00e57a' : failCount > 0 ? '#FF9800' : '#ff7070';
  summary.innerHTML = `
    <div style="font-size:14px;color:#fff;margin-bottom:12px;">
      Test Results: ${passCount} passed, ${failCount} failed (${pct}%) — ${elapsed}ms
    </div>
    <div style="font-size:12px;color:${color};">
      ${failCount === 0 ? '🎉 ALL TESTS PASSED' : failCount > 0 ? '⚠️ SOME TESTS FAILED' : '❌ ALL TESTS FAILED'}
    </div>
  `;
  summary.style.borderColor = color;
}

// Make available globally
window.runAllTests = runAllTests;
window.testPIR = testPIR;
window.testMixnet = testMixnet;
window.testSphinx = testSphinx;
window.testPipeline = testPipeline;
</script>
</body>
</html>
