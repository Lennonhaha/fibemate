<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FIBEMATE - Privacy-Enhanced Messaging</title>
  <link rel="stylesheet" href="styles.css">
  <script src="secure-key-storage.js"></script>
  <script src="key-storage-migration.js"></script>
  <script src="key-manager.js"></script>
  <script src="double-ratchet.js"></script>
  <script src="message-crypto.js"></script>
  <script src="message-crypto-v2.js"></script>
  <script src="crypto/crypto/ml-kem-768.js"></script>
  <script src="crypto/crypto/ml-kem-768-wrapper.js"></script>
  <script src="crypto/crypto/pq-integration.js"></script>

  <!-- <script src="zk/schnorr-prover.js"></script> -->  <!-- v1 disabled, using v2 -->
  <script src="zk/schnorr-prover-v2.js"></script>  <!-- Correct EC implementation -->
  <!-- <script src="zk/schnorr-verifier.js"></script> -->  <!-- v1 disabled, using v2 -->
  <script src="zk/bulletproofs.js"></script>
  <script src="zk/zk-auth.js"></script>
  <script src="zk/zk-integration.js"></script>
  <script src="zk-ui-integration.js"></script>
  <script src="WSManager.js"></script>
  <style>
    /* 娑撳顣介崣姗€鍣洪敍鍫滅返 WebSocket / 娑撳顣介崚鍥ㄥ床閹稿鎸虫担璺ㄦ暏閿?*/
    :root {
      --bg-primary: #0a0a0f;
      --text-secondary: #888;
      --accent: #00E5C3;
      --border: #333;
    }
    [data-theme="light"] {
      --bg-primary: #f5f5f5;
      --text-secondary: #666;
      --accent: #00B4A0;
      --border: #e0e0e0;
    }
    /* WebSocket 閻樿埖鈧焦瀵氱粈鍝勬珤 */
    .ws-status {
      position: fixed;
      top: 10px;
      right: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      background: rgba(0,0,0,0.7);
      border-radius: 12px;
      font-size: 11px;
      z-index: 1000;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .ws-status.show { opacity: 1; }
    .ws-status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #666;
    }
    .ws-status-dot.connecting { background: #FFC107; animation: pulse 1s infinite; }
    .ws-status-dot.connected { background: #00E5C3; }
    .ws-status-dot.disconnected { background: #FF5252; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
    
    /* 閻ц缍嶉弬鐟扮础閸掑洦宕查弽鍥╊劮 */
    .login-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      padding: 4px;
      background: rgba(0,0,0,0.2);
      border-radius: 10px;
    }
    .tab-btn {
      flex: 1;
      padding: 8px 12px;
      border: none;
      background: transparent;
      color: #888;
      font-size: 13px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s;
    }
    .tab-btn.active {
      background: rgba(0,229,195,0.15);
      color: #00E5C3;
    }
    
    /* 妤犲矁鐦夐惍浣界翻閸忋儳绮?*/
    .captcha-group {
      display: flex;
      gap: 8px;
    }
    .captcha-group input {
      flex: 1;
    }
    .btn-captcha {
      padding: 10px 14px;
      background: rgba(0,229,195,0.1);
      border: 1px solid rgba(0,229,195,0.3);
      color: #00E5C3;
      border-radius: 8px;
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.3s;
    }
    .btn-captcha:hover:not(:disabled) {
      background: rgba(0,229,195,0.2);
    }
    .btn-captcha:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    
    /* 閻劍鍩涢崡蹇氼唴 */
    .agreement-links {
      text-align: center;
      margin-top: 16px;
      font-size: 11px;
      color: #666;
    }
    .agreement-links a {
      color: #00E5C3;
      text-decoration: none;
    }
    
    /* Spinner */
    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.2);
      border-top-color: #00E5C3;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .btn-loading { pointer-events: none; opacity: 0.8; }

    /* Input validation */
    .input-valid {
      border-color: #00E5C3 !important;
      box-shadow: 0 0 0 2px rgba(0,229,195,0.15);
    }
    .input-invalid {
      border-color: #FF5252 !important;
      box-shadow: 0 0 0 2px rgba(255,82,82,0.15);
    }
    .input-error-msg {
      font-size: 11px;
      color: #FF5252;
      margin-top: 4px;
      padding-left: 4px;
    }

    /* ZK Progress */
    .zk-badge {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 12px 16px;
      background: rgba(0,229,195,0.05);
      border: 1px solid rgba(0,229,195,0.15);
      border-radius: 10px;
      margin-bottom: 16px;
    }
    .zk-progress-bar {
      width: 100%;
      height: 3px;
      background: rgba(255,255,255,0.05);
      border-radius: 2px;
      overflow: hidden;
    }
    .zk-progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #00E5C3, #00B4A0);
      border-radius: 2px;
      transition: width 0.3s ease;
    }
    .zk-step {
      font-size: 12px;
      color: #666;
      transition: color 0.3s;
    }
    .zk-step.completed { color: #00E5C3; }

    /* Password strength */
    .strength-bar {
      display: flex;
      gap: 4px;
      margin-top: 6px;
      padding: 0 2px;
    }
    .strength-segment {
      flex: 1;
      height: 3px;
      background: rgba(255,255,255,0.05);
      border-radius: 2px;
      transition: background 0.3s;
    }
    .strength-label {
      font-size: 11px;
      margin-top: 4px;
      padding-left: 2px;
      transition: color 0.3s;
    }

    /* Theme toggle */
    .theme-toggle {
      position: fixed;
      top: 10px;
      left: 10px;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid var(--border, #333);
      background: rgba(0,0,0,0.5);
      color: #888;
      font-size: 16px;
      cursor: pointer;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s;
      backdrop-filter: blur(10px);
    }
    .theme-toggle:hover { color: #00E5C3; border-color: #00E5C3; }
    [data-theme="light"] .theme-toggle { background: rgba(255,255,255,0.8); }

    /* Page loading overlay */
    .page-loader {
      position: fixed;
      inset: 0;
      background: var(--bg-primary, #0a0a0f);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      transition: opacity 0.5s;
    }
    .page-loader.hidden { opacity: 0; pointer-events: none; }
    .page-loader .loader-shield {
      width: 48px;
      height: 54px;
      animation: loaderPulse 1.5s ease-in-out infinite;
    }
    .page-loader .loader-text {
      margin-top: 16px;
      font-size: 12px;
      color: var(--text-secondary, #888);
      letter-spacing: 2px;
    }
    @keyframes loaderPulse {
      0%, 100% { opacity: 0.4; transform: scale(0.95); }
      50% { opacity: 1; transform: scale(1.05); }
    }

    /* 濞撶顓归崗銉ュ經 */
    .guest-entry {
      text-align: center;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid rgba(255,255,255,0.05);
    }
    .guest-entry a {
      color: #888;
      text-decoration: none;
      font-size: 13px;
    }
    .guest-entry a:hover {
      color: #00E5C3;
    }
    .guest-entry p {
      color: #555;
      font-size: 11px;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <!-- 妞ょ敻娼伴崝鐘烘祰閸斻劎鏁?-->
  <div class="page-loader" id="pageLoader">
    <svg class="loader-shield" viewBox="0 0 64 72" fill="none">
      <path d="M32 4L58 14V36C58 50 48 60 32 66C16 60 6 50 6 36V14L32 4Z"
            stroke="#00E5C3" stroke-width="2" fill="rgba(0,229,195,0.08)"/>
      <circle cx="32" cy="32" r="6" stroke="#00E5C3" stroke-width="1.5" fill="none"/>
      <path d="M32 38V48" stroke="#00E5C3" stroke-width="2" stroke-linecap="round"/>
    </svg>
    <div class="loader-text">FIBEMATE</div>
  </div>

  <!-- 娑撳顣介崚鍥ㄥ床 -->
  <button class="theme-toggle" id="themeToggle" title="閸掑洦宕叉稉濠氼暯">棣冨</button>

  <!-- 鐠嬪啳鐦崠鍝勭厵 -->
  <div id="debugLog" style="position:fixed;bottom:5px;left:5px;background:#111;background:rgba(0,0,0,0.9);color:#0f0;font-size:11px;font-family:monospace;padding:8px;max-height:200px;overflow-y:auto;z-index:99999;display:none;border:1px solid #333;max-width:400px;"></div>
  <script>
    // Debug log visibility control
    // Show in development, hide in production
    const isDev = window.location.hostname === 'localhost' || 
                  window.location.hostname === '127.0.0.1' ||
                  localStorage.getItem('fibemate_debug') === 'true';
    if (isDev) {
      document.getElementById('debugLog').style.display='block';
    }
  </script>

  <!-- WebSocket 閻樿埖鈧焦瀵氱粈鍝勬珤 -->
  <div class="ws-status" id="wsStatus">
    <div class="ws-status-dot" id="wsStatusDot"></div>
    <span id="wsStatusText">Disconnected</span>
  </div>

  <!-- 閻ц缍嶆い鐢告桨娑撹顔愰崳?-->
  <div class="login-wrapper">
    <!-- 閼冲本娅欓弫鍫熺亯 -->
    <div class="bg-grid"></div>
    <div class="bg-glow"></div>

    <!-- 娑擃厼銇庨惂璇茬秿閸楋紕澧?-->
    <div class="login-card">
      <!-- Logo 閸栧搫鐓?- 閻ц缍嶅▔銊ュ斀閸掑洦宕?-->
      <div class="logo-area">
        <div class="shield-logo">
          <svg viewBox="0 0 64 72" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" style="stop-color:#00E5C3"/>
                <stop offset="100%" style="stop-color:#00B4A0"/>
              </linearGradient>
              <linearGradient id="shieldFill" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" style="stop-color:rgba(0,229,195,0.15)"/>
                <stop offset="100%" style="stop-color:rgba(0,180,160,0.08)"/>
              </linearGradient>
            </defs>
            <path d="M32 4L58 14V36C58 50 48 60 32 66C16 60 6 50 6 36V14L32 4Z"
                  stroke="url(#shieldGrad)" stroke-width="2" fill="url(#shieldFill)"/>
            <path d="M32 12L50 20V36C50 46 42 54 32 58C22 54 14 46 14 36V20L32 12Z"
                  stroke="url(#shieldGrad)" stroke-width="1" fill="none" opacity="0.4"/>
            <circle cx="32" cy="32" r="6" stroke="url(#shieldGrad)" stroke-width="1.5" fill="none"/>
            <path d="M32 38V48" stroke="url(#shieldGrad)" stroke-width="2" stroke-linecap="round"/>
            <path d="M32 8L52 17V22" stroke="url(#shieldGrad)" stroke-width="0.5" opacity="0.3"/>
          </svg>
        </div>
        <h1 class="brand-name">FIBEMATE</h1>
        <p class="brand-sub">Security-First Messaging 璺?End-to-End Encryption</p>
      </div>

      <!-- 鐎瑰鍙忓鐣岀彿 -->
      <div class="security-badge">
        <svg width="10" height="12" viewBox="0 0 10 12" fill="none">
          <path d="M5 1L9 2.5V6C9 8.5 7 10.5 5 11.5C3 10.5 1 8.5 1 6V2.5L5 1Z"
                stroke="currentColor" stroke-width="1" fill="none"/>
        </svg>
        <span>End-to-End Encryption 璺?Zero-Knowledge Proof</span>
      </div>

      <!-- 閻ц缍嶉弬鐟扮础閸掑洦宕?-->
      <div class="login-tabs">
        <button type="button" class="tab-btn active" data-tab="password">鐎靛棛鐖滈惂璇茬秿</button>
        <button type="button" class="tab-btn" data-tab="phone">閹靛婧€閸欓娅ヨぐ?/button>
      </div>

      <!-- 鐎靛棛鐖滈惂璇茬秿鐞涖劌宕?-->
      <form class="login-form" id="loginForm" autocomplete="off">
        <div class="input-group">
          <input
            type="text"
            id="username"
            name="fm_un_" + Math.random().toString(36).slice(2,8)
            placeholder="閻劍鍩涢崥?
            spellcheck="false"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="off"
            required
            aria-label="閻劍鍩涢崥?
            aria-describedby="loginError"
          >
        </div>
        <div class="input-group">
          <input
            type="password"
            id="password"
            name="fm_pw_" + Math.random().toString(36).slice(2,8)
            placeholder="鐎靛棛鐖?
            autocomplete="off"
            required
            aria-label="鐎靛棛鐖?
            aria-describedby="loginError"
          >
        </div>

        <button type="submit" class="btn-primary" id="loginBtn" aria-label="閻ц缍嶉幋鏍ㄦ暈閸?>
          <svg width="14" height="16" viewBox="0 0 14 16" fill="none" style="margin-right:6px">
            <rect x="2" y="7" width="10" height="8" rx="1.5" stroke="currentColor" stroke-width="1.3" fill="none"/>
            <path d="M4 7V5C4 3.34 5.34 2 7 2C8.66 2 10 3.34 10 5V7" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
            <circle cx="7" cy="11" r="1" fill="currentColor"/>
          </svg>
          <span id="loginBtnText">閻ц缍?璺?濞夈劌鍞?/span>
        </button>

        <!-- ZK 閸栧灝鎮曢惂璇茬秿閹稿鎸?-->
        <button type="button" class="btn-secondary" id="zkLoginBtn">
          <svg width="12" height="14" viewBox="0 0 12 14" fill="none" style="margin-right:6px">
            <path d="M6 1L11 3V7C11 10 8.5 12.5 6 13.5C3.5 12.5 1 10 1 7V3L6 1Z"
                  stroke="currentColor" stroke-width="1" fill="none"/>
          </svg>
          Anonymous Login 璺?Zero-Knowledge Proof
        </button>

        <div id="loginError" class="error-msg" style="display:none"></div>
      </form>

      <!-- 閹靛婧€閸欓娅ヨぐ鏇°€冮崡鏇礄姒涙顓婚梾鎰閿?-->
      <form class="login-form" id="phoneLoginForm" style="display:none" autocomplete="off">
        <div class="input-group">
          <input
            type="tel"
            id="phoneNumber"
            name="fm_ph_" + Math.random().toString(36).slice(2,8)
            placeholder="閹靛婧€閸?
            maxlength="11"
            pattern="1[3-9]\d{9}"
            autocomplete="off"
            autocorrect="off"
            required
          >
        </div>
        <div class="input-group captcha-group">
          <input
            type="text"
            id="phoneCaptcha"
            name="fm_cp_" + Math.random().toString(36).slice(2,8)
            placeholder="妤犲矁鐦夐惍?
            maxlength="6"
            autocomplete="off"
            autocorrect="off"
            required
          >
          <button type="button" class="btn-captcha" id="sendCaptchaBtn">閼惧嘲褰囨宀冪槈閻?/button>
        </div>

        <button type="submit" class="btn-primary" id="phoneLoginBtn">
          <span id="phoneLoginBtnText">閻ц缍?/ 濞夈劌鍞?/span>
        </button>

        <div id="phoneLoginError" class="error-msg" style="display:none"></div>
      </form>


    </div>

    <!-- Toast 闁氨鐓?-->
    <div class="toast" id="toast" style="display:none"></div>
  </div>



  <script>
    // ================================================
    // 閻ц缍?/ 濞夈劌鍞介柅鏄忕帆
    // ================================================

    // 婵″倹鐏夊鑼瑜版洩绱濋崚娆戞纯閹恒儴鐑︽潪?    document.addEventListener('DOMContentLoaded', () => {
      // Hide page loader after scripts loaded
      const loader = document.getElementById('pageLoader');
      if (loader) {
        setTimeout(() => loader.classList.add('hidden'), 300);
        setTimeout(() => loader.remove(), 800);
      }

      // Theme toggle
      initThemeToggle();

      requestNotificationPermission();

      if (FIBEMATE_ZK && FIBEMATE_ZK.isLoggedIn()) {
        window.location.href = 'main.html';
        return;
      }
      initLoginForm();
      initPhoneLogin();
      
      // Keyboard shortcuts
      document.addEventListener('keydown', (e) => {
        // Enter to submit (when not in textarea/input)
        if (e.key === 'Enter' && !e.target.matches('textarea')) {
          const activeForm = document.activeElement.closest('form');
          if (activeForm) {
            const submitBtn = activeForm.querySelector('button[type="submit"]');
            if (submitBtn && !submitBtn.disabled) {
              // Ctrl+Enter for ZK login
              if (e.ctrlKey && submitBtn.id === 'loginBtn') {
                e.preventDefault();
                document.getElementById('zkLoginBtn')?.click();
              } else if (!e.ctrlKey) {
                e.preventDefault();
                submitBtn.click();
              }
            }
          }
        }
        // Escape to close modals/clear errors
        if (e.key === 'Escape') {
          document.querySelectorAll('.error-msg').forEach(el => el.style.display = 'none');
        }
      });
    });

    function initLoginForm() {
      const form = document.getElementById('loginForm');
      const zkBtn = document.getElementById('zkLoginBtn');
      const errorEl = document.getElementById('loginError');
      const usernameInput = document.getElementById('username');
      const passwordInput = document.getElementById('password');
      
      // Real-time input validation feedback
      function validateInput(input, minLen = 1) {
        const value = input.value.trim();
        const group = input.closest('.input-group');
        const existingError = group?.querySelector('.input-error-msg');
        
        // Remove existing states
        input.classList.remove('input-valid', 'input-invalid');
        if (existingError) existingError.style.display = 'none';
        
        if (value.length > 0) {
          if (value.length >= minLen) {
            input.classList.add('input-valid');
          } else {
            input.classList.add('input-invalid');
          }
        }
      }
      
      // Add validation listeners
      usernameInput?.addEventListener('input', () => validateInput(usernameInput, 3));
      passwordInput?.addEventListener('input', () => validateInput(passwordInput, 6));

      // Password strength for register form
      const regPw = document.getElementById('regPassword');
      if (regPw) {
        regPw.addEventListener('input', () => {
          updatePasswordStrength(regPw.value);
          validateInput(regPw, 8);
        });
      }
      
      // Clear validation on focus
      [usernameInput, passwordInput].forEach(input => {
        if (input) {
          input.addEventListener('focus', () => {
            input.classList.remove('input-valid', 'input-invalid');
          });
        }
      });

      // 閺嶅洤鍣惂璇茬秿
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        if (!username || !password) return;

        setLoading('loginBtn', 'loginBtnText', true);
        errorEl.style.display = 'none';

        try {
          // v2: Use ZKUIIntegration for login (supports v2 Schnorr+Bulletproofs)
          const zkUI = getZKUIIntegration();
          await zkUI.init();
          const data = await zkUI.login(username, password);
          if (data.token) {
            localStorage.setItem('fk_token', data.token);
            localStorage.setItem('fk_uid', data.userId);
          }
          if (data.displayName) {
            localStorage.setItem('fk_displayName', data.displayName);
          }
          connectWebSocket();
          if (data.zkUsed) {
            showToast(`棣冩敿 ZK 鐠併倛鐦夐惂璇茬秿閹存劕濮?(${data.duration || 'N/A'})`, 'success');
          } else {
            showToast('閻ц缍嶉幋鎰閿涘本顒滈崷銊ㄧ儲鏉?..', 'success');
          }
          setTimeout(() => { window.location.href = 'main.html'; }, 500);
        } catch (err) {
          errorEl.textContent = err.message;
          errorEl.style.display = 'block';
        } finally {
          setLoading('loginBtn', 'loginBtnText', false);
        }
      });

      // ZK 閸栧灝鎮曢惂璇茬秿 - 娴ｈ法鏁ら弬鎵畱 ZKUIIntegration
      zkBtn.addEventListener('click', async () => {
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        if (!username || !password) {
          errorEl.textContent = '鐠囧嘲鍘涙潏鎾冲弳閻劍鍩涢崥宥呮嫲鐎靛棛鐖?;
          errorEl.style.display = 'block';
          return;
        }
        setLoading('zkLoginBtn', null, true);
        errorEl.style.display = 'none';

        try {
          const zkUI = getZKUIIntegration();
          await zkUI.init();
          
          // Show ZK progress

    // 閸婃帟顓搁弮?    function startCountdown(btn) {

        count--;

        if (count <= 0) {
          clearInterval(timer);
          btn.textContent = '閼惧嘲褰囨宀冪槈閻?;

    async function animateZkProgress() {
      const steps = ['zkStep1', 'zkStep2', 'zkStep3', 'zkStep4'];
      const progressFill = document.getElementById('zkProgressFill');
      
      for (let i = 0; i < steps.length; i++) {
        const id = steps[i];
        const el = document.getElementById(id);
        if (el) {
          el.classList.add('completed');
        }
        // Update progress bar
        if (progressFill) {
          progressFill.style.width = ((i + 1) / steps.length * 100) + '%';
        }
        await sleep(300);
      }
    }

    function setLoading(btnId, textId, loading) {
      const btn = document.getElementById(btnId);
      if (!btn) return;
      btn.disabled = loading;
      
      // Get or create spinner element
      let spinner = btn.querySelector('.spinner');
      
      if (loading) {
        btn.classList.add('btn-loading');
        if (!spinner) {
          spinner = document.createElement('span');
          spinner.className = 'spinner';
          btn.insertBefore(spinner, btn.firstChild);
        }
        if (textId) {
          const textEl = document.getElementById(textId);
          if (textEl) textEl.textContent = '婢跺嫮鎮婃稉?..';
        }
      } else {
        btn.classList.remove('btn-loading');
        if (spinner) spinner.remove();
        if (textId) {
          const textEl = document.getElementById(textId);
          if (textEl) textEl.textContent = (btnId === 'loginBtn' || btnId === 'registerBtn') ? '閻ц缍?璺?濞夈劌鍞? : 
                                  (btnId === 'zkLoginBtn') ? 'Anonymous Login 璺?Zero-Knowledge Proof' :
                                  (btnId === 'phoneLoginBtn') ? '閻ц缍?/ 濞夈劌鍞? : '閹绘劒姘?;
        }
      }
    }

    // Toast stack for multiple notifications
    let toastQueue = [];
    let toastTimeout = null;
    
    function showToast(message, type = 'info') {
      // Icon based on type
      const icons = {
        info: '棣冩敿',
        success: '閴?,
        error: '閴?,
        warning: '閳跨媴绗?
      };
      const icon = icons[type] || icons.info;
      
      // Create unique toast element
      const toast = document.createElement('div');
      toast.className = 'toast ' + type;
      toast.innerHTML = `<span style="margin-right:8px;">${icon}</span>${message}`;
      toast.style.cssText = 'position:fixed;bottom:80px;left:50%;transform:translateX(-50%);padding:12px 24px;border-radius:10px;font-size:13px;z-index:1001;display:flex;align-items:center;';
      
      // Color based on type
      const colors = {
        info: 'rgba(0, 229, 195, 0.15)|rgba(0, 229, 195, 0.3)|#00E5C3',
        success: 'rgba(0, 229, 100, 0.15)|rgba(0, 200, 100, 0.3)|#00e57a',
        error: 'rgba(255, 80, 80, 0.15)|rgba(255, 80, 80, 0.3)|#ff7070',
        warning: 'rgba(255, 180, 50, 0.15)|rgba(255, 180, 50, 0.3)|#ffb050'
      };
      const [bg, border, text] = colors[type]?.split('|') || colors.info.split('|');
      toast.style.cssText += `background:${bg};border:1px solid ${border};color:${text};`;
      
      document.body.appendChild(toast);
      
      // Auto remove
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transition = 'opacity 0.3s';
        setTimeout(() => toast.remove(), 300);
      }, 3000);
      
      // Stack toasts vertically
      const existingToasts = document.querySelectorAll('.toast:not(#toast)');
      existingToasts.forEach((t, i) => {
        t.style.bottom = (80 + i * 60) + 'px';
      });
    }

    function sleep(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));

    // ================================================

    function updateWSStatus(status, text) {
      const dot = document.getElementById('wsStatusDot');
      const txt = document.getElementById('wsStatusText');
      const container = document.getElementById('wsStatus');
      if (!dot || !txt || !container) return;
      dot.className = 'ws-status-dot ' + status;
      txt.textContent = text;
      container.classList.add('show');
    }

    function connectWebSocket() {
      const token = localStorage.getItem('fk_token');
      if (!token) return;

      const wsManager = WSManager.getInstance();

      // 鐠併垽妲勯悩鑸碘偓浣风皑娴?      wsManager.on('connected', () => {
        updateWSStatus('connected', '瀹歌尪绻涢幒?);
        wsManager.send({ type: 'presence', status: 'online' });
      });
      wsManager.on('disconnected', () => {
        updateWSStatus('disconnected', '瀹稿弶鏌囧鈧?);
      });

      // 鐠併垽妲勫☉鍫熶紖閿涘牊鏌婂☉鍫熶紖闁氨鐓￠敍?      wsManager.on('message', (msg) => {
        if (document.hidden && Notification.permission === 'granted') {
          new Notification('FIBEMATE', {
            body: msg.preview || '閺傜増绉烽幁?,
            icon: '/icon.png'
          });
        }
      });

      // 閺嬪嫬缂?API base URL
      let apiBase;
      if (window.electronAPI && window.electronAPI.getWSUrl) {
        // Electron 閸樼喓鏁撻敍姘矤 ws URL 閹恒劌顕?api base
        const raw = window.electronAPI.getWSUrl();
        apiBase = raw.replace(/^wss?/, m => m === 'wss' ? 'https' : 'http').replace(/\/ws$/, '/api');
      } else {
        apiBase = localStorage.getItem('fk_api_url') || 'http://8.156.77.68:3001/api';
      }

      updateWSStatus('connecting', '鏉╃偞甯存稉?..');
      wsManager.connect(apiBase, token);
    }

    function initThemeToggle() {
      const saved = localStorage.getItem('fibemate_theme');
      if (saved) document.documentElement.setAttribute('data-theme', saved);
      updateThemeIcon(saved);

      document.getElementById('themeToggle')?.addEventListener('click', () => {
        const current = document.documentElement.getAttribute('data-theme');
        const next = current === 'light' ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('fibemate_theme', next);
        updateThemeIcon(next);
      });
    }
    function updateThemeIcon(theme) {
      const btn = document.getElementById('themeToggle');
      if (btn) btn.textContent = theme === 'light' ? '閳解偓閿? : '棣冨';
    }

    // ================================================
    // 鐎靛棛鐖滃鍝勫濡偓濞?    // ================================================
    function updatePasswordStrength(pw) {
      let score = 0;
      if (pw.length >= 8) score++;
      if (pw.length >= 12) score++;
      if (/[A-Z]/.test(pw) && /[a-z]/.test(pw)) score++;
      if (/[0-9]/.test(pw)) score++;
      if (/[^A-Za-z0-9]/.test(pw)) score++;
      score = Math.min(score, 4);

      const colors = ['', '#FF5252', '#FF9800', '#FFC107', '#00E5C3'];
      const labels = ['', '瀵?, '娑撯偓閼?, '鏉堝啫宸?, '瀵?];

      for (let i = 1; i <= 4; i++) {
        const seg = document.getElementById('seg' + i);
        if (seg) seg.style.background = i <= score ? colors[score] : 'rgba(255,255,255,0.05)';
      }
      const label = document.getElementById('strengthLabel');
      if (label) {
        label.textContent = pw.length > 0 ? labels[score] || '' : '';
        label.style.color = colors[score] || '#666';
      }
    }
