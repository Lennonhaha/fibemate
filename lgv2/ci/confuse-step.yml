name: LG v2.1/v2.2 Confuse CI

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Build target (c/rust/all)'
        required: true
        default: 'all'
        type: choice
        options:
          - c
          - rust
          - all

jobs:
  build-c:
    if: inputs.target == 'c' || inputs.target == 'all'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y gcc make
      - name: Build C library
        run: make -C lgv2/c clean all
      - name: Run C tests
        run: make -C lgv2/c test
      - name: Archive C library
        uses: actions/upload-artifact@v4
        with:
          name: liblgv2
          path: lgv2/c/liblgv2.so

  build-rust:
    if: inputs.target == 'rust' || inputs.target == 'all'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-unknown-unknown
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Build Rust library
        run: cargo build --release --manifest-path lgv2/rust/Cargo.toml
      - name: Build WASM
        run: wasm-pack build lgv2/rust --target web --out-dir ../wasm
      - name: Run Rust tests
        run: cargo test --manifest-path lgv2/rust/Cargo.toml
      - name: Archive WASM package
        uses: actions/upload-artifact@v4
        with:
          name: lgv2-wasm
          path: lgv2/wasm/
