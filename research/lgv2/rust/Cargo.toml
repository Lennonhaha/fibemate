[package]
name = "lgv2"
version = "2.2.0"
edition = "2021"
description = "LG v2.1/v2.2 7-layer irreducible group representation confusion engine"

[lib]
path = "lib.rs"
crate-type = ["cdylib", "staticlib", "lib"]

[dependencies]
wasm-bindgen = "0.2"
getrandom = { version = "0.2", features = ["js"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1