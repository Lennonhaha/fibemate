[package]
name = "lgv2"
version = "2.2.2"
edition = "2021"
description = "LG v2.2 confusion engine + 4 defense modules"

[lib]
path = "lib.rs"
crate-type = ["cdylib", "staticlib", "lib"]

[dependencies]
wasm-bindgen = "0.2"
getrandom = { version = "0.2", features = ["js"] }
rand = "0.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
