[package]
name = "vwz_signature"
version = "0.1.0"
edition = "2021"
description = "VWZ Hash-and-Sign signature — Rust/WASM port"
license = "GPL-3.0-only"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "bench"
path = "src/bin/bench.rs"

[dependencies]
sha3 = "0.10"
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
js-sys = "0.3"

[features]
# Optional console panic hook (only compiled when enabled).
console_error_panic_hook = []

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
