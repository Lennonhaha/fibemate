[package]
name = "mlkem-fips203-wasm"
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"
description = "ML-KEM-768 (FIPS 203) WebAssembly surface backed by libcrux-ml-kem"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Pinned: the FIPS 203 implementation that tauri also ships (see fibemate-tauri#81).
libcrux-ml-kem = { version = "=0.0.10", default-features = false, features = ["mlkem768", "std"] }
# Must match the installed wasm-bindgen CLI schema exactly; see README "Toolchain".
wasm-bindgen = "=0.2.126"

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
